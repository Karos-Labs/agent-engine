<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #ffffff; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    box-sizing: border-box;
    padding: 48px;
    text-align: center;
  }
  h1 { font-size: calc(56px * var(--ts, 1)); margin: 0 0 24px 0; }
  p { font-size: calc(30px * var(--ts, 1)); margin: 0 0 32px 0; color: #333333; }
  img { max-width: 80%; max-height: 40vh; object-fit: cover; }
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}">
  <div class="brand-badge">{{seriesBadge}}</div>
  <div class="brand-handle">{{brandHandle}}</div>
  <h1>{{headline}}</h1>
  <p>{{body}}</p>
  <img src="{{image:hero}}" />
  <script>
    // The render tool's `readyFlagCheck` waits for exactly this (default
    // `readyFlag`, publish.renderCarousel's own schema default) before it
    // ever screenshots the page.
    window.__CAROUSEL_READY__ = true;
  </script>
</body>
</html>
