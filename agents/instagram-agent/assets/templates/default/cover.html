     THE OBVIOUS TEMPLATE FIX WAS TRIED AND IT IS REFUSED ON A MEASUREMENT,
     which is worth recording so the next reader does not spend the afternoon
     on it. Only the ramp's top ~225px carries INK — below that its alpha is
     under the 18-unit line — so the "480px bounded masthead" is half invisible
     to the instrument, and re-deriving the stops to run ink to ~430px
     (0.95/0.62@170/0.34@320/wash@430/0@520) takes the failures from 15 rows to
     9 with no overflow and no clause-E cost (`iod` 26.4-33.3%, still far under
     `FULL_BLEED_IMAGERY_SHARE`'s 50%). It also puts the EYEBROW on a ramp that
     has not dissolved. The eyebrow sits at the field's foot, which at `l` with
     long copy is only 229px down the ramp, and `--fg` over that ground:

       kit                    shipped stops      deeper stops    bar
       bundled #C4552F          14.25:1             8.33:1      4.5:1
       pale    #EFC75E          12.43:1             4.23:1      FAILS
       light   #8FD6C8          12.46:1             4.31:1      FAILS

     The dissolution IS the eyebrow's protection — the note beside `.cov-field`
     has always said so and now it has a table. A 9-row improvement bought with
     an unreadable kicker on every pale kit is not an improvement, so the stops
     do not move and the hole stays reported rather than painted over.

     `.headline` also gained a `huge` step upward, the first time this ladder
     has stepped UP. A cover with a 24-character title was setting it at 104px
     with two thirds of the plate below the band to fill; that is the same
     "the type had to carry the frame and it was not big enough to" the
     statement archetype's own ladder was corrected for. It also feeds back
     into the field: a bigger title makes the lockup taller, so the elastic
     field is shorter, so the screened tail shrinks with it.

     WHERE THE TYPE SITS IN IT is not a free choice. The eyebrow and the
     device are anchored to the field's FOOT, where the ramp has already
     dissolved to within a few units of the ground, because that is the one
     band whose contrast does not depend on the brand accent's lightness:
     `--fg` measures 10.7:1 there on the reference kit and 6.6:1 on the
     lightest accent the palette walk admits (`#EFC75E`), against 4.5:1 on the
     ramp's own head for the first and a failure for the second. A template
     cannot run `color-contrast()` in Chrome stable, so it has to compose
     around the problem instead. */
  .cov-field {
    position: relative; z-index: 3; flex: 1 1 auto; min-block-size: 0;
    margin: 16px 16px 0;
    padding: calc(84px * var(--ts, 1)) calc(var(--mx) - 16px) calc(44px * var(--ts, 1));
    display: flex; flex-direction: column;
    /* ── AND THE GRAMMAR CANNOT ANCHOR THE BAND EITHER. SECOND MEASUREMENT,
          SAME ANSWER. ──
       `justify-content: var(--lockup-anchor, flex-end)` was the second attempt
       at letting `compositionGrammar` reach this plate, on the reasoning that
       the band is painted end to end so moving its contents costs no bare
       ground. The dead-space half of that held — every grammar stayed at or
       under 0.1694 — and the plate broke somewhere else instead. Measured,
       karoslabs kit, production composition:

         top-column  / split-band   en m  `div.cov-field [h 697>515]`
                                    en l  `div.cov-field [h 822>645]`
                                    he m  `div.cov-field [h 620>451]`
                                    he l  `div.cov-field [h 732>516]`
         and with it `div.eyebrow × span.mk-plain` 10-21px DEEP — the eyebrow
         printing over the title.

       This band is a FIXED height (`--cover-band`, 300-600px) with `overflow:
       hidden`. Anchored at its head, the device and the eyebrow overflow its
       foot, which is `scrollHeight > clientHeight` — clause B's hard `clipped`
       — and the eyebrow lands on the lockup. `flex-end` is load-bearing: it
       makes the residual overflow leave through the BLOCK-START edge, which is
       the one direction this composition can absorb.
       So both cover anchors are measured out, and this plate's per-client
       geometry stays `--cover-band`'s height. What was actually collapsing the
       three probe covers onto one poster was upstream and is fixed there:
       `fallbackClientVisualSystem` resolved `displayRegister: grotesque` for
       every kit with no `aesthetic`/`visualMood`, so three clients shared a
       face; that branch is seeded off the slug now. Letting the grammar into
       the cover needs `.cov-field` to stop being a fixed band, which is a
       composition pass and not a token. */
    justify-content: flex-end;
    overflow: hidden;
    /* ── ONE LAYER: THE BOUNDED MASTHEAD RAMP. ──
       The 2px/14px horizontal screen that used to sit over this ramp was
       deleted by RFC-20 P2; the block above carries the measurement and the
       Ground Rule that forbids it. What is left is an OBJECT in the Ground
       Rule's sense: 480 design px measured from the field's block-start,
       `no-repeat`, switched off entirely by the two guards below when there
       is no title or when a photograph loaded.

       The ramp's five stops, expressed as px against 480: 0.95 at 0, 0.42
       at 190, wash at 290, 0.04 at 395, gone at 480. On the bundled accent/
       ground pair the accent is ~92 units from the ground, so an alpha `a`
       lands `92a` away: the part of the band that measures as a DRAWN DEVICE
       is its own top half and the part that measures as ACCENT is its top
       ~10%, which is what keeps the cover clear of `IMAGERY_OR_DEVICE_FLOOR`
       at one end and of `FULL_BLEED_IMAGERY_SHARE` and `ACCENT_MAX_SHARE` at
       the other, at every copy length rather than as a function of one.

       THE MIDDLE THREE STOPS MOVED DOWN 56/50/30px ON 2026-09-15, and the
       sweep is why. The previous stops (134/240/365) put the cover at
       `imageryOrDeviceShare` 0.102-0.106 in English at `s` and 0.0955-0.101
       in Hebrew at `s` — UNDER the 0.10 floor on `he medium s` and
       `he long s`, and within a point of it on every other small-scale row.
       The ramp itself measures the same in both scripts; what the rows
       differ by is the fat-stroke interiors of the display type, which the
       measure counts as graphic cells and which Heebo at 0.94 x 0.85 has
       fewer of. A device floor met by the headline's stroke width is not
       met by the device, so the ramp now carries the floor on its own:
       measured with the stops above, the cover reads 0.116-0.125 at `s` in
       both scripts (worst row `he long s` 0.1157), accent share 0.042
       against a 0.45 ceiling, and the largest empty rectangle is unchanged
       to the cell. */
    /* ── PHASE 5.5: THE MASTHEAD ENDS ON AN EDGE INSTEAD OF DISSOLVING. ──
       The five-stop fade ran to `transparent` at 480px, and everything past
       ~260px measured as GROUND (`slide-metrics.ts` calls a cell occupied when
       its mean is more than 18 units from the ground token, and at 92 units of
       accent-to-ground separation that is an alpha of ~0.20). So the band's
       own lower 220px joined the hole under it and the two measured as ONE
       rectangle — which is most of the 0.2833 the cover was refused for.

       The block is now 300px and its last stop is 26% rather than nothing, so
       the masthead has a defined foot and every cell inside it is occupied.
       It is SHORTER than the old fade, not longer: this is a bounded object
       with an edge, not the half-plate accent field RFC-20 P2 deleted (that
       one measured 45.7% accent on a pale kit, over `ACCENT_MAX_SHARE`). At
       26% of a 92-unit separation it is 24 units off the ground — visible
       tone, nowhere near the accent's own bin. */
    background-image:
      linear-gradient(to bottom,
        color-mix(in srgb, var(--accent) 95%, transparent) 0%,
        color-mix(in srgb, var(--accent) 42%, transparent) 63%,
        color-mix(in srgb, var(--accent) 30%, transparent) 87%,
        color-mix(in srgb, var(--accent) 26%, transparent) 100%);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: 0 0;
  }
  /* The two guards. A photograph replaces the field; a cover with no title is
     not a title card and must not measure as one.

     THE SECOND GUARD IS ASKED OF THE TITLE'S CHILDREN, NOT OF THE TITLE. The
     title is a TWIN-SLOT PAIR now (see the twin-slot block below), so `#title`
     has two element children on every render and can never be `:empty` again.
     Written as `#title:empty` this guard would have gone permanently silent
     and an empty cover would have kept the ramp — ink a plate with nothing on
     it must not acquire, which is the whole point of the guard. "Has a
     non-empty twin" is the same question, asked one level down. */
  body:has(.hero) .cov-field,
  body:not(:has(#title > span:not(:empty))) .cov-field { background-image: none; }

  /* ── THE EYEBROW'S OWN GROUND, on the photograph path only ──────────────
     The eyebrow and its rail are anchored to the field's FOOT (see
     `justify-content: flex-end` above). On the no-photograph path that foot
     is where the ramp has dissolved, and `--fg` measures 11.8:1 there. On the
     photograph path the guard above switches the whole field paint off, and
     the eyebrow is then standing on bare photograph, roughly 70px above the
     field's bottom edge — far below `.scrim-top`, which ends at 16% of the
     plate, and high up `.scrim`'s `to top` ramp, where it has faded to ~0.23
     alpha. Measured through `.local/cover-contrast.mjs` (2026-09-11, real
     Chromium, 1080x1440 @2, glyph core against the median of the eyebrow's
     own text band):

       eyebrow ground                 before      with this chip
       dark photograph (#242428)      11.90:1       13.27:1
       light photograph (#E1E6EC)      1.28:1        9.72:1
       near-white photograph (#F8F9FA) 1.2:1         9.39:1

     1.28:1 is a label a reader cannot see, and the file header used to claim
     `.scrim-top` protected it — it does not and never could, since it ends
     roughly 590px above where the eyebrow renders. (What `.scrim-top` does
     protect is `.brand-badge` at y=56; the header now says so.)

     A short band at the field's foot rather than a taller scrim, because the
     legacy rule the bottom scrim obeys is the right one: a scrim over the
     whole plate turns a photograph into a texture. This one is measured from
     the block-end in `px * --ts`, so it tracks the eyebrow it is protecting
     rather than the field's elastic height, and it fades out over the same
     distance again so there is no drawn edge across the picture.

     A CHIP THAT HUGS THE LABEL, and the two attempts it replaces are worth
     recording, because each of them would have shipped on its number alone.

     1. A gradient band on `.cov-field`'s own background measured 8.39:1 and
        looked like a grey rectangle pasted onto the photograph. The field is
        inset 16px and clipped to its own box, so the band arrived with two
        vertical edges and a hard horizontal cut across the picture at the
        field's foot. The plate was worse than the one it fixed. There is no
        way to paint a soft-edged band from here either: anything anchored to
        `.lockup` paints INSIDE that element's z-index-4 stacking context and
        would cover the eyebrow rather than sit behind it, and the fixed
        bottom `.scrim` cannot reach — it is at 0.23 alpha where the eyebrow
        renders, and getting it to the 0.61 a bright plate needs would mean a
        near-opaque scrim over the bottom half of every photograph, which is
        the one thing this file's scrim rule forbids.
     2. A three-stop `text-shadow` halo. It is the right instinct for type on
        photography and it is simply too small at 24px: 1.68:1 on the overcast
        plate and 1.44:1 on the near-white one. Light type on a light
        photograph cannot be saved by a glow.

     So the label gets a ground of its own, sized to the label. It is the same
     device `BADGE_VARIANT_CSS`'s `pill` variant already gives branded clients
     — a chip is a normal editorial move for a kicker over a picture — and it
     is small enough (~0.9% of the plate) that it changes no measurement the
     interest floor reads. The negative inline margin cancels the padding, so
     not one glyph moves between the two paths.

     It paints only when there IS an eyebrow, for the reason the field's own
     no-title guard exists: an empty plate must not acquire ink it has
     no content to justify. The rail gets a soft dark spread rather than a
     chip, because a 2px hairline at 46% is the first thing a bright plate
     erases and a chip around a hairline would be a box around nothing. */
  body:has(.hero) .eyebrow:not(:empty) {
    align-self: flex-start;
    padding: calc(11px * var(--ts, 1)) calc(20px * var(--ts, 1));
    margin-inline-start: calc(-20px * var(--ts, 1));
    background: color-mix(in srgb, var(--bg) 86%, transparent);
  }

  /* ── RFC-20 §11.5 ITEM 3: A SCRIM WITH NO PHOTOGRAPH UNDER IT. ──

     §11.5 left `cover.html`'s blank plate open at `occupiedShare` **0.06%**
     and `largestEmptyRectShare` **51.67%**, with the note: *"0.06% is ≈58
     cells of 97,200, and 51.67% is the algebraic signature of a handful of
     cells near the plate's mid-line — one obstruction at the centroid halves
     the largest empty rectangle. Naming the element needs one render with a
     cell map; it is not guessed at here."*

     **It is the scrims, and the number names them.** `.scrim` is bottom-
     anchored and `block-size: 52%`, so its upper edge sits at y = 48% of the
     plate. A largest-empty-rectangle that cannot cross that row is either the
     48% above it or the **52%** below — and 51.67% is that 52% less the
     handful of cells the edge itself occupies. The share the clause reported
     and the scrim's own declared height are the same number.

     WHY IT MARKS ANY CELLS AT ALL, since it paints nothing a reader can see:
     both scrims composite `color-mix(in srgb, var(--bg) N%, transparent)`
     over a ground that IS `var(--bg)`. The composite is `--bg` exactly, at
     every stop, so the layer is invisible by construction — but the 8-bit
     rounding at its boundary row is not exactly zero, and `slide-metrics.ts`
     marks a cell on an ABSOLUTE distance from the ground. A seam one cell
     tall is enough to cut the plate in two for a metric that finds ONE
     contiguous rectangle. This is [[furniture-guards-read-the-subject]]'s
     rule restated at its limit: **position, not area** — 58 cells of nothing
     move the number 48 points.

     THE FIX IS THE LAYER'S OWN STATED PURPOSE. A scrim exists so that copy
     stays readable over a PHOTOGRAPH; this file's own comments say so twice
     (*"which is what a photo-header scrim is"*, *"it costs the photograph
     nothing a reader would notice"*). With no photograph there is nothing to
     scrim, the copy sits on flat brand ground at full contrast, and the layer
     is a full-bleed layer the plate has not earned — which is RFC-20 §5.0's
     Ground Rule, and §11.1's class finding one layer over.

     `body:has(.hero)` is exactly the right condition and the file already
     uses it: `onerror` REMOVES the `<img>` rather than hiding it, so the
     selector is false precisely when no photograph loaded. A hero render is
     byte-identical. */
  /* ── AND ON THIS FILE THE GUARD IS WITHDRAWN, BECAUSE IT WAS MEASURED. ──

     Pushed and rendered on CI 34956752073. `slide.html`'s half of this change
     is kept — its blank plate went from a 48-point seam to `occ 0.00 / LER
     100.00`, which is the whole point. **The cover's half made four things
     worse at once, and every one of them says the same sentence:**

       G2, blank cover      occ 0.06 -> 0.22, LER 51.67 -> 24.72
       gate-zero, cover s   iod 0.0898 against clause E's 0.10 floor  FAIL
       gate-zero, cover m   iod 0.0977                                FAIL
       marked cover, short  textShare 0.4979 against a 0.47 ceiling   FAIL

     **The scrims were being scored as the cover's drawn device.** A scrim is
     COVERED and has at most three distinct colours, which is
     `slide-metrics.ts`'s literal definition of a `graphic` cell, and
     `imageryOrDeviceShare = imageryShare + graphicShare`. Take them away and
     the cells do not disappear — they are re-classified as TEXT, which is why
     `textShare` rose by the same order it fell by. RFC-20 §11.1 states this as
     a class: *any full-frame painted layer that a plate has not earned will be
     scored by some clause as the evidence that clause was built to look for.*
     The hatch was scored as type, the plinth as a device, the screen as
     content — **and this is the fourth instance, on a layer nobody suspected
     because it paints nothing a reader can see.**

     WHY IT IS RECORDED RATHER THAN ACTED ON. Clearing it honestly means the
     cover's `iod` no longer includes a scrim, and `IMAGERY_OR_DEVICE_FLOOR`
     was calibrated on renders where it did — so the clause needs its own
     re-sweep, which is a phase and not a line. RFC-20 §11.4 did not scope it
     and §5.6 rule 4 forbids the shortcut of lowering the floor instead. What
     ships is the measurement above and the guard withdrawn from this file
     only, so the cover is byte-identical to `main` while the defect is
     written down where the next pass will hit it.

     §11.5 item 3's 51.67% is therefore still open on the cover and is now
     UNDERSTOOD rather than merely named: `.scrim` is `block-size: 52%`, its
     upper edge sits at y = 48%, and 51.67% is the 52% below it. */

  /* ── NOTHING IN THE BAND IS CRUSHED TO MAKE ROOM. ──
     `.cov-field` is a flex column, so its children are flex items and take
     `flex-shrink: 1` by default: when the band is full, the browser does not
     overflow it, it SQUEEZES whatever has no content of its own to resist.
     Measured on this tree with a figure device at `m`, on the eyebrow's rule
     before it was deleted: it rendered `240x0` — a rule painted at zero
     height, on every cover carrying an object, silently, for as long as the
     band has been fixed. The rule is gone; the shape that hid it is not, and
     the eyebrow is still a flex item in that band.
     It also makes `scrollHeight === clientHeight` on a field that is visibly
     over, which is why the fit pass below asks where the first child STARTS
     rather than asking the field whether it scrolls. */
  .cov-field > * { flex: 0 0 auto; }
  .cov-device { inline-size: 100%; }
  .cov-device:empty { display: none; }
  /* The figure's descender allowance is NOT set here, and the first attempt at
     this fix is why. `slide-devices.ts` measured `.dv-figure`'s `0.16em` on
     Fraunces, and `condensed` (Oswald) and `mono-display` (IBM Plex Mono) both
     overshoot it — but a `.cov-device .dv-figure` rule in this file also beats
     `script-fonts.ts`'s `.dv-figure { padding-block-end: 0.30em }`, which is
     the allowance MEASURED FOR HEBREW, and the Hebrew plates then reported the
     overflow the Latin ones had stopped reporting (measured on this tree:
     `div.dv-figure [h 146>134]` on three plates of every Hebrew carousel). The
     allowance belongs where the script is known: `clientVisualSystemCss` emits
     it for a covered script only, so the script pack keeps the last word on
     the scripts it measured. */
  /* ── AND THE BAND HAS THE LAST WORD ON HOW BIG THE OBJECT IS. ──
     `.cov-field` is a FIXED band — `--cover-band` is 300-600px, chosen per run
     by the system's `coverForm` — with `justify-content: flex-end` and
     `overflow: hidden`, so an object taller than the band is not squeezed, it
     is CUT OFF AT THE TOP OF THE PLATE. Measured on this tree with a figure
     device, before these rungs existed: `div.cov-device` at -188..284 at `m`
     and -305..135 at `l`, in every display register and both scripts — i.e.
     every cover carrying a bounded object shipped with the top of its own
     number sliced off, and `probe.offscreen`/`probe.overflow` reported it as
     `clipped` on the FIRST SLIDE.

     The rungs shrink the object rather than the band, because the band is the
     system's decision about this cover's form and the object is the thing that
     has to live inside it. Nothing is dropped at any rung: the source credit a
     number is quoted with is not slack. The script below steps down only while
     the field actually overflows, so a cover whose object already fits renders
     byte-identically to before. */
  .cov-device .dv-figure { font-size: calc(var(--t-figure) * 0.9091 * var(--dv-fit, 1)); }
  .cov-device .dv-figure--mid { font-size: calc(var(--t-figure) * 0.6818 * var(--dv-fit, 1)); }
  .cov-device .dv-figure--small { font-size: calc(var(--t-figure) * 0.4909 * var(--dv-fit, 1)); }
  /* The label follows, but not all the way down: it is read, so it stops at
     78% where the numeral keeps going. */
  .cov-device .dv-label { font-size: calc(var(--t-label) * 0.9375 * max(var(--dv-fit, 1), 0.78)); }
  /* ── AND THE BAND GIVES WHAT IT CAN BEFORE THE OBJECT DOES. ──
     `--cover-band` is the system's decision about this cover's FORM, and on a
     plate with nothing in the band that is the whole story. With an object in
     it the band is a MINIMUM instead: it grows to what the object needs, up to
     58% of the plate, and only then does the object start giving. The cap is
     what keeps the lockup's share — the title is the cover — and the lockup's
     own ladder answers for the rest. */
  body:not(:has(.hero)):has(.cov-device .dv) .cov-field {
    block-size: auto; min-block-size: var(--cover-band, 600px); max-block-size: 58%;
  }

  .lockup {
    position: relative; z-index: 4; flex: 0 0 auto;
    padding-inline: var(--mx); padding-block: calc(52px * var(--ts, 1)) 104px;
  }
  /* ── PHASE 5.5: A TYPOGRAPHIC COVER IS A POSTER, NOT A MASTHEAD WITH A
        CAPTION UNDER IT. ──
     `.cov-field` was the elastic item and `.lockup` was rigid, so every pixel
     of slack on a no-photograph cover collected in ONE band between the ramp's
     faded tail and the title — the owner's *"השקף הראשון יחסית ריק ומשעמם"*,
     and measured on this tree as `largestEmptyRect` 1080x408 at (0,384),
     share 0.2833 against the cover's 0.22 ceiling.

     The two roles swap. The field keeps the ramp — it is the masthead and it
     is what carries the plate over `IMAGERY_OR_DEVICE_FLOOR`, whose share
     comes from the ramp's own top half (see the five stops above), so a
     300px floor keeps every cell that clause reads and drops only the tail
     that measured as ground anyway. The lockup becomes elastic and centres
     its own content, so the remaining slack is halved before the ladder below
     shrinks it again.

     PHOTOGRAPH PATH UNTOUCHED. With a hero the composition is the picture and
     the title has to stay inside the bottom scrim, so both rules are scoped
     off `body:has(.hero)` and a photographic cover renders byte-identically. */
  /* The masthead is SIZED, and it yields before the title does. 560px is 39%
     of the plate: enough that the block reads as the poster's own field rather
     than as a strip, and enough that the slack left for the lockup halves to
     bands the dead-space clause clears with margin at every copy length. It
     shrinks — `flex: 0 1 auto` with a 300px floor — so a long title takes the
     room back from the masthead instead of running off the plate; 220 is the
     length at which the gradient still reads as a band, and it is reached only
     by the longest title at the reviewer's largest type scale. */
  body:not(:has(.hero)) .cov-field { flex: 0 1 auto; block-size: var(--cover-band, 600px); min-block-size: 220px; }
  body:not(:has(.hero)) .lockup {
    /* `1 0 auto`: the lockup GROWS into the slack and never shrinks below its
       own content. `1 1 auto` with `min-block-size: 0` let the flex algorithm
       shrink it under a long title, and a centred child of a box smaller than
       itself escapes at BOTH ends — `probe.overflow` on `div#title.headline`,
       which is the same shape the closer's middle was in before RFC-21. The
       masthead above is the item that yields, which is the right order: a
       band can be shorter, a title cannot be cut. */
    flex: 1 0 auto;
    display: flex; flex-direction: column; justify-content: center;
    /* ── THE CLIENT'S `compositionGrammar` DOES NOT ANCHOR THIS BLOCK, AND
          THAT IS NOW A MEASUREMENT RATHER THAN AN ASSERTION. ──
       `--lockup-anchor` reached exactly ONE of the eight templates
       (`headline-focus.html`), which made it an axis that skipped the plate a
       reader stops on first: three probe clients on three different grammars
       rendered the same cover geometry three times. `visual-system.ts`'s note
       excluded the cover by saying *"the cover and closer have roles of their
       own"*, where `slide.html` was excluded by a table. So the table was
       taken here too — `justify-content: var(--lockup-anchor, center)` on this
       rule, karoslabs kit through the production composition, all four
       grammars x {s, m, l} x {en, he}, `largestEmptyRectShare`:

                          en s    en m    en l    he s    he m    he l
         centre-measure   0.1169  0.1149  0.1216  0.1389  0.1694  0.1194
         top-column       0.1238  0.1149  0.1216  0.1766  0.2195  0.1123
         split-band       0.1278  0.1149  0.1217  0.1889  0.2444  0.1250
         bottom-column    0.1361  0.1149  0.1250  0.2000  0.2611  0.1417

       The cover ceiling is 0.22 (`LARGEST_EMPTY_RECT_CEILING`). Two of the
       four anchors take a HEBREW cover past it — `split-band` 0.2444 and
       `bottom-column` 0.2611 at `m` — and `compositionGrammar` is frozen per
       client, so that is not one unlucky plate but every post those clients
       ever ship. Clause C waives a hole on a plate with a subject, but not one
       that `holeSpansFrame` calls a band across the frame, which is the shape
       an off-centre anchor opens. An axis that refuses two of its own four
       values on one script is a hold generator.
       So the cover keeps `center`, for the reason `slide.html` keeps it, and
       the grammar reaches this plate through `.cov-field` instead — the
       masthead band's own anchor, where the ramp is painted and the same
       four values cost nothing. See that rule. */
  }
  .eyebrow {
    /* ── THE LABEL'S BOX IS ITS LABEL. ──
       A block-level eyebrow spans the whole measure whatever it says, so its
       BOX reaches the opposite corner of the plate even when its ink stops
       after two words. `renderCarousel`'s reserved-zone probe reads boxes, so
       a full-width label was reported as entering the brand mark's corner from
       the other side of the frame — a finding about nothing, on the instrument
       §7 F2 exists to make trustworthy. `fit-content` makes the two agree.
       `stat-callout.html` has always been `inline-block` for the same reason. */
    inline-size: fit-content; max-inline-size: 100%;
    font-family: var(--f-mono);
    /* ── 700, BECAUSE THE INSTRUMENT MEASURES THE STROKE, NOT THE DECLARATION. ──
       At 600 over the ramp head the sampled glyph core came back #dad1ca
       against a full-strength `--fg` declaration — 4.47:1, three hundredths under the bar
       (CI Chromium, `interest-floor-calibration.test.ts`). That gap is the
       stroke: 22px of mono at 0.24em tracking has very little ink per glyph,
       and every edge pixel of it is a blend with the ground, so a thin cut
       never reaches the colour it was given. Two things make it reach:
       `--fg` at full strength (above), and a heavier stem.
       The `<link>` in the head is what makes the cut real rather than
       synthesised — it asked for 400;500;600 and now asks for 700 as well —
       and where the webfont does not load at all (a CI runner with no network
       takes `ui-monospace`) 700 is the one weight every system mono actually
       ships. The type scale does not move: §4.4 gives this label `t-micro`
       and weight is not a step on that ladder. */
    font-weight: 700; font-size: var(--t-micro);
    letter-spacing: 0.24em; text-transform: uppercase;
    /* ── FULL `--fg`, AND THE 8% IT USED TO GIVE AWAY IS WHY. ──
       This read `color-mix(in srgb, var(--fg) 92%, transparent)` — the same
       softening `.body-text` and the subtitle carry, copied onto an element
       that cannot afford it. The two are not comparable: body text is set at
       `--t-label` (32px) at weight 400 over the field's FOOT, where the ramp
       has dissolved and `--fg` measures 10.7:1 (see the table beside
       `.cov-field`). This label is 22px of mono at 0.24em tracking, and on the
       no-photograph path it sits on the ramp's HEAD, where the same table
       records `--fg` at EXACTLY 4.5:1 on the bundled kit — no margin at all.
       Compositing 8% of the ground into a thin, widely-tracked glyph at that
       position took it to 3.93:1 (CI Chromium, glyph #ccc1b9 over #735248,
       `interest-floor-calibration.test.ts`), i.e. under the bar, on the one
       element of the cover a reader meets first.
       The softening bought nothing this plate needed. A label that is present
       is legible or it is decoration, and the ramp-head ground is the case
       that decides it. */
    color: var(--fg);
    margin-block-start: calc(36px * var(--ts, 1));
  }
  .eyebrow:empty { display: none; }
  /* The keyline under the eyebrow runs the full measure of the field and is
     what gives the field a drawn bottom edge instead of a raw cut — the job
     the previous revision's 40px accent-ink shelf did, at a hundredth of the
     coverage and with no accent budget spent on it. */
  /* ── AND THIS ONE IS **NOT** UNDER THE ACCENT SWITCH, WHICH IS THE COVER'S
        ROLE SPEAKING. ──
     The other six hairlines in the set are (§4.3): they are standing furniture
     and the run's system decides which three slides may carry a mark. The cover
     has no furniture at all (§4.5) — no badge, no index, no source credit — so
     there is nothing here for a switch to turn ON. Its rail is the eyebrow's
     underline and the guard below is the whole rule: no eyebrow, no rail, and
     on a §4.5-compliant cover there is no eyebrow. Switching it as well would
     give the one plate that owns no furniture a piece of switchable furniture,
     which `template-furniture.test.ts`'s Chromium block refuses by name. */
  /* ── THE COVER'S RAIL IS GONE, AND §4.5 IS WHY. ──
     *The cover carries NO furniture at all* — `template-furniture.test.ts`
     says so by name, and a keyline under the eyebrow is furniture. It was also
     the widest instance of the defect the owner named: 952px at 46% of the
     foreground on slide 1, beside a 240px `--accent` mark on slides 4 and 8,
     one carousel, two colours, two lengths. Re-colouring it was worse, not
     better — on the heroless path this rail sits INSIDE the accent ramp, so an
     accent rule painted on it is a mark nobody can see, and on the photograph
     path the eyebrow already has its own scrim chip.

     It costs no measurement: the rail lives inside `.cov-field`, whose band is
     either the ramp or the photograph, so its pixels were ink on ink and its
     absence cannot open a rectangle the field was not already closing —
     measured on this tree, a cover rendered with and without a bounded object
     reports the same `inkShare`, `occupiedShare` and `largestEmptyRectShare`
     to four decimal places for exactly that reason. */

  /* `.headline` rather than a cover-specific class name on purpose: it is one
     of `script-fonts.ts`'s DISPLAY_SELECTORS, so a Hebrew or Arabic cover
     picks up that script's own leading instead of Latin leading on a
     script whose ascenders and nikud need more room. */
  .headline {
    font-family: var(--f-display); font-weight: 600; font-size: calc(var(--t-display) * 0.8387);
    line-height: 1.07; letter-spacing: -0.02em; text-wrap: balance;
    /* Not cosmetic: a display face's glyph box is taller than a sub-1.15 line
       box, so the block reports `scrollHeight > clientHeight` and the DOM
       probe calls it an overflowing element — which fails clause B of the
       interest floor on a slide that fits perfectly. In `em`, so it tracks
       every size step and every per-script type scale. */
    padding-block-end: max(0.22em, var(--mk-face-bleed, 0em));
  }
  /* The ladder now steps UP as well as down. `huge` is the step a short title
     was missing: with the field capped at 520px the lockup has 920px to fill,
     and a 24-character title at 104px used two lines of it. */
  /* ── PHASE 5.5: THE LADDER SETS THE TITLE TO FILL. ──
     Every rung moves up on the NO-PHOTOGRAPH path, where the title is the
     plate's only subject and §4.5 says it must be the largest thing on it. A
     24-character title used to be set at 132px and take two lines of a
     1064px column; at 205px it takes three and the plate reads as a poster.
     The steps are scale steps, so the run's `typeScale` flavour moves them.
     Over a photograph the title stays where it was — the scrim it has to sit
     inside did not grow — which is what the `body:has(.hero)` rungs below
     have always been for. */
  .headline.huge { font-size: calc(var(--t-display) * 1.5); line-height: 1.02; }
  body:not(:has(.hero)) .headline { font-size: calc(var(--t-display) * 1.2); line-height: 1.04; }
  body:not(:has(.hero)) .headline.small { font-size: calc(var(--t-display) * 0.95); line-height: 1.08; }
  body:not(:has(.hero)) .headline.tiny { font-size: calc(var(--t-statement) * 1.05); line-height: 1.12; }
  /* A FOURTH RUNG, and the case that needs it is the worst one the set can
     produce: the longest title over the longest sub-line at the reviewer's
     largest scale. Measured, that lockup ran 71px past the frame with the
     masthead already collapsed to its 220px floor — `probe.overflow` on `html,
     body`, which clause B refuses as `clipped`. It could not happen before
     this phase because the scale steps were declared on `:root` and `--ts`
     never reached the display type at all. */
  body:not(:has(.hero)) .headline.micro { font-size: calc(var(--t-statement) * 0.88); line-height: 1.16; }
  /* Over a photograph the title stays at the base size: it has to fit inside
     the bottom scrim, which does not grow with it. */
  body:has(.hero) .headline.huge { font-size: calc(var(--t-display) * 0.8387); line-height: 1.07; }
  .headline.small { font-size: calc(var(--t-statement) * 1); line-height: 1.1; }
  .headline.tiny { font-size: calc(var(--t-statement) * 0.7857); line-height: 1.14; }

  /* ── PHASE 5.5: THE COVER'S ACCENT BAR IS GONE FROM THE MARKUP. ──

     The rule was "one accent mark under the title", guarded on the title. The
     cover's role changed: §4.5 of the phase spec gives the cover NO furniture
     at all — no badge, no eyebrow, no rule, no index — because its only job is
     to make someone stop and swipe, and every mark on it is a thing competing
     with the one subject. The owner on the 2026-09-16 covers: *"השקף הראשון
     יחסית ריק ומשעמם"* — a gradient with a title in the lower third and a
     decorative bar under it is not a cover, and the bar was the least of what
     was missing.

     Deleted from the MARKUP rather than switched off with `--fx-accent`, which
     is the treatment every other plate's bar gets: the cover is the one plate
     where the answer is "never", not "only when the system says so". The rules
     are kept so a CLIENT template that still carries a `.stat-band` div keeps
     its guard. */
  /* ── PHASE 5.5, ITEM C: THE ACCENT MARK IS ONE GEOMETRY, NOT SIX. ──
     The run's `accentForm` decides the mark's shape ONCE and publishes it as
     `--fx-accent-w` / `--fx-accent-h`. Before this the length was a property of
     whichever template the writer's layout landed on — 64px on a quote card,
     200px on a stat plate, 240px on a closer, full measure on a panel — so the
     three slides the accent switch allows a mark on carried three different
     shapes, which is the owner's *"sometimes a long purple marker and
     sometimes a short one"* read as geometry rather than as colour. Each file
     keeps its own literal as the var() fallback, so a document composed
     without the run sheet is byte-identical. */
  .stat-band { display: var(--fx-accent, none); inline-size: var(--fx-accent-w, calc(200px * var(--ts, 1))); block-size: var(--fx-accent-h, calc(14px * var(--ts, 1))); background: var(--accent); margin-block-start: calc(28px * var(--ts, 1)); }
  body:not(:has(#title > span:not(:empty))) .stat-band { display: none; }

  /* §4.4 gives the COVER SUB-LINE its own step (`t-lead`), and the no-hero
     path is where that matters: the sub-line is the cover's second and last
     type step, and at the body's reading size it read as a caption under a
     poster rather than as part of it. Over a photograph it stays at the
     reading size — there it sits on the scrim and has to stay quiet. */
  body:not(:has(.hero)) .body-text { font-size: var(--t-lead); line-height: 1.34; max-inline-size: 820px; }
  /* AND IT HAS A LADDER, for the same reason the title does: `t-lead` is the
     step for a SUB-LINE, and the writer sometimes sends a paragraph. At 310
     characters the lead step is nine lines and the plate overflowed
     (`probe.overflow` on `html, body`). Two rungs down, ending at the reading
     size the photograph path uses. */
  body:not(:has(.hero)) .body-text.small { font-size: calc(var(--t-lead) * 0.78); line-height: 1.4; }
  body:not(:has(.hero)) .body-text.tiny { font-size: var(--t-label); line-height: 1.5; }
  .body-text {
    font-family: var(--f-body); font-weight: 400; font-size: var(--t-label); line-height: 1.5;
    color: color-mix(in srgb, var(--fg) 92%, transparent);
    margin-block-start: calc(26px * var(--ts, 1)); max-inline-size: 880px; text-wrap: pretty;
  }
