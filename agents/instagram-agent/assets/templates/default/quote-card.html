<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent quote_card slide template</title>
<!--
  `quote_card` — a pull-quote and its attribution.

  Ported from the `.quote-block` device shared by karos-agents' legacy
  `marketer-legend.html` and `campaign-story.html` (defined in
  `marketing-services/_ms-core.css` / `_cf-devices.css`).

  The giant accent quotation mark IS the design, and the one non-obvious value
  makes it work: `line-height: 0.55` on a 200px glyph. That pulls the mark's
  own leading in so it tucks tight above the first line of the quote instead
  of floating half a line-height away from it. Changing it to a normal
  line-height breaks the lockup.

  The mark is a literal character in the markup rather than a CSS
  `::before { content: "\201C" }`, also as legacy had it — a real text node
  inherits the italic display face and its own optical sizing, which a
  generated-content glyph does not reliably do across font loads.

  ── 2026-09-11, the visual rework ──

  This archetype measured worse than any other in the set at a positional
  role: a quote on bare ground left 59% of the frame as one contiguous empty
  rectangle, with 3.5% of it occupied. The quote is now set in a PULL-QUOTE
  PANEL — a graded, accent-tinted card with a full-weight accent rule down its
  reading-start edge — under a kicker rail, which is both the composition a
  pull quote wants and what carries the plate.

  Three mechanical rules the whole bundled set now keeps, all learned from the
  renderer's own instruments rather than from taste:

    * every decoration is a BACKGROUND LAYER, never a positioned child. A
      positioned decoration that leaves its parent's box makes that parent
      report `scrollWidth > clientWidth`, which the DOM probe reports as an
      overflowing element — and clause B of the interest floor fails a slide
      on `probe.overflow` alone, whatever the pixels say.
    * display type carries a small `padding-block-end` in `em`. A glyph box
      taller than its line box trips the same clause: the 200px quotation mark
      at `line-height: 0.55` measured a 110px line box against 178px of ink.
    * a large tinted panel is GRADED and TEXTURED, never a flat swatch.
      `measureSlidePng` decides what colour a slide's ground is by taking the
      modal FLAT cell, so a big flat panel can out-vote the real ground and be
      measured AS the ground — after which every dark pixel at the frame edge
      counts as clipped ink. A graded, textured panel has no flat bin to win
      that vote with, and it is the better surface anyway.

  See `stat-callout.html`'s header for why the token block is duplicated per
  archetype file rather than shared.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    /* THE WASH TONE, and it is a mix rather than the accent itself.
       A ground wash has to land in the measurement's 12-18 band — visible
       tone that is not a mark — for EVERY accent the palette walk admits,
       and the accent alone cannot do that. The only gate on --accent is
       ACCENT_GROUND_CONTRAST_FLOOR = 3 against the ground, so a dark accent
       sits ~92 units from the bundled ground and a pale one ~159: the same
       14% alpha that measures 12.9 on the first measures 22.3 on the second,
       which is INK. Rendered with a pale kit every template in this
       directory then put ink in the 8px bleed band (clippedEdgeShare 0.5-0.7%
       against a 0.4% ceiling) and counted its own wash as content.
       Mixing the accent halfway into the foreground compresses that spread:
       the mix is ~170 units from the ground on a dark accent and ~195 on a
       pale one, so 8% of it is 13.6 and 15.6 — inside the band on both, with
       the accent's hue still in it. */
    --wash: color-mix(in srgb, var(--accent) 45%, var(--fg));
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    /* Quote slides get wider gutters than the rest of the set — both legacy
       generations did this, and it is what keeps a 70px italic measure from
       running the full plate width. */
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2): a discrete type-scale multiplier
     and logical text alignment, applied per slide via body classes. Classes,
     never a {{fontScale}} CSS var: a stripped placeholder degrades to a
     harmless "ts-" class token, whereas an EMPTY-but-defined custom property
     substitutes as empty (not the var() fallback) and would invalidate every
     font-size on an older checkpointed slides-data re-rendered post-deploy. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  /* ── PHASE 5.5: THE ONE TYPE SCALE (`visual-system.ts`, `TYPE_SCALE_PX`). ──
     Six steps for the whole archetype set, against the 45 distinct `font-size`
     values the eight bundled templates declared between them. A plate picks a
     step by ROLE rather than by which file the writer's layout landed on.
     `visualSystemCssBlock` overrides these per run with the resolved system's
     type flavour; these are the self-contained defaults a brandless render
     uses.

     ── ON `body`, NOT ON `:root`, AND THAT IS NOT A STYLE CHOICE. ──
     A custom property's `var()` references are substituted AT THE ELEMENT THAT
     DECLARES IT. `--ts` is `1` on `:root` and is overridden on `body.ts-s` /
     `body.ts-l`, so a `--t-*` declared on `:root` resolves `var(--ts, 1)`
     against the ROOT's value — always 1 — and then inherits down already
     substituted. Declared there, the reviewer's whole type-scale control
     silently stopped reaching every size that reads a step: measured, this
     plate rendered its 300px figure at 300px at `ts-s`, where the literal it
     replaced rendered 255px, and the calibration's own s-vs-l control pair
     reported the two plates painting identical ink (0.4175 both). Declared
     HERE the substitution happens on `body`, where `body.ts-s` is in force. */
  body {
    /* ── PHASE 5.5: THE PAGE MARGIN IS THE VISUAL SYSTEM'S `gutter` AXIS. ──
       `--gutter` is emitted per run by `visualSystemCssBlock` (`wide` 64px,
       `tight` 48px) and was read by nothing: every template hard-coded its own
       margin, so two catalog entries that differ ONLY in gutter rendered the
       same plate and the twelve-entry catalog was a variety claim a reader
       could not see. The literal stays as the fallback, so a document composed
       without the run sheet is byte-identical. */
    --mx: calc(var(--gutter, 64px) * 1.25);
    --t-micro: calc(22px * var(--ts, 1));
    --t-label: calc(32px * var(--ts, 1));
    --t-lead: calc(46px * var(--ts, 1));
    --t-statement: calc(84px * var(--ts, 1));
    --t-display: calc(124px * var(--ts, 1));
    --t-figure: calc(220px * var(--ts, 1));
  }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--f-body);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 96px var(--mx) 96px;
  }

  /* ── L1: the tonal wash, full bleed, inside the 12-18 band. A pixel is
        GROUND within 12 of the ground colour and INK beyond 18, so a wash
        between the two is visible tone that is not a mark: it may reach the
        frame edge without putting ink in the band `clippedEdgeShare` reads,
        and it takes the plate off "flat". ── */
  .ground {
    position: absolute; inset: 0; z-index: 0;
    /* A CORNER wash, not half the plate, because the pull-quote panel below
       covers well over 40% of the frame. `measureSlidePng` decides what
       colour a slide's ground IS by taking the modal FLAT cell; a half-plate
       wash splits the real ground's vote across several tones while the panel
       pools its own, the panel wins, and every dark pixel at the frame edge is
       then measured as clipped ink. The standing rule for this set: a panel
       over about 40% of the frame means the plate gets a corner wash. */
    background-image: radial-gradient(58% 26% at 100% 0%, color-mix(in srgb, var(--wash) var(--ground-texture-alpha, 8%), transparent) 0%, transparent 72%);
  }
  /* ── THERE IS NO L2 ON THIS PLATE ANY MORE, and that is the point. ──
     A full-bleed texture inset 16px used to paint ink in every cell of the
     frame, which made `occupiedShare` and `largestEmptyRectShare` constants:
     every ground-bearing template in this directory reported the same 1.5%
     largest empty rectangle with the full copy on it and with every slot
     empty. The texture now lives only on the pull-quote panel, which is the
     region the composition actually occupies — see `cover.html`'s header for
     the rule and `headline-focus.html`'s for the pitch. ── */

  .qc-head { position: relative; z-index: 3; flex: 0 0 auto; }
  /* `inline-block` so a client's `pill`/`brackets` badge variant wraps the
     words rather than painting a full-measure bar. */
  .eyebrow {
    /* ── THE LABEL'S BOX IS ITS LABEL. ──
       A block-level eyebrow spans the whole measure whatever it says, so its
       BOX reaches the opposite corner of the plate even when its ink stops
       after two words. `renderCarousel`'s reserved-zone probe reads boxes, so
       a full-width label was reported as entering the brand mark's corner from
       the other side of the frame — a finding about nothing, on the instrument
       §7 F2 exists to make trustworthy. `fit-content` makes the two agree.
       `stat-callout.html` has always been `inline-block` for the same reason. */
    inline-size: fit-content; max-inline-size: 100%;
    display: inline-block;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow:empty { display: none; }
  /* ── PHASE 5.5 §4.3: UNDER THE ACCENT SWITCH, AND IT IS THE EYEBROW'S
        UNDERLINE. ──
     `stat-callout.html`'s `.sc-rail` carries the whole argument. The same 2px
     full-measure hairline at 48% of the foreground appears in seven of the
     eight files, so before this it painted on six of eight plates of every
     carousel — the owner's *"יש קווים כאלה"* in a quieter colour — and on a
     plate whose eyebrow slot came through empty it was a rule over nothing. */
  .qc-rail { display: var(--fx-accent, none); block-size: 2px; background: color-mix(in srgb, var(--fg) 48%, transparent); margin-block-start: calc(24px * var(--ts, 1)); }
  body:not(:has(.eyebrow:not(:empty))) .qc-rail { display: none; }

  /* The pull-quote panel: graded and textured for the reason in the header,
     with the accent spent on one heavy rule down the reading-start edge
     rather than on the panel fill. */
  .quote-block {
    /* The panel STRETCHES to meet the kicker rail and centres the quote
       inside itself. Hugging the quote parked it at the foot of the plate
       with the top half bare — the composition this rework exists to
       abolish — and centring inside a stretched panel composes the same way
       for a one-line quote and a six-line one. */
    position: relative; z-index: 3; flex: 1 1 auto; min-block-size: 0;
    /* CAPPED, for the reason `stat-callout.html`'s slab is: an uncapped
       stretch put ~550px of empty tint inside the panel (a 20%-tall band
       above the quote mark and a 25%-tall band below the quote) INSIDE the
       region that supplies this archetype's device score, which is decoration
       being scored as content one level down. Capped at 860px the same plate
       carries ~310px of internal air, split either side of a quote that now
       sets four points larger, and the space the cap gives back becomes two
       even gaps on the ground rather than one hole (largest empty rectangle
       9.5%, ceiling 22% at the cover role). Hugging outright was measured and
       rejected: it puts a 22.6% rectangle under the panel, which is over that
       ceiling before the calibration margin is applied at all. */
    max-block-size: calc(860px * var(--ts, 1));
    display: flex; flex-direction: column; justify-content: center;
    /* The bottom margin is not slack: it keeps the panel under half the
       frame. At or above half, the interest floor treats a slide as carrying
       a FULL-BLEED element and switches clause B's `clippedEdgeShare` limb
       off (`FULL_BLEED_IMAGERY_SHARE`) — which is the right call for a
       photograph reaching the edges and the wrong one for a panel sitting
       inside a 64px margin, since it would leave clipped type on this
       archetype to the DOM limb alone. */
    /* The bottom margin is not slack: it keeps the panel under half the
       frame, for the reason above, AND it is where the attribution now sits.
       The attribution used to be the panel's last child, which put a
       ~25%-tall band of empty tint under it INSIDE the region that supplies
       this archetype's device score, and left the 150px under the panel as
       bare ground — a 14.2% largest empty rectangle, inside the calibration's
       8-point margin at the cover role. Moving one line out of the panel and
       into that band fixes both: the panel ends where its content ends, and
       the space under it carries the credit. */
    margin-block: calc(44px * var(--ts, 1)) calc(96px * var(--ts, 1));
    padding: calc(44px * var(--ts, 1)) calc(52px * var(--ts, 1)) calc(40px * var(--ts, 1));
  }
  /* THE PANEL PAINTS ONLY WHEN THERE IS A QUOTE IN IT. `imageryOrDeviceShare`
     counts a covered, low-colour-count cell as a drawn device, so an
     unconditional tinted block scores its whole area whether or not anything
     is standing on it — which is how a plate with every slot empty used to
     clear the role floors it exists to fail. */
  /* ── THE CARD IS PRINTED IN CONCENTRIC ARCS, AND THAT IS THIS ARCHETYPE'S
        MARK. ──
     The whole bundled set used to carry one 45-degree hairline field, so six
     of the eight plates read as the same wallpaper with different words on it
     — the owner's second complaint verbatim. Every archetype now spends a
     different MARK (`headline-focus.html`'s header lists the set and states
     why a mark is needed at all rather than a flat tint or clean ground).
     This one is the only CURVED mark in the directory: concentric rings
     centred on the card, so the ground echoes the round shoulder of the one
     glyph this archetype is built around. At a glance it is a ripple, not a
     hatch — nothing else in the set can be mistaken for it.

     Centred rather than struck from a corner, and that is a direction
     decision rather than a compositional one: a mark anchored at `0% 0%` is
     a PHYSICAL corner, so on an RTL card it would radiate from the far side
     while the accent rule (`border-inline-start`) moved to the near one. A
     centred ring set is mirror-symmetric and needs no second rule.

     2px rings on a 22px pitch, by the same cell arithmetic every mark in this
     directory answers to: a 2px stroke can never fill three quarters of a 4px
     cell, so the rings add no drawn-device coverage and the card's device
     share stays the TINT's. The pitch also bounds the largest empty rectangle
     inside the card to one ~20px gap, and — the reason a bare graded panel is
     not an option here — a cell crossed by a ring is not FLAT, which is what
     stops a panel covering half the frame from out-voting the real ground for
     `backgroundHex` (see the third rule in this file's header). */
  /* Asked of the quote's CHILDREN. `.quote-text` is a twin-slot pair now (see
     the twin-slot block below), so it has two element children on every render
     and `:not(:empty)` on the host itself would be true on a plate with no
     quote on it — the panel would paint, and the panel IS this archetype's
     drawn device, so an empty quote card would have cleared the role floors
     this guard exists to make it fail. */
  .quote-block:has(.quote-text > span:not(:empty)) {
    border-inline-start: calc(14px * var(--ts, 1)) solid var(--accent);
    /* ── 2026-09-15: THE DOT FIELD IS DELETED. ──
       A `repeating-radial-gradient` of 2px dots on a 22px pitch is the one the
       owner named directly: ״לפעמים אתה עושה נקודות ברקע שממש קשה להסתכל על
       זה״ — dots in the background that are genuinely hard to look at. It is
       the same rule every other texture in this directory went under
       (restraint reference rule 1) and it survived the first sweep only
       because that pass matched `repeating-linear-gradient` and this one is
       radial. The panel keeps its accent tint and its 14px accent border. */
    background-image:
      linear-gradient(162deg,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%,
        color-mix(in srgb, var(--accent) 8%, transparent) 100%);
  }

  /* ── AN IMAGE ON A PANEL ARCHETYPE (RFC-21 Part 2). ──

     Until now only `cover.html` and `slide.html` declared an `{{image:hero}}`
     slot, so `HERO_IMAGE_LAYOUTS` was two archetypes wide and a carousel that
     reached for structured panels sourced **no pictures at all** — measured on
     `thepitchbydeel` pubsub-21559620763659451, 8 slides, 0 images. The imagery
     floor fixes the COUNT by promoting `text_only` slides; this fixes the
     RANGE, so a post does not have to choose between a designed panel and a
     photograph.

     THE OWNER'S BRIEF, 2026-09-15: *add image/illustration slots and sometimes
     use striking images in other layouts too (beside a stat or a card), so we
     are not limited to cover and slide.html.*

     IT IS A BAND, NOT A BACKGROUND, and that is the whole design of it. A
     full-bleed photograph behind a panel would put the panel's type on an
     uncontrolled ground — the contrast gate cannot promise anything over a
     picture — and it would re-introduce exactly the full-frame layer RFC-20
     §11.1 spent a phase removing. A bounded band sits BESIDE the content, has
     its own edges, and every share it moves is its own.

     `:empty` collapses it, so a slide with no picture is byte-identical to
     before. `object-fit: cover` on a fixed band means a portrait or a
     landscape both fill it without distortion, and `onerror` removes the node
     rather than hiding it — a removed node leaves no broken-image glyph, which
     is the same rule `cover.html` and `slide.html` already follow. */
  /* ── THE PICTURE IS THE ELEMENT THAT YIELDS. ──

     `flex: 0 1 auto` with a definite `block-size`, so in this column flex
     container the band is the ONLY item that can shrink (every sibling is
     `0 0 auto`). When a long body at `l` asks for more than the 1440px canvas
     has, the band gives the space back instead of the copy being clipped.

     WHY IT IS THE RIGHT ELEMENT TO GIVE, and this is the whole argument:
     **text cannot shrink without being clipped, and a cover-fitted photograph
     can shrink without losing anything.** `object-fit: cover` means a shorter
     band crops a little more of the same picture at the same scale - no
     distortion, no reflow, nothing hidden. Capping a text box instead is what
     CI 35001921837 caught: *"2 element(s) overflow their own box (div.num-zone,
     div#figure.num-figure), and 0% of the frame is ink inside the 8px bleed
     band"* - nothing falling off the canvas, a fixed-size numeral hidden by a
     box drawn smaller than it.

     200px rather than 300: measured down when the same overflow appeared on
     `stat-callout.html`, whose header carries the arithmetic. `min-block-size`
     floors the shrink so the band cannot be squeezed to a sliver - at that
     point it is neither a picture nor honest about being one, and clause E
     would score a 30px stripe as this plate's drawn device. */
  .sc-figure-band {
    position: relative; z-index: 3; flex: 0 1 auto;
    block-size: calc(200px * var(--ts, 1)); min-block-size: calc(110px * var(--ts, 1)); inline-size: 100%;
    overflow: hidden; border-radius: 2px;
    margin-block-end: calc(24px * var(--ts, 1));
  }
  /* ── THE COLLAPSE IS KEYED ON A NON-EMPTY `src`, NEVER ON `:has(img)`. ──

     `fillTemplate` ERASES a slot nobody filled, so a slide with no picture
     still renders `<img src="">` and the `<img>` element is still there.
     `:not(:has(img))` is therefore FALSE on exactly the plates it was written
     to collapse, and the band kept its 200px on every pictureless slide in the
     set. That is what CI 35011946920 measured as `clipped` on
     `en ltr long l -> stat-callout @ interior`, on a plate the sweep attaches
     no image to at all — the band was eating the height the long body needed
     and no amount of shrinking the figure was ever going to give it back.

     `onerror="this.remove()"` does not cover it either, and that is the part
     worth keeping. An empty `src` may or may not fire `error`, and if it does
     it fires ASYNCHRONOUSLY: the DOM probe can read the document before the
     handler runs, so the same template measures differently run to run. A
     collapse rule has to be true at parse time. `onerror` stays for the case it
     is actually for, a path that was filled and then failed to load.

     This is the same lesson `slide.html` already carries at its `.scrim` rule:
     *"`.bg:empty` rather than `:not(:has(.hero))` because this template's
     `onerror` empties a wrapper instead of removing a top-level node"*. Same
     defect, one archetype over, and the house pattern was already written down. */
  .sc-figure-band:not(:has(img[src]:not([src=""]))) { display: none; }
  .sc-figure-band img { inline-size: 100%; block-size: 100%; object-fit: cover; display: block; }
  /* ── AND THE PANEL STOPS SHRINKING WHEN A PICTURE IS ON THE PLATE. ──

     `.quote-block` is `flex: 1 1 auto` with `min-block-size: 0`. It GROWS to
     fill the gap, which is what its own comment above is about, and it also
     SHRINKS below its own content, which nothing above is about and which is
     how `stat-callout.html` came to report `clipped` twice.

     The band is `flex: 0 1 auto` so that IT is what gives a pixel back when a
     long body at `l` asks for more than the canvas has. With two shrinkable
     items a browser splits the overflow between them in proportion to their
     base sizes, so this one would take the larger share and clip its own text:
     the band would be the element that yields in the comment and not in the
     layout. `1 0 auto` keeps the grow and drops the shrink.

     Scoped to `:has(.sc-figure-band img)`, so a plate with no picture keeps the
     exact flex it had before the band existed and every share the calibration
     measured on it still holds. */
  body:has(.sc-figure-band img[src]:not([src=""])) .quote-block { flex: 1 0 auto; }
  /* ── PHASE 5.5: hidden unless the system switches it on. ──
     A contentless 8px accent rule under the picture band. `--fx-accent` is set
     by `visualSystemCssBlock` on at most three slides of a carousel; on the
     rest this mark does not paint at all. It is `display` rather than an ink
     swap because the bar is a positioned `::after` with no layout to preserve. */
  .sc-figure-band::after {
    display: var(--fx-accent, none);
    content: ""; position: absolute; inset-block-end: 0; inset-inline: 0;
    block-size: calc(8px * var(--ts, 1)); background: var(--accent);
  }
  .quote-mark {
    font-family: var(--f-display); font-style: italic; font-weight: 400;
    font-size: calc(var(--t-figure) * 0.8182); line-height: 0.55; color: var(--accent);
    /* The tight leading IS the lockup (see the header). The padding gives the
       glyph the room its line box does not have, so the DOM probe stops
       reporting the mark as an overflowing element; the negative margin
       underneath puts the optical gap back where legacy had it. */
    padding-block-end: 0.5em; margin-block-end: calc(-58px * var(--ts, 1));
  }
  /* BOUND TO THE QUOTE, like every other ink-bearing layer in this directory.
     This glyph is hard-coded in the markup, not substituted, so it painted on
     EVERY render including one where `quoteText` came through empty: a 180px
     accent-coloured mark, 816x189 device px, measuring 9.9% of the frame as a
     text-bearing leaf. That is ink with no content justifying it — the exact
     rule `cover.html`'s header states for this whole set — and it defeated the
     DOM half of clause G on a plate with nothing to read on it: the empty
     quote card reported `textBoxShare` 0.0992 against a 0.02 floor and looked
     to the probe like a slide that had copy. `display: none`, not
     `visibility: hidden`, so it leaves no box for the probe to sum. Asked of
     the CHILDREN for the same reason the panel guard above is: `.quote-text`
     is a twin-slot pair and is never `:empty` itself. */
  .quote-block:not(:has(.quote-text > span:not(:empty))) .quote-mark { display: none; }
  /* ── A SHORT PULL QUOTE IS SET LARGE, and the base rung stays at 84. ──

     MEASURED, CI 35024757753: `he rtl short s -> quote-card @ interior` was
     refused with `render-integrity` — *"only 0.9% of the frame carries any ink
     at all (floor 1.5%); the render looks broken, not boring"*. Nothing was
     broken. A short Hebrew quote at the reviewer's SMALLEST type step is
     84 x 0.85 x 0.94 = 67px over about thirty characters, and thirty
     characters of 67px type on a 1080x1440 plate is genuinely almost nothing.

     WHAT HAD BEEN HOLDING THAT NUMBER UP, and this is the point: the radial
     dot field this phase deleted. `inkShare` counts INK cells, and a field of
     small dots at a low duty cycle is read as ink rather than as a covered
     graphic — so the decoration was being scored as the plate's content, which
     is RFC-20 §11.1's class finding in reverse. Removing it did not break this
     plate; it revealed that the plate had never carried enough of its own.

     The panel's tint cannot fix it either, and that is worth stating so nobody
     tries: a flat bounded region at or under three distinct colours is a
     GRAPHIC cell, not an ink cell, so no amount of accent tone moves
     `inkShare` by a pixel. Only glyphs do.

     So the type comes up — but as a STEP for the quote that needs it, not as
     a new base rung. Raising the base to 108px was tried first (c7d5d1c) and
     CI 35029212820 refused it one file over: `template-mark-slots` reported
     `quote-card.html rtl l: marked render overflows`, because every quote up
     to 70 characters at `l` was now set at 108 x 1.18 x 0.94 = 120px in a
     panel capped at 860px. The ladder's thresholds were tuned around 84px
     and a base rung is every quote's size; a step is one quote's. */
  .quote-text {
    font-family: var(--f-display); font-style: italic; font-weight: 500;
    font-size: calc(var(--t-statement) * 1); line-height: 1.26; letter-spacing: -0.008em; text-wrap: balance;
    padding-block-end: max(0.22em, var(--mk-face-bleed, 0em));
  }
  .quote-text.small { font-size: calc(var(--t-statement) * 0.7619); line-height: 1.24; }
  .quote-text.tiny { font-size: calc(var(--t-statement) * 0.5952); line-height: 1.28; }
  /* ── THE STEP UP, for a quote that is a single breath. ──
     The ladder only ever stepped DOWN, so a 31-character quote got the same
     84px as a 90-character one and sat as two short lines in the middle of an
     860px panel. A quote this short is the plate's whole subject and can carry
     display size: 104px is `cover.html`'s `.headline` measure, the panel holds
     four lines of it under the cap at `l`, and the `he rtl short s` row reads
     `inkShare` 0.0200 with it (from 0.0157) — the type doing the work rather
     than a texture. The step is taken from the same `mkLen` count as the
     others, below the `small` threshold at every scale, so no quote the ladder
     already sized moves: English SHORT is 44 characters and stays at 84px, and
     the mark-slots fixtures are untouched. */
  .quote-text.big { font-size: calc(var(--t-display) * 0.8387); line-height: 1.16; }
  /* Outside the panel, under it — see `.quote-block`'s margin note. */
  .qc-foot { position: relative; z-index: 3; flex: 0 0 auto; display: flex; align-items: center; gap: calc(26px * var(--ts, 1)); }
  /* PHASE 5.5 — a contentless 64x6 accent dash before the attribution, hidden
     unless the visual system switched this slide's accent on. */
  /* ── PHASE 5.5, ITEM C: THE ACCENT MARK IS ONE GEOMETRY, NOT SIX. ──
     The run's `accentForm` decides the mark's shape ONCE and publishes it as
     `--fx-accent-w` / `--fx-accent-h`. Before this the length was a property of
     whichever template the writer's layout landed on — 64px on a quote card,
     200px on a stat plate, 240px on a closer, full measure on a panel — so the
     three slides the accent switch allows a mark on carried three different
     shapes, which is the owner's *"sometimes a long purple marker and
     sometimes a short one"* read as geometry rather than as colour. Each file
     keeps its own literal as the var() fallback, so a document composed
     without the run sheet is byte-identical. */
  .qc-foot::before { display: var(--fx-accent, none); content: ""; flex: 0 0 auto; inline-size: var(--fx-accent-w, calc(64px * var(--ts, 1))); block-size: var(--fx-accent-h, calc(6px * var(--ts, 1))); background: var(--accent); }
  .qc-foot:has(.quote-attr:empty) { display: none; }
  .quote-attr {
    font-family: var(--f-body); font-size: calc(var(--t-label) * 0.8438); font-weight: 500;
    letter-spacing: 0.01em; color: color-mix(in srgb, var(--fg) 82%, transparent);
  }

  /* ── TWIN SLOTS: THE MARKED COPY AND ITS PLAIN FALLBACK (RFC-17 §5.4). ──
     `cover.html`'s twin-slot block is the canonical note — why a pair rather
     than a straight swap (`fillTemplate` erases an unfilled slot, so a run
     resumed across a deploy would render an empty quote), why both twins stay
     in the DOM on every render (`probePage` counts a text-bearing LEAF, so
     wrapping one path and not the other moves `textBoxShare` and
     `fontFamiliesUsed` between two renders of the same copy), and why the
     panel-paint guard above had to be restated against the children.

     Slot names are written WITHOUT their braces in this file — `fillTemplate`
     is a `replaceAll` over the literal token and does not skip comments, so a
     token spelled out here is a second substitution site. `cover.html` carries
     the canonical note and the measurement.

     One pair here: `.quote-text` takes `html:quoteRuns` + `quoteText`.
     The attribution is not a clause and takes no marks, so `.quote-attr` and
     its `.qc-foot:has(.quote-attr:empty)` guard are untouched.

     WHAT THE PAIR DOES NOT BUY ON THIS ARCHETYPE, stated here so nobody
     reaches for it: `.quote-text` is set ITALIC at 84px, and an italic run's
     background box is an upright rectangle while the glyphs it is meant to
     sit behind lean. `block` is therefore refused on this file whatever the
     ground's luminance says (RFC-17 §5.4) — the kinds that work here are the
     ones drawn from the baseline or in the glyphs themselves. That is a
     decision for the shared mark sheet, not for this file; what this file
     owes it is the slot, and the slot is here. */
  /* The twin host's block-start bleed — see `cover.html` for the measurement
     and why it is here rather than only in the shared mark sheet. */
  :has(> span.mk-plain) { padding-block-start: max(var(--mk-twin-bleed, .22em), var(--mk-face-bleed, 0em)); }
  .quote-text:has(.mk-runs:not(:empty)) .mk-plain { display: none; }

  /* Standing brand furniture. The brand head fragment (`buildBrandHeadHtml`)
     restates both rules and lands AFTER this sheet, so a client with a kit
     keeps its own placement; these defaults exist because a brandless render
     otherwise lays the handle out in normal flow, on top of the quote. */
  .brand-handle {
    position: absolute; bottom: 34px; inset-inline-start: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.08em;
    color: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  /* The badge RULE outlives the badge SLOT: the `seriesBadge` slot is deleted
     from this file's markup, but a CLIENT's own template may still carry it
     (it is still in `KNOWN_SLOT_NAMES` and still a `LAYOUT_FIELD_KEY` for
     exactly that reason), and a badge with no placement rule lays itself out
     in normal flow over the copy. */
  .brand-badge {
    position: absolute; top: 36px; inset-inline-end: var(--mx); z-index: 6;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  /* An @handle, a URL and a #hashtag are LTR strings, and a Hebrew or Arabic
     slide lays them out inside an RTL paragraph: the leading `@` is a bidi
     NEUTRAL, so it takes the paragraph embedding level and ends up on the
     wrong side — every Hebrew slide in the tree shipped `karoslabs@`. The
     `<bdi dir="ltr">` in the markup is the fix; `dir` on the DIV would also
     have re-resolved its own `inset-inline-start` and moved the watermark to
     the other corner. The extra :has() selector is what keeps an empty slot
     hidden now that the div always has an element child. */
  /* ── PHASE 5.5: THE PAGINATION INDEX. ──
     One index, the same size in the same corner in all eight templates,
     painted on every interior slide or on none
     (`ClientVisualSystem.pagination`, frozen per client). It replaces the
     460px `.ground-glyph` that existed in two of the eight files, which is
     what the owner saw as *"על חלק מהשקופיות כתוב מספר ועל חלק לא"*. Hidden
     unless switched on — the inversion this phase applies to every mark in
     the set. See `slide.html` for the full note. */
  .pg-index {
    display: var(--fx-pagination, none);
    position: absolute; inset-block-end: 40px; inset-inline-end: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.14em;
    color: color-mix(in srgb, var(--fg) 45%, transparent);
  }
  .brand-badge:empty, .brand-handle:empty, .brand-handle:has(> bdi:empty) { display: none; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}" data-n="{{slideIndex}}">
  <div class="ground" aria-hidden="true"></div>
  <!-- The `seriesBadge` slot was here and is deleted. It printed an INTERNAL
       label ("BY THE NUMBERS", "{ FIELD NOTES }") in the same corner on every
       slide of every post — a name for the pipeline's own format that a reader
       cannot use, repeated eight times, which is the repetition a reader reads
       as machine-made. On geektime it also collided with the brand logo disc
       in that corner and clipped to `{ FIELD` on all eight plates. What
       replaces it is this slide's OWN topical line (`kicker`, in the
       composition where a label belongs), on the slides this run's visual
       system allows one. -->
  <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
  <span class="pg-index" aria-hidden="true">{{slideIndex}}</span>
  <div class="qc-head">
    <div class="eyebrow">{{kicker}}</div>
    <div class="qc-rail"></div>
  </div>
  <div class="sc-figure-band"><img src="{{image:hero}}" onerror="this.remove()" alt="" /></div>
  <div class="quote-block">
    <div class="quote-mark">&ldquo;</div>
    <div class="quote-text" id="quote"><span class="mk-runs">{{html:quoteRuns}}</span><span class="mk-plain">{{quoteText}}</span></div>
  </div>
  <div class="qc-foot">
    <div class="quote-attr">{{attribution}}</div>
  </div>
  <script>
    // Legacy `CF.lengthClass` breakpoints, adapted to this measure: a quote
    // over ~110 characters cannot hold 84px inside the plate without pushing
    // the panel past its own box.
    //
    // THE BREAKPOINTS MOVE WITH THE REVIEWER'S TYPE SCALE, and they have to.
    // The ladder decides a size from the string's length alone, so at `l`
    // (`--ts` 1.18) every step it picks is 18% taller in a plate that did not
    // grow: a 104-character quote took the 84px step, rendered at 99px, and
    // the panel reported `scrollHeight > clientHeight` — which the DOM probe
    // calls an overflowing element and clause B of the interest floor fails
    // the slide on, on copy that fits perfectly at `m`. Shifting the
    // thresholds down at `l` steps the same quote to the next size, which
    // still lands larger than the `m` render. `s` keeps the `m` thresholds:
    // a smaller scale never overflows, and stepping DOWN there would make a
    // short quote tiny for no reason.
    //
    // THE `m` FIRST STEP IS 90, NOT 110, AND THAT NUMBER IS MEASURED. The
    // panel is capped at 860px (see `.quote-block`), so the 84px step holds
    // five lines and not six. Swept in real Chromium (`.local/qc-fit.mjs`,
    // 2026-09-11) at `m`, four characters apart: 90 and 94 sit at five lines
    // with 40px of room inside the cap; 98, 102, 106 and 107 all take a
    // sixth line and report `scrollHeight 877 > clientHeight 860`, which
    // clause B of the interest floor fails the slide on. 110 let every one of
    // those through — the 107-character quote this repo's own fixtures use
    // included — and the escape was hard to see in the pixels, because a
    // centred flex box spills half of it out of the BLOCK-START edge, where
    // `scrollHeight` cannot follow it (see `probePage`'s block-start limb).
    // 90 keeps four characters of margin under the last length that measured
    // clean, which is the room a wide-glyph string needs.
    //
    // THE LADDER MEASURES THE VISIBLE TWIN, NOT BOTH OF THEM — `cover.html`'s
    // script carries the full note. `textContent` reads a `display: none`
    // subtree too, so on a marked render the host holds its copy twice, and on
    // THIS archetype a doubled count is the worst case in the set: the sweep
    // recorded above put the 90-character breakpoint four characters from the
    // last length that measured clean inside the 860px cap, so a doubled count
    // does not overflow — it silently drops a five-line quote to `tiny` and
    // throws away the composition the cap was tuned around. Zero-width bidi
    // controls are stripped for the reason stated there.
    (function () {
      function mkLen(el) {
        if (el === null) return 0;
        var runs = el.querySelector(".mk-runs");
        var src = runs !== null && runs.textContent.trim() !== "" ? runs : el.querySelector(".mk-plain");
        var text = ((src === null ? el : src).textContent || "").replace(/[\u2066-\u2069\u200E\u200F]/g, "");
        return text.trim().length;
      }
      var q = document.getElementById("quote");
      var len = mkLen(q);
      var big = document.body.classList.contains("ts-l");
      if (len > (big ? 130 : 190)) q.className = "quote-text tiny";
      else if (len > (big ? 70 : 90)) q.className = "quote-text small";
      // A single-breath quote steps UP — see `.quote-text.big`. 36 rather
      // than 40: the sweep's English SHORT is 44 and must not move.
      else if (len > 0 && len <= 36) q.className = "quote-text big";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
