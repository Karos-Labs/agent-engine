<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent closer slide template</title>
<!--
  `closer` — the last slide. The save moment, and the only slide that gets to
  ask the reader for something.

  The 2026-09-08 audit's finding 9 named three defects, and the third was
  "closers with no call to action". The deeper version of that defect is a
  closer that is near-empty: a line of thanks on a bare plate, which is the
  cheapest slide in any carousel to get wrong because nobody is looking at it
  when the copy is written. So this file, like `cover.html`, is built so the
  empty version cannot be rendered:

    * a token-driven GROUND is always painted (a texture plus a full-measure
      accent footer band, or a display-face numeral field — chosen per run by
      the same seeded walk `paletteForSlide` uses, see `isVariationSlot`);
    * a RECAP STRIP of two to four mini plates, built BY CODE from the
      carousel's own earlier slides (`buildRecapFragment`) — never a second
      draft of the post, every plate is a verbatim fragment of a slide the
      reader has already seen;
    * the takeaway in the display face, and a question or a CTA under an
      accent rule.

  ── 2026-09-11, the visual rework ──

  The previous revision's standing graphic was a 380x230 tinted rectangle
  pinned in the far bottom corner, with the copy optically centred somewhere
  above it. It measured (14% of the frame, enough for clause E) and it read as
  an accident: a brown box with no relationship to anything else on the plate.
  It is now a FOOTER BAND running the full measure, and the ask sits ON it —
  so the graphic is the thing the reader's eye lands on last, which is exactly
  where a call to action wants to be. The band composes at any content length,
  because the column above it is elastic and the band is not.

  Two mechanical rules this file now keeps, both learned from the DOM probe
  rather than from the pixels:

    * every decoration is a BACKGROUND LAYER, never a positioned child. A
      positioned decoration that leaves its parent's box makes that parent
      report `scrollWidth > clientWidth`, which the renderer's probe reports
      as an overflowing element — and clause B of the interest floor fails a
      slide on `probe.overflow` alone. The old rotated accent rule did exactly
      that, on every closer, for a decoration nobody could see.
    * display type carries a small `padding-block-end` in `em`. A display
      face's glyph box is taller than a sub-1.15 line box, so the block
      reports `scrollHeight > clientHeight` and trips the same clause.

  The 16px inset on `.ground-art` is the pixel half of the same care:
  `clippedEdgeShare` counts ink inside an 8px bleed band and fails a slide
  over 0.4%. `.ground`'s wash may bleed, because it stays below the ink
  threshold at every stop.

  Slots: `takeaway`, `cta`, `question`, `html:recap`, plus `eyebrow` and the
  standing furniture. Exactly one of `cta`/`question` is filled per slide —
  see `contentFor`: a question is set as an invitation, a CTA as a line, and
  those are two different typographic jobs rather than one slot with two
  meanings. `html:recap` carries the recap strip, or a slide-level number
  device when there is no recap to build.

  See `stat-callout.html`'s header for why the token block is duplicated.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    /* THE WASH TONE, and it is a mix rather than the accent itself.
       A ground wash has to land in the measurement's 12-18 band — visible
       tone that is not a mark — for EVERY accent the palette walk admits,
       and the accent alone cannot do that. The only gate on --accent is
       ACCENT_GROUND_CONTRAST_FLOOR = 3 against the ground, so a dark accent
       sits ~92 units from the bundled ground and a pale one ~159: the same
       14% alpha that measures 12.9 on the first measures 22.3 on the second,
       which is INK. Rendered with a pale kit every template in this
       directory then put ink in the 8px bleed band (clippedEdgeShare 0.5-0.7%
       against a 0.4% ceiling) and counted its own wash as content.
       Mixing the accent halfway into the foreground compresses that spread:
       the mix is ~170 units from the ground on a dark accent and ~195 on a
       pale one, so 8% of it is 13.6 and 15.6 — inside the band on both, with
       the accent's hue still in it. */
    --wash: color-mix(in srgb, var(--accent) 45%, var(--fg));
    --accent-ink: #141414;
    --line: color-mix(in srgb, var(--fg) 28%, transparent);
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2) — see `stat-callout.html`'s note
     on why these are classes and never a {{fontScale}} custom property. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  /* ── PHASE 5.5: THE ONE TYPE SCALE (`visual-system.ts`, `TYPE_SCALE_PX`). ──
     Six steps for the whole archetype set, against the 45 distinct `font-size`
     values the eight bundled templates declared between them. A plate picks a
     step by ROLE rather than by which file the writer's layout landed on.
     `visualSystemCssBlock` overrides these per run with the resolved system's
     type flavour; these are the self-contained defaults a brandless render
     uses.

     ── ON `body`, NOT ON `:root`, AND THAT IS NOT A STYLE CHOICE. ──
     A custom property's `var()` references are substituted AT THE ELEMENT THAT
     DECLARES IT. `--ts` is `1` on `:root` and is overridden on `body.ts-s` /
     `body.ts-l`, so a `--t-*` declared on `:root` resolves `var(--ts, 1)`
     against the ROOT's value — always 1 — and then inherits down already
     substituted. Declared there, the reviewer's whole type-scale control
     silently stopped reaching every size that reads a step: measured, this
     plate rendered its 300px figure at 300px at `ts-s`, where the literal it
     replaced rendered 255px, and the calibration's own s-vs-l control pair
     reported the two plates painting identical ink (0.4175 both). Declared
     HERE the substitution happens on `body`, where `body.ts-s` is in force. */
  body {
    /* ── PHASE 5.5: THE PAGE MARGIN IS THE VISUAL SYSTEM'S `gutter` AXIS. ──
       `--gutter` is emitted per run by `visualSystemCssBlock` (`wide` 64px,
       `tight` 48px) and was read by nothing: every template hard-coded its own
       margin, so two catalog entries that differ ONLY in gutter rendered the
       same plate and the twelve-entry catalog was a variety claim a reader
       could not see. The literal stays as the fallback, so a document composed
       without the run sheet is byte-identical. */
    --mx: var(--gutter, 64px);
    --t-micro: calc(22px * var(--ts, 1));
    --t-label: calc(32px * var(--ts, 1));
    --t-lead: calc(46px * var(--ts, 1));
    --t-statement: calc(84px * var(--ts, 1));
    --t-display: calc(124px * var(--ts, 1));
    --t-figure: calc(220px * var(--ts, 1));
  }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--f-body);
    display: flex; flex-direction: column;
    padding: 104px var(--mx) 16px;
  }

  /* ── L1: the tonal wash, full bleed, inside the 12-18 band. ──
     A pixel is GROUND within 12 of the ground colour and INK beyond 18; a
     wash between the two is visible tone that is not a mark, so it may reach
     the frame edge without putting ink in the bleed band, and it takes the
     plate off "flat" — which is the honest way past clause D, a conjunction
     of flat AND idle. One layer, never two overlapping: two 14-unit tones
     that cross each other sum past 18 and stop being a ground. */
  .ground {
    position: absolute; inset: 0; z-index: 0;
    background-image: linear-gradient(186deg, transparent 46%, color-mix(in srgb, var(--wash) var(--ground-texture-alpha, 8%), transparent) 100%);
  }
  /* ── L2: the texture and the accent geometry, ON THE TAKEAWAY'S FIELD. ──

     Both of these used to be full-bleed `<div>`s inset 16px, and that was the
     defect this revision removes. A texture painting ink in every cell of the
     plate makes `occupiedShare` and `largestEmptyRectShare` constants:
     measured through `measureSlidePng` over real Chromium, this file's
     previous revision reported the SAME 1.5% largest empty rectangle with the
     full copy on it and with every slot empty, while carrying a visible
     full-width void from the accent rule under the takeaway (y~53%) to the
     top of the footer band (y~78%) that no clause could see.

     So the rule stated in `cover.html`'s header applies here too: **tone may
     paint anywhere, ink only inside a region the composition occupies, and
     only when the content that justifies it is present.** `.cl-field` is that
     region — it wraps the recap strip, the takeaway and the accent rule — and
     its paint is switched off when there is no takeaway.

     2px rules every 9px at 20% of the foreground: about 44 units of contrast,
     a pinstripe a phone can actually resolve, where the pre-rework
     1.5px/18px at 14% was half the duty at 31 units and reproduced as
     nothing. The pitch is derived in `headline-focus.html`'s own note — a
     measurement cell is 4 design px, so a 2px rule on a `p`px pitch marks
     `(2+4)/p` of the cells it crosses, and the 14-16px pitches this set shipped
     first marked under half of them. It stays a TEXTURE and not a device at
     any pitch, because a 2px rule cannot fill three quarters of a 4px cell. */
  /* ── THE FIELD IS A STACK OF BANDS, AND THAT IS THIS ARCHETYPE'S MARK. ──
     The whole bundled set used to carry one 45-degree hairline field, so six
     of the eight plates read as the same wallpaper with different words on it
     — the owner's second complaint verbatim ("בנוסף בגלל שזה חזרתי זה נראה
     AI"). Every archetype now spends a different MARK, and
     `headline-focus.html`'s header lists the set and states why a mark is
     needed at all rather than a flat tint or clean ground.

     A closer's mark is ARCHITECTURAL rather than fine: 6px bars on a 30px
     pitch, which is banding a reader sees as geometry rather than a texture
     they read as tone. That is the right register for the last slide — it
     rhymes with the footer band the ask sits on and with the recap strip's
     own plates, so the whole plate reads as a stack of horizontal masses. It
     is the only mark in the directory whose individual marks are visible at
     feed size, which is what a closer wants and what a hook slide does not.

     THE PITCH IS MEASURED, not chosen. The first try was 6px on a 68px pitch
     — genuinely architectural, and it marked only 15% of the cell rows it
     crossed at an 8.8% duty cycle, so this plate went from 47.4% flat to
     64.3% and a Hebrew closer to 66.4%, three points under clause D's 70%
     ceiling on a slide carrying a full recap strip. A ground whose margin
     against "flat and idle" is three points is a ground that will trip on the
     next copy length. At 6px/30px the duty is 20% — the same order as the
     22% of the 2px/9px hatch it replaces — and the bars are still individually
     countable, which is the property that makes this a band stack and not a
     texture.

     It stays a rule system and not a drawn device because of the same cell
     arithmetic every mark in this set answers to, applied to the RULE rather
     than the pitch: a covered cell needs 48 of its 64 samples, so only the
     cell rows a 6px bar spans outright can ever be covered — a third of the
     rows it touches, and `imageryOrDeviceShare` here stays the ASK BAND's and
     the recap strip's, which are the closer's real devices. The pitch also
     bounds the largest empty rectangle inside the field to one 24px band,
     against a 22% ceiling at the closer role.

     The TONE is the set's standing 20% of the foreground — the same weight
     the hairline field it replaces carried — and deliberately not the 26% a
     first pass reached for: at 26% a 6px bar competes with the takeaway it is
     supposed to sit behind. Softening it costs nothing here, and that is
     worth stating because it is not obvious: `flatBackgroundShare` counts
     pixels within 12 units of the ground and a 20% bar is 44 units off it, so
     the bars are INK at either tone, and every number this ground answers for
     is the GEOMETRY's rather than the alpha's. 20% also keeps this mark
     inside the 12-34% band the rest of the directory uses — the range that
     still clears the ink line for a client whose derived neutrals sit closer
     together than the bundled pair.

     The accent is spent on ONE solid rule capping the field's head, not on a
     diagonal band: a diagonal band is `headline-focus.html`'s signature, and
     two archetypes sharing a signature is the defect this pass removes. */
  /* ── 2026-09-15: THE BAND RHYTHM IS DELETED, THE ACCENT CAP STAYS
        (RFC-20 §11.4). ──
     The paragraph above is the record of a texture that no longer exists,
     kept because its arithmetic is still true and the next person to reach
     for a field texture needs it. The 6px-every-30px ruling at 20% of `--fg`
     covered the whole field, and the restraint reference's rule 1 is
     *texture only at near-ground value, never a field you can read as a
     pattern.* This one read as a pattern.
     `slide.html` and `headline-focus.html` lost theirs in the same pass and
     for the same three reasons; `slide.html`'s header block states them in
     full. The short version is the third one: the clause that required the
     ink is gone (PR #124 demoted clause D's occupancy limb to
     reporting-only), so the texture was paying a bill nobody sends.
     WHAT STAYS is the sentence the paragraph above ends on — *the accent is
     spent on ONE solid rule capping the field's head* — which is now the
     whole of this file's field paint. A 10px bar is punctuation; a ruling
     over 1000x800px was a surface. */
  /* The cap is SHORT — `headline-focus.html`'s `.hf-field` carries the
     measurement. Same 240px measure as `.cl-rule` below it, which is the
     point: one accent width for the whole directory. */
  /* ── PHASE 5.5: the cap's INK is conditional, its geometry is not. ──
     `var(--fx-accent-ink, transparent)` — `visualSystemCssBlock` sets it on at
     most three slides of a carousel, and the closer is always one of them
     (`accentSlidesFor` always returns the last slide). So on a closer this
     paints exactly as before; what changed is that it can no longer paint on a
     plate the system did not choose. */
  .cl-art {
    background-image: linear-gradient(to bottom, var(--fx-accent-ink, transparent) 0 calc(10px * var(--ts, 1)), transparent 0);
    background-size: calc(240px * var(--ts, 1)) 100%;
    background-repeat: no-repeat;
    background-position: var(--cap-x, 0) 0;
  }
  body[dir="rtl"], html[dir="rtl"] body { --cap-x: 100%; }
  /* The alternative ground: a display-face numeral bleeding off the start
     corner, over a TIGHTER band rhythm — 4px bars every 20px, so the two
     closers differ in the weight and the count of their bands as well as in
     whether a numeral is present. Finer here on purpose: the numeral is the
     thing to see on this variant, and a 6px bar competes with it. This used to be the same 135-degree hatch
     the grid variant ran at 45, which is one mark at two angles: two
     consecutive slides wearing it still read as one wallpaper, which is the
     defect the variant exists to break.
     OUTLINE ONLY on the numeral — a filled numeral at any tint that reads is
     a filled SHAPE, and every cell inside it then counts as a drawn device;
     the budget goes into stroke CONTRAST instead, which costs no coverage at
     all. */
  /* The tighter band rhythm goes with the grid variant's — same three
     reasons. The two closers now differ in WHERE the accent cap sits and in
     whether the numeral is present, which is two axes of difference for one
     mark instead of two wallpapers: the glyph variant caps the field's FOOT,
     so the eye enters at the numeral and leaves at the rule rather than the
     other way round. `slide.html` makes the same substitution, position for
     texture, between its odd and even plates. */
  body.gr-glyph .cl-art {
    background-image: linear-gradient(to top, var(--fx-accent-ink, transparent) 0 calc(10px * var(--ts, 1)), transparent 0);
    background-position: var(--cap-x, 0) 100%;
  }
  /* The guards. No takeaway, no field; and furniture that paints ink answers
     to the same rule, so the numeral goes with it.

     BOTH ARE ASKED OF THE TAKEAWAY'S CHILDREN. `.headline` is a twin-slot pair
     now (see the twin-slot block below), so `#takeaway` has two element
     children on every render and can never match `:empty` again — written the
     old way these two guards would have gone permanently silent and a closer
     with nothing to say would have kept both the field paint and the 720px
     numeral, which is the ink an empty plate must not acquire. */
  body:not(:has(#takeaway > span:not(:empty))) .cl-art { background-image: none; }
  /* ── PHASE 5.5: THE 460px GROUND NUMERAL IS RETIRED. ──

     It lived in TWO of the eight bundled templates — this one and
     `headline-focus.html` — so a carousel showed a giant outlined numeral on
     two plates and nothing on the other six. The owner, judging the
     2026-09-16 posts: *"על חלק מהשקופיות כתוב מספר ועל חלק לא"*. The brief
     blamed `GROUND_VARIATION_MIX = 0.5`; that has been a constant since
     2026-09-14 (`slides-data.ts` reads `isVariationSlot(1, ...)`, one ground
     per post) and was never the cause. The template set was.

     Within-carousel randomness is the wrong axis for this: a carousel is ONE
     system. The axis moves up to `ClientVisualSystem.pagination` — all or
     none, frozen per client — and down to a uniform 22px index in all eight
     files, below. A designed large figure is still available where the
     CONTENT has a number: `device: { kind: "figure" }`, which the copy model
     authors and `slide-devices.ts` paints, bounded and labelled.

     The whole `.ground-glyph` rule set, its `gr-glyph` branch and its
     -webkit-text-stroke watermark are deleted with it; the span is gone from
     the markup below. `gr-glyph` survives as the ground's ACCENT GEOMETRY
     (this file's `.cl-art` caps the field's foot under it and its head
     otherwise), which is what that class was always worth. */
  .pg-index {
    display: var(--fx-pagination, none);
    position: absolute; inset-block-end: 40px; inset-inline-end: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.14em;
    color: color-mix(in srgb, var(--fg) 45%, transparent);
  }

  /* The top anchor, the elastic column, and the ask that sits on the band. */
  .cl-head { position: relative; z-index: 3; flex: 0 0 auto; }
  .cl-rail { display: var(--fx-accent, none); block-size: 2px; background: color-mix(in srgb, var(--fg) 48%, transparent); margin-block-start: calc(24px * var(--ts, 1)); }
  /* ── The Ground Rule and §11.5 together — `stat-callout.html`'s `.sc-rail`
        carries the full argument. ──
     §11.5 item 2 is this file: `largestEmptyRectShare` 0.2278 (en) and
     0.2306 (he) at `(0,0 → 1080,328/332)`, over the 0.22 closer ceiling, on
     a populated plate whose eyebrow slot the fixture left empty. Same rail,
     same corner, same one-word cause as the stat callout.
     THE SUBJECT OF A CLOSER IS ITS TAKEAWAY, and the guard reads it the same
     way the field paint above does — asked of the twin's CHILDREN, because
     `#takeaway` is a twin-slot pair and can never match `:empty` again. */
  /* ── PHASE 5.5 §4.3: THE RAIL IS UNDER THE ACCENT SWITCH, AND IT IS THE
        EYEBROW'S UNDERLINE. ──
     Two changes, and the second is the one the owner named.

     (1) `display: var(--fx-accent, none)`. Every standing mark in this set is
     hidden unless the run's resolved system switches it on; the bands and the
     bars landed under that switch and the hairlines did not, so a neutral 2px
     full-measure rule kept painting on six of eight plates of every carousel
     — *"יש קווים כאלה"* in a quieter colour.

     (2) The guard asks the EYEBROW again, not only the plate's subject. The
     subject-guard reading was written for RFC-20 §11.5, where a populated
     plate that lost its rail measured a band at the top — but that
     measurement was taken while this archetype's middle HUGGED its content.
     The middle is `flex: 1 1 auto` now, so a collapsed head is absorbed by the
     composition instead of leaving a hole, which is the remedy §11.5 itself
     asked for (*"the composition owes the top of the plate something"*) rather
     than the furniture standing in for it. The subject guard is KEPT beside
     it: an empty plate still paints nothing, which is RFC-20 guard G2.
     A rule over nothing is not a rule; it is ink a quiet plate acquired. */
  body:not(:has(.eyebrow:not(:empty))) .cl-rail { display: none; }
  body:not(:has(#takeaway > span:not(:empty))) .cl-rail { display: none; }
  /* The field runs the full measure inside the 16px frame — wider than the
     body's own 64px margin, so it reads as a field rather than as a
     highlighted paragraph. The negative inline margin and the matching inline
     padding cancel, so no glyph moves; 16px rather than 0 because
     `clippedEdgeShare` counts ink inside an 8px bleed band.

     The takeaway is anchored to the field's FOOT, not centred in it. Centred,
     the plate carried two ~25% bands of bare texture, one above the statement
     and one between it and the footer band; anchored, the breathing room all
     collects under the accent geometry at the top — where a designed plate
     wants it — and the reading order (eyebrow, accent, takeaway, ask) is one
     continuous run down to the band. */
  /* ── PHASE 5.5: THE SLACK IS DISTRIBUTED, NOT POOLED. ──
     `flex-end` was chosen while the 460px `.ground-glyph` filled the band
     above the takeaway; with the glyph retired it pooled EVERY pixel of slack
     into one rectangle under the head. Measured on this tree before the
     change: `largestEmptyRect` 1080x384 at (0,164), share 0.2667 against the
     closer's 0.22 ceiling — the plate the owner called empty, measuring
     emptier than the one he called empty. `center` halves the band by putting
     the same slack above AND below the statement; the ladder below is what
     makes each half small rather than merely equal. */
  /* ── PHASE 5.5: THE BAND IS THE ELASTIC ITEM, NOT THE FIELD. ──
     The 460px `.ground-glyph` used to fill this plate's middle. With it
     retired, an elastic FIELD meant every pixel of slack became BARE GROUND
     between the head and the takeaway: `largestEmptyRect` 1080x384 at (0,164),
     share 0.2667 against a 0.22 ceiling — the closer measuring emptier than
     the one the owner called empty.

     Swapping which item is elastic answers it without adding a single mark.
     The field takes its own content's height; the ASK — whose background IS
     this archetype's drawn device, a 24-40% accent band that paints only when
     there are words in it — grows into the slack instead. Slack that used to
     be a hole is now the payoff surface, which is what a closer is for. The
     band keeps a 300px floor and shrinks no further, so a long takeaway over a
     four-plate recap still fits; measured, the worst case leaves 228px of the
     773px the field can use.

     `flex: 0 0 auto` also removes the shrink-below-content state entirely: a
     CENTRED child of a box the flex algorithm shrank escapes at both ends, and
     that is `probe.overflow` on `div.cl-field, div.cl-wrap` — clause B's hard
     `clipped`, on a plate that fits. */
  .cl-field {
    position: relative; z-index: 3; flex: 0 0 auto;
    display: flex; flex-direction: column; justify-content: center;
    margin-inline: calc(16px - var(--mx)); padding-inline: calc(var(--mx) - 16px);
    margin-block-start: calc(28px * var(--ts, 1));
    padding-block: calc(40px * var(--ts, 1));
  }
  /* THE WRAP NEVER SHRINKS BELOW ITS OWN CONTENT, the same correctness rule
     `headline-focus.html`'s `.copy` states at length and the one this file
     was still breaking. With no `flex` declared it defaulted to `0 1 auto`,
     so when `.cl-ask` grew the flex algorithm shrank this box under its
     content and `.cl-field`'s `justify-content: flex-end` pushed the excess
     out of the BLOCK-START edge — measured at `m` with the calibration's own
     LONG body in the `cta` slot and a three-plate recap, the wrap rendered
     105px above its own field; with that body in the `question` slot, 304px
     above it, and `.cl-recap`, `.rc-strip`, `.rc-plate` and `.rc-n` all
     rendered above y=0 (`.local/fx-cl-fit.mjs`).

     At `flex: 0 0 auto` the box is exactly its content, so the fit question
     is answered by the ladders below rather than by silent clipping. What
     residual overflow remains still leaves through the block-start edge —
     `.cl-field` stays `flex-end`, because the breathing room collecting under
     the accent geometry at the top is this plate's composition — and
     `probePage`'s block-start limb is what reports it. Overflow that cannot
     be designed away must at least be visible.

     ── 2026-09-12: SAID PLAINLY — THIS DECLARATION IS BELT, THE LADDERS ARE
        BRACES, AND ON EVERY CASE THIS TREE CAN PRODUCE THE BRACES HOLD
        ALONE. ──
     Removing `flex: 0 0 auto` from this rule and re-running the geometry
     sweep (`.local/fx-cl-fit.mjs`: the LONG body in both slots x no/3/4-plate
     recap x s/m/l, 27 combinations) changes not one measured value — same
     field height, same wrap height, same clearance, no overflow anywhere —
     because the ask ladders below now size the ask to fit before the flex
     algorithm is ever asked to shrink anything. Neutering the takeaway ladder
     instead (`.headline.small`/`.tiny` back to 100px) fails the calibration's
     cover/closer case at the MEDIUM length straight away.
     So: the sizes are what fix the plate, and this line is the correctness
     rule that keeps a future ladder gap from clipping silently instead of
     reporting. It is kept deliberately, and it is not the thing to point at
     when explaining why the closer fits. */
  .cl-wrap { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; }
  /* ── THE ASK, AND THE BAND UNDER IT. ──
     The band is this archetype's drawn device: a filled, low-colour-count
     region of about a fifth of the frame, which is what carries a closer over
     clause E when there is no photograph to carry it. It used to be a
     background layer on the full-bleed ground div, painted whether or not
     there was anything to ask — so a closer with an empty ask still measured
     as carrying a device. It is now the ASK'S OWN background and it paints
     only when the ask has words in it, which is the same sentence the
     archetype's doc comment has always made: the graphic is the thing the
     reader's eye lands on last, and it is there because the call to action
     is. */
  .cl-ask {
    position: relative; z-index: 3; flex: 1 1 auto; min-block-size: 300px;
    /* ── AND CAPPED, WHICH IS THE OTHER HALF OF MAKING IT ELASTIC. ──
       Uncapped, a closer whose takeaway came through EMPTY had no field at all
       and the band took the whole plate: the hollow-middle guard measured
       16.4% where it needs over 22%, i.e. the instrument that names *"some of
       the slides are empty"* went blind on the one archetype this phase
       recomposed. 780px is over the band's own tallest populated case
       (measured: the worst leaves it 751px) and well under the plate, so a
       plate with a takeaway is unchanged and a plate without one shows 421px
       of bare ground and is refused for it. Scaled by `--ts` like the floor. */
    max-block-size: calc(780px * var(--ts, 1));
    display: flex; flex-direction: column; justify-content: center;
    margin-inline: calc(16px - var(--mx)); padding-inline: calc(var(--mx) - 16px);
    /* ── AND IT RESERVES THE FOOT STRIP THE STANDING MARKS OWN. ──
       The ask is the only band in the set that reaches the plate's bottom
       edge: `body`'s own `padding-block-end` is 16px, and `.cl-ask` is
       `flex: 1 1 auto`, so its box ends 16px from the frame. `.brand-handle`
       (`inset-block-end: 44px`) and `.pg-index` (`inset-block-end: 40px`) are
       ABSOLUTE and are therefore invisible to that flow — nothing reserved
       their strip, and the ask's last line was free to be set on top of them.

       Measured on this tree before the fix: the karoslabs kit under
       `mono-display` (IBM Plex Mono's advance width is wider than the three
       other registers', which is why only that register showed it), an
       eight-slide English carousel, CTA *"Open ChatGPT. Type the question
       your buyer asks when evaluating options in your category. Screenshot
       the answer."* — 108 characters, well inside `body`'s 600 maximum. The
       third line, "the answer.", printed directly over "@karoslabs": two
       strings interleaved, both legible, both ruined, on the LAST slide of
       every carousel, which is the one carrying the call to action.

       The reservation is the strip's real geometry rather than a round
       number: the handle's own inset (44px) less the plate's foot padding
       (16px) is 28px of it, the mark's line box is `--t-micro` times its
       leading, and 18px is the clearance that keeps a descender off the cap
       height below it. `max()` against the ask's own 40px so a small type
       scale never LOSES padding it had; every term rides `--ts`, because the
       reviewer's scale grows the handle and the CTA together.

       Padding rather than a shorter `max-block-size`: `* { box-sizing:
       border-box }` is set at the top of this sheet, so the band's PAINTED
       area is unchanged — clause E rests on that area (see the note above),
       and a fix that shrank it would have traded a collision for a floor
       failure. Only the copy inside it moves up. */
    --brand-foot-strip: calc(28px + var(--t-micro) * 1.5 + 18px);
    padding-block-start: calc(40px * var(--ts, 1));
    padding-block-end: max(calc(40px * var(--ts, 1)), var(--brand-foot-strip));
  }
  /* Asked of the two slots' CHILDREN — both are twin-slot pairs now (see the
     twin-slot block below), and a host with two element children is never
     `:not(:empty)`-false. This is the guard whose failure mode is the loudest
     in the set: written the old way the ask's band would paint on a closer
     with no question and no CTA, and that band is this archetype's drawn
     device — an empty ask would have cleared clause E on its own decoration. */
  .cl-ask:has(.cl-question > span:not(:empty)), .cl-ask:has(.cl-cta > span:not(:empty)) {
    /* The band's own top edge is under the accent switch with every other
       standing mark in the set (§4.3) — `--fx-accent-ink` is the channel for an
       accent-COLOURED border, and a quiet closer's band keeps its surface and
       loses the line. The surface itself is not switched: it is this
       archetype's drawn device and clause E rests on it. */
    border-block-start: calc(6px * var(--ts, 1)) solid var(--fx-accent-ink, transparent);
    /* The ask's band is ruled HORIZONTALLY, on the same axis as the field's
       band stack above it — this plate has one direction and everything on it
       obeys it. Fine here rather than architectural: the band is only 400px
       tall and a 68px rhythm inside it would read as two stripes. */
    background-image:
      linear-gradient(to top,
        color-mix(in srgb, var(--accent) 40%, transparent) 0%,
        color-mix(in srgb, var(--accent) 24%, transparent) 100%);
  }

  .eyebrow {
    /* ── THE LABEL'S BOX IS ITS LABEL. ──
       A block-level eyebrow spans the whole measure whatever it says, so its
       BOX reaches the opposite corner of the plate even when its ink stops
       after two words. `renderCarousel`'s reserved-zone probe reads boxes, so
       a full-width label was reported as entering the brand mark's corner from
       the other side of the frame — a finding about nothing, on the instrument
       §7 F2 exists to make trustworthy. `fit-content` makes the two agree.
       `stat-callout.html` has always been `inline-block` for the same reason. */
    inline-size: fit-content; max-inline-size: 100%;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.22em; text-transform: uppercase; color: color-mix(in srgb, var(--fg) 84%, transparent);
  }
  .eyebrow:empty { display: none; }

  /* ── The recap strip. Class names match `buildRecapFragment` exactly; the
        plate title reuses `.item-title`, one of `script-fonts.ts`'s
        DISPLAY_SELECTORS, so a Hebrew recap gets Hebrew leading. ── */
  .cl-recap { position: relative; }
  .cl-recap:empty { display: none; }
  /* GRADED AND TEXTURED, never a flat swatch — the standing rule for every
     large panel in this directory, and the one this file was still breaking.
     `measureSlidePng` reads the slide's ground colour off the modal FLAT
     cell, and a flat `color-mix(accent 26%, bg)` fill over a recap strip at
     the reviewer's `l` type scale is the largest single flat region on the
     plate: it won that vote, the brand ground was measured as brown, and
     every dark pixel at the frame edge was then counted as clipped ink —
     1.6% against a 0.4% ceiling, on a plate with (verified pixel by pixel
     against the real `--bg`) exactly zero ink in the bleed band. */
  .cl-recap:not(:empty) {
    background-image:
      linear-gradient(162deg,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%,
        color-mix(in srgb, var(--accent) 8%, transparent) 100%);
    padding: calc(34px * var(--ts, 1)) calc(30px * var(--ts, 1)) calc(28px * var(--ts, 1));
    margin-block-end: calc(56px * var(--ts, 1));
    border-block-start: calc(6px * var(--ts, 1)) solid var(--accent);
  }
  .rc-strip { display: flex; gap: calc(20px * var(--ts, 1)); }
  .rc-plate {
    flex: 1 1 0; border-block-start: 3px solid var(--line);
    padding-block-start: calc(22px * var(--ts, 1));
  }
  .rc-n {
    font-family: var(--f-mono); font-weight: 600; font-size: calc(var(--t-micro) * 0.8636);
    letter-spacing: 0.16em; color: color-mix(in srgb, var(--fg) 62%, transparent);
    margin-block-end: calc(16px * var(--ts, 1));
  }
  .rc-plate .item-title {
    font-family: var(--f-display); font-weight: 500; font-size: calc(var(--t-lead) * 0.6739);
    line-height: 1.25; letter-spacing: -0.01em; text-wrap: balance; padding-block-end: 0.14em;
  }
  /* FOUR PLATES IS A NARROWER COLUMN, so it is a smaller size. `.rc-strip`
     divides the 952px content column evenly: three plates are ~304px wide and
     four are ~223px, and `MAX_RECAP_PLATE_CHARS` is 40 either way. At 31px a
     40-character title takes five lines in a 223px plate — the strip stops
     being a glance, which is the exact thing `MAX_RECAP_PLATES`'s comment says
     four plates must not do — and it took the strip to 345px of an 823px
     field at `l`, which is what pushed the takeaway off the top of its own
     box. */
  .rc-strip:has(.rc-plate:nth-child(4)) .item-title {
    font-size: calc(var(--t-label) * 0.8125); line-height: 1.22;
  }
  /* THE STRIP'S FURNITURE STOPS GROWING AT `l`. `--ts` is a request for
     bigger TYPE; scaling a recap plate's padding and the gap under the strip
     by the same 18% spends the field's elastic middle on air. The type inside
     it still scales. Measured (`.local/cl-fit.mjs`): with a four-plate recap
     and a 97-character takeaway at `l` the wrap sat 66px above its own field
     and 33px on top of the eyebrow rail; with this, the four-plate title step
     and the ladder's `tiny` step it sits 42px inside its field and 75px under
     the rail. 42px is the thinnest margin in the sweep, and it is the case
     that defines this block — a shorter takeaway or a three-plate strip has
     between 54px and 434px. */
  body.ts-l .cl-recap:not(:empty) {
    padding: calc(24px * var(--ts, 1)) calc(26px * var(--ts, 1)) calc(20px * var(--ts, 1));
    margin-block-end: calc(32px * var(--ts, 1));
  }
  body.ts-l .rc-plate { padding-block-start: calc(16px * var(--ts, 1)); }
  body.ts-l .rc-n { margin-block-end: calc(11px * var(--ts, 1)); }
  body.ts-l .cl-rule { margin-block-start: calc(30px * var(--ts, 1)); }

  /* `.headline`, not a closer-specific name — a DISPLAY_SELECTOR, so the
     takeaway picks up per-script leading. */
  /* ── PHASE 5.5: THE LADDER KEEPS THE BLOCK'S HEIGHT, NOT THE TYPE'S SIZE. ──
     A length ladder exists so that more characters do not make a taller block.
     This one did the opposite of that job at the top end: a 24-character
     takeaway — the strongest payoff a closer can have — was set at the same
     100px as a 44-character one and occupied ONE line of a 858px field, which
     is how a payoff plate came to measure as the emptiest plate in the set.
     Every rung moves up and a `huge` rung is added under 30 characters, so the
     statement block lands between ~500px and ~630px at every length. THE
     STEPS ARE SCALE STEPS (§4.4), so the run's own `typeScale` flavour reaches
     them: `display` renders these at 130/110/92, `condensed` 12% larger and
     `editorial` 14% smaller, which is the axis that used to change nothing. */
  .headline {
    font-family: var(--f-display); font-weight: 600; font-size: calc(var(--t-display) * 1.05);
    line-height: 1.12; letter-spacing: -0.018em; text-wrap: balance;
    padding-block-end: max(0.22em, var(--mk-face-bleed, 0em));
  }
  .headline.huge { font-size: calc(var(--t-display) * 1.3); line-height: 1.06; }
  .headline.small { font-size: calc(var(--t-display) * 0.8871); line-height: 1.14; }
  /* The ladder's missing bottom step. `.cl-field` is the elastic middle
     (`flex: 1 1 auto; min-block-size: 0`) anchored with `justify-content:
     flex-end`, so when `.cl-wrap` outgrows it the excess leaves through the
     BLOCK-START edge — invisibly, because `scrollHeight` only ever counts
     overflow below the padding box. Measured at `l` (`.local/cl-fit.mjs`,
     real Chromium): a 97-character takeaway over a three-plate recap put the
     wrap 53px above its own field and 20px ON TOP of the eyebrow's rail; over
     a four-plate recap, 73px and 40px. `probePage` now has a block-start limb
     and reports both, but a template that needs the probe to catch it is
     still a broken template — this step is what makes it fit. */
  .headline.tiny { font-size: calc(var(--t-statement) * 1.0952); line-height: 1.16; }
  /* ── AND THE PLATE THAT ALREADY HAS A SUBJECT KEEPS THE MEASURED LADDER. ──
     The rungs above are for a closer whose only content is its takeaway —
     the plate that measured 0.2667 empty. A closer carrying a RECAP STRIP is
     a different composition: the strip takes 447-646px of the same field, so
     the band the big rungs exist to fill is already filled, and setting a
     24-character takeaway at 188px on top of it pushed `.cl-field` and
     `.cl-wrap` out of their own boxes (`probe.overflow`, measured). This
     restores exactly the sizes RFC-21 tuned around the strip, and it is the
     right order of precedence: content first, then the ladder that fills what
     the content left. */
  body:has(.cl-recap:not(:empty)) .headline,
  body:has(.cl-recap:not(:empty)) .headline.huge { font-size: calc(var(--t-display) * 1.05); line-height: 1.1; }
  body:has(.cl-recap:not(:empty)) .headline.small { font-size: calc(var(--t-display) * 0.85); line-height: 1.14; }
  body:has(.cl-recap:not(:empty)) .headline.tiny { font-size: calc(var(--t-statement) * 0.7619); line-height: 1.16; }

  /* The one accent moment above the ask. */
  /* ── PHASE 5.5: hidden unless the system switches it on. ──
     A standalone 240x14 accent bar with a 40px margin, so it COLLAPSES rather
     than going transparent: an invisible bar would still spend 54px of the
     composition on nothing. The closer is always in `accentSlides`, so on this
     archetype it paints exactly as it did — the change is that the same bar in
     `slide.html`, `headline-focus.html` and `stat-callout.html` no longer
     paints on every plate of every post. */
  /* ── PHASE 5.5, ITEM C: THE ACCENT MARK IS ONE GEOMETRY, NOT SIX. ──
     The run's `accentForm` decides the mark's shape ONCE and publishes it as
     `--fx-accent-w` / `--fx-accent-h`. Before this the length was a property of
     whichever template the writer's layout landed on — 64px on a quote card,
     200px on a stat plate, 240px on a closer, full measure on a panel — so the
     three slides the accent switch allows a mark on carried three different
     shapes, which is the owner's *"sometimes a long purple marker and
     sometimes a short one"* read as geometry rather than as colour. Each file
     keeps its own literal as the var() fallback, so a document composed
     without the run sheet is byte-identical. */
  .cl-rule { display: var(--fx-accent, none); inline-size: var(--fx-accent-w, calc(240px * var(--ts, 1))); block-size: var(--fx-accent-h, calc(14px * var(--ts, 1))); background: var(--accent); margin-block: calc(40px * var(--ts, 1)) 0; }
  /* ── THE GROUND RULE. ──
     RFC-20 §5.0: ink only inside a region the composition occupies, and only
     when the content that justifies it is present. A 240x14 solid accent bar
     is ink, and on a plate with no takeaway it was the only thing in frame —
     sitting near the centre line, which is the worst place for it, because
     `largestEmptyRectangle` finds ONE contiguous rectangle and a mark at the
     centroid roughly halves the number G2 reads.
     This guard was written once and reverted with `a3bf8f7`, which cut this
     file from the phase rather than judging the guard. The file is back in
     scope with the bounded object (§11.4) and so is the guard, unchanged, on
     the same slot the field paint above already reads. */
  body:not(:has(#takeaway > span:not(:empty))) .cl-rule { display: none; }
  /* ── AND ONE MARK, NOT TWO, WHERE THE BAND ALREADY ENDS THE STATEMENT. ──
     Rendered on this tree, an accent closer carrying an ask showed the rule
     (240x10) and the band's own 6px top edge 90px apart, one above the other:
     two accent lines stacked in the same reading position, which is the shape
     of *"there are these lines"* even when each one is defensible on its own.
     The BAND wins — it is the plate's payoff surface and the edge is its own
     boundary — so the rule stands down wherever the band paints, and a closer
     with no ask keeps the rule as its one mark. */
  body:has(.cl-ask .cl-question > span:not(:empty)) .cl-rule,
  body:has(.cl-ask .cl-cta > span:not(:empty)) .cl-rule { display: none; }

  /* ── THE ASK HAS A LADDER NOW, and it is the piece that was missing. ──
     `.cl-ask` is `flex: 0 0 auto` with a 400px floor, so its height is its
     copy's height and it takes that height from `.cl-field` — the elastic
     middle holding the recap and the takeaway. Nothing bounded it.
     `InstagramSlideCopySchema` puts no maximum on `body`, and
     `slides-data.ts` routes a body with no '?' into `cta` and one with a '?'
     into `question`, so the calibration's own 306-character LONG body is a
     producible ask. Measured (`.local/fx-cl-fit.mjs`, real Chromium): it took
     `.cl-ask` from 400px to 504px in the `cta` slot and to 989px in the
     `question` slot at `l`, which left the field 234px for a 722px wrap.
     Every other type block in this directory picks its size from its own
     string's length; these two now do too, on the same `~15%` lower
     thresholds at `l` that `quote-card.html`'s script explains. */
  .cl-question {
    font-family: var(--f-display); font-weight: 500; font-size: calc(var(--t-lead) * 1.1304);
    line-height: 1.3; letter-spacing: -0.012em; text-wrap: balance; padding-block-end: max(0.16em, var(--mk-face-bleed, 0em));
  }
  .cl-question.small { font-size: calc(var(--t-lead) * 0.913); line-height: 1.32; }
  .cl-question.tiny { font-size: calc(var(--t-lead) * 0.7391); line-height: 1.36; }
  /* The ladder's bottom step, and the case that needs it is the worst one the
     schema admits: a 306-character body with a '?' in it, so it routes to the
     question slot, at `l`, over a four-plate recap. At `tiny` the ask still
     came to 490px and the wrap escaped its field by 47px; at `micro` the ask
     is back on its 400px floor and the wrap clears by 101px. */
  .cl-question.micro { font-size: calc(var(--t-lead) * 0.6087); line-height: 1.4; }
  .cl-question:not(:has(> span:not(:empty))) { display: none; }
  .cl-cta {
    font-family: var(--f-body); font-weight: 500; font-size: calc(var(--t-label) * 1.125);
    line-height: 1.45; color: color-mix(in srgb, var(--fg) 94%, transparent);
    max-inline-size: 860px; text-wrap: pretty;
  }
  .cl-cta.small { font-size: calc(var(--t-lead) * 0.6739); line-height: 1.45; }
  .cl-cta.tiny { font-size: calc(var(--t-label) * 0.8438); line-height: 1.5; }
  /* The CTA's own bottom step, and it exists for the same reason
     `.cl-question.micro` does — the question slot got one and the CTA did not,
     although the two take the SAME string and the CTA is the branch a body
     with no '?' in it takes, i.e. the common one.

     The case: `body` is `.max(600)` and a 600-character CTA is producible.
     Measured on this tree in real Chrome, `humanist-serif`, an eight-slide
     English carousel over a four-plate recap: at `tiny` the CTA wrapped to ten
     lines and its box left `.cl-ask` by 23px, `probe.overflow` reported
     `div.cl-cta`, and the last two lines printed over `@karoslabs`. The strip
     reservation above cannot help there — it reserves space INSIDE a box the
     copy is already too tall for — which is why the fit loop below is the
     other half of this fix and this rung is what it has to descend to. */
  .cl-cta.micro { font-size: calc(var(--t-label) * 0.6875); line-height: 1.42; }
  .cl-cta:not(:has(> span:not(:empty))) { display: none; }

  /* ── TWIN SLOTS: THE MARKED COPY AND ITS PLAIN FALLBACK (RFC-17 §5.4). ──
     `cover.html`'s twin-slot block is the canonical note — why a pair rather
     than a straight swap (`fillTemplate` erases an unfilled slot, so a run
     resumed across a deploy would render an empty takeaway), why both twins
     stay in the DOM on every render (`probePage` counts a text-bearing LEAF,
     so wrapping one path and not the other moves `textBoxShare` and
     `fontFamiliesUsed` between two renders of the same copy), and why every
     `:empty` guard in this file had to be restated against the children.

     A NOTE ON HOW THE SLOT NAMES ARE SPELLED BELOW. `fillTemplate` is a
     `replaceAll` over the LITERAL token, and it does not know this is a
     comment: a raw-fragment token written out in full here is a SECOND
     substitution site, and a fragment carrying a style element of its own
     closes this stylesheet early and dumps the rest of this file onto the
     plate as body copy. Measured, on all six mark-bearing templates. So every
     slot named in prose in this file drops its braces — `html:takeawayRuns`,
     not the token — and only the real slot down in the markup can ever match.
     For the same reason no comment here spells a style tag out in full; see
     `cover.html`'s canonical copy of this note.

     THREE PAIRS HERE, THE MOST IN THE SET: `.headline` takes
     `html:takeawayRuns` + `takeaway`, `.cl-question` takes
     `html:questionRuns` + `question`, `.cl-cta` takes
     `html:ctaRuns` + `cta`. The question and the CTA are already
     mutually exclusive upstream, so at most two of the three ever carry copy
     on one plate — which is why each needs its OWN collapse rule rather than
     one rule over a shared ancestor: the rule has to name the host whose runs
     span it is collapsing, or a filled takeaway would hide an unmarked CTA's
     only copy. */
  /* The twin host's block-start bleed — see `cover.html` for the measurement
     and why it is here rather than only in the shared mark sheet. */
  :has(> span.mk-plain) { padding-block-start: max(var(--mk-twin-bleed, .22em), var(--mk-face-bleed, 0em)); }
  .headline:has(.mk-runs:not(:empty)) .mk-plain { display: none; }
  .cl-question:has(.mk-runs:not(:empty)) .mk-plain { display: none; }
  .cl-cta:has(.mk-runs:not(:empty)) .mk-plain { display: none; }

  /* Standing brand furniture. The brand head fragment (`buildBrandHeadHtml`)
     restates both rules and lands AFTER this sheet, so a client with a kit
     keeps its own placement; these defaults exist because a brandless render
     otherwise lays the handle out in normal flow, on top of the copy. */
  .brand-handle {
    position: absolute; bottom: 44px; inset-inline-start: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.08em;
    color: color-mix(in srgb, var(--fg) 62%, transparent);
  }
  /* The badge RULE outlives the badge SLOT: the `seriesBadge` slot is deleted from
     this file's markup, but a CLIENT's own template may still carry the slot
     (it is still in `KNOWN_SLOT_NAMES` and still a `LAYOUT_FIELD_KEY` for
     exactly that reason), and a badge with no placement rule lays itself out
     in normal flow over the copy. */
  .brand-badge {
    position: absolute; top: 56px; inset-inline-start: var(--mx); z-index: 6;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  /* An @handle, a URL and a #hashtag are LTR strings, and a Hebrew or Arabic
     slide lays them out inside an RTL paragraph: the leading `@` is a bidi
     NEUTRAL, so it takes the paragraph embedding level and ends up on the
     wrong side — every Hebrew slide in the tree shipped `karoslabs@`. The
     `<bdi dir="ltr">` in the markup is the fix; `dir` on the DIV would also
     have re-resolved its own `inset-inline-start` and moved the watermark to
     the other corner. The extra :has() selector is what keeps an empty slot
     hidden now that the div always has an element child. */
  .brand-badge:empty, .brand-handle:empty, .brand-handle:has(> bdi:empty) { display: none; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}} gr-{{groundStyle}}" data-n="{{slideIndex}}">
  <div class="ground" aria-hidden="true"></div>
  <!-- The 460px `.ground-glyph` and the `seriesBadge` slot were both here
       and are both deleted — see their own notes in the sheet above. -->
  <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
  <span class="pg-index" aria-hidden="true">{{slideIndex}}</span>
  <div class="cl-head">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="cl-rail"></div>
  </div>
  <div class="cl-field cl-art">
    <div class="cl-wrap">
      <div class="cl-recap">{{html:recap}}</div>
      <div class="headline" id="takeaway"><span class="mk-runs">{{html:takeawayRuns}}</span><span class="mk-plain">{{takeaway}}</span></div>
      <div class="cl-rule"></div>
    </div>
  </div>
  <div class="cl-ask">
    <div class="cl-question"><span class="mk-runs">{{html:questionRuns}}</span><span class="mk-plain">{{question}}</span></div>
    <div class="cl-cta"><span class="mk-runs">{{html:ctaRuns}}</span><span class="mk-plain">{{cta}}</span></div>
  </div>
  <script>
    // THE BREAKPOINTS MOVE WITH THE REVIEWER'S TYPE SCALE, for the reason
    // `quote-card.html`'s script states and `headline-focus.html`'s repeats:
    // the ladder picks a size from the string's length alone, so at `l`
    // (`--ts` 1.18) every step it picks is 18% taller inside a plate that did
    // not grow — and this archetype's middle is competing with a recap strip
    // that grew by the same 18%. Measured (`.local/cl-fit.mjs`): a
    // 97-character takeaway over a three-plate recap fits at `m` with 113px
    // of clearance under the eyebrow rail and overlaps it by 20px at `l`.
    // `s` keeps the `m` thresholds: a smaller scale never overflows.
    //
    // AND THEY MOVE WITH THE RECAP TOO, which is the second competitor for
    // the same field. A recap strip takes 447-646px of the middle at `m`
    // (`.local/fx-cl-fit.mjs`), so how much room the takeaway has depends on
    // whether one is present as much as on the type scale. Measured: the
    // 90-character takeaway took the `small` step (80px) and needed 798px of
    // a 783px field with a three-plate recap under it — 15px over, on a plate
    // every instrument in the tree called clean before `probePage` grew its
    // block-start limb. One step down is 726px and fits.
    //
    // The ask's own two ladders are new here and are the same shape, on their
    // own lengths. A long ask is what pushes the field down; a long takeaway
    // is what fills it; both have to give.
    (function () {
      var big = document.body.classList.contains("ts-l");
      var recap = document.querySelector(".cl-recap");
      // The recap's factor is MULTIPLICATIVE on whatever the scale already
      // asked for, and it is 0.85 rather than the scale's own step because it
      // is a different quantity: `l` grows every glyph on the plate by 18%,
      // while a recap takes a fixed 447-646px out of the middle.
      var r = recap !== null && recap.textContent.trim() !== "" ? 0.85 : 1;
      var at = function (m, l) { return Math.round((big ? l : m) * r); };
      // THE LADDERS MEASURE THE VISIBLE TWIN, NOT BOTH OF THEM —
      // `cover.html`'s script carries the full note. All three of the slots
      // this helper is called on are twin-slot pairs, and `textContent` reads
      // a `display: none` subtree too, so on a marked render each host holds
      // its copy twice: measured naively a 46-character takeaway would score
      // 92 and drop two steps, on a plate whose middle is already competing
      // with the recap strip. Zero-width bidi controls are stripped for the
      // reason stated there. `.cl-recap` is NOT a twin pair — it is a
      // code-built `html:recap` fragment — and it keeps its own plain
      // `textContent` read above.
      var len = function (el) {
        if (el === null) return 0;
        var runs = el.querySelector(".mk-runs");
        var src = runs !== null && runs.textContent.trim() !== "" ? runs : el.querySelector(".mk-plain");
        var text = ((src === null ? el : src).textContent || "").replace(/[\u2066-\u2069\u200E\u200F]/g, "");
        return text.trim().length;
      };

      var t = document.getElementById("takeaway");
      var q = document.querySelector(".cl-question");
      var c = document.querySelector(".cl-cta");
      var ask = document.querySelector(".cl-ask");
      var TAKEAWAY_RUNGS = ["headline huge", "headline", "headline small", "headline tiny"];
      var QUESTION_RUNGS = ["cl-question", "cl-question small", "cl-question tiny", "cl-question micro"];
      var CTA_RUNGS = ["cl-cta", "cl-cta small", "cl-cta tiny", "cl-cta micro"];

      // ── AND THEN THE MEASURE HAS THE LAST WORD. ──
      //
      // A character-count ladder cannot see a FACE's advance width, and this
      // phase gave the display face its own per-client axis: the same
      // 24-character takeaway that fits at the poster rung in Inter is 1,043px
      // wide in IBM Plex Mono inside a 952px measure, and a single word wider
      // than its column cannot wrap — so the host overflows horizontally,
      // `probe.overflow` fires and clause B refuses the plate as `clipped`
      // with a steer ("shorten the headline") that cannot fix a font metric.
      //
      // So the ladder's pick is a STARTING POINT and the DOM decides: step
      // down while the content is wider than the box. It costs one layout read
      // per step on a plate that is already laid out, it is correct for every
      // face and every script rather than for the two the rungs were measured
      // against, and it can only ever make type smaller than the ladder asked
      // for — never larger, so no plate gains size from it.
      var fitToMeasure = function (el, rungs) {
        if (el === null) return;
        var from = rungs.indexOf(el.className);
        for (var i = (from < 0 ? 0 : from); i < rungs.length; i++) {
          el.className = rungs[i];
          if (el.scrollWidth <= el.clientWidth + 1) return;
        }
      };

      // ── AND THEN THE ASK IS MADE TO FIT THE BOX IT IS IN. ──
      //
      // The two ladders above pick a size from a STRING'S LENGTH, which is
      // right for the faces they were measured against and a guess for every
      // other one — `fitToMeasure` already says so about the takeaway's width.
      // The ask needs the same correction on the block axis, and for a reason
      // the takeaway does not have: how much room it gets is decided by the
      // FIELD above it, which is holding a recap strip and a display-sized
      // takeaway whose heights move with the face, the script and the copy. So
      // the length ladder can pick a step that fits the plate in the abstract
      // and does not fit THIS plate.
      //
      // What overflows here does not merely clip. `.cl-ask` ends 16px from the
      // frame and `.brand-handle` / `.pg-index` are ABSOLUTE inside that strip,
      // and `justify-content: center` spills a too-tall ask in BOTH directions
      // — so the last line lands on the watermark. Measured on this tree before
      // this pass existed, `mono-display` with a 108-character CTA: three lines,
      // "the answer." printed on top of "@karoslabs", both strings legible and
      // both ruined, on the last slide of every carousel.
      //
      // The box is `clientHeight` less its own padding, because the block-end
      // padding is the reserved foot strip: the copy has to fit ABOVE the
      // watermark, not merely inside the band that paints over it.
      var askRoom = function () {
        if (ask === null) return 0;
        var cs = getComputedStyle(ask);
        return ask.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
      };
      var askUsed = function () {
        if (ask === null) return 0;
        var total = 0;
        for (var i = 0; i < ask.children.length; i++) total += ask.children[i].getBoundingClientRect().height;
        return total;
      };
      var askFits = function () { return askUsed() <= askRoom() + 1; };
      var fitAsk = function (el, rungs) {
        if (el === null || ask === null) return;
        var from = rungs.indexOf(el.className);
        for (var i = (from < 0 ? 0 : from); i < rungs.length; i++) {
          el.className = rungs[i];
          if (askFits()) return;
        }
      };

      /**
       * ── THE WHOLE COLUMN IS FITTED ONCE, AND THE ASK HAS PRIORITY. ──
       *
       * Three ladders sharing one 1,320px column cannot each be right on their
       * own: the takeaway's size decides how much of the field is left, and the
       * field decides how much the ask gets. At the schema's own ceiling
       * (`body` is `.max(600)`) the ask does not fit at its SMALLEST rung on a
       * mono face over a four-plate recap — measured: 411px of copy into 252px
       * of room, 80px of it below the band and straight onto the handle — and
       * no amount of stepping the ask alone can recover that.
       *
       * So the takeaway gives up a step instead, which is what a designer does
       * with a long call to action: the payoff line is still the largest thing
       * on the plate, and the ask is the one element here that can land on the
       * watermark. Bounded at four takeaway rungs x four ask rungs, and the ask
       * is RESET to the length ladder's own pick on each takeaway step so it can
       * go back UP when a smaller takeaway frees the room.
       */
      var layout = function () {
        // Reset first, so the pass is IDEMPOTENT and the second one (below, once
        // the web fonts have actually arrived) can choose a larger step than the
        // first did. The length ladders' `else` branches leave the class alone,
        // so without this a re-run could only ever ratchet downwards.
        t.className = "headline";
        if (q !== null) q.className = "cl-question";
        if (c !== null) c.className = "cl-cta";

        // 90/44 and 46/30 are the measured pair this file already carried; only
        // the recap factor is new.
        if (len(t) > at(90, 44)) t.className = "headline tiny";
        else if (len(t) > at(46, 30)) t.className = "headline small";
        // The rung a payoff plate was missing — see `.headline.huge`.
        else if (len(t) <= at(30, 22)) t.className = "headline huge";
        fitToMeasure(t, TAKEAWAY_RUNGS);

        if (q !== null) {
          if (len(q) > at(190, 160)) q.className = "cl-question micro";
          else if (len(q) > at(120, 102)) q.className = "cl-question tiny";
          else if (len(q) > at(60, 51)) q.className = "cl-question small";
        }
        if (c !== null) {
          if (len(c) > at(200, 170)) c.className = "cl-cta tiny";
          else if (len(c) > at(110, 94)) c.className = "cl-cta small";
        }
        var qBase = q === null ? "" : q.className;
        var cBase = c === null ? "" : c.className;

        for (var k = Math.max(0, TAKEAWAY_RUNGS.indexOf(t.className)); k < TAKEAWAY_RUNGS.length; k++) {
          t.className = TAKEAWAY_RUNGS[k];
          if (q !== null) q.className = qBase;
          if (c !== null) c.className = cBase;
          fitAsk(q, QUESTION_RUNGS);
          fitAsk(c, CTA_RUNGS);
          if (askFits()) return;
        }
      };

      // ── AND IT IS RUN AGAIN ONCE THE REAL FACES HAVE ARRIVED. ──
      //
      // This script is inline at the end of the body, so it runs at parse time
      // — BEFORE the Google Fonts `<link>`s resolve. Every measurement above is
      // therefore taken against the FALLBACK face, and `renderCarousel` then
      // awaits `document.fonts.ready` and screenshots the plate set in the real
      // one. Measured here: the 601-character CTA fitted at `tiny` in the
      // fallback (370px into 432px of room) and rendered at 411px into 252px in
      // IBM Plex Mono, i.e. the ladder's whole job was done against a face that
      // is not on the plate. That is the mechanism behind the CTA landing on the
      // watermark, and no threshold in this file could have been chosen to
      // survive it.
      //
      // The ready flag moves behind the font wait for the same reason: the
      // renderer waits for the flag and THEN for `document.fonts.ready`, so
      // deferring it costs nothing and guarantees the pixels it screenshots are
      // the ones this pass measured. The timeout is the fail-open — a render
      // sandbox with no network must still finish, laid out in the fallback,
      // rather than hang on a font that is never coming.
      layout();
      var settled = false;
      var settle = function () {
        if (settled) return;
        settled = true;
        layout();
        window.__CAROUSEL_READY__ = true;
      };
      if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
        document.fonts.ready.then(settle, settle);
        setTimeout(settle, 4000);
      } else {
        settle();
      }
    })();
  </script>
</body>
</html>
