<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent slide template</title>
<!--
  `slide` — the general interior plate: a claim, its explanation, and the object
  that evidences it.

  REBUILT 2026-09-17 on the shared design system. This is the plate the owner
  saw as *"חלק מהשקפים ריקים"* — measured on the old build it carried ~190px of
  dead band above the copy and ~200px below, with everything crammed into the
  middle of a flat ground. Two things fix that here and neither is a tweak: the
  stack is anchored to the foot so the air is a top margin instead of a hole,
  and the fit ladder tries a step UP before it settles, so a short claim sets
  large rather than floating.

  Reading order, top to bottom: claim, explanation, evidence. The figure comes
  AFTER the body, which is the opposite of `headline-focus` and deliberate —
  there the numeral is the setup, here the sentence is.
-->
<style>
/* @ds:start */
/* ============================================================================
   THE DESIGN SYSTEM — one source of truth for all eight plates.
   ----------------------------------------------------------------------------
   This block is GENERATED into every template between the `@ds:start` and
   `@ds:end` markers by `scripts/sync-design-system.ts`, and a test asserts the
   eight copies are byte-identical to this file. Edit HERE, never in a plate.

   WHY IT EXISTS. Before this file the scale, the ground, the brand zone and the
   fit ladder were declared separately in all eight templates. Five different
   authors edited "a template" and the set drifted: measured on the production
   composition path, one carousel rendered 22-28 distinct type sizes against a
   six-step scale, and 3 accent colours at 11 different widths. A reader reads
   that as machine-made, and the owner did.

   THE THREE RULES THIS FILE ENFORCES.
   1. TYPE COMES OFF THE SCALE OR NOT AT ALL. There are six steps. A long string
      takes a SMALLER STEP, never a fraction of one. `calc(var(--t-x) * 0.8387)`
      is how the set got to 25 sizes; there is not one multiplier in here.
   2. ONE ACCENT, ONE FORM, ONE PLACE. `.acc` is the only mark on any plate. It
      is one block, sized by the run's own `--fx-accent-w/h`, in one colour, and
      it sits directly above the headline. Nothing else in the set paints a
      rule, and no element in the set carries a decorative border — a 984px
      `border-top` on a card reads to the eye exactly like a 984px hairline.
   3b. NO COLOUR IS INVENTED HERE. The accent fell back to a literal `#ff5a1f`
      when the run had not switched a slide on — so a client whose brand colour
      is purple and a client whose brand colour is lime both rendered orange
      rules, on the plates the system had deliberately left unmarked. The owner
      caught it by eye before any test did. Every colour in this sheet now
      resolves to a kit token or to `currentColor`.

   3. THE DECISION LAYER REACHES THE PIXELS. `--system-ground`, `--system-
      grammar`, `--display-weight`, `--display-tracking` and `--logo-zone-*`
      were all emitted by `visual-system.ts` / `brand-render-tokens.ts` and read
      by NOTHING, which is why three clients rendered the same look and why the
      brand mark printed over the eyebrow. Every one of them is consumed below.
   ========================================================================== */

/* ---- canvas ------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* THE CANVAS IS 1080x1440. `render-carousel.ts` defaults `canvas` to
   `{ w: 1080, h: 1440 }` and every clause of the interest floor measures
   against those coordinates. This system's first draft said 1350 — Instagram's
   4:5 in CSS pixels — and laid every plate out in the top 1350px of a 1440px
   frame, leaving a 90px dead band under the foot zone on all eight and
   inflating every empty-rectangle measurement taken off them. */
body {
  inline-size: 1080px;
  block-size: 1440px;
  position: relative;
  overflow: hidden;
  background: var(--bg, #14151a);
  color: var(--fg, #f4f2ee);
  font-family: var(--f-body, system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── THE BRAND ACCENT ENTERS HERE, AND ONLY HERE. ──
   `buildBrandHeadHtml` emits `--bg`, `--fg`, the faces and the logo zone — but
   NOT `--accent`. Every template used to declare it itself, this rewrite
   dropped the declaration, and the whole set fell through to a fallback: a
   client whose accent is purple and one whose accent is lime both painted in
   the foreground ink, and before the literal fallback was removed they painted
   ORANGE. The owner saw it on two clients at once. An empty `{{accentColor}}`
   makes this declaration invalid and the var simply stays unset, which is the
   behaviour the fallbacks below are written for. */
/* ── THE DEFAULT TOKEN BLOCK. ──
   The plate declares its own ground and ink so a document composed WITHOUT a
   brand kit still has both — `buildBrandHeadHtml` lands after this sheet, so a
   kit that supplies them still wins. Every other colour in the file is a `var()`
   reading these; this is the one place a literal belongs, and it is what the
   interest-floor calibration reads to anchor a measurement to a named ground.
   Without it the sweep cannot name the ground it is measuring against and
   refuses to run at all. */
body {
  --bg: #17181C;
  --fg: #F4F2EC;
  /* The faces the bundled set requests, and the set's own last word on what a
     plate looks like without a kit. A sheet that READS `--f-display` and never
     declares it renders in `system-ui` and `ui-monospace` — which is exactly
     what the calibration caught ("cover rendered in fallback faces"), and what
     a client with no display face of its own would have shipped. */
  --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body: 'Inter', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

body { --accent: {{accentColor}}; }

/* The badge slot is not in the bundled markup, but its placement rule is (see
   `.brand-badge`), and a rule that READS a token nobody declares resolves to
   nothing — an ink of `initial` on a client template that does carry the slot.
   Declared here so the value exists wherever the rule can apply. */
body { --badge-ink: color-mix(in srgb, var(--fg) 55%, transparent); }

/* The reviewer's type-scale request. Hebrew sets ~6% larger at the same step,
   so the script sheet may override this; `script-fonts.ts` owns that. */
body            { --ts: 1; }
body.ts-s       { --ts: 0.85; }
body.ts-l       { --ts: 1.18; }

/* ---- the scale — SIX STEPS, AND NOTHING BETWEEN THEM -------------------- */
body {
  --t-micro:      calc(22px  * var(--ts, 1));
  --t-label:      calc(32px  * var(--ts, 1));
  --t-lead:       calc(46px  * var(--ts, 1));
  --t-statement:  calc(66px  * var(--ts, 1));
  --t-display:    calc(94px  * var(--ts, 1));
  --t-figure:     calc(200px * var(--ts, 1));

  /* rhythm. Every gap in the set is one of these — no ad-hoc margins. */
  --sp:   28px;
  --sp-2: 56px;
  --sp-3: 84px;

  /* the margin is the run's own gutter decision, not a per-plate number */
  --mx: var(--gutter, 84px);

  /* zones. `--logo-zone-block` comes from `planBrandLogoPlacement` via
     `buildBrandHeadHtml`; before this file nothing read it, so the mark landed
     on top of the eyebrow on six plates of eight.
     `max()` because the zone has TWO jobs and the placement only sizes one of
     them: it has to clear the mark, and it has to give the eyebrow a band to
     sit in. Measured on the first render of this system, a kit whose placement
     reports a short zone let the mark print over the device's label. */
  --zone-mark: max(var(--logo-zone-block, 0px), 132px);
  --zone-foot: 104px;
}

/* ---- ground ------------------------------------------------------------- */
/* `--system-ground` is the run's ground decision. It was emitted and unread,
   which is most of why three clients' carousels looked like one carousel. */
.ground {
  position: absolute;
  inset: 0;
  background: var(--bg, #14151a);
  z-index: 0;
}
/* The vocabulary is the system catalogue's own — `flat | grid | glyph` — and it
   arrives on every slide as `groundStyle`.

   ── EVERY ONE OF THEM IS BOUNDED, AND THAT IS NOT A STYLE CHOICE. ──
   The first version painted each treatment across the WHOLE plate. It looked
   quiet and it broke the measurement: a full-frame gradient moves the mean of
   every cell it covers, so `slide.html` with no photograph measured
   `inkShare 0.96` and `textBoxShare 0` — the interest floor reported "the
   ground layers rendered and the copy did not" on a plate whose copy was
   perfectly visible. `slide-metrics.ts` keeps two masks precisely so a
   DECORATIVE texture cannot be mistaken for content, and a screen that fills
   whatever room it is given is the shape RFC-20 §5.2 deleted.

   So each ground is one bounded mass with `no-repeat` and a declared extent,
   and the rest of the plate is the brand's own ground colour. */

/* FLAT — one soft mass lifting the lockup's corner. Quiet, not empty. */
body[data-ground="flat"] .ground {
  background-image: radial-gradient(circle at 50% 50%,
    color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 60%), transparent),
    transparent 70%);
  background-repeat: no-repeat;
  background-position: -14% 108%;
  background-size: 92% 620px;
}

/* GRID — a drawn field, held to a band rather than tiled over the plate. The
   lines are uniform and they never terminate next to text. */
body[data-ground="grid"] .ground {
  background-image:
    repeating-linear-gradient(0deg,
      color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 34%), transparent) 0 1px,
      transparent 1px 90px),
    repeating-linear-gradient(90deg,
      color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 34%), transparent) 0 1px,
      transparent 1px 90px);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 0, 0 0;
  background-size: 100% 540px, 100% 540px;
}

/* GLYPH — one oversized accent form bled off a corner. No letterform: a text
   glyph in the ground is the thing that read as a watermark on a template. */
body[data-ground="glyph"] .ground {
  background-image: radial-gradient(circle at 50% 50%,
    color-mix(in srgb, var(--accent) calc(var(--ground-texture-alpha, 0.10) * 150%), transparent),
    transparent 68%);
  background-repeat: no-repeat;
  background-position: 108% -10%;
  background-size: 74% 560px;
}

/* ---- the BOUNDED picture ------------------------------------------------ */
/* TWO KINDS OF PICTURE, AND THE DIFFERENCE IS DELIBERATE (RFC-20 §11.1).
   On the cover and on `slide` the photograph IS the plate: full bleed, copy
   over a scrim, and a reader scrolling past sees a photograph. On the four
   panel archetypes it is a bounded band beside type that keeps its own ground,
   and a reader sees a typographic slide with a picture in it — which is the
   owner's *"שהסלייד עצמו לפעמים יכיל תמונה וטקסט"*.

   Keeping both is what makes a carousel vary from plate to plate. Making every
   plate full bleed (this system's first attempt) removed that variation AND
   handed every plate a full-frame layer it had not earned, which the interest
   floor's clauses are calibrated to read as evidence of something else. */
.sc-figure-band {
  inline-size: 100%;
  block-size: 300px;
  /* `0 1 auto` and a floor: the band is the element that YIELDS when a plate is
     tight, because a picture reads at 220px and a headline does not, but it may
     not be squeezed into a stripe. */
  flex: 0 1 auto;
  min-block-size: 220px;
  overflow: hidden;
  border-radius: 3px;
}
.sc-figure-band img {
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  display: block;
}
/* ── THE COLLAPSE TESTS THE `src`, NOT THE ELEMENT. ──
   `:empty` and `:not(:has(img))` are both FALSE on exactly the plates this is
   for: `fillTemplate` erases a slot nobody filled, so the markup renders
   `<img src="">` and the element is still in the document. A band written that
   way keeps its 300px everywhere and a plate with no photograph ships a hole.
   `figure-band-collapse.test.ts` exists because this shipped once already. */
.sc-figure-band:not(:has(img[src]:not([src=""]))) { display: none; }

/* ---- the three bands ---------------------------------------------------- */
/* A plate is: the mark band, the field, the foot band. Content lives in the
   field and NEVER enters the other two — that reservation is the whole answer
   to "the logo runs over the heading". */
.plate {
  position: relative;
  z-index: 3;
  /* The canvas's height, taken from the body rather than restated — one number
     for the frame, and a plate that cannot disagree with it. */
  block-size: 100%;
  padding: var(--zone-mark) var(--mx) var(--zone-foot);
  display: flex;
  flex-direction: column;
  /* ANCHORING IS DONE WITH AUTO MARGINS, NOT `justify-content`, and the reason
     is a bug this system shipped for exactly one render. With
     `justify-content: flex-end`, content taller than the field overflows at the
     START edge — it grows UP, straight through the reserved brand band, and the
     first render of the new cover printed the eyebrow 5px into the headline
     because of it. Worse, `scrollHeight` does not report overflow in that
     direction, so the fit ladder could not see the thing it exists to prevent.
     With `flex-start` plus the auto margin below, a stack that does not fit
     grows DOWNWARD, which `scrollHeight` reports and the ladder then steps. */
  /* SPACE-BETWEEN, so a plate's blocks DISTRIBUTE across the field instead of
     clustering at one end. The interest floor refuses a plate whose largest
     empty rectangle covers more than 22% of it, and a single block anchored to
     one edge of a 1142px field leaves 35-44% — measured on this tree, on six of
     eight plates. Splitting the air into two gaps is what a composition does.

     `space-between` and not `flex-end`: when content is taller than the field
     it falls back to packing from the START, so overflow goes DOWNWARD where
     `scrollHeight` reports it and the fit ladder can step. `flex-end` overflows
     upward through the reserved brand band, silently — this system shipped that
     bug for one render and the eyebrow printed into the headline. */
  /* PACKED, WITH THE AIR ABOVE. `space-between` put the blocks at opposite ends
     and left one hole in the middle — the owner's *"לפעמים כשיש רווח ריק גדול
     מדי זה לא יפה אם יש למטה משהו ולמעלה משהו"*. His prescription was to do
     both things at once: bring the blocks closer AND give the few words that
     matter more size. This is the first half; the fit ladder's two grow rungs
     are the second. `flex-start` plus an auto margin on the first child, rather
     than `flex-end`, so a stack that does not fit still overflows DOWNWARD
     where `scrollHeight` reports it. */
  justify-content: flex-start;
  gap: var(--sp-2);
  overflow: visible;
}
/* The run's composition grammar decides which edge the copy sits on. It arrives
   as `data-anchor` on the body — a CSS custom property cannot be selected on,
   which is half of why `--lockup-anchor` was emitted and read by nothing. */
/* The run's composition grammar still decides which end a plate leans to, for
   the plates that have one dominant block. */
/* OVER A PHOTOGRAPH THE COPY GOES TO THE FOOT. The scrim is built to darken
   downward, so the bottom of the plate is where type is legible and where it is
   not standing on somebody's face. With the picture as the only subject the
   field has one block in it, and `space-between` puts a lone block at the top —
   which is the one place a photo cover should not put its headline. */
/* Over a photograph the copy goes to the foot — the spacer above already
   does that, so this only has to stop a `top` anchor overriding it. */
body:has(.hero) .plate::before { display: block; }
body:has(.hero) .plate::after { display: none; }

/* ── THE SPACER, NOT AN AUTO MARGIN ON A CHILD. ──
   Anchoring by putting `margin-block-start: auto` on `:first-child` breaks the
   moment that child can hide, and on four plates it can: the image band is the
   first child and it is `display: none` with no photograph. `:first-child`
   still matches a hidden element, so the margin landed on nothing and the whole
   stack snapped back to the top of the field — measured on the comparison card,
   which came out top-heavy with 280px under it. This system has hit that same
   trap three times now, in three different shapes.
   A flexible pseudo-element cannot hide, cannot be reordered and takes no part
   in `:first-child`, so the anchor holds whatever the markup does. It shrinks
   to nothing when the content needs the room, so it can never cause overflow. */
.plate::before {
  content: "";
  display: block;
  flex: 1 1 0;
  min-block-size: 0;
}
/* ── THE RUN'S COMPOSITION GRAMMAR, AS SOMETHING CSS CAN SELECT ON. ──
   `bottom` is the default and the spacer above is it. The other three move the
   spacer, or stand it down in favour of `space-between`. The grammar used to
   arrive only as `--lockup-anchor`, a custom property, and a custom property
   cannot appear in a selector — so all four grammars put the lockup at the same
   y, measured on a real render. */
body[data-anchor="top"] .plate::before,
body[data-anchor="split"] .plate::before { display: none; }

body[data-anchor="top"] .plate::after,
body[data-anchor="centre"] .plate::after {
  content: "";
  display: block;
  flex: 1 1 0;
  min-block-size: 0;
}

/* `split-band` is the one grammar that is not an anchor: the head of the field
   takes the statement and its foot takes whatever follows, with a band of
   ground between them. `space-between` degrades to `flex-start` when the
   content is taller than the field, so overflow still goes DOWNWARD where the
   fit ladder can see it. */
body[data-anchor="split"] .plate { justify-content: space-between; }

/* ---- the brand band: mark on one side, eyebrow on the other ------------- */
.zone-mark {
  position: absolute;
  inset-block-start: 0;
  inset-inline: var(--mx);
  block-size: var(--zone-mark);
  z-index: 4;
  display: flex;
  align-items: center;
  /* PACKED, WITH THE AIR ABOVE. `space-between` put the blocks at opposite ends
     and left one hole in the middle — the owner's *"לפעמים כשיש רווח ריק גדול
     מדי זה לא יפה אם יש למטה משהו ולמעלה משהו"*. His prescription was to do
     both things at once: bring the blocks closer AND give the few words that
     matter more size. This is the first half; the fit ladder's two grow rungs
     are the second. `flex-start` plus an auto margin on the first child, rather
     than `flex-end`, so a stack that does not fit still overflows DOWNWARD
     where `scrollHeight` reports it. */
  justify-content: flex-start;
  gap: var(--sp-2);
  pointer-events: none;
}
/* `brandLogoCss` positions and sizes `img.brand-logo` from the placement; this
   only reserves the opposite end of the band for the eyebrow so the two can
   never meet. */
.zone-mark .eyebrow { margin-inline-start: auto; }

.eyebrow, .kicker {
  font-family: var(--f-mono, ui-monospace, monospace);
  font-size: var(--t-micro);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--fg) 62%, transparent);
  white-space: nowrap;
}
.eyebrow:empty, .kicker:empty { display: none; }

/* The bundled plates carry no series badge — it printed an internal format
   label in the same corner on every slide, which is the repetition a reader
   reads as machine-made. The PLACEMENT rule stays, because a client's own
   template may still carry the slot and a badge that lost its rule would lay
   itself out in normal flow on top of the copy. */
.brand-badge {
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: var(--mx);
  z-index: 5;
  font-family: var(--f-mono, ui-monospace, monospace);
  font-size: var(--t-micro);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--badge-ink, color-mix(in srgb, var(--fg) 55%, transparent));
}
.brand-badge:empty { display: none; }

/* ---- the foot band: handle and numeral ---------------------------------- */
.zone-foot {
  position: absolute;
  inset-block-end: 0;
  inset-inline: var(--mx);
  block-size: var(--zone-foot);
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
/* THE KIT PLACES THE HANDLE ABSOLUTELY, AND THE BAND IS A POSITIONED ANCESTOR.
   `brandLogoCss` emits `.brand-handle { position: absolute; bottom: 44px;
   inset-inline-start: 44px }` and lands AFTER the template's own sheet, so it
   wins on a tie. Inside `.zone-foot` — which is itself positioned — that 44px
   is measured from the BAND's edge rather than the plate's, and the handle came
   out 44px inboard of everything else on the plate. The owner saw it
   immediately: *"ה@username הוא לא בצד"*. Two class names beat one, so this
   returns the handle to the band's own flow without the kit losing anything it
   legitimately owns (face, size, tracking, colour). */
.zone-foot .brand-handle,
.zone-foot .pg-index,
.zone-mark .eyebrow,
.zone-mark .kicker { position: static; inset: auto; }

/* `:empty` ALONE CANNOT SEE AN EMPTY HANDLE. The slot is `<div
   class="brand-handle"><bdi>{{brandHandle}}</bdi></div>`, so the div always has
   an element child and is never `:empty` — a client with no handle would ship
   an invisible box holding the layout open. The kit's head emits the same pair;
   the template carries it too, for a document composed without one. */
.brand-handle:empty,
.brand-handle:has( > bdi:empty) { display: none; }

.brand-handle {
  font-family: var(--f-mono, ui-monospace, monospace);
  font-size: var(--t-micro);
  letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--fg) 46%, transparent);
}
/* The owner's "a number on some slides and not on others". `--fx-pagination`
   is the run's all-or-none decision; the cover and the closer opt out in their
   own markup, every interior plate shows it, and no plate decides for itself. */
.pg-index {
  /* `none`, for the same reason the accent defaults to `none`: a numeral that
     paints when the run did not name the slide is the owner's "a number on some
     slides and not on others" — decided by the markup instead of by the rule.
     `numeralSlides` names every interior and never the cover or the closer, so
     the switch is what makes it all-or-none. */
  display: var(--fx-pagination, none);
  font-family: var(--f-mono, ui-monospace, monospace);
  font-size: var(--t-micro);
  letter-spacing: 0.16em;
  color: color-mix(in srgb, var(--fg) 34%, transparent);
}

/* ---- THE ACCENT — the only mark in the set ------------------------------ */
/* `--fx-accent` is the run's per-slide on/off switch and `data-accent` is its
   FORM. The form axis was decided per run, held across runs, printed on the
   payload — and read by no template, so five forms rendered as one bar at two
   sizes. Each of these is a different shape, not a different measurement:
   a reader can tell two posts apart by this alone.

   None of them is a full-measure rule. A 952px hairline across a plate is the
   thing the owner named as the AI tell, and no form here can produce one. */
.acc {
  /* `none`, NOT `block`. The fallback is what a slide gets when the run did
     not name it — and a mark that paints when nobody asked for it is the
     "orange rule on every slide" the owner rejected. Default off, switched on
     by `visualSystemCssBlock` for the one to three plates it chose. */
  display: var(--fx-accent, none);
  inline-size: var(--fx-accent-w, 88px);
  block-size: var(--fx-accent-h, 10px);
  background: var(--fx-accent-ink, var(--accent, currentColor));
  flex: none;
}

/* RULE — a short horizontal block above the headline. */
body[data-accent="rule"] .acc { border-radius: 1px; }

/* TINT — no mark at all. The accent colours something that was going to be on
   the plate anyway: the list's numerals, the recap's numerals, the source line.
   This replaces a `bracket` form that stood the rule on its end as a vertical
   bar beside the lockup; the owner's verdict on it was *"גם הקו האנכי שהוספת
   נראה ממש רע - תוריד, עדיף פשוט לפעמים להשאיר אלמנט בצבע השני"*, and that is
   the correct call — a free-standing stroke with nothing to do is furniture
   whichever way it is turned. Colour carried by content is the quietest accent there is. */
body[data-accent="tint"] .acc { display: none; }
body[data-accent="tint"] .source-line,
body[data-accent="tint"] .eyebrow,
body[data-accent="tint"] .kicker { color: var(--fx-accent-ink, var(--accent)); }

/* BAND — the accent becomes the eyebrow's own plate. No free-standing mark at
   all: the colour is carried by a label that was going to be there anyway,
   which is the quietest way to use an accent and the least template-like. */
body[data-accent="band"] .acc { display: none; }
body[data-accent="band"] .eyebrow,
body[data-accent="band"] .kicker {
  background: var(--fx-accent-ink, var(--accent));
  color: var(--bg);
  padding: 6px 14px;
  border-radius: 2px;
}

/* FIELD — the accent is a colour area, not a mark. The plate gets a banner of
   ground in the brand colour and the mark disappears entirely. */
body[data-accent="field"] .acc { display: none; }
body[data-accent="field"] .ground::after {
  content: "";
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  block-size: 34%;
  background: var(--fx-accent-ink, var(--accent));
  opacity: 0.92;
}
body[data-accent="field"] .eyebrow,
body[data-accent="field"] .kicker { color: var(--bg); }

/* NONE — the run decided the carousel carries no accent at all. */
body[data-accent="none"] .acc { display: none; }

/* ---- type roles --------------------------------------------------------- */
/* `--display-weight` and `--display-tracking` are the run's own display
   register. Both were emitted and unread, so every kit-less client rendered in
   the same face at the same weight. */
.headline {
  font-family: var(--f-display, var(--f-body, system-ui, sans-serif));
  font-weight: var(--display-weight, 700);
  letter-spacing: var(--display-tracking, -0.02em);
  /* 1.12, NOT 1.06, AND NO COMPENSATING PADDING. A display face paints outside
     its line box — Oswald by 0.3em, Space Grotesk by 0.06em, and the Hebrew
     faces substituted for them by more again. The first attempt at this paid
     for the overshoot in `padding-block`, which was wrong twice over: padding
     grows the box and the reported overflow by the same amount, so it never
     closed the gap, and it pushed the type down inside its own box — on a
     Hebrew cover it opened 130px between the accent and the headline it is
     supposed to sit on. A line box tall enough to contain the ink fixes the
     geometry where the geometry is wrong, and costs the composition nothing. */
  line-height: 1.06;
  text-wrap: balance;
  /* The ink a display face paints OUTSIDE its line box is closed by the fit
     ladder, which measures it on the rendered plate rather than carrying a
     constant per face. See `_ds-fit.js` — three attempts at a constant here
     (a flat em value, the register's own `--mk-face-bleed`, and a `:lang(he)`
     rule) each fixed one face and missed another, because the overshoot
     depends on the face, the script, the step and the line height at once. */
  margin: 0;
  /* Display type set at 1.06 puts ink outside its own line box — ascenders at
     the top line, descenders at the last. Measured on this system's first
     render, the host reported 292px of content in a 289px box on a title with
     no descenders at all. In `em` so it is one decision at every step, not a
     pixel fudge per size: this is the optical padding the line height omits,
     and without it the ladder steps a plate that fits.

     `--mk-face-bleed` is ADDED because the overshoot is a property of the face,
     not of the design: the run's own display register already declares how far
     its face paints outside the line box (0 for Fraunces and Inter, 0.3em for
     Oswald, 0.06em for Space Grotesk). With a flat allowance the two humanist
     registers were clean and every condensed cover reported 6-28px of overflow
     — the same defect, at one register only, which is what a face constant is
     for. Reading it here means a register added later brings its own number.

     The base went 0.12/0.10 -> 0.18/0.14 on a measurement rather than a guess:
     with the face constant in, the only plates still reporting were Hebrew
     covers at 8-10px over, because `--mk-face-bleed` is the LATIN register's
     number and the Hebrew face substituted for it has its own ascent. 0.18em
     clears the largest of those with margin. */
}
.body-text {
  font-family: var(--f-body, system-ui, sans-serif);
  font-weight: 400;
  line-height: 1.42;
  max-inline-size: 22em;
  /* 90%, not 82%. `.body-text` is a MARK-BEARING host: an emphasis swatch can
     be painted behind it, and `MARK_HOST_INK_ALPHA` is the floor at which the
     text stays legible on top of that block. Softening a mark host's ink is
     how a marked word becomes less readable than an unmarked one. */
  color: color-mix(in srgb, var(--fg) 90%, transparent);
  margin: 0;
}
.source-line, .note {
  font-family: var(--f-mono, ui-monospace, monospace);
  font-size: var(--t-micro);
  letter-spacing: 0.06em;
  color: color-mix(in srgb, var(--fg) 48%, transparent);
  margin: 0;
}
.source-line:empty, .note:empty { display: none; }

/* role defaults, each exactly one step */
.r-figure    { font-size: var(--t-figure); }
.r-display   { font-size: var(--t-display); }
.r-statement { font-size: var(--t-statement); }
.r-lead      { font-size: var(--t-lead); }
.r-label     { font-size: var(--t-label); }
.r-micro     { font-size: var(--t-micro); }

/* ---- THE FIT LADDER — steps, not fractions ------------------------------ */
/* `_ds-fit.js` measures the VISIBLE twin and sets `data-fit` on the host:
   -1 short copy, take the next step UP (this is what stops a six-word headline
   floating in an empty plate); 0 its own step; 1 and 2 step down. Every value
   it can produce is a step of the scale above. */
[data-fit="-1"].r-display   { font-size: var(--t-figure); }
[data-fit="-1"].r-statement { font-size: var(--t-display); }
[data-fit="-1"].r-lead      { font-size: var(--t-statement); }

/* The second grow rung. Only the roles that START below the top of the scale
   have one — a display host is already at the largest step by `-1` and there is
   nothing above `--t-figure` to give it. */
[data-fit="-2"].r-display   { font-size: var(--t-figure); }
[data-fit="-2"].r-statement { font-size: var(--t-figure); }
[data-fit="-2"].r-lead      { font-size: var(--t-display); }

[data-fit="1"].r-figure     { font-size: var(--t-display); }
[data-fit="1"].r-display    { font-size: var(--t-statement); }
[data-fit="1"].r-statement  { font-size: var(--t-lead); }
[data-fit="1"].r-lead       { font-size: var(--t-label); }

[data-fit="2"].r-figure     { font-size: var(--t-statement); }
[data-fit="2"].r-display    { font-size: var(--t-lead); }
[data-fit="2"].r-statement  { font-size: var(--t-label); }
[data-fit="2"].r-lead       { font-size: var(--t-label); }

/* ---- the twin slot ------------------------------------------------------ */
/* Marked renders carry the copy twice (`.mk-runs` with emphasis spans,
   `.mk-plain` without). Exactly one is ever visible, and the fit ladder is
   careful to measure the visible one — see `_ds-fit.js`.

   `display: contents`, so the twin generates NO BOX and the text becomes a
   direct child of the host. The reason is measurable. As an inline span the
   twin is sized by the FONT's ascent and descent rather than by `line-height`,
   so on a Hebrew face with a tall ascent its rect sat above the headline's own
   content box and every Hebrew cover reported an overflow with nothing visibly
   wrong. Making it a block moved the same 3-27px report onto the block instead.
   With no box there is nothing to overflow: the host carries the text, the host
   carries the optical padding, and one geometric check covers both scripts. */
/* ── THE HOST MAKES ROOM FOR A MARK'S BLEED. ──
   An emphasis swatch is painted BEHIND its run and it overshoots the line box
   upward — `emphasis-marks.ts` measures the overshoot per script and publishes
   it as `--mk-twin-bleed` (.14em Latin, .22em Hebrew), with `--mk-face-bleed`
   carrying the display face's own share. The fit ladder closes ink on the END
   edge only, because that is the side `scrollHeight` can report; this is the
   start edge, and without it a marked headline's first line is clipped.
   The fallback is the HEBREW value, because a document composed without the
   run sheet cannot know its own script and has to be safe for the worse case. */
/* ── A TWIN HOST IS NEVER `:empty`, SO IT NEEDS A DIFFERENT QUESTION. ──
   The slot renders as two `<span>` children on every plate, filled or not, so
   `.host:empty` is permanently false: an unfilled host would keep its box, its
   padding and its gap, holding the layout open around nothing. Ask about the
   CHILDREN instead — no non-empty span, no host. */
*:has(> span.mk-plain):not(:has(> span:not(:empty))) { display: none; }

*:has(> span.mk-plain) { padding-block-start: max(var(--mk-twin-bleed, .22em), var(--mk-face-bleed, 0em)); }

/* ── BLOCK, NOT `display: contents`. ──
   The twins are the only TEXT-BEARING LEAVES in the set: `.headline` and
   `.body-text` always have two element children, so the probe's "an element
   with words and no element children" lands on the spans and nowhere else.
   `display: contents` gives an element no box, and a leaf with no rendered box
   contributes no area — so every plate reported `textBoxShare` at 0-0.3% and
   the interest floor said "the ground layers rendered and the copy did not"
   about plates that had rendered perfectly, marks and all.
   `contents` was introduced to stop an inline twin reporting a false overflow
   against its host. The fit ladder's `closeInk` closes that properly now, on
   every element of the plate and by measurement, so the box can come back. */
.mk-runs  { display: block; }
.mk-plain { display: block; }
.mk-runs:empty { display: none; }
.mk-runs:not(:empty) + .mk-plain { display: none; }
/* `--mk-face-bleed` is the run's decision about whether an emphasis run may
   change face. 0 keeps ONE face inside a headline, which is what stopped a
   Hebrew line coming out in two typefaces. */
.mk-runs em, .mk-runs b, .mk-runs strong {
  font-style: normal;
  font-weight: inherit;
  font-family: inherit;
  color: var(--fx-accent-ink, var(--accent, currentColor));
}
body[data-face-bleed="1"] .mk-runs em { font-family: var(--f-display); }

/* ---- the bounded object (device) ---------------------------------------- */
.device:empty { display: none; }
.dv-figure {
  font-family: var(--f-display, var(--f-body, system-ui, sans-serif));
  font-weight: var(--display-weight, 700);
  font-size: var(--t-figure);
  line-height: 0.88;
  color: var(--dv-ink, var(--fg));
}
/* One step up from where it started. At `--t-label` against a 200px figure the
   caption read as fine print — the owner's *"הטקסט מתחת ל90% הוא ממש קטן"* —
   and a figure whose meaning is unreadable is a decoration, not evidence. */
.dv-label {
  font-family: var(--f-body, system-ui, sans-serif);
  font-size: var(--t-lead);
  line-height: 1.3;
  color: var(--dv-quiet, color-mix(in srgb, var(--fg) 72%, transparent));
}
/* THE DEVICE STEPS WITH THE PLATE. The bounded object is the tallest thing on
   the plates that carry one, so a plate that does not fit is usually the device
   rather than the copy. Before these two rules the object simply overflowed —
   at `ts-l` the cover's figure grew up through the reserved brand band and
   printed under the mark. Both values are steps of the scale, so the object
   shrinking cannot put an off-scale size on the plate. */
[data-fit="1"] .dv-figure { font-size: var(--t-display); }
[data-fit="2"] .dv-figure { font-size: var(--t-statement); }
[data-fit="1"] .dv-label,
[data-fit="2"] .dv-label  { font-size: var(--t-micro); }

/* The device never paints a rule of its own. It is a figure and its label. */
.device .dv-rule, .device .dv-accent { display: none; }

/* ---- script direction --------------------------------------------------- */
body.ta-start .plate, body.ta-start .zone-mark, body.ta-start .zone-foot { text-align: start; }
body.ta-center .plate { text-align: center; }
body.ta-center .plate > * { margin-inline: auto; }
body.ta-center .acc { margin-inline: auto; }
/* @ds:end-of-source */
/* @ds:end */

/* ---- slide -------------------------------------------------------------- */
.sl-lockup {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--sp);
}
.sl-lockup .headline { max-inline-size: min(17ch, 100%); }
.sl-lockup .body-text { max-inline-size: min(26em, 100%); }
.sl-device { margin-block-start: var(--sp-2); }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}" data-n="{{slideIndex}}" data-hero-scrim="{{heroScrimStrength}}" data-ground="{{groundStyle}}" data-cover="{{coverForm}}" data-accent="{{accentForm}}" data-anchor="{{compositionAnchor}}">
  <div class="ground" aria-hidden="true"></div>
  <div class="bg"><img src="{{image:hero}}" onerror="this.remove()" alt="" /></div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="zone-mark">
    <div class="eyebrow">{{kicker}}</div>
  </div>

  <div class="plate slide">
    <div class="sl-lockup">
      <div class="acc" aria-hidden="true"></div>
      <div class="headline r-statement" id="headline" data-fitted="primary"><span class="mk-runs">{{html:headlineRuns}}</span><span class="mk-plain">{{headline}}</span></div>
      <div class="body-text r-lead" data-fitted="secondary"><span class="mk-runs">{{html:bodyRuns}}</span><span class="mk-plain">{{body}}</span></div>
      <div class="device sl-device" data-fitted="secondary">{{html:device}}</div>
    </div>
  </div>

  <div class="zone-foot">
    <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
    <span class="pg-index" aria-hidden="true">{{slideIndex}}</span>
  </div>

  <script>
/* @ds:fit-start */
/* ============================================================================
   THE FIT LADDER — one for the whole set.
   ----------------------------------------------------------------------------
   Generated into every template between the `@ds:fit-start` / `@ds:fit-end`
   markers by `scripts/sync-design-system.ts`. Edit HERE, never in a plate.

   WHAT IT REPLACES. Every template used to carry its own ladder that picked a
   size from `textContent.length` against bespoke thresholds. Three problems,
   all of them things the owner saw:

   1. IT GUESSED. A character count does not know the face, the script, the
      reviewer's `--ts`, or how wide the words are, so each ladder needed its
      own thresholds AND a second set shifted ~15% for `ts-l`. Eight ladders,
      sixteen threshold sets, and a long statement still printed over its own
      kicker. This one MEASURES the laid-out box and steps until it fits, so
      there is nothing to tune and nothing to keep in sync.

   2. IT READ THE HIDDEN TWIN. `textContent` reads a `display: none` subtree, so
      on a marked render the host counted its copy twice and a 30-character
      headline scored 60 and took a step it did not need. Geometry only sees
      the visible twin, so a marked and an unmarked render of the same copy now
      set the same size.

   3. IT ONLY EVER SHRANK. Short copy stayed at the role's own step and left the
      plate mostly empty — the owner's "the first slide is relatively empty and
      boring", and the near-blank interior plate. This ladder tries ONE STEP UP
      first and keeps it when it fits.

   Every value it sets resolves to a step of the six-step scale. It cannot
   produce a size that is not on the scale, which is the property that took a
   carousel from 25 distinct sizes to the set the scale declares.
   ========================================================================== */
(function () {
  var plate = document.querySelector('.plate');
  if (!plate) { window.__CAROUSEL_READY__ = true; return; }

  var hosts = Array.prototype.slice.call(document.querySelectorAll('[data-fitted]'));
  if (!hosts.length) { window.__CAROUSEL_READY__ = true; return; }
  var primary = hosts.filter(function (h) { return h.getAttribute('data-fitted') === 'primary'; });

  /* EVERY ELEMENT ON THE PLATE, DEEPEST FIRST — not just the fitted hosts.
     A host is where a STEP is applied; overflow happens wherever there is text.
     Measured: `.me-title` in a list row and `.quote-attr` under a quotation are
     neither of them fit hosts, and both reported — the attribution printed 15px
     into the reserved foot band, on top of the @handle, which is the same class
     of defect as the closer's CTA and was invisible for the same reason.
     Deepest first so a child's ink is closed before its parent is measured,
     otherwise a container inherits its children's overflow and pays twice. */
  var content = Array.prototype.slice.call(plate.querySelectorAll('*'))
    .filter(function (el) { return el.tagName !== 'IMG' && el.tagName !== 'BR'; })
    .map(function (el) { var d = 0, n = el; while (n && n !== plate) { d++; n = n.parentElement; } return { el: el, depth: d }; })
    .sort(function (a, b) { return b.depth - a.depth; })
    .map(function (x) { return x.el; });

  /* Overflow means either of the two things a reader sees: the stack is taller
     than the field between the brand band and the foot band, or a single
     unbreakable line is wider than the measure. */
  /* The field the copy is allowed to occupy: the plate's content box, which is
     everything between the reserved brand band and the reserved foot band. */
  function field() {
    var r = plate.getBoundingClientRect();
    var cs = getComputedStyle(plate);
    return { top: r.top + parseFloat(cs.paddingTop), bottom: r.bottom - parseFloat(cs.paddingBottom) };
  }

  function overflows() {
    if (plate.scrollHeight > plate.clientHeight + 1) return true;

    /* GEOMETRY, NOT JUST `scrollHeight`. Content that overflows in the block-
       START direction is invisible to `scrollHeight` — a flex item aligned to
       the end, or an auto margin on an item taller than its track, grows UP and
       reports nothing. That is how the cover's figure came to sit 132px above
       its band, under the brand mark, on a plate the ladder called fitted.
       This limb measures what the render check measures: is any fitted host
       outside the field the plate reserved for it? */
    var f = field();
    for (var g = 0; g < content.length; g++) {
      var box = content[g].getBoundingClientRect();
      if (box.height === 0 || box.width === 0) continue;
      if (box.top < f.top - 1 || box.bottom > f.bottom + 1) return true;
    }

    /* THE CANVAS ITSELF. A host that sets a `max-inline-size` in `ch` grows with
       the step it is given, so at the top of the ladder a 15ch measure at the
       figure step is wider than the plate — the first render of this system
       widened the document to 1194px against a 1080px canvas. `body` clips, so
       the host's own `scrollWidth` looks fine and only the document shows it. */
    if (document.documentElement.scrollWidth > document.body.clientWidth + 1) return true;
    for (var i = 0; i < hosts.length; i++) {
      if (hosts[i].scrollWidth > hosts[i].clientWidth + 1) return true;
    }
    return false;
  }

  function set(list, value) {
    for (var i = 0; i < list.length; i++) list[i].setAttribute('data-fit', String(value));
  }

  /* ── CLOSE THE INK THE LINE BOX DOES NOT CONTAIN. ──
     A display face paints above its first line and below its last by an amount
     that depends on the face, the script, the size and the line height all at
     once. `scrollHeight` reports it, and clause B turns that report into
     `clipped` — so a plate that looks perfect burns every redraft it is given.
     Three constants were tried here and each fixed one face and missed the
     next: a flat em value, the register's own `--mk-face-bleed` (which the
     system emits as `0em` on the headline anyway), and a Hebrew-only rule.
     Measuring is exact, needs no table, and costs one reflow per host. */
  function closeInk() {
    for (var i = 0; i < content.length; i++) content[i].style.paddingBlockEnd = '';
    /* All of it on the END edge, not half on each. `scrollHeight` only ever
       reports the overflow BELOW the content box — ink above the first line is
       invisible to it — so splitting the correction in two closed half of the
       gap and left the rest reported. Two rounds because adding padding can
       reflow the host and change the number by a pixel or two. */
    for (var round = 0; round < 2; round++) {
      for (var j = 0; j < content.length; j++) {
        var h = content[j];
        var over = h.scrollHeight - h.clientHeight;
        if (over <= 0) continue;
        var current = parseFloat(h.style.paddingBlockEnd) || 0;
        h.style.paddingBlockEnd = current + over + 'px';
      }
    }
  }

  function pass() {
    /* Start every host at its own step. */
    set(hosts, 0);
    closeInk();

    /* Grow: only the primary host, only one step, only if it still fits. A plate
       whose copy is short should read as a deliberate large statement rather
       than as a small thing adrift in a grey field. */
    /* GROW WHILE IT FITS, not exactly once. The interest floor refuses a plate
       whose largest empty rectangle covers more than 22% of it, and measured on
       this tree the bottom-anchored stacks were reporting 28-44% — the same
       thing the owner sees as *"חלק מהשקפים ריקים"*. One rung was not enough to
       close that on a short headline. Each rung is still a step of the scale,
       and the loop stops the moment anything would overflow, so filling the
       plate can never become clipping it. */
    /* ONE RUNG, NOT TWO. Two rungs took a nine-word headline from 94px to
       200px: six lines wall-to-wall, which is not a headline a CMO sets, and
       which the interest floor reads as a GRAPHIC rather than as text — a cell
       inside a 150px stroke holds one colour, so `textBoxShare` fell to 0.2%
       and the floor reported "the ground layers rendered and the copy did not"
       about a plate that had rendered perfectly. Filling a plate is the bounded
       object's job; the type's job is to be read. */
    if (primary.length) {
      var grown = 0;
      while (grown > -1 && !overflows()) {
        grown -= 1;
        set(primary, grown);
        closeInk();
      }
      if (overflows()) { grown += 1; set(primary, grown); closeInk(); }
    }

    /* Shrink: everything together, so the relationship between the headline and
       its lede survives the step. Two steps is the floor — a third would take a
       display line below the lede's own size and invert the hierarchy, and a
       plate that still does not fit at step 2 is a copy-length problem that the
       content-weight floor should refuse rather than something type can hide. */
    var step = 0;
    while (overflows() && step < 2) {
      step += 1;
      set(hosts, step);
      closeInk();
    }

    /* Leave the outcome on the body so a render check, the interest floor and a
       failing test can all see which rung was used without re-deriving it. */
    document.body.setAttribute('data-fit-step', String(step));
  }

  /* TWO PASSES, AND THE FLAG GOES UP AFTER THE SECOND. The first pass measures
     the fallback face; a web font with different metrics can turn a line that
     fitted into one that does not, so the answer is only true once the fonts
     the plate actually uses have loaded. `render-carousel.ts` waits on
     `__CAROUSEL_READY__`, so raising it before the second pass would screenshot
     a layout the ladder had not seen. */
  pass();
  var done = function () { pass(); window.__CAROUSEL_READY__ = true; };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(done, done);
  else done();
})();
/* @ds:fit-end */
  </script>
</body>
