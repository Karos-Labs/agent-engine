<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent stat_callout slide template</title>
<!--
  `stat_callout` — one big metric, its sub-label, and the source that backs it.

  Ported from karos-agents' legacy `products/live/instagram-agent/assets/
  templates/marketing-services/by-the-numbers.html` (the `hook` slide type)
  plus the `.stat-band` / `.source-line` devices in `_cf-devices.css`. The type
  scale and the figure's character-count ladder are the legacy values.

  Two legacy decisions carried over deliberately, both of which look like
  mistakes until you know why:

  1. The source line is NOT the mono face and is NOT uppercase/letter-spaced.
     That was a v2 correction in the legacy system ("use the mono face
     sparingly") — a tracked-out mono credit under a 300px number reads as a
     second design element competing with the figure.
  2. The figure carries its own unit or symbol ("73%", "4.2x", "$1.8B") as one
     string rather than a number plus a separate unit field, so the two can
     never be typeset apart from each other.

  Type size is picked from the figure's own character count, in-page, exactly
  as legacy `_cf-core.js` did it — a character-count breakpoint, never a
  measure-and-fit loop.

  ── 2026-09-11, the visual rework ──

  This was the emptiest plate in the bundled set, and by a long way: a figure
  and a caption optically centred on bare ground measured 7% of the frame
  occupied with a single contiguous empty rectangle covering 26-30% of it.
  Every clause of the interest floor failed it at a positional role, and a
  reader would have called it unfinished before any of them did.

  The fix is a composition rather than a decoration. The figure now sits in a
  STAT SLAB — a full-measure accent-tinted card, capped with an accent rule,
  elastic so it fills whatever height the kicker and the footnote leave it —
  and the plate reads top to bottom: label, slab, evidence. The slab is also
  what carries this archetype over the imagery-or-device floor when it is
  routed to position 1, which `interest-floor-calibration.test.ts` measures
  at both the cover and closer roles.

  The decorative layers follow the same two rules as the rest of the set, both
  learned from the DOM probe rather than from the pixels: every decoration is
  a BACKGROUND LAYER rather than a positioned child (a positioned decoration
  that leaves its parent's box makes that parent report `scrollWidth >
  clientWidth`, which the renderer's probe reports as overflow, and clause B
  of the interest floor fails on `probe.overflow` alone); and display type
  carries a small `padding-block-end` in `em`, because a display face's glyph
  box is taller than a sub-1.15 line box and trips the same clause. The legacy
  figure at `line-height: 0.95` measured a 143px line box against 163px of
  content — an overflow on a slide that fits perfectly.

  The design tokens below are duplicated across each archetype template in
  this directory, because `publish.renderCarousel` reads one self-contained
  file per slide and has no include mechanism. That duplication is what the
  template registry's separate `css_styles` metadata field exists to fix; the
  files stay standalone (and therefore previewable in a browser on their own)
  until it does.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    /* THE WASH TONE, and it is a mix rather than the accent itself.
       A ground wash has to land in the measurement's 12-18 band — visible
       tone that is not a mark — for EVERY accent the palette walk admits,
       and the accent alone cannot do that. The only gate on --accent is
       ACCENT_GROUND_CONTRAST_FLOOR = 3 against the ground, so a dark accent
       sits ~92 units from the bundled ground and a pale one ~159: the same
       14% alpha that measures 12.9 on the first measures 22.3 on the second,
       which is INK. Rendered with a pale kit every template in this
       directory then put ink in the 8px bleed band (clippedEdgeShare 0.5-0.7%
       against a 0.4% ceiling) and counted its own wash as content.
       Mixing the accent halfway into the foreground compresses that spread:
       the mix is ~170 units from the ground on a dark accent and ~195 on a
       pale one, so 8% of it is 13.6 and 15.6 — inside the band on both, with
       the accent's hue still in it. */
    --wash: color-mix(in srgb, var(--accent) 45%, var(--fg));
    --accent-ink: #141414;
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2): a discrete type-scale multiplier
     and logical text alignment, applied per slide via body classes. Classes,
     never a {{fontScale}} CSS var: a stripped placeholder degrades to a
     harmless "ts-" class token, whereas an EMPTY-but-defined custom property
     substitutes as empty (not the var() fallback) and would invalidate every
     font-size on an older checkpointed slides-data re-rendered post-deploy. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  /* ── PHASE 5.5: THE ONE TYPE SCALE (`visual-system.ts`, `TYPE_SCALE_PX`). ──
     Six steps for the whole archetype set, against the 45 distinct `font-size`
     values the eight bundled templates declared between them. A plate picks a
     step by ROLE rather than by which file the writer's layout landed on.
     `visualSystemCssBlock` overrides these per run with the resolved system's
     type flavour; these are the self-contained defaults a brandless render
     uses.

     ── ON `body`, NOT ON `:root`, AND THAT IS NOT A STYLE CHOICE. ──
     A custom property's `var()` references are substituted AT THE ELEMENT THAT
     DECLARES IT. `--ts` is `1` on `:root` and is overridden on `body.ts-s` /
     `body.ts-l`, so a `--t-*` declared on `:root` resolves `var(--ts, 1)`
     against the ROOT's value — always 1 — and then inherits down already
     substituted. Declared there, the reviewer's whole type-scale control
     silently stopped reaching every size that reads a step: measured, the stat
     plate rendered its 300px figure at 300px at `ts-s`, where the literal it
     replaced rendered 255px, and the calibration's own s-vs-l control pair
     reported the two plates painting identical ink (0.4175 both). Declared
     HERE the substitution happens on `body`, where `body.ts-s` is in force. */
  body {
    /* ── PHASE 5.5: THE PAGE MARGIN IS THE VISUAL SYSTEM'S `gutter` AXIS. ──
       `--gutter` is emitted per run by `visualSystemCssBlock` (`wide` 64px,
       `tight` 48px) and was read by nothing: every template hard-coded its own
       margin, so two catalog entries that differ ONLY in gutter rendered the
       same plate and the twelve-entry catalog was a variety claim a reader
       could not see. The literal stays as the fallback, so a document composed
       without the run sheet is byte-identical. */
    --mx: var(--gutter, 64px);
    --t-micro: calc(22px * var(--ts, 1));
    --t-label: calc(32px * var(--ts, 1));
    --t-lead: calc(46px * var(--ts, 1));
    --t-statement: calc(84px * var(--ts, 1));
    --t-display: calc(124px * var(--ts, 1));
    --t-figure: calc(220px * var(--ts, 1));
  }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: var(--f-body);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 96px var(--mx) 88px;
  }

  /* ── L1: the tonal wash, full bleed, inside the 12-18 band, and CONFINED
        TO A CORNER on this archetype alone. ──
     A pixel is GROUND within 12 of the ground colour and INK beyond 18; a
     wash between the two is visible tone that is not a mark, so it may bleed
     to the frame edge without putting ink in the band `clippedEdgeShare`
     reads.

     Every other template in this set washes half the plate. This one cannot,
     and the reason is the slab. `measureSlidePng` decides what colour the
     slide's ground IS by taking the modal FLAT cell, and a full-plate wash
     splits the real ground's vote across several tones while the slab pools
     its own — so the slab won, the brand ground was measured as brown, and
     every dark pixel at the frame edge counted as clipped ink (1.4% against a
     0.4% ceiling) on a slide with nothing clipped anywhere. A corner wash
     leaves the ground one dominant tone and keeps the plate off flat. */
  .ground {
    position: absolute; inset: 0; z-index: 0;
    background-image: radial-gradient(58% 26% at 100% 0%, color-mix(in srgb, var(--wash) var(--ground-texture-alpha, 8%), transparent) 0%, transparent 72%);
  }
  /* ── THERE IS NO L2 ON THIS PLATE ANY MORE, and that is the point. ──
     A full-bleed texture inset 16px used to paint ink in every cell of the
     frame, which made `occupiedShare` and `largestEmptyRectShare` constants:
     every ground-bearing template in this directory reported the same 1.5%
     largest empty rectangle with the full copy on it and with every slot
     empty. The texture now lives only on the stat slab, which is the region
     the composition actually occupies — see `cover.html`'s header for the
     rule and `headline-focus.html`'s for the pitch. ── */

  .sc-head { position: relative; z-index: 3; flex: 0 0 auto; }
  /* `inline-block` so a client's `pill` or `brackets` badge variant
     (`BADGE_VARIANT_CSS`) wraps the words rather than painting a full-measure
     bar — the variant sheet sets background and padding but never a display. */
  .eyebrow {
    display: inline-block;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  }
  .sc-rail { display: var(--fx-accent, none); block-size: 2px; background: color-mix(in srgb, var(--fg) 48%, transparent); margin-block-start: calc(24px * var(--ts, 1)); }
  /* ── RFC-20 §5.0 (the Ground Rule) AND §11.5, WHICH PULL OPPOSITE WAYS,
        RESOLVED BY ASKING THE GUARD A DIFFERENT QUESTION. ──

     THE GROUND RULE says furniture may not paint on a plate with no content:
     with every slot empty this file reported `largestEmptyRectShare` 64.99%
     against G2's 90% bar, because a full-measure hairline across a blank
     plate splits its empty rectangle in two. A plate that cannot report
     itself blank cannot be told apart from a neglected one.

     §11.5 says the OPPOSITE thing about the same rail. Guarded on
     `.eyebrow`, a POPULATED plate whose writer supplied no kicker loses the
     rail too — and then measures a 0.2750 rectangle at `(0,0 → 1080,340)`,
     the band between the top of the plate and the first content. RFC-20
     §11.5 recorded that as open with the note *"the guard is right; the
     composition owes the top of the plate something"*, and left it unfixed
     because there was no basis to pick a composition without a render.

     **BOTH ARE RIGHT, AND THE EYEBROW WAS THE WRONG THING TO ASK ABOUT.**
     The question the Ground Rule actually asks is *does this plate carry
     content* — not *did this particular optional slot arrive*. Asked of the
     plate's own subject, one selector answers both: an empty plate has no
     subject, so nothing paints and G2 is satisfied; a populated plate has
     one whether or not it has a kicker, so the rail paints, breaks the top
     band, and §11.5's rectangle closes.

     WHICH SLOT IS "THE SUBJECT" IS PER-FILE and is named at each guard: the
     figure on a stat callout, the labels on a comparison card, the takeaway
     on a closer. Never the eyebrow, and never the ground, which is the
     distinction this whole part of RFC-20 is about.

     THE USER'S OWN INSTRUCTION, 2026-09-15: *use the position of
     `largestEmptyRect` to prevent the hole in the middle.* Position is
     exactly what separates these two cases — same rail, same 2px, and the
     difference between furniture on a blank plate and a rule that closes a
     340px band is where it sits relative to content. */
  /* THE SUBJECT OF A STAT CALLOUT IS ITS FIGURE. `#figure` rather than
     `> span:not(:empty)` because this slot is not a mark host — the emphasis
     system wraps only headline and body hosts in twin spans — so a bare
     `:not(:empty)` is the right reader here and the same one `.stat-band`
     below already uses. */
  /* ── PHASE 5.5 §4.3: THE RAIL IS UNDER THE ACCENT SWITCH, AND IT IS THE
        EYEBROW'S UNDERLINE. ──
     Two changes, and the second is the one the owner named.

     (1) `display: var(--fx-accent, none)`. Every standing mark in this set is
     hidden unless the run's resolved system switches it on; the bands and the
     bars landed under that switch and the hairlines did not, so a neutral 2px
     full-measure rule kept painting on six of eight plates of every carousel
     — *"יש קווים כאלה"* in a quieter colour.

     (2) The guard asks the EYEBROW again, not only the plate's subject. The
     subject-guard reading was written for RFC-20 §11.5, where a populated
     plate that lost its rail measured a band at the top — but that
     measurement was taken while this archetype's middle HUGGED its content.
     The middle is `flex: 1 1 auto` now, so a collapsed head is absorbed by the
     composition instead of leaving a hole, which is the remedy §11.5 itself
     asked for (*"the composition owes the top of the plate something"*) rather
     than the furniture standing in for it. The subject guard is KEPT beside
     it: an empty plate still paints nothing, which is RFC-20 guard G2.
     A rule over nothing is not a rule; it is ink a quiet plate acquired. */
  body:not(:has(.eyebrow:not(:empty))) .sc-rail { display: none; }
  body:not(:has(#figure:not(:empty))) .sc-rail { display: none; }

  /* ── The stat slab. A FILLED, low-colour-count region is what the
        measurement calls a drawn device, and this one is about 40% of the
        frame — which is what makes a stat callout a legitimate cover when a
        run routes one to position 1, instead of a figure floating on ground.
        Elastic, so it composes at any label length rather than leaving a hole
        above or below it. ── */
  .num-zone {
    /* `1 1 auto`, so the slab STRETCHES into the space between the kicker
       rail and the footnote, with the figure and its label centred inside it.
       It hugged its content until the full-plate texture came off this
       directory, and hugging only looked right while a full-bleed decoration
       was hiding what it left behind: measured on real Chromium once the
       texture was bound to the composition, a hugged slab parked a 330px band
       of bare ground above itself and a 310px band below — a 16.9% largest
       empty rectangle against the cover role's 22% ceiling, i.e. inside the
       calibration's own 8-point margin. Stretched, the same plate reports
       under 3%.
       The counter-risk is the one `quote-card.html` names: a panel at or over
       half the frame makes the interest floor treat the slide as carrying a
       FULL-BLEED element and switches clause B's `clippedEdgeShare` limb off.
       Measured, this slab lands at ~34% of drawn device stretched (from
       28.8% hugged), because the type cells inside it are not graphic cells
       and the texture over the tint lifts several cells past the three
       distinct colours a graphic may have. */
    position: relative; z-index: 3; flex: 1 1 auto; min-block-size: 0;
    /* ...but CAPPED, and the cap is the number the full-bleed exemption sets.
       Uncapped, the slab took the whole 826px between the rail and the
       footnote and measured 51% of drawn device — over
       `FULL_BLEED_IMAGERY_SHARE`, which would have switched clause B's pixel
       limb off on every stat plate. At 660px it measures ~40%, and the 170px
       it gives back becomes two ~85px gaps under `space-between`, which is
       breathing room rather than a hole (largest empty rectangle ~8%, ceiling
       22% at the cover role). Scaled by `--ts` so a reviewer's size step
       moves the cap with the type it has to hold. */
    max-block-size: calc(660px * var(--ts, 1));
    display: flex; flex-direction: column; justify-content: center;
    margin-block: calc(40px * var(--ts, 1));
    padding: calc(52px * var(--ts, 1)) calc(48px * var(--ts, 1));
    /* The slab carries the SAME texture as the ground, and that is not only
       taste. `measureSlidePng` takes the slide's ground colour from the modal
       FLAT cell — and a cell crossed by the texture is not flat. An untextured
       slab covering 40% of the plate was therefore the only large flat region
       in the frame, so it won the vote and became "the background": every dark
       pixel at the frame edge was then measured as ink against a brown ground,
       and this slide reported 1.6% of clipped edge against a 0.4% ceiling with
       nothing clipped anywhere. Texturing the slab puts the ground back in
       charge of its own identity, and the panel reads as the same surface as
       the rest of the plate rather than as a sticker on it.

       The tint underneath it is a GRADIENT rather than a flat fill, for the
       same reason and belt-and-braces: a graded panel has no single flat bin
       to win that vote with, whatever its size. It also simply looks better
       at this scale — a 950x700 swatch of one value reads as a placeholder. */
  }
  /* THE SLAB PAINTS ONLY WHEN THERE IS A FIGURE ON IT. `imageryOrDeviceShare`
     counts a covered, low-colour-count cell as a drawn device, so an
     unconditional tinted block scores its whole area whether or not anything
     is standing on it — which is how a plate with every slot empty used to
     clear the role floors it exists to fail. */
  /* ── THE SLAB IS GRAPH PAPER, AND THAT IS THIS ARCHETYPE'S MARK. ──
     The whole bundled set used to carry one 45-degree hairline field, so six
     of the eight plates read as the same wallpaper with different words on it
     — the owner's second complaint verbatim. Every archetype now spends a
     different MARK (`headline-focus.html`'s header lists the set and states
     why a mark is needed at all rather than a flat tint). A stat slab's is a
     GRID: a plotting grid, which is the one ground in the directory that says
     something about the content standing on it — this archetype exists to
     carry a measurement, and a measurement belongs on squared paper.

     A single-direction ruling was tried first and rejected on the pixels
     rather than on taste: rendered beside `cover.html`, a horizontally ruled
     orange slab and a horizontally screened orange plate are the same object
     at feed size, and `resolveLayout` will happily put a `stat_callout` at
     position 2, directly under the cover. Two adjacent slides wearing one
     treatment is exactly what this pass exists to stop.

     THE TWO RATES ARE DELIBERATELY UNEQUAL — 2px every 13px across, 1.5px
     every 17px down — and that is the whole reason this can be a grid at all
     rather than a device. A covered cell is 48 of its 64 samples, and on the
     measurement's 4px cell a 2px rule is 4 of the 8 sample rows: two 2px
     rules crossing inside one cell union to 32 + 32 - 16 = exactly 48, which
     is the covered test's own `>=`. Every intersection would have counted as
     a drawn device, and a grid has a lot of intersections. At 2px by 1.5px
     the union is 32 + 24 - 12 = 44 of 64, comfortably under, and the unequal
     PITCHES mean the intersections do not line up into a lattice a reader
     reads as dots. Away from the crossings neither rule can fill three
     quarters of a cell on its own, so the slab's device share stays the
     TINT's.

     Both rates are also what keep the slab's cells off "flat" —
     `measureSlidePng` reads the slide's ground colour off the modal FLAT
     cell, and an untextured panel over 40% of the frame is the largest flat
     region on the plate, so it wins that vote and the brand ground is
     measured as brown (see the note below). */
  /* ── 2026-09-15: THE GRAPH PAPER IS DELETED AND THE SLAB STOPS BEING BROWN. ──

     TWO DEFECTS, ONE RULE, AND BOTH WERE NAMED IN WRITING BEFORE THEY WERE
     FIXED. `docs/instagram-restraint-reference.md` closes with them:

       * *"the accent at partial opacity over `#17181C` is a brown, not the
         brand orange - and that is worth fixing, but as a colour derivation
         rather than by eye"*;
       * rule 1, *"texture only at near-ground value, never a field you can
         read as a pattern"*.

     Seen on the render the owner rejected (`pubsub-21850131523417857`, slide
     5) both are plainly there: a muddy brown panel carrying a visible sheet of
     graph paper. His words were ״רקע ממש מבולגן״ and ״קווים שמסגירים AI״ - a
     messy background, and lines that give the machine away.

     THE BROWN IS ARITHMETIC. `color-mix(accent 32%, bg)` interpolates toward
     the GROUND, and on a dark kit the ground is `#17181C`, so a saturated
     orange mixed a third of the way to near-black lands on brown. It is not a
     bad choice of percentage; **mixing an accent toward a dark ground is a
     desaturation operation**, and no percentage of it produces the brand
     colour. The derivation has to keep the accent's own hue and move only its
     ALPHA over the ground, which is what `color-mix(..., transparent)` does -
     the same form every other accent in this directory already uses.

     14% and 8%: the slab stays a panel the eye reads as brand-coloured rather
     than as a surface competing with the numeral standing on it, and the pair
     keeps the gradient the note below wants for the modal-colour vote.

     THE GRAPH PAPER GOES, with every other texture this phase deleted. Its
     own comment argued it was "a plotting grid, the one ground in the
     directory that says something about the content standing on it" - which
     is a good sentence about a mark nobody has to look through to read a 200px
     numeral. At 15% of `--fg` on a 13x17px pitch it is a pattern, and rule 1
     does not have an exception for a well-argued pattern. */
  body:has(#figure:not(:empty)) .num-zone {
    background-image:
      linear-gradient(158deg,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%,
        color-mix(in srgb, var(--accent) 8%, transparent) 100%);
    /* PHASE 5.5 — the slab's accent cap paints only on a slide the visual
       system chose. Ink rather than `display`, so the slab's own geometry
       (and every share the interest floor measures on it) is unchanged. */
    border-block-start: calc(8px * var(--ts, 1)) solid var(--fx-accent-ink, transparent);
  }

  /* Legacy `.num-figure`: 300px default, stepping down by figure length. */
  .num-figure {
    font-family: var(--f-display); font-weight: 600; font-size: calc(var(--t-figure) * 1.3636);
    line-height: 1; letter-spacing: -0.025em;
    /* See the header: a line box tighter than the glyph box makes the block
       report `scrollHeight > clientHeight`, which the DOM probe reports as an
       overflowing element and clause B of the interest floor fails on. Legacy
       set this at 0.95 and measured a 143px line box against 163px of content.
       Heebo (a Hebrew run's display face) is deeper than Fraunces again, so
       the leading goes back to 1 and the padding is set for the deeper of the
       two faces; `.stat-band`'s own margin is trimmed to keep the optical gap
       where it was. */
    padding-block-end: 0.28em;
  }
  .num-figure.mid { font-size: calc(var(--t-figure) * 1); }
  .num-figure.small { font-size: calc(var(--t-figure) * 0.6818); }
  /* ── THE LADDER STEPS DOWN AT `ts-l`, BECAUSE THE CANVAS DOES NOT STEP UP. ──

     `body.ts-l` multiplies every size on the plate by 1.18. The 1080x1440
     canvas is not multiplied by anything, so at the reviewer's largest type
     step the composition has 18% more type to fit in the same frame, and this
     archetype is the one with no slack left: measured on real Chromium, the
     sweep's LONG copy at `l` reported `clipped` naming
     `div.num-zone, div#figure.num-figure` — the slab squeezed by the footnote
     below it, and a 354px numeral inside a box drawn 567px tall.

     THREE OTHER FIXES WERE TRIED FIRST AND ARE WORTH KNOWING ABOUT, because
     each of them looks right and none of them works:

       - CAP THE SLAB (`max-block-size`). A cap does not shrink what is inside
         it; it hides it. This is what produced the second `clipped` run.
       - STOP THE SLAB SHRINKING (`flex: 1 0 auto`). The overflow moves from
         the slab to `html, body` — the plate is 1554px of content in a 1440px
         frame either way, and now nothing absorbs it.
       - SHORTEN THE FIXTURE. Tempting, and half-defensible now that
         `07h2-word-budget` caps a slide at 30 words while this fixture is 69:
         but it moved the failure to `headline-focus`, because shorter copy
         fits under `MAX_COPY_FOR_OBJECT` and the plate then gains a bounded
         object it did not have. Changing an input to make a plate pass is the
         move RFC-20 §5.6 rule 4 is about, one level up from the threshold.

     So the type comes down, which is the one change that removes height
     without removing content or hiding it. Only at `l`: `s` and `m` are
     untouched and every share calibrated on them still holds.

     THE FIGURE, NOT THE BODY, and that is a composition decision rather than
     an arithmetic one. A stat plate's body is the evidence for its number and
     a reader has to be able to read it; the numeral is already the largest
     thing in the frame by a factor of five and loses nothing by being large
     rather than enormous. 170/140/110 against the base 300/220/150 is
     ~200px rendered at `l`, which still clears the slab's device share (the
     sweep re-measures `imageryOrDeviceShare` and clause E would refuse it if
     it did not). */
  body.ts-l .num-figure { font-size: calc(var(--t-figure) * 0.7727); }
  body.ts-l .num-figure.mid { font-size: calc(var(--t-figure) * 0.6364); }
  body.ts-l .num-figure.small { font-size: calc(var(--t-figure) * 0.5); }

  /* The one full-strength accent mark inside the slab.
     PHASE 5.5 — hidden unless the visual system switched this slide's accent
     on. It COLLAPSES rather than going transparent: a standalone bar with an
     8px margin would otherwise spend 22px of the slab on nothing. */
  /* ── PHASE 5.5, ITEM C: THE ACCENT MARK IS ONE GEOMETRY, NOT SIX. ──
     The run's `accentForm` decides the mark's shape ONCE and publishes it as
     `--fx-accent-w` / `--fx-accent-h`. Before this the length was a property of
     whichever template the writer's layout landed on — 64px on a quote card,
     200px on a stat plate, 240px on a closer, full measure on a panel — so the
     three slides the accent switch allows a mark on carried three different
     shapes, which is the owner's *"sometimes a long purple marker and
     sometimes a short one"* read as geometry rather than as colour. Each file
     keeps its own literal as the var() fallback, so a document composed
     without the run sheet is byte-identical. */
  .stat-band { display: var(--fx-accent, none); inline-size: var(--fx-accent-w, calc(200px * var(--ts, 1))); block-size: var(--fx-accent-h, calc(14px * var(--ts, 1))); background: var(--accent); margin-block-start: calc(8px * var(--ts, 1)); }
  /* The Ground Rule again — see `.sc-rail` above for the whole argument.
     This bar belongs to the figure: with no figure there is no slab for it
     to mark, and an unguarded 200x14 solid in the middle of a blank plate is
     half of what took G2's empty-plate rectangle to 64.99%.
     `headline-focus.html` guards its own `.stat-band` on the same principle,
     and here the guard reads the same slot the rail's does, so the plate
     draws completely or not at all. */
  body:not(:has(#figure:not(:empty))) .stat-band { display: none; }

  .num-label {
    font-family: var(--f-display); font-weight: 500; font-size: calc(var(--t-lead) * 1.1739);
    line-height: 1.28; letter-spacing: -0.012em; margin-block-start: calc(38px * var(--ts, 1));
    max-inline-size: 820px; text-wrap: balance; padding-block-end: 0.14em;
  }

  /* ── AN IMAGE ON A PANEL ARCHETYPE (RFC-21 Part 2). ──

     Until now only `cover.html` and `slide.html` declared an `{{image:hero}}`
     slot, so `HERO_IMAGE_LAYOUTS` was two archetypes wide and a carousel that
     reached for structured panels sourced **no pictures at all** — measured on
     `thepitchbydeel` pubsub-21559620763659451, 8 slides, 0 images. The imagery
     floor fixes the COUNT by promoting `text_only` slides; this fixes the
     RANGE, so a post does not have to choose between a designed panel and a
     photograph.

     THE OWNER'S BRIEF, 2026-09-15: *add image/illustration slots and sometimes
     use striking images in other layouts too (beside a stat or a card), so we
     are not limited to cover and slide.html.*

     IT IS A BAND, NOT A BACKGROUND, and that is the whole design of it. A
     full-bleed photograph behind a panel would put the panel's type on an
     uncontrolled ground — the contrast gate cannot promise anything over a
     picture — and it would re-introduce exactly the full-frame layer RFC-20
     §11.1 spent a phase removing. A bounded band sits BESIDE the content, has
     its own edges, and every share it moves is its own.

     `:empty` collapses it, so a slide with no picture is byte-identical to
     before. `object-fit: cover` on a fixed band means a portrait or a
     landscape both fill it without distortion, and `onerror` removes the node
     rather than hiding it — a removed node leaves no broken-image glyph, which
     is the same rule `cover.html` and `slide.html` already follow. */
  /* ── THE PICTURE IS THE ELEMENT THAT YIELDS. ──

     `flex: 0 1 auto` with a definite `block-size`, so in this column flex
     container the band is the ONLY item that can shrink (every sibling is
     `0 0 auto`). When a long body at `l` asks for more than the 1440px canvas
     has, the band gives the space back instead of the copy being clipped.

     WHY IT IS THE RIGHT ELEMENT TO GIVE, and this is the whole argument:
     **text cannot shrink without being clipped, and a cover-fitted photograph
     can shrink without losing anything.** `object-fit: cover` means a shorter
     band crops a little more of the same picture at the same scale - no
     distortion, no reflow, nothing hidden. Capping a text box instead is what
     CI 35001921837 caught: *"2 element(s) overflow their own box (div.num-zone,
     div#figure.num-figure), and 0% of the frame is ink inside the 8px bleed
     band"* - nothing falling off the canvas, a fixed-size numeral hidden by a
     box drawn smaller than it.

     200px rather than 300: measured down when the same overflow appeared on
     `stat-callout.html`, whose header carries the arithmetic. `min-block-size`
     floors the shrink so the band cannot be squeezed to a sliver - at that
     point it is neither a picture nor honest about being one, and clause E
     would score a 30px stripe as this plate's drawn device. */
  .sc-figure-band {
    position: relative; z-index: 3; flex: 0 1 auto;
    block-size: calc(200px * var(--ts, 1)); min-block-size: calc(110px * var(--ts, 1)); inline-size: 100%;
    overflow: hidden; border-radius: 2px;
    margin-block-end: calc(24px * var(--ts, 1));
  }
  /* ── THE COLLAPSE IS KEYED ON A NON-EMPTY `src`, NEVER ON `:has(img)`. ──

     `fillTemplate` ERASES a slot nobody filled, so a slide with no picture
     still renders `<img src="">` and the `<img>` element is still there.
     `:not(:has(img))` is therefore FALSE on exactly the plates it was written
     to collapse, and the band kept its 200px on every pictureless slide in the
     set. That is what CI 35011946920 measured as `clipped` on
     `en ltr long l -> stat-callout @ interior`, on a plate the sweep attaches
     no image to at all — the band was eating the height the long body needed
     and no amount of shrinking the figure was ever going to give it back.

     `onerror="this.remove()"` does not cover it either, and that is the part
     worth keeping. An empty `src` may or may not fire `error`, and if it does
     it fires ASYNCHRONOUSLY: the DOM probe can read the document before the
     handler runs, so the same template measures differently run to run. A
     collapse rule has to be true at parse time. `onerror` stays for the case it
     is actually for, a path that was filled and then failed to load.

     This is the same lesson `slide.html` already carries at its `.scrim` rule:
     *"`.bg:empty` rather than `:not(:has(.hero))` because this template's
     `onerror` empties a wrapper instead of removing a top-level node"*. Same
     defect, one archetype over, and the house pattern was already written down. */
  .sc-figure-band:not(:has(img[src]:not([src=""]))) { display: none; }

  /* ── A BANDED PLATE IS A DIFFERENT COMPOSITION, NOT THE SAME ONE SQUEEZED. ──

     THE FIRST ATTEMPT AND WHY IT FAILED, because the failure is the lesson.
     CI 34996343379 reported `clipped` on `en ltr long l` as soon as this
     archetype carried a picture, so the band's height was taken out of the
     slab's cap: `max-block-size: 380px` under `body:has(.sc-figure-band img[src]:not([src=""]))`.
     CI 35001921837 then reported clipped AGAIN, and the finding named the
     reason exactly - *"2 element(s) overflow their own box (div.num-zone,
     div#figure.num-figure), and 0% of the frame is ink inside the 8px bleed
     band"*. Nothing was falling off the canvas. **The slab's content is
     FIXED-SIZE, so capping the box does not shrink what is in it - it hides
     it.** A 300px numeral cannot be squeezed into 380px of box that also holds
     52px of padding twice, an accent bar and a label. `flex: 1 1 auto` makes
     the slab elastic; it does not make a font-size elastic, and only one of
     those two things was ever true.

     SO THE FIGURE STEPS DOWN INSTEAD, through the ladder the template already
     has. `.num-figure.small` is 150px and the script below already assigns it
     for a figure over six characters; a picture on the plate is the second
     reason to reach for it. The slab keeps its elastic `flex` and its 660px
     cap, and now genuinely fits inside them.

     THE ARITHMETIC, at `l` (`--ts: 1.18`) on the 1440px canvas, which is the
     case that failed. Body padding is 96 + 88 = 184 and is NOT scaled, so
     1256px is the budget:

       .sc-head     eyebrow 22 + rail 2 + 24 margin, x1.18            ~ 90
       band         200 + 24 margin, x1.18                             264
       .num-zone    figure 150 + 0.28em pad-end, stat-band 14 + 8,
                    label, 36 padding x2, 24 margin-block x2, x1.18   ~ 455
       .sc-foot     body 31/1.55 over four lines + source 17 + 30     ~ 294
                                                                  ---------
                                                                     ~ 1103

     153px of headroom, where the capped version was over by ~270. The slab's
     own padding and margin come down with the figure because they were set for
     a 300px numeral: 52 -> 36 and 40 -> 24 keeps the same optical ratio around
     a smaller one rather than parking a ring of dead ground around it, which
     clause C would read as exactly what it is.

     AND THE SLAB STOPS SHRINKING, which is the line that makes the band's
     `flex: 0 1 auto` mean anything at all. `.num-zone` is `flex: 1 1 auto` with
     `min-block-size: 0` — it GROWS to fill the gap, by design, and it also
     SHRINKS below its own content, which is the exact mechanism that produced
     the clip. With both it and the band shrinkable, a browser distributes the
     overflow between them in proportion to their base sizes, so the slab would
     take the larger share and hide its numeral again: the band would be the
     element that yields in the comment and not in the layout.

     `1 0 auto` keeps the grow and drops the shrink. The stretch that clause C
     needs is untouched, the band is now the only item on the plate that can
     give a pixel back, and the worst case this arithmetic does not cover — a
     two-line sub-label over a five-line body — comes out of the picture rather
     than out of the type. That is what `min-block-size` on the band is the
     floor for.

     WHAT IT COSTS THE GATES, checked rather than assumed. The slab is smaller,
     so clause E's `imageryOrDeviceShare` loses some of it - and the band pays
     it back: 200 x 1080 of the 1080 x 1440 frame is 13.9% of drawn imagery on
     its own, against a 10% floor, before the slab is counted at all. And the
     slab moving further from `FULL_BLEED_IMAGERY_SHARE` is the safe direction:
     its own cap comment exists to keep it UNDER that line so clause B's pixel
     limb stays armed. */
  body:has(.sc-figure-band img[src]:not([src=""])) .num-figure,
  body:has(.sc-figure-band img[src]:not([src=""])) .num-figure.mid { font-size: calc(var(--t-figure) * 0.6818); }
  body:has(.sc-figure-band img[src]:not([src=""])) .num-zone {
    /* Grow, never shrink - see the note above. */
    flex: 1 0 auto;
    padding: calc(36px * var(--ts, 1)) calc(48px * var(--ts, 1));
    margin-block: calc(24px * var(--ts, 1));
  }
  .sc-figure-band img { inline-size: 100%; block-size: 100%; object-fit: cover; display: block; }
  /* ── PHASE 5.5: hidden unless the system switches it on. ──
     A contentless 8px accent rule under the picture band. `--fx-accent` is set
     by `visualSystemCssBlock` on at most three slides of a carousel; on the
     rest this mark does not paint at all. It is `display` rather than an ink
     swap because the bar is a positioned `::after` with no layout to preserve. */
  .sc-figure-band::after {
    display: var(--fx-accent, none);
    content: ""; position: absolute; inset-block-end: 0; inset-inline: 0;
    block-size: calc(8px * var(--ts, 1)); background: var(--accent);
  }
  .sc-foot { position: relative; z-index: 3; flex: 0 0 auto; }
  .num-body {
    font-family: var(--f-body); font-weight: 400; font-size: calc(var(--t-label) * 0.9688); line-height: 1.55;
    color: color-mix(in srgb, var(--fg) 90%, transparent); max-inline-size: 880px; text-wrap: pretty;
    border-inline-start: calc(4px * var(--ts, 1)) solid color-mix(in srgb, var(--accent) 80%, transparent);
    padding-inline-start: calc(28px * var(--ts, 1));
  }
  .source-line {
    font-family: var(--f-body); font-weight: 400; font-size: calc(var(--t-micro) * 0.7727);
    color: color-mix(in srgb, var(--fg) 58%, transparent); line-height: 1.6; margin-block-start: calc(30px * var(--ts, 1));
  }
  /* Collapses to nothing when the slot was left empty. */
  .source-line:empty { display: none; }
  .num-body:empty { display: none; }
  .eyebrow:empty { display: none; }

  /* Standing brand furniture. The brand head fragment (`buildBrandHeadHtml`)
     restates both rules and lands AFTER this sheet, so a client with a kit
     keeps its own placement; these defaults exist because a brandless render
     otherwise lays the handle out in normal flow, in the middle of the copy. */
  .brand-handle {
    position: absolute; bottom: 34px; inset-inline-start: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.08em;
    color: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  /* The badge RULE outlives the badge SLOT: the `seriesBadge` slot is deleted
     from this file's markup, but a CLIENT's own template may still carry it
     (it is still in `KNOWN_SLOT_NAMES` and still a `LAYOUT_FIELD_KEY` for
     exactly that reason), and a badge with no placement rule lays itself out
     in normal flow over the copy. */
  .brand-badge {
    position: absolute; top: 36px; inset-inline-end: var(--mx); z-index: 6;
    font-family: var(--f-mono); font-weight: 600; font-size: var(--t-micro);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  /* An @handle, a URL and a #hashtag are LTR strings, and a Hebrew or Arabic
     slide lays them out inside an RTL paragraph: the leading `@` is a bidi
     NEUTRAL, so it takes the paragraph embedding level and ends up on the
     wrong side — every Hebrew slide in the tree shipped `karoslabs@`. The
     `<bdi dir="ltr">` in the markup is the fix; `dir` on the DIV would also
     have re-resolved its own `inset-inline-start` and moved the watermark to
     the other corner. The extra :has() selector is what keeps an empty slot
     hidden now that the div always has an element child. */
  /* ── PHASE 5.5: THE PAGINATION INDEX. ──
     One index, the same size in the same corner in all eight templates,
     painted on every interior slide or on none
     (`ClientVisualSystem.pagination`, frozen per client). It replaces the
     460px `.ground-glyph` that existed in two of the eight files, which is
     what the owner saw as *"על חלק מהשקופיות כתוב מספר ועל חלק לא"*. Hidden
     unless switched on — the inversion this phase applies to every mark in
     the set. See `slide.html` for the full note. */
  .pg-index {
    display: var(--fx-pagination, none);
    position: absolute; inset-block-end: 40px; inset-inline-end: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: 0.14em;
    color: color-mix(in srgb, var(--fg) 45%, transparent);
  }
  .brand-badge:empty, .brand-handle:empty, .brand-handle:has(> bdi:empty) { display: none; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}" data-n="{{slideIndex}}">
  <div class="ground" aria-hidden="true"></div>
  <!-- The `seriesBadge` slot was here and is deleted. It printed an INTERNAL
       label ("BY THE NUMBERS", "{ FIELD NOTES }") in the same corner on every
       slide of every post — a name for the pipeline's own format that a reader
       cannot use, repeated eight times, which is the repetition a reader reads
       as machine-made. On geektime it also collided with the brand logo disc
       in that corner and clipped to `{ FIELD` on all eight plates. What
       replaces it is this slide's OWN topical line (`kicker`, in the
       composition where a label belongs), on the slides this run's visual
       system allows one. -->
  <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
  <span class="pg-index" aria-hidden="true">{{slideIndex}}</span>
  <div class="sc-head">
    <div class="eyebrow">{{kicker}}</div>
    <div class="sc-rail"></div>
  </div>
  <div class="sc-figure-band"><img src="{{image:hero}}" onerror="this.remove()" alt="" /></div>
  <div class="num-zone">
    <div class="num-figure" id="figure">{{figure}}</div>
    <div class="stat-band"></div>
    <div class="num-label">{{subLabel}}</div>
  </div>
  <div class="sc-foot">
    <div class="num-body">{{body}}</div>
    <div class="source-line">{{sourceLine}}</div>
  </div>
  <script>
    // Legacy `_cf-core.js` sized the figure off its own string length rather
    // than measuring the rendered box: >6 characters drops to `small`, >3 to
    // `mid`. Cheap, deterministic, and it never reflows mid-screenshot.
    (function () {
      var fig = document.getElementById("figure");
      var len = (fig.textContent || "").trim().length;
      if (len > 6) fig.className = "num-figure small";
      else if (len > 3) fig.className = "num-figure mid";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
