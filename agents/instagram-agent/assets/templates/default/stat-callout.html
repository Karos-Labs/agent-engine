<!doctype html>
<html lang="en" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent stat_callout slide template</title>
<!--
  `stat_callout` — one big metric, its sub-label, and the source that backs it.

  Ported from karos-agents' legacy `products/live/instagram-agent/assets/
  templates/marketing-services/by-the-numbers.html` (the `hook` slide type)
  plus the `.stat-band` / `.source-line` devices in `_cf-devices.css`. The type
  scale, the 132x12 accent band, and the top:320px zone offset are the legacy
  values verbatim.

  Two legacy decisions carried over deliberately, both of which look like
  mistakes until you know why:

  1. The source line is NOT the mono face and is NOT uppercase/letter-spaced.
     That was a v2 correction in the legacy system ("use the mono face
     sparingly") — a tracked-out mono credit under a 300px number reads as a
     second design element competing with the figure.
  2. The figure carries its own unit or symbol ("73%", "4.2x", "$1.8B") as one
     string rather than a number plus a separate unit field, so the two can
     never be typeset apart from each other.

  Type size is picked from the figure's own character count, in-page, exactly
  as legacy `_cf-core.js` did it — a character-count breakpoint, never a
  measure-and-fit loop.

  The design tokens below are duplicated across each archetype template in
  this directory, because `publish.renderCarousel` reads one self-contained
  file per slide and has no include mechanism. That duplication is what the
  template registry's separate `css_styles` metadata field exists to fix; the
  files stay standalone (and therefore previewable in a browser on their own)
  until it does.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    --accent-ink: #141414;
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --mx: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: var(--f-body);
    /* Optically centred rather than pinned at legacy's `top: 320px`.
       Legacy could top-anchor because its slides also carried a logo lockup
       top-left and a ticker rail along the bottom; without that furniture a
       fixed top offset leaves a quarter of a 1440px plate empty, and how much
       depends on how long the label and body happen to run. Centring composes
       at any content length, which is the property that actually matters when
       the copy is generated per run. */
    display: flex; align-items: center;
    padding: 0 var(--mx);
  }

  /* `inset-inline-end`, not `right` — this corner is defined relative to
     reading direction (the far corner from where the eye starts), so it has
     to flip along with `dir="{{dir}}"` rather than stay pinned to the right
     for a client whose posts are RTL. */
  .eyebrow {
    position: absolute; top: 56px; inset-inline-end: var(--mx); z-index: 4;
    font-family: var(--f-mono); font-weight: 500; font-size: 19px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
  }

  .num-zone { width: 100%; z-index: 3; }

  /* Legacy `.num-figure`: 300px default, stepping down by figure length. */
  .num-figure {
    font-family: var(--f-display); font-weight: 600; font-size: 300px;
    line-height: 0.95; letter-spacing: -0.025em;
  }
  .num-figure.mid { font-size: 220px; }
  .num-figure.small { font-size: 150px; }

  /* The one accent moment on the slide. */
  .stat-band { width: 132px; height: 12px; background: var(--accent); margin-top: 34px; }

  .num-label {
    font-family: var(--f-display); font-weight: 500; font-size: 56px;
    line-height: 1.3; letter-spacing: -0.012em; margin-top: 44px;
    max-width: 920px; text-wrap: balance;
  }
  .num-body {
    font-family: var(--f-body); font-weight: 400; font-size: 31px; line-height: 1.55;
    color: rgba(244,242,236,0.85); margin-top: 30px; max-width: 880px; text-wrap: pretty;
  }
  .source-line {
    font-family: var(--f-body); font-weight: 400; font-size: 16px;
    color: rgba(244,242,236,0.55); line-height: 1.6; margin-top: 46px;
  }
  /* Collapses to nothing when the slot was left empty. */
  .source-line:empty { display: none; }
  .num-body:empty { display: none; }
</style>
</head>
<body>
  <div class="eyebrow">{{kicker}}</div>
  <div class="num-zone">
    <div class="num-figure" id="figure">{{figure}}</div>
    <div class="stat-band"></div>
    <div class="num-label">{{subLabel}}</div>
    <div class="num-body">{{body}}</div>
    <div class="source-line">{{sourceLine}}</div>
  </div>
  <script>
    // Legacy `_cf-core.js` sized the figure off its own string length rather
    // than measuring the rendered box: >6 characters drops to `small`, >3 to
    // `mid`. Cheap, deterministic, and it never reflows mid-screenshot.
    (function () {
      var fig = document.getElementById("figure");
      var len = (fig.textContent || "").trim().length;
      if (len > 6) fig.className = "num-figure small";
      else if (len > 3) fig.className = "num-figure mid";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
