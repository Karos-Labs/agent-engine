<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent headline-focus slide template</title>
<!--
  `headline-focus` — one statement, at size, with the figure that proves it.

  REBUILT 2026-09-17 on the shared design system. This is the plate the owner's
  own probe caught three defects on at once: the kicker printed on top of the
  headline, a hairline crossed the headline's glyphs, and the first line was
  clipped at the top edge. All three came from the same place — a kicker rail
  and a headline sharing one unreserved band — and all three are answered by the
  shared structure rather than by tuning:

  * the kicker lives in `.zone-mark`, a band nothing else may enter;
  * `.dv-rule` is hidden set-wide, so no rule can cross a headline;
  * the fit ladder measures against the field's real top edge, so a statement
    that would have grown into the mark band steps down instead of clipping.
-->
<style>
/* @ds:start */
/* ============================================================================
   THE DESIGN SYSTEM — one source of truth for all eight plates.
   ----------------------------------------------------------------------------
   This block is GENERATED into every template between the `@ds:start` and
   `@ds:end` markers by `scripts/sync-design-system.ts`, and a test asserts the
   eight copies are byte-identical to this file. Edit HERE, never in a plate.

   WHY IT EXISTS. Before this file the scale, the ground, the brand zone and the
   fit ladder were declared separately in all eight templates. Five different
   authors edited "a template" and the set drifted: measured on the production
   composition path, one carousel rendered 22-28 distinct type sizes against a
   six-step scale, and 3 accent colours at 11 different widths. A reader reads
   that as machine-made, and the owner did.

   THE THREE RULES THIS FILE ENFORCES.
   1. TYPE COMES OFF THE SCALE OR NOT AT ALL. There are six steps. A long string
      takes a SMALLER STEP, never a fraction of one. `calc(var(--t-x) * 0.8387)`
      is how the set got to 25 sizes; there is not one multiplier in here.
   2. ONE ACCENT, ONE FORM, ONE PLACE. `.acc` is the only mark on any plate. It
      is one block, sized by the run's own `--fx-accent-w/h`, in one colour, and
      it sits directly above the headline. Nothing else in the set paints a
      rule, and no element in the set carries a decorative border — a 984px
      `border-top` on a card reads to the eye exactly like a 984px hairline.
   3b. NO COLOUR IS INVENTED HERE. The accent fell back to a literal `#ff5a1f`
      when the run had not switched a slide on — so a client whose brand colour
      is purple and a client whose brand colour is lime both rendered orange
      rules, on the plates the system had deliberately left unmarked. The owner
      caught it by eye before any test did. Every colour in this sheet now
      resolves to a kit token or to `currentColor`.

   3. THE DECISION LAYER REACHES THE PIXELS. `--system-ground`, `--system-
      grammar`, `--display-weight`, `--display-tracking` and `--logo-zone-*`
      were all emitted by `visual-system.ts` / `brand-render-tokens.ts` and read
      by NOTHING, which is why three clients rendered the same look and why the
      brand mark printed over the eyebrow. Every one of them is consumed below.
   ========================================================================== */

/* ---- canvas ------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* THE CANVAS IS 1080x1440. `render-carousel.ts` defaults `canvas` to
   `{ w: 1080, h: 1440 }` and every clause of the interest floor measures
   against those coordinates. This system's first draft said 1350 — Instagram's
   4:5 in CSS pixels — and laid every plate out in the top 1350px of a 1440px
   frame, leaving a 90px dead band under the foot zone on all eight and
   inflating every empty-rectangle measurement taken off them. */
body {
  inline-size: 1080px;
  block-size: 1440px;
  position: relative;
  overflow: hidden;
  background: var(--bg, #14151a);
  color: var(--fg, #f4f2ee);
  font-family: var(--f-body, system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── THE BRAND ACCENT ENTERS HERE, AND ONLY HERE. ──
   `buildBrandHeadHtml` emits `--bg`, `--fg`, the faces and the logo zone — but
   NOT `--accent`. Every template used to declare it itself, this rewrite
   dropped the declaration, and the whole set fell through to a fallback: a
   client whose accent is purple and one whose accent is lime both painted in
   the foreground ink, and before the literal fallback was removed they painted
   ORANGE. The owner saw it on two clients at once. An empty `{{accentColor}}`
   makes this declaration invalid and the var simply stays unset, which is the
   behaviour the fallbacks below are written for. */
/* ── THE DEFAULT TOKEN BLOCK. ──
   The plate declares its own ground and ink so a document composed WITHOUT a
   brand kit still has both — `buildBrandHeadHtml` lands after this sheet, so a
   kit that supplies them still wins. Every other colour in the file is a `var()`
   reading these; this is the one place a literal belongs, and it is what the
   interest-floor calibration reads to anchor a measurement to a named ground.
   Without it the sweep cannot name the ground it is measuring against and
   refuses to run at all. */
/* ── ON `:root`, NOT ON `body`, AND THE DIFFERENCE IS TOTAL. ──
   The brand kit declares its tokens on `:root` and is spliced AFTER this sheet,
   so on equal specificity the kit wins — which is the whole contract. Declaring
   these on `body` instead makes them MORE specific than the kit's, so a
   template default silently defeats every client's colours. Measured: on a
   light-ground kit the plate rendered this sheet's near-white `--fg` on the
   kit's light `--bg` and the floor reported "0% of the frame carries any ink at
   all; the render looks broken" — which it was, invisibly. */
:root {
  --bg: #17181C;
  --fg: #F4F2EC;
  /* The faces the bundled set requests, and the set's own last word on what a
     plate looks like without a kit. A sheet that READS `--f-display` and never
     declares it renders in `system-ui` and `ui-monospace` — which is exactly
     what the calibration caught ("cover rendered in fallback faces"), and what
     a client with no display face of its own would have shipped. */
  --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body: 'Inter', system-ui, -apple-system, sans-serif;
  /* No `--f-mono` default (owner feedback 2026-09-24, WS-02/06): IBM Plex Mono
     was declared and never loaded, so every label painted the system mono
     (DejaVu). A brand that declares a mono sets it; every other reads its
     own body face through `var(--f-mono, var(--f-body))`. */
}

:root { --accent: {{accentColor}}; }

/* The badge slot is not in the bundled markup, but its placement rule is (see
   `.brand-badge`), and a rule that READS a token nobody declares resolves to
   nothing — an ink of `initial` on a client template that does carry the slot.
   Declared here so the value exists wherever the rule can apply. */
/* On `body`, not `:root`: this one is the SET's own token, not a kit token,
   so nothing upstream competes for it — and `default-template-render` asserts
   the declaration is where a template author would look for it. */
body { --badge-ink: color-mix(in srgb, var(--fg) 55%, transparent); }

/* The reviewer's type-scale request. Hebrew sets ~6% larger at the same step,
   so the script sheet may override this; `script-fonts.ts` owns that. */
body            { --ts: 1; }
body.ts-s       { --ts: 0.85; }
body.ts-l       { --ts: 1.18; }

/* ---- the scale — SIX STEPS, AND NOTHING BETWEEN THEM -------------------- */
body {
  --t-micro:      calc(22px  * var(--ts, 1));
  --t-label:      calc(32px  * var(--ts, 1));
  --t-lead:       calc(46px  * var(--ts, 1));
  --t-statement:  calc(66px  * var(--ts, 1));
  --t-display:    calc(94px  * var(--ts, 1));
  --t-figure:     calc(200px * var(--ts, 1));

  /* rhythm. Every gap in the set is one of these — no ad-hoc margins. */
  --sp:   28px;
  --sp-2: 56px;
  --sp-3: 84px;

  /* the margin is the run's own gutter decision, not a per-plate number */
  --mx: var(--gutter, 84px);

  /* zones. `--logo-zone-block` comes from `planBrandLogoPlacement` via
     `buildBrandHeadHtml`; before this file nothing read it, so the mark landed
     on top of the eyebrow on six plates of eight.
     `max()` because the zone has TWO jobs and the placement only sizes one of
     them: it has to clear the mark, and it has to give the eyebrow a band to
     sit in. Measured on the first render of this system, a kit whose placement
     reports a short zone let the mark print over the device's label. */
  --zone-mark: max(var(--logo-zone-block, 0px), 132px);
  --zone-foot: 104px;
}

/* ---- ground ------------------------------------------------------------- */
/* `--system-ground` is the run's ground decision. It was emitted and unread,
   which is most of why three clients' carousels looked like one carousel. */
.ground {
  position: absolute;
  inset: 0;
  background: var(--bg, #14151a);
  z-index: 0;
}
/* The vocabulary is the system catalogue's own — `flat | grid | glyph` — and it
   arrives on every slide as `groundStyle`.

   ── EVERY ONE OF THEM IS BOUNDED, AND THAT IS NOT A STYLE CHOICE. ──
   The first version painted each treatment across the WHOLE plate. It looked
   quiet and it broke the measurement: a full-frame gradient moves the mean of
   every cell it covers, so `slide.html` with no photograph measured
   `inkShare 0.96` and `textBoxShare 0` — the interest floor reported "the
   ground layers rendered and the copy did not" on a plate whose copy was
   perfectly visible. `slide-metrics.ts` keeps two masks precisely so a
   DECORATIVE texture cannot be mistaken for content, and a screen that fills
   whatever room it is given is the shape RFC-20 §5.2 deleted.

   So each ground is one bounded mass with `no-repeat` and a declared extent,
   and the rest of the plate is the brand's own ground colour. */

/* FLAT — one soft mass lifting the lockup's corner. Quiet, not empty. */
body[data-ground="flat"] .ground {
  background-image: radial-gradient(circle at 50% 50%,
    color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 60%), transparent),
    transparent 70%);
  background-repeat: no-repeat;
  background-position: -14% 108%;
  background-size: 92% 620px;
}

/* GRID — a drawn field, held to a band rather than tiled over the plate. The
   lines are uniform and they never terminate next to text. */
body[data-ground="grid"] .ground {
  background-image:
    repeating-linear-gradient(0deg,
      color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 34%), transparent) 0 1px,
      transparent 1px 90px),
    repeating-linear-gradient(90deg,
      color-mix(in srgb, var(--fg) calc(var(--ground-texture-alpha, 0.10) * 34%), transparent) 0 1px,
      transparent 1px 90px);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 0, 0 0;
  background-size: 100% 540px, 100% 540px;
}

/* GLYPH — one oversized accent form bled off a corner. No letterform: a text
   glyph in the ground is the thing that read as a watermark on a template. */
body[data-ground="glyph"] .ground {
  background-image: radial-gradient(circle at 50% 50%,
    color-mix(in srgb, var(--accent) calc(var(--ground-texture-alpha, 0.10) * 150%), transparent),
    transparent 68%);
  background-repeat: no-repeat;
  background-position: 108% -10%;
  background-size: 74% 560px;
}

/* ---- the FULL-BLEED picture --------------------------------------------- */
/* THE PHOTOGRAPH IS TAKEN OUT OF FLOW, AND THAT IS LOAD-BEARING. `.bg` is a
   plain wrapper; if its `<img>` stays in normal flow it is 1080x1440 of layout
   and it pushes the entire plate below the canvas. Measured after an edit had
   silently deleted this rule: `.bg` was 1444px tall, `.plate` started at
   y=1444 and the headline sat at y=2395 — every such plate screenshotted as
   bare ground, and the interest floor reported "only 0% of the frame carries
   any ink at all; the render looks broken", which it was. */
.hero,
.bg img {
  position: absolute;
  inset: 0;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  display: block;
  z-index: 1;
}

/* ── A MARK IS SET CLEAR, AT ITS OWN SIZE (2026-09-24, second pass). ──
   The owner, on a Honda mark shown as a white tile on half the slide: "not
   nice and not professional. If you put a logo in, it has no background and
   sits properly; and a picture that small, blown up to half the screen,
   looks bad". So a mark is never a panel and never stretched:
     - `mark-clear` (the workflow lifted its backdrop, or it is a vector):
       no panel at all, and WHITE on a dark ground, the way a publication
       sets a logo on a dark page;
     - `mark` (its backdrop could not be lifted): it keeps it, small, with
       rounded corners, never the size of a picture.
   Both are capped at their natural size (`width/height: auto` under a max),
   so a small file is never enlarged past what it can carry. On a panel the
   mark sits in the centred block, copy above and below (`inset`). */
.sc-figure-band:is([data-kind="mark"], [data-kind="mark-clear"]) {
  background: none;
  block-size: auto;
  min-block-size: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: var(--sp);
  overflow: visible;
}
.sc-figure-band:is([data-kind="mark"], [data-kind="mark-clear"]) img {
  inline-size: auto;
  block-size: auto;
  max-inline-size: 60%;
  max-block-size: 200px;
  object-fit: contain;
  filter: none;
  mix-blend-mode: normal;
}
.sc-figure-band[data-kind="mark"] img { max-block-size: 150px; border-radius: 6px; }
body[data-tone="dark"] .sc-figure-band[data-kind="mark-clear"] img { filter: brightness(0) invert(1); }
/* On a full-bleed plate (cover, photo) the mark leaves the background alone
   and sits above the lockup, start-aligned, at the same capped size. */
img.hero:is([data-kind="mark"], [data-kind="mark-clear"]) {
  inset: auto;
  inset-block-start: calc(var(--zone-mark) + var(--sp-2));
  inset-inline-start: var(--mx);
  inline-size: auto;
  block-size: auto;
  max-inline-size: 56%;
  max-block-size: 220px;
  object-fit: contain;
  filter: none;
  mix-blend-mode: normal;
}
img.hero[data-kind="mark"] { max-block-size: 160px; border-radius: 6px; }
body[data-tone="dark"] img.hero[data-kind="mark-clear"] { filter: brightness(0) invert(1); }
body:has(img.hero:is([data-kind="mark"], [data-kind="mark-clear"])) .scrim { display: none; }


/* ── THE CLIENT'S PRODUCT AS AN OBJECT (2026-09-24). ──
   A product lifted off its shop backdrop (`heroKind: "cutout"`) is set on
   the plate, not cropped into a frame: contained whole, no panel, a soft
   shadow under it so it sits on the ground rather than floating. In a band
   it keeps the band's shape and extent; as a full-bleed hero it becomes an
   object in the upper field, above the lockup. */
.sc-figure-band[data-kind="cutout"] { background: none; overflow: visible; border-radius: 0; }
.sc-figure-band[data-kind="cutout"] img {
  object-fit: contain;
  filter: drop-shadow(0 18px 28px color-mix(in srgb, var(--shadow-ink, #000000) 38%, transparent));
  mix-blend-mode: normal;
}
/* ONE HEIGHT PER COMPOSITION, used by the picture AND by the lockup under it
   (2026-09-25). Both used to be percentages, and they are not the same
   percentage: `block-size: 38%` resolves against the plate's HEIGHT (1440px ->
   547px) while `padding-block-start: 38%` resolves against its WIDTH (1080px
   -> 410px), so the headline started 137px up inside the product. The framed
   cover did the same at 46% (662px picture, 497px padding): Hanky Panky's
   headline sat on the photograph's lower edge. A length both rules share
   cannot disagree. 540px, not 620: at 620 a long deck under the frame
   overflowed the plate in CI's fonts (interest-floor calibration, slide.html
   @ long). */
body { --cutout-h: 540px; --frame-h: 540px; }
img.hero[data-kind="cutout"] {
  inset: auto;
  inset-block-start: calc(var(--zone-mark) + var(--sp));
  inset-inline: var(--mx);
  inline-size: auto;
  block-size: var(--cutout-h);
  margin-inline: auto;
  object-fit: contain;
  filter: drop-shadow(0 22px 34px color-mix(in srgb, var(--shadow-ink, #000000) 40%, transparent));
}
body:has(img.hero[data-kind="cutout"]) .scrim { display: none; }
/* The lockup starts under the object: a product is never behind the words. */
body:has(img.hero[data-kind="cutout"]) .plate { padding-block-start: calc(var(--zone-mark) + var(--sp) + var(--cutout-h) + var(--sp-2)); }

/* —— A PHOTOGRAPH SET AS A BLOCK, NOT AS A WALL (2026-09-24). ——
   The owner, on two full-bleed covers whose headline and deck ran across a
   face and a body: *"it would have been nicer if the picture were like slide 3
   of XO Digital, where the picture is not over the whole screen — it is a bit
   more aesthetic"*. Slide 3 is the centred block they had already picked out
   of the rotation (`inset`: copy above, picture, copy below).

   So a photographic hero on a full-bleed plate can be set the same way: the
   picture bounded in the upper field, the words on the plate's own ground
   under it. `object-fit: cover` and not `contain`, which is the whole
   difference from `cutout` above — a product is shown WHOLE, a photograph is
   cropped to the block it is given.

   The scrim goes with it. A scrim exists to make copy legible over a picture,
   and here no copy is over the picture; leaving it on would darken a
   photograph for no reason. */
/* TWO SHAPES CARRY A FULL-BLEED PICTURE, and they are not the same element.
   `cover.html` paints `<img class="hero" data-kind>`; `slide.html` (the
   `photo` archetype) wraps it as `<div class="bg" data-kind><img></div>`, so
   the kind sits on the WRAPPER there. A rule written only for the first left
   the `photo` plate painting a wall with the headline across the subject's
   face — which is the defect this whole change is about, on the other half of
   the set. Measured on a real render before it was widened. */
img.hero[data-kind="framed"],
.bg[data-kind="framed"] > img {
  inset: auto;
  inset-block-start: calc(var(--zone-mark) + var(--sp));
  inset-inline-start: var(--mx);
  /* MEASURED, not `auto`: on a replaced element `inline-size: auto` resolves
     from the image's own aspect ratio, so the block came out as wide as a
     1200x1500 photograph is at 46% height — a column down the middle with the
     ground either side, which is not the composition. `cutout` above WANTS
     that behaviour (a product keeps its shape); a framed photograph is a
     block, and the block spans the measure. */
  inline-size: calc(100% - (2 * var(--mx)));
  block-size: var(--frame-h);
  object-fit: cover;
  border-radius: 10px;
}
body:has(img.hero[data-kind="framed"]) .scrim,
body:has(.bg[data-kind="framed"]) .scrim { display: none; }
/* The lockup starts under the block: the words are never on the photograph. */
body:has(img.hero[data-kind="framed"]) .plate,
body:has(.bg[data-kind="framed"]) .plate { padding-block-start: calc(var(--zone-mark) + var(--sp) + var(--frame-h) + var(--sp-2)); }

.scrim {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  /* `to top`, and these exact stops, because they are the ones that were
     MEASURED to leave a photograph its colour. A scrim is a gradient laid over
     the picture, so its shape decides how much of the plate keeps the image's
     own palette. Fully transparent above 62%, and only the band the lockup
     sits in is dark enough to read on. */
  /* ANCHORED TO THE TEXT (owner feedback round 2026-09-24, item H, WS-08):
     `_ds-fit.js` measures where the lockup starts and sets `--scrim-dense` so
     the dense band reaches one line above the first line of copy. A long
     cover title used to climb past 42% onto a half-strength shade. Never
     below today's 22%, so a short cover keeps its photograph exactly as
     before; without the script the stops are today's. */
  background: linear-gradient(to top,
    color-mix(in srgb, var(--bg) 96%, transparent) 0%,
    color-mix(in srgb, var(--bg) 86%, transparent) var(--scrim-dense, 22%),
    color-mix(in srgb, var(--bg) 52%, transparent) calc(var(--scrim-dense, 22%) + 20%),
    color-mix(in srgb, var(--bg) 0%, transparent) calc(var(--scrim-dense, 22%) + 40%));
}
/* No photograph, no scrim: it exists to make copy legible over a picture, and
   over bare ground it only flattens the ground. */
body:not([data-hero-scrim]) .scrim,
body[data-hero-scrim=""] .scrim { display: none; }
.bg:empty ~ .scrim { display: none; }

/* ---- the BOUNDED picture ------------------------------------------------ */
/* TWO KINDS OF PICTURE, AND THE DIFFERENCE IS DELIBERATE (RFC-20 §11.1).
   On the cover and on `slide` the photograph IS the plate: full bleed, copy
   over a scrim, and a reader scrolling past sees a photograph. On the four
   panel archetypes it is a bounded band beside type that keeps its own ground,
   and a reader sees a typographic slide with a picture in it — which is the
   owner's *"שהסלייד עצמו לפעמים יכיל תמונה וטקסט"*.

   Keeping both is what makes a carousel vary from plate to plate. Making every
   plate full bleed (this system's first attempt) removed that variation AND
   handed every plate a full-frame layer it had not earned, which the interest
   floor's clauses are calibrated to read as evidence of something else. */
.sc-figure-band {
  inline-size: 100%;
  block-size: 300px;
  /* `0 1 auto` and a floor: the band is the element that YIELDS when a plate is
     tight, because a picture reads at 220px and a headline does not, but it may
     not be squeezed into a stripe. */
  flex: 0 1 auto;
  min-block-size: 220px;
  overflow: hidden;
  border-radius: 3px;
}
.sc-figure-band img {
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  display: block;
}
/* ── THE COLLAPSE TESTS THE `src`, NOT THE ELEMENT. ──
   `:empty` and `:not(:has(img))` are both FALSE on exactly the plates this is
   for: `fillTemplate` erases a slot nobody filled, so the markup renders
   `<img src="">` and the element is still in the document. A band written that
   way keeps its 300px everywhere and a plate with no photograph ships a hole.
   `figure-band-collapse.test.ts` exists because this shipped once already. */
.sc-figure-band:not(:has(img[src]:not([src=""]))) { display: none; }

/* ---- WHERE THE BOUNDED PICTURE SITS ------------------------------------- */
/* ── ONE SHAPE IS A TEMPLATE. FIVE ARE A DESIGN SYSTEM. ──
   The band above is the default and is unchanged: full width of the field,
   300px, at the top. It was also the ONLY bounded placement in the set, so
   every picture on every panel plate in every carousel had the same size and
   the same position, and the owner read the result exactly right on
   2026-09-18: *"the positions and the sizes can change, it can appear at the
   side sometimes, it can be next to the text."*

   `data-figure` carries the choice. `band` is the default and is what a
   template renders when nothing sets it, so a plate that opts out of this is
   byte-identical to the one that shipped.

   EVERY VARIANT IS GRID, and that is not a style preference. `.plate` is a
   flex column whose anchoring is done with auto margins (see the note on
   `.plate` above, and the overflow bug that made it necessary). A float would
   need `display: block` and would take that anchoring with it. Grid keeps the
   band in its own track and auto-places every other child of the plate into
   the second one, which needs no change to any template's markup. */

/* ── THE SPLIT: A PICTURE DOWN ONE HALF, THE TYPE ON THE OTHER (2026-09-24). ──
   The owner asked for this composition by name: a picture on one side and
   the text on the other. The first version was a two-column grid inside
   `.plate` and the calibration sweep refused it four times, rightly: the
   picture spanned implicit rows and pushed the plate past the canvas, and
   the type bunched at the top of its column over a dead block 25-34% of
   the frame. This is the editorial split instead. The picture is taken out
   of flow and bleeds edge to edge down one half of the frame; the plate,
   the brand band and the foot band are narrowed to the other half. The
   copy then lays out exactly as it does on a full plate, anchoring, fit
   ladder and all, only in a narrower field, and the type scale steps down
   one notch so a figure or a statement fits that field. */
body[data-figure="side"],
body[data-figure="side-end"] {
  --split: 42%;
  --t-figure:     calc(132px * var(--ts, 1));
  --t-display:    calc(72px  * var(--ts, 1));
  --t-statement:  calc(54px  * var(--ts, 1));
  --t-lead:       calc(38px  * var(--ts, 1));
  --t-label:      calc(30px  * var(--ts, 1));
}
body[data-figure="side"] .sc-figure-band,
body[data-figure="side-end"] .sc-figure-band {
  position: absolute;
  inset-block: 0;
  inline-size: var(--split);
  block-size: auto;
  min-block-size: 0;
  margin: 0;
  border-radius: 0;
  z-index: 1;
}
body[data-figure="side"] .sc-figure-band { inset-inline-start: 0; }
body[data-figure="side-end"] .sc-figure-band { inset-inline-end: 0; }
body[data-figure="side"] .plate { padding-inline-start: calc(var(--split) + var(--sp-2)); }
body[data-figure="side-end"] .plate { padding-inline-end: calc(var(--split) + var(--sp-2)); }
body[data-figure="side"] :is(.zone-mark, .zone-foot) { inset-inline-start: calc(var(--split) + var(--sp-2)); }
body[data-figure="side-end"] :is(.zone-mark, .zone-foot) { inset-inline-end: calc(var(--split) + var(--sp-2)); }
/* No picture, no split: the copy takes the whole field back. (The rotation
   only chooses a side shape for a slide with a picture; this is the guard.) */
body:is([data-figure="side"], [data-figure="side-end"]):not(:has(.sc-figure-band img[src]:not([src=""]))) .plate { padding-inline: var(--mx); }
body:is([data-figure="side"], [data-figure="side-end"]):not(:has(.sc-figure-band img[src]:not([src=""]))) :is(.zone-mark, .zone-foot) { inset-inline: var(--mx); }

/* FOOT — the picture closes the plate instead of opening it.
   This replaces an `inset` variant that put a 38% block in the upper corner
   with the type beside it. It looked right and measured wrong twice: a grid
   column that ends after one row leaves the rest of that column empty, and the
   calibration sweep read `list_takeaway @ first (cover)` as a 456x988 dead
   rectangle, then as 8.5% imagery against a 10% floor. A shape that can only
   be made to fill by knowing how many children the plate has is a shape this
   system cannot carry.

   `order` and an auto margin instead, which is what `.plate` already uses to
   anchor everything else: the band sorts last and is pushed to the foot, so
   the plate fills by construction whatever the archetype puts above it. A
   picture at the bottom is a genuinely different read from one at the top,
   which is the variety this set was short of. */
body[data-figure="foot"] .sc-figure-band {
  order: 2;
  margin-block-start: auto;
  block-size: 420px;
  min-block-size: 300px;
}

/* TALL — the band keeps its position and takes half the plate. Same shape,
   different weight, which is the cheapest variation in the set and the one
   that carries a photograph worth looking at. */
body[data-figure="tall"] .sc-figure-band {
  block-size: 620px;
  min-block-size: 420px;
}

/* BLEED — the band runs past the field's own gutter to the frame edge. The
   plate keeps its margins; the picture does not. Negative inline margins
   rather than a wider element, so nothing about the flex column changes. */
/* THE STRIP THAT CROSSES THE SLIDE EDGE (2026-09-23, stage 5 of the owner's
   reference-looks plan). The Deel event recaps run a photograph off the edge
   of one slide and pick it up at the edge of the next, which is what makes a
   reader swipe. `carry-out` runs this slide's band 240px past the edge the
   next slide arrives from; `carry-in` paints the SAME image at the SAME size
   on the next slide, shifted by exactly the canvas width, so its first 240px
   are the tail the previous slide cut off, and its own band starts after it.
   Both bands are fixed at 300px here, because the tail can only line up with
   a band that does not yield.
   The next slide always arrives from the physical RIGHT, whatever the post's
   language, so the side is the inline END in a left-to-right document and the
   inline START in a right-to-left one. */
/* Both bands are PINNED, not stacked: the tail on the next slide can only
   line up with a band whose top and height are fixed, so the band leaves the
   flow at the top of the plate and the plate starts its copy below it.
   The picture is PAINTED, not placed: slide N's band stops at the canvas edge
   and draws the photograph at the full strip width (`--carry-w`), so the edge
   cuts the picture; slide N+1 draws the same photograph at the same width in a
   240px box, shifted left by exactly what slide N showed. Same width, same
   vertical centring, same crop, and every box stays inside the frame, which is
   what the render probe measures. `background-position` is physical, which is
   right here: the next slide arrives from the right in either language. */
/* On `body`, not `:root`: `--mx` is declared on `body`, and a `:root` calc
   over it resolves to nothing, which drops the whole background shorthand. */
body { --carry: 240px; --carry-w: calc(1080px - var(--mx) + var(--carry)); }
body[data-figure="carry-out"] .plate,
body[data-figure="carry-in"] .plate { padding-block-start: calc(var(--zone-mark) + 300px + var(--sp-2)); }
body[data-figure="carry-out"] .sc-figure-band,
body[data-figure="carry-in"] .sc-figure-band {
  position: absolute;
  inset-block-start: var(--zone-mark);
  block-size: 300px;
  inline-size: auto;
  margin: 0;
}
body[data-figure="carry-out"] .sc-figure-band {
  background: var(--hero-src) 0 50% / var(--carry-w) auto no-repeat;
}
body[data-figure="carry-out"] .sc-figure-band img { visibility: hidden; }
html[dir="ltr"] body[data-figure="carry-out"] .sc-figure-band { inset-inline-start: var(--mx); inset-inline-end: 0; border-start-end-radius: 0; border-end-end-radius: 0; }
html[dir="rtl"] body[data-figure="carry-out"] .sc-figure-band { inset-inline-start: 0; inset-inline-end: var(--mx); border-start-start-radius: 0; border-end-start-radius: 0; }
html[dir="ltr"] body[data-figure="carry-in"] .sc-figure-band { inset-inline-start: calc(var(--carry) + 24px); inset-inline-end: var(--mx); }
html[dir="rtl"] body[data-figure="carry-in"] .sc-figure-band { inset-inline-end: calc(var(--carry) + 24px); inset-inline-start: var(--mx); }
.sc-carry { display: none; }
body[data-figure="carry-in"] .sc-carry {
  display: block;
  position: absolute;
  z-index: 3;
  inset-block-start: var(--zone-mark);
  block-size: 300px;
  inline-size: var(--carry);
  background: var(--carry-src) calc(var(--carry) - var(--carry-w)) 50% / var(--carry-w) auto no-repeat;
}
/* The hidden image is what makes the page wait: the render screenshots once
   every IMAGE has loaded, and a CSS background is not one. Without it the
   strip's tail was captured before its picture arrived. */
.sc-carry img { visibility: hidden; inline-size: 1px; block-size: 1px; }
html[dir="ltr"] body[data-figure="carry-in"] .sc-carry { inset-inline-start: 0; }
html[dir="rtl"] body[data-figure="carry-in"] .sc-carry { inset-inline-end: 0; }

body[data-figure="bleed"] .sc-figure-band {
  margin-inline: calc(var(--mx) * -1);
  inline-size: calc(100% + var(--mx) * 2);
  block-size: 440px;
  border-radius: 0;
}

/* ── THREE SHAPES THAT MOVE THE PICTURE WITHOUT NARROWING THE TYPE ──
   (2026-09-24, stage 8 of the owner's reference-looks plan: *"no pictures in
   random places, like the centre or the sides"*.) The side shapes above stay
   unselected because they halve the column the fit ladder sizes type in.
   These three keep the type at the full field width, so the ladder's
   measurement is exactly the one it was calibrated on, and move only the
   picture: to the side, into a circle, or into the middle of the plate.

   CORNER — a square picture held to the inline END of the field, smaller than
   a band. The editorial "picture beside the headline" read, at the size of
   an object rather than a banner. */
/* RIGID, not the band's `0 1 auto`: a shape that yields only in height stops
   being a square (and a circle becomes an oval). The fit ladder steps the
   type instead, which is what it is for. */
body[data-figure="corner"] .sc-figure-band {
  align-self: flex-end;
  flex: 0 0 auto;
  inline-size: 420px;
  block-size: 420px;
  min-block-size: 0;
  border-radius: 4px;
}
/* CIRCLE — a round crop at the inline START, for a person or an object that
   reads as a portrait. A logo is never cropped round: a mark shown whole on
   its panel keeps its square corners. */
body[data-figure="circle"] .sc-figure-band {
  align-self: flex-start;
  flex: 0 0 auto;
  inline-size: 400px;
  block-size: 400px;
  min-block-size: 0;
  border-radius: 50%;
}
body[data-figure="circle"] .sc-figure-band[data-kind="mark"] { border-radius: 4px; }
/* INSET — the picture sits in the MIDDLE of the plate, between the first
   block of copy and the rest, centred and narrower than the field. `order`
   does it without touching any plate's markup: the band sorts after the
   first content block (the element right after the carry strip) and before
   everything else. On a plate with one block the picture follows it. */
body[data-figure="inset"] .plate > * { order: 2; }
body[data-figure="inset"] .plate > .sc-carry + * { order: 0; }
body[data-figure="inset"] .plate > .sc-figure-band {
  order: 1;
  align-self: center;
  inline-size: 76%;
  block-size: 420px;
  min-block-size: 280px;
  border-radius: 4px;
}

/* The collapse rule is written against the band itself, so it holds for every
   variant above. A `side` plate with no picture is a one-column plate, because
   a `display: none` grid item leaves its track empty rather than reserving it:
   `grid-template-columns` still declares two, so the type stays in the second
   and the first is 44% of nothing. That would be a hole, so the grid itself is
   dropped when the band is. */
body[data-figure]:not([data-figure="band"]) .plate:not(:has(.sc-figure-band img[src]:not([src=""]))) {
  display: flex;
  grid-template-columns: none;
}

/* ---- the three bands ---------------------------------------------------- */
/* A plate is: the mark band, the field, the foot band. Content lives in the
   field and NEVER enters the other two — that reservation is the whole answer
   to "the logo runs over the heading". */
.plate {
  position: relative;
  z-index: 3;
  /* The canvas's height, taken from the body rather than restated — one number
     for the frame, and a plate that cannot disagree with it. */
  block-size: 100%;
  padding: var(--zone-mark) var(--mx) var(--zone-foot);
  display: flex;
  flex-direction: column;
  /* ANCHORING IS DONE WITH AUTO MARGINS, NOT `justify-content`, and the reason
     is a bug this system shipped for exactly one render. With
     `justify-content: flex-end`, content taller than the field overflows at the
     START edge — it grows UP, straight through the reserved brand band, and the
     first render of the new cover printed the eyebrow 5px into the headline
     because of it. Worse, `scrollHeight` does not report overflow in that
     direction, so the fit ladder could not see the thing it exists to prevent.
     With `flex-start` plus the auto margin below, a stack that does not fit
     grows DOWNWARD, which `scrollHeight` reports and the ladder then steps. */
  /* SPACE-BETWEEN, so a plate's blocks DISTRIBUTE across the field instead of
     clustering at one end. The interest floor refuses a plate whose largest
     empty rectangle covers more than 22% of it, and a single block anchored to
     one edge of a 1142px field leaves 35-44% — measured on this tree, on six of
     eight plates. Splitting the air into two gaps is what a composition does.

     `space-between` and not `flex-end`: when content is taller than the field
     it falls back to packing from the START, so overflow goes DOWNWARD where
     `scrollHeight` reports it and the fit ladder can step. `flex-end` overflows
     upward through the reserved brand band, silently — this system shipped that
     bug for one render and the eyebrow printed into the headline. */
  /* PACKED, WITH THE AIR ABOVE. `space-between` put the blocks at opposite ends
     and left one hole in the middle — the owner's *"לפעמים כשיש רווח ריק גדול
     מדי זה לא יפה אם יש למטה משהו ולמעלה משהו"*. His prescription was to do
     both things at once: bring the blocks closer AND give the few words that
     matter more size. This is the first half; the fit ladder's two grow rungs
     are the second. `flex-start` plus an auto margin on the first child, rather
     than `flex-end`, so a stack that does not fit still overflows DOWNWARD
     where `scrollHeight` reports it. */
  justify-content: flex-start;
  gap: var(--sp-2);
  overflow: visible;
}
/* The run's composition grammar decides which edge the copy sits on. It arrives
   as `data-anchor` on the body — a CSS custom property cannot be selected on,
   which is half of why `--lockup-anchor` was emitted and read by nothing. */
/* The run's composition grammar still decides which end a plate leans to, for
   the plates that have one dominant block. */
/* ── AN INTERIOR PHOTOGRAPH AS A BLOCK (2026-09-24). ──
   The owner, on full-bleed interior photographs (Sitti's portrait, Hanky
   Panky's product shot): "nicer like XO Digital's slide 3, where the
   picture is not the whole screen". On the photo plate, `data-figure=
   "inset"` frames the photograph as a block under the brand band, inside
   the side gutters, and the copy takes the field below it on the plain
   ground: no scrim, no type over the picture. */
body[data-figure="inset"]:has(.plate.slide) .bg {
  position: absolute;
  inset: auto;
  inset-block-start: calc(var(--zone-mark) + var(--sp));
  inset-inline: var(--mx);
  block-size: var(--inset-h, 600px);
  border-radius: 4px;
  overflow: hidden;
  z-index: 1;
}
body[data-figure="inset"]:has(.plate.slide) .bg img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; }
body[data-figure="inset"]:has(.plate.slide) .scrim { display: none; }
body[data-figure="inset"]:has(.plate.slide) .plate { padding-block-start: calc(var(--zone-mark) + var(--sp) + var(--inset-h, 600px) + var(--sp-2)); }

/* OVER A PHOTOGRAPH THE COPY GOES TO THE FOOT. The scrim is built to darken
   downward, so the bottom of the plate is where type is legible and where it is
   not standing on somebody's face. With the picture as the only subject the
   field has one block in it, and `space-between` puts a lone block at the top —
   which is the one place a photo cover should not put its headline. */
/* Over a photograph the copy goes to the foot — the spacer above already
   does that, so this only has to stop a `top` anchor overriding it. */
body:has(.hero) .plate::before { display: block; }
body:has(.hero) .plate::after { display: none; }

/* ── THE SPACER, NOT AN AUTO MARGIN ON A CHILD. ──
   Anchoring by putting `margin-block-start: auto` on `:first-child` breaks the
   moment that child can hide, and on four plates it can: the image band is the
   first child and it is `display: none` with no photograph. `:first-child`
   still matches a hidden element, so the margin landed on nothing and the whole
   stack snapped back to the top of the field — measured on the comparison card,
   which came out top-heavy with 280px under it. This system has hit that same
   trap three times now, in three different shapes.
   A flexible pseudo-element cannot hide, cannot be reordered and takes no part
   in `:first-child`, so the anchor holds whatever the markup does. It shrinks
   to nothing when the content needs the room, so it can never cause overflow. */
.plate::before {
  content: "";
  display: block;
  flex: 1 1 0;
  min-block-size: 0;
}

/* ── A PLATE THAT CARRIES A BOUNDED OBJECT GIVES THE FREE SPACE TO THE OBJECT,
      NOT TO THE SPACER. ──
   The spacer pushes the stack to the foot and leaves the air in one block at
   the head — which is a large empty rectangle whichever end it sits at, and the
   interest floor refuses one over 22% of the plate. An object that grows takes
   that space instead: it is still bounded (a declared box, `no-repeat`, one
   ramp), it is still content by every mask `slide-metrics` keeps, and a reader
   sees a composed plate rather than a stack with a hole above it. */
/* ── AND THE COVER'S LIMB IS THE ONE THAT WAS NEVER WRITTEN. ──
   The comment above has been right since it was written and the cover was
   not in it: `> .plate-spacer` selects a CLASS THAT DOES NOT EXIST — the
   spacer is a pseudo-element, which is the whole point of the note above it —
   and the rule body was empty, so the declaration landed nowhere. The two
   siblings on the next line were implemented and the cover was not.

   WHAT IT COST, measured on this tree at short copy: `.cov-field` and
   `.plate::before` BOTH resolve to `flex: 1 1 0`, so they are two items with
   equal grow and a zero basis and they SPLIT the free space half each. The
   band came out at ~384px of the 768px it could have had, and the other half
   was a full-width empty rectangle at the head of the plate —
   `largestEmptyRect 0,76 1080x384`, 26.7% against a 22% cover ceiling. The
   hole was never a missing number; it was the object and the spacer holding
   one plate's worth of air between them.

   Guarded on the two states that stand the band DOWN, because there the
   spacer is the anchor and must keep growing: over a photograph
   (`:has(.hero)`) the picture is the subject, and `typographic-poster` has no
   subject but its sentence. `portrait` is deliberately absent — with no
   photograph it puts its band back (see `cover.html`), and then it wants this
   rule like any other form. */
body:not(:has(.hero)):not([data-cover="typographic-poster"]) .plate:has(.cov-field)::before,
.plate:has(.quote-block)::before,
.plate:has(.cl-recap:not(:empty))::before { flex-grow: 0; }
.quote-block { flex: 1 1 auto; justify-content: center; }
.cl-recap:not(:empty) { flex: 1 1 auto; }
.cl-wrap { flex: 1 1 auto; }
/* ── THE RUN'S COMPOSITION GRAMMAR, AS SOMETHING CSS CAN SELECT ON. ──
   `bottom` is the default and the spacer above is it. The other three move the
   spacer, or stand it down in favour of `space-between`. The grammar used to
   arrive only as `--lockup-anchor`, a custom property, and a custom property
   cannot appear in a selector — so all four grammars put the lockup at the same
   y, measured on a real render. */
body[data-anchor="top"] .plate::before,
body[data-anchor="split"] .plate::before { display: none; }

body[data-anchor="top"] .plate::after,
body[data-anchor="centre"] .plate::after {
  content: "";
  display: block;
  flex: 1 1 0;
  min-block-size: 0;
}

/* `split-band` is the one grammar that is not an anchor: the head of the field
   takes the statement and its foot takes whatever follows, with a band of
   ground between them. `space-between` degrades to `flex-start` when the
   content is taller than the field, so overflow still goes DOWNWARD where the
   fit ladder can see it. */
body[data-anchor="split"] .plate { justify-content: space-between; }

/* ── AND THE OBJECT TAKES THE AIR ON EVERY ANCHOR, NOT JUST THE ONE PARKING
      SPOT THAT WAS FIXED FIRST. ──
   Free space on a plate can be parked in three places: the leading spacer, the
   trailing spacer, or between the children with `space-between`. The rule
   above — give it to the bounded object rather than to the spacer — was
   applied to the first one only, so the other two still made the hole it
   exists to prevent. Measured on the real-Chromium end-to-end carousel, whose
   grammar is seeded off the client slug and came out `split-band`:
   `interest:dead-space (slide 1) — an empty rectangle covered 31% of the plate
   (0,552 to 1080,992)`, a full-width 440px strip between the band's foot and
   the copy, against a 22% cover ceiling. `space-between` on a plate whose
   first child is already the subject does not compose anything; it opens a gap
   in the middle and hands the plate to the floor.

   So on a plate carrying a visible `.cov-field` all three are shut and the
   band, which is the only item left with `flex-grow`, absorbs the lot. The
   anchor axis still moves the lockup on the seven plates that have no bounded
   object — which is where `visual-system-axes-render` measures it, on
   `headline-focus.html` — and on the cover the composition is the band and a
   foot-anchored lockup, which is what the plate's own header describes. Same
   guard as the rule above: over a photograph and on `typographic-poster` the
   band stands down, and there the spacers are the anchor and must keep
   working. */
body:not(:has(.hero)):not([data-cover="typographic-poster"]) .plate:has(.cov-field) { justify-content: flex-start; }
body:not(:has(.hero)):not([data-cover="typographic-poster"]) .plate:has(.cov-field)::after { flex-grow: 0; }

/* ---- the brand band: mark on one side, eyebrow on the other ------------- */
.zone-mark {
  position: absolute;
  inset-block-start: 0;
  inset-inline: var(--mx);
  block-size: var(--zone-mark);
  z-index: 4;
  display: flex;
  align-items: center;
  /* PACKED, WITH THE AIR ABOVE. `space-between` put the blocks at opposite ends
     and left one hole in the middle — the owner's *"לפעמים כשיש רווח ריק גדול
     מדי זה לא יפה אם יש למטה משהו ולמעלה משהו"*. His prescription was to do
     both things at once: bring the blocks closer AND give the few words that
     matter more size. This is the first half; the fit ladder's two grow rungs
     are the second. `flex-start` plus an auto margin on the first child, rather
     than `flex-end`, so a stack that does not fit still overflows DOWNWARD
     where `scrollHeight` reports it. */
  justify-content: flex-start;
  gap: var(--sp-2);
  pointer-events: none;
}
/* `brandLogoCss` positions and sizes `img.brand-logo` from the placement; this
   only reserves the opposite end of the band for the eyebrow so the two can
   never meet. */
.zone-mark .eyebrow { margin-inline-start: auto; }

/* INSTAGRAM'S SLIDE COUNTER SITS ON THIS CORNER (2026-09-23). The app lays a
   "2/5" pill over the top reading-end corner of every carousel slide, and the
   eyebrow above is pushed to exactly that end. Measured off the owner's own
   screenshots and scaled to this 1080px canvas, the pill covers 38-107px from
   the top and 38-130px in from the side, and it cut the label in half on the
   reference posts ("THE S 2/5"). The end side of the band therefore stops
   136px short of the edge instead of `--mx`: the pill lands on the reading-end
   corner of the viewer's UI, which is the inline END for a slide written in the
   viewer's own language. The start side keeps the plate's margin, so the label
   still lines up with nothing new. */
.zone-mark { padding-inline-end: max(0px, calc(var(--ig-counter-clear, 136px) - var(--mx))); }

/* OVER A PHOTOGRAPH THE EYEBROW IS AT FULL INK. The scrim is transparent across
   the top third by design — that is what leaves a picture its colour — so a
   62% eyebrow sits on bare photograph and measured 2.16:1 against a 4.5 floor.
   A reader could not see it. Full strength costs the composition nothing at
   this size and buys the only thing the line is there for. */
body:has(.hero) .eyebrow,
body:has(.hero) .kicker {
  color: var(--fg);
  /* ── AND IT CARRIES ITS OWN GROUND. ──
     Full ink alone measured 4.29:1 against the 4.5 floor, and that number is
     not a property of the label: it is a property of whatever pixel the
     photograph happens to put behind it (measured glyph #eee5df on ground
     #b24948, a mid-tone red). A rule that passes on one picture and fails on
     the next is not a rule. The chip is a local scrim sized to the LABEL
     rather than to the band, so legibility stops depending on the image while
     the picture keeps its colour everywhere the label is not — which is the
     whole reason the scrim is transparent across the top third in the first
     place. Mixed against `--bg` rather than a flat black, so a light brand kit
     gets a light chip and the pair stays the kit's own. */
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  padding-block: 2px;
  padding-inline: 8px;
  border-radius: 2px;
}

.eyebrow, .kicker {
  font-family: var(--f-mono, var(--f-body));
  font-size: var(--t-micro);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  /* 72%, not 62%: set in the brand's body face (thinner strokes than the
     system mono it used to fall back to) the eyebrow measured 4.30:1 over the
     cover's ramp, under the 4.5:1 floor. */
  color: color-mix(in srgb, var(--fg) 72%, transparent);
  white-space: nowrap;
}
.eyebrow:empty, .kicker:empty { display: none; }

/* The bundled plates carry no series badge — it printed an internal format
   label in the same corner on every slide, which is the repetition a reader
   reads as machine-made. The PLACEMENT rule stays, because a client's own
   template may still carry the slot and a badge that lost its rule would lay
   itself out in normal flow on top of the copy. */
.brand-badge {
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: var(--mx);
  z-index: 5;
  font-family: var(--f-mono, var(--f-body));
  font-size: var(--t-micro);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--badge-ink, color-mix(in srgb, var(--fg) 55%, transparent));
}
.brand-badge:empty { display: none; }

/* ---- the foot band: handle and numeral ---------------------------------- */
.zone-foot {
  position: absolute;
  inset-block-end: 0;
  inset-inline: var(--mx);
  block-size: var(--zone-foot);
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
/* THE KIT PLACES THE HANDLE ABSOLUTELY, AND THE BAND IS A POSITIONED ANCESTOR.
   `brandLogoCss` emits `.brand-handle { position: absolute; bottom: 44px;
   inset-inline-start: 44px }` and lands AFTER the template's own sheet, so it
   wins on a tie. Inside `.zone-foot` — which is itself positioned — that 44px
   is measured from the BAND's edge rather than the plate's, and the handle came
   out 44px inboard of everything else on the plate. The owner saw it
   immediately: *"ה@username הוא לא בצד"*. Two class names beat one, so this
   returns the handle to the band's own flow without the kit losing anything it
   legitimately owns (face, size, tracking, colour). */
.zone-foot .brand-handle,
.zone-foot .pg-index,
.zone-mark .eyebrow,
.zone-mark .kicker { position: static; inset: auto; }

/* `:empty` ALONE CANNOT SEE AN EMPTY HANDLE. The slot is `<div
   class="brand-handle"><bdi>{{brandHandle}}</bdi></div>`, so the div always has
   an element child and is never `:empty` — a client with no handle would ship
   an invisible box holding the layout open. The kit's head emits the same pair;
   the template carries it too, for a document composed without one. */
.brand-handle:empty,
.brand-handle:has( > bdi:empty) { display: none; }

.brand-handle {
  font-family: var(--f-mono, var(--f-body));
  font-size: var(--t-micro);
  letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--fg) 46%, transparent);
}
/* The owner's "a number on some slides and not on others". `--fx-pagination`
   is the run's all-or-none decision; the cover and the closer opt out in their
   own markup, every interior plate shows it, and no plate decides for itself. */
.pg-index {
  /* `none`, for the same reason the accent defaults to `none`: a numeral that
     paints when the run did not name the slide is the owner's "a number on some
     slides and not on others" — decided by the markup instead of by the rule.
     `numeralSlides` names every interior and never the cover or the closer, so
     the switch is what makes it all-or-none. */
  display: var(--fx-pagination, none);
  font-family: var(--f-mono, var(--f-body));
  font-size: var(--t-micro);
  letter-spacing: 0.16em;
  color: color-mix(in srgb, var(--fg) 34%, transparent);
}

/* THE PICTURE'S CREDIT (2026-09-23). An `attributable` photograph (most CC,
   every Wikimedia file) must print its credit, and until now none did. It sits
   in the foot band, between the handle and the numeral, because that band is
   already reserved furniture: the fit ladder sizes type against the FIELD, so a
   line here can never collide with the copy or push it. Body face rather than
   mono, because a credit is up to 90 characters and mono at this step would
   truncate the licence off its end; two lines at most, then an ellipsis. */
.ds-credit:empty,
.ds-credit:has( > bdi:empty) { display: none; }
.ds-credit {
  flex: 1 1 auto;
  min-inline-size: 0;
  margin-inline: 24px;
  text-align: center;
  font-family: var(--f-body, system-ui, sans-serif);
  font-size: var(--t-micro);
  line-height: 1.25;
  color: color-mix(in srgb, var(--fg) 52%, transparent);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

/* ---- THE ACCENT — the only mark in the set ------------------------------ */
/* `--fx-accent` is the run's per-slide on/off switch and `data-accent` is its
   FORM. The form axis was decided per run, held across runs, printed on the
   payload — and read by no template, so five forms rendered as one bar at two
   sizes. Each of these is a different shape, not a different measurement:
   a reader can tell two posts apart by this alone.

   None of them is a full-measure rule. A 952px hairline across a plate is the
   thing the owner named as the AI tell, and no form here can produce one. */
.acc {
  /* `none`, NOT `block`. The fallback is what a slide gets when the run did
     not name it — and a mark that paints when nobody asked for it is the
     "orange rule on every slide" the owner rejected. Default off, switched on
     by `visualSystemCssBlock` for the one to three plates it chose. */
  display: var(--fx-accent, none);
  inline-size: var(--fx-accent-w, 88px);
  block-size: var(--fx-accent-h, 10px);
  background: var(--fx-accent-ink, var(--accent, currentColor));
  flex: none;
}

/* RULE — a short horizontal block above the headline. */
body[data-accent="rule"] .acc { border-radius: 1px; }

/* TINT — no mark at all. The accent colours something that was going to be on
   the plate anyway: the list's numerals, the recap's numerals, the source line.
   This replaces a `bracket` form that stood the rule on its end as a vertical
   bar beside the lockup; the owner's verdict on it was *"גם הקו האנכי שהוספת
   נראה ממש רע - תוריד, עדיף פשוט לפעמים להשאיר אלמנט בצבע השני"*, and that is
   the correct call — a free-standing stroke with nothing to do is furniture
   whichever way it is turned. Colour carried by content is the quietest accent there is. */
body[data-accent="tint"] .acc { display: none; }
body[data-accent="tint"] .source-line,
body[data-accent="tint"] .eyebrow,
body[data-accent="tint"] .kicker { color: var(--fx-accent-ink, var(--accent)); }

/* BAND — the accent becomes the eyebrow's own plate. No free-standing mark at
   all: the colour is carried by a label that was going to be there anyway,
   which is the quietest way to use an accent and the least template-like. */
body[data-accent="band"] .acc { display: none; }
body[data-accent="band"] .eyebrow,
body[data-accent="band"] .kicker {
  background: var(--fx-accent-ink, var(--accent));
  color: var(--bg);
  padding: 6px 14px;
  border-radius: 2px;
}

/* FIELD — the accent is a colour area, not a mark. The plate gets a banner of
   ground in the brand colour and the mark disappears entirely. */
body[data-accent="field"] .acc { display: none; }
body[data-accent="field"] .ground::after {
  content: "";
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  block-size: 34%;
  background: var(--fx-accent-ink, var(--accent));
  opacity: 0.92;
}
body[data-accent="field"] .eyebrow,
body[data-accent="field"] .kicker { color: var(--bg); }

/* NONE — the run decided the carousel carries no accent at all. */
body[data-accent="none"] .acc { display: none; }

/* ---- type roles --------------------------------------------------------- */
/* `--display-weight` and `--display-tracking` are the run's own display
   register. Both were emitted and unread, so every kit-less client rendered in
   the same face at the same weight. */
.headline {
  font-family: var(--f-display, var(--f-body, system-ui, sans-serif));
  font-weight: var(--display-weight, 700);
  letter-spacing: var(--display-tracking, -0.02em);
  /* 1.12, NOT 1.06, AND NO COMPENSATING PADDING. A display face paints outside
     its line box — Oswald by 0.3em, Space Grotesk by 0.06em, and the Hebrew
     faces substituted for them by more again. The first attempt at this paid
     for the overshoot in `padding-block`, which was wrong twice over: padding
     grows the box and the reported overflow by the same amount, so it never
     closed the gap, and it pushed the type down inside its own box — on a
     Hebrew cover it opened 130px between the accent and the headline it is
     supposed to sit on. A line box tall enough to contain the ink fixes the
     geometry where the geometry is wrong, and costs the composition nothing. */
  /* 1.12, not 1.06. An emphasis swatch is painted behind its run and a line
     box tighter than the face's own content area leaves the swatch outside it —
     `span.mk` and `span.mk-t` were both reported as overflowing their own box
     on every marked plate. The extra leading is what contains them. */
  line-height: 1.12;
  text-wrap: balance;
  /* The ink a display face paints OUTSIDE its line box is closed by the fit
     ladder, which measures it on the rendered plate rather than carrying a
     constant per face. See `_ds-fit.js` — three attempts at a constant here
     (a flat em value, the register's own `--mk-face-bleed`, and a `:lang(he)`
     rule) each fixed one face and missed another, because the overshoot
     depends on the face, the script, the step and the line height at once. */
  margin: 0;
  /* Display type set at 1.06 puts ink outside its own line box — ascenders at
     the top line, descenders at the last. Measured on this system's first
     render, the host reported 292px of content in a 289px box on a title with
     no descenders at all. In `em` so it is one decision at every step, not a
     pixel fudge per size: this is the optical padding the line height omits,
     and without it the ladder steps a plate that fits.

     `--mk-face-bleed` is ADDED because the overshoot is a property of the face,
     not of the design: the run's own display register already declares how far
     its face paints outside the line box (0 for Fraunces and Inter, 0.3em for
     Oswald, 0.06em for Space Grotesk). With a flat allowance the two humanist
     registers were clean and every condensed cover reported 6-28px of overflow
     — the same defect, at one register only, which is what a face constant is
     for. Reading it here means a register added later brings its own number.

     The base went 0.12/0.10 -> 0.18/0.14 on a measurement rather than a guess:
     with the face constant in, the only plates still reporting were Hebrew
     covers at 8-10px over, because `--mk-face-bleed` is the LATIN register's
     number and the Hebrew face substituted for it has its own ascent. 0.18em
     clears the largest of those with margin. */
}
.body-text {
  font-family: var(--f-body, system-ui, sans-serif);
  font-weight: 400;
  line-height: 1.42;
  max-inline-size: 22em;
  /* 90%, not 82%. `.body-text` is a MARK-BEARING host: an emphasis swatch can
     be painted behind it, and `MARK_HOST_INK_ALPHA` is the floor at which the
     text stays legible on top of that block. Softening a mark host's ink is
     how a marked word becomes less readable than an unmarked one. */
  color: color-mix(in srgb, var(--fg) 90%, transparent);
  margin: 0;
}
.source-line, .note {
  font-family: var(--f-mono, var(--f-body));
  font-size: var(--t-micro);
  letter-spacing: 0.06em;
  color: color-mix(in srgb, var(--fg) 48%, transparent);
  margin: 0;
}
.source-line:empty, .note:empty { display: none; }

/* role defaults, each exactly one step */
.r-figure    { font-size: var(--t-figure); }
.r-display   { font-size: var(--t-display); }
.r-statement { font-size: var(--t-statement); }
.r-lead      { font-size: var(--t-lead); }
.r-label     { font-size: var(--t-label); }
.r-micro     { font-size: var(--t-micro); }

/* ---- THE FIT LADDER — steps, not fractions ------------------------------ */
/* `_ds-fit.js` measures the VISIBLE twin and sets `data-fit` on the host:
   -1 short copy, take the next step UP (this is what stops a six-word headline
   floating in an empty plate); 0 its own step; 1 and 2 step down. Every value
   it can produce is a step of the scale above. */
[data-fit="-1"].r-display   { font-size: var(--t-figure); }
[data-fit="-1"].r-statement { font-size: var(--t-display); }
[data-fit="-1"].r-lead      { font-size: var(--t-statement); }

/* The second grow rung. Only the roles that START below the top of the scale
   have one — a display host is already at the largest step by `-1` and there is
   nothing above `--t-figure` to give it. */
[data-fit="-2"].r-display   { font-size: var(--t-figure); }
[data-fit="-2"].r-statement { font-size: var(--t-figure); }
[data-fit="-2"].r-lead      { font-size: var(--t-display); }

[data-fit="1"].r-figure     { font-size: var(--t-display); }
[data-fit="1"].r-display    { font-size: var(--t-statement); }
[data-fit="1"].r-statement  { font-size: var(--t-lead); }
[data-fit="1"].r-lead       { font-size: var(--t-label); }
/* ── `.r-label` HAS RUNGS TOO, AND THE GAP WAS NOT THEORETICAL. ──
   Every register but this one could step down, so a host set in `--t-label`
   was unshrinkable no matter what the ladder decided. Measured on the closer
   at the reviewer's `l` scale: `.cl-cta` came out 434px in a 1204px field,
   the ladder went to its floor at step 2 with the CTA untouched, and the plate
   overflowed by 55px — `clipped`, on a plate whose only problem was one line
   of type that had nowhere to go. `--t-micro` is the step below, and it is the
   same step `.dv-label` already takes at these rungs. */
[data-fit="1"].r-label      { font-size: var(--t-micro); }

[data-fit="2"].r-figure     { font-size: var(--t-statement); }
[data-fit="2"].r-display    { font-size: var(--t-lead); }
[data-fit="2"].r-statement  { font-size: var(--t-label); }
[data-fit="2"].r-lead       { font-size: var(--t-label); }
[data-fit="2"].r-label      { font-size: var(--t-micro); }

/* ---- the twin slot ------------------------------------------------------ */
/* Marked renders carry the copy twice (`.mk-runs` with emphasis spans,
   `.mk-plain` without). Exactly one is ever visible, and the fit ladder is
   careful to measure the visible one — see `_ds-fit.js`.

   `display: contents`, so the twin generates NO BOX and the text becomes a
   direct child of the host. The reason is measurable. As an inline span the
   twin is sized by the FONT's ascent and descent rather than by `line-height`,
   so on a Hebrew face with a tall ascent its rect sat above the headline's own
   content box and every Hebrew cover reported an overflow with nothing visibly
   wrong. Making it a block moved the same 3-27px report onto the block instead.
   With no box there is nothing to overflow: the host carries the text, the host
   carries the optical padding, and one geometric check covers both scripts. */
/* ── THE HOST MAKES ROOM FOR A MARK'S BLEED. ──
   An emphasis swatch is painted BEHIND its run and it overshoots the line box
   upward — `emphasis-marks.ts` measures the overshoot per script and publishes
   it as `--mk-twin-bleed` (.14em Latin, .22em Hebrew), with `--mk-face-bleed`
   carrying the display face's own share. The fit ladder closes ink on the END
   edge only, because that is the side `scrollHeight` can report; this is the
   start edge, and without it a marked headline's first line is clipped.
   The fallback is the HEBREW value, because a document composed without the
   run sheet cannot know its own script and has to be safe for the worse case. */
/* ── A TWIN HOST IS NEVER `:empty`, SO IT NEEDS A DIFFERENT QUESTION. ──
   The slot renders as two `<span>` children on every plate, filled or not, so
   `.host:empty` is permanently false: an unfilled host would keep its box, its
   padding and its gap, holding the layout open around nothing. Ask about the
   CHILDREN instead — no non-empty span, no host. */
*:has(> span.mk-plain):not(:has(> span:not(:empty))) { display: none; }

*:has(> span.mk-plain) { padding-block-start: max(var(--mk-twin-bleed, .22em), var(--mk-face-bleed, 0em)); }

/* ── BLOCK, NOT `display: contents`. ──
   The twins are the only TEXT-BEARING LEAVES in the set: `.headline` and
   `.body-text` always have two element children, so the probe's "an element
   with words and no element children" lands on the spans and nowhere else.
   `display: contents` gives an element no box, and a leaf with no rendered box
   contributes no area — so every plate reported `textBoxShare` at 0-0.3% and
   the interest floor said "the ground layers rendered and the copy did not"
   about plates that had rendered perfectly, marks and all.
   `contents` was introduced to stop an inline twin reporting a false overflow
   against its host. The fit ladder's `closeInk` closes that properly now, on
   every element of the plate and by measurement, so the box can come back. */
.mk-runs  { display: block; }
.mk-plain { display: block; }
.mk-runs:empty { display: none; }
.mk-runs:not(:empty) + .mk-plain { display: none; }
/* `--mk-face-bleed` is the run's decision about whether an emphasis run may
   change face. 0 keeps ONE face inside a headline, which is what stopped a
   Hebrew line coming out in two typefaces. */
.mk-runs em, .mk-runs b, .mk-runs strong {
  font-style: normal;
  font-weight: inherit;
  font-family: inherit;
  color: var(--fx-accent-ink, var(--accent, currentColor));
}
body[data-face-bleed="1"] .mk-runs em { font-family: var(--f-display); }

/* ---- the bounded object (device) ---------------------------------------- */
.device:empty { display: none; }
.dv-figure {
  font-family: var(--f-display, var(--f-body, system-ui, sans-serif));
  font-weight: var(--display-weight, 700);
  font-size: var(--t-figure);
  line-height: 0.88;
  color: var(--dv-ink, var(--fg));
}
/* One step up from where it started. At `--t-label` against a 200px figure the
   caption read as fine print — the owner's *"הטקסט מתחת ל90% הוא ממש קטן"* —
   and a figure whose meaning is unreadable is a decoration, not evidence. */
.dv-label {
  font-family: var(--f-body, system-ui, sans-serif);
  font-size: var(--t-lead);
  line-height: 1.3;
  color: var(--dv-quiet, color-mix(in srgb, var(--fg) 72%, transparent));
}
/* THE DEVICE STEPS WITH THE PLATE. The bounded object is the tallest thing on
   the plates that carry one, so a plate that does not fit is usually the device
   rather than the copy. Before these two rules the object simply overflowed —
   at `ts-l` the cover's figure grew up through the reserved brand band and
   printed under the mark. Both values are steps of the scale, so the object
   shrinking cannot put an off-scale size on the plate. */
[data-fit="1"] .dv-figure { font-size: var(--t-display); }
[data-fit="2"] .dv-figure { font-size: var(--t-statement); }
[data-fit="1"] .dv-label,
[data-fit="2"] .dv-label  { font-size: var(--t-micro); }

/* The device never paints a rule of its own. It is a figure and its label.
   ONLY the rule (2026-09-23). This used to hide `.dv-accent` as well, from the
   days the rule itself carried that class, and `.dv-accent` is now the marker
   on the INFORMATION half of a device: the "after" figure of a before/after
   pair, the winning side of a versus, the largest bar, the last timeline point,
   the whole filled grid of a unit_grid. Rendered on today's plates, a
   `figure_pair` of $700m -> $1.4bn painted "$700m -> Series E": the number the
   slide was about was invisible. */
.device .dv-rule { display: none; }

/* ---- script direction --------------------------------------------------- */
body.ta-start .plate, body.ta-start .zone-mark, body.ta-start .zone-foot { text-align: start; }
body.ta-center .plate { text-align: center; }
body.ta-center .plate > * { margin-inline: auto; }
body.ta-center .acc { margin-inline: auto; }
/* ---- A BRAND MARK AS A SMALL BADGE (2026-09-23) --------------------------
   The owner, on the white panel that came first: a logo does not have to sit
   in a fixed place or take the whole slide. It is a small part of the post,
   to the side, with no copy over it, and where it sits varies. So the mark is
   the plate's first FLOW child (never absolute: text cannot land on it, and
   the fit ladder sees its height), a white chip sized to the mark, and
   `data-at` (`markPlacementFor`) moves it with `order` above the copy or
   after it, at the start edge or the end. Hidden when no mark arrived. */
/* Placement on the plain selector, so `data-at` (same class plus an attribute) outranks it;
   the `:has()` rule below only switches the chip on. */
.mark-badge { display: none; order: -1; align-self: flex-start; justify-self: start; }
.mark-badge:has(img[src]:not([src=""])) {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  box-sizing: border-box;
  block-size: 104px;
  min-inline-size: 104px;
  max-inline-size: 320px;
  padding: 18px 26px;
  border-radius: 22px;
  background: var(--mark-panel, #ffffff);
  margin-block: var(--sp);
  position: relative;
  z-index: 4;
}
.mark-badge img { max-block-size: 100%; max-inline-size: 100%; object-fit: contain; display: block; }
.mark-badge[data-at^="tail"] { order: 99; }
.mark-badge[data-at$="-end"] { align-self: flex-end; justify-self: end; }
/* OVER THE PICTURE, AT THE SIDE OR IN A CORNER. Absolute, so the renderer
   (`mark-placement.ts`) only keeps one of these after checking that no copy
   is within 14px of it and that the pixels under it are the quietest on the
   slide; with no renderer choice, `auto` is the flow placement above. */
.mark-badge[data-at^="corner-"],
.mark-badge[data-at^="side-"] { position: absolute; margin: 0; }
.mark-badge[data-at="corner-top-end"] { inset-block-start: calc(var(--zone-mark) + var(--sp)); inset-inline-end: var(--mx); }
.mark-badge[data-at="corner-top-start"] { inset-block-start: calc(var(--zone-mark) + var(--sp)); inset-inline-start: var(--mx); }
.mark-badge[data-at="side-end"] { inset-block-start: 36%; inset-inline-end: var(--mx); }
.mark-badge[data-at="side-start"] { inset-block-start: 36%; inset-inline-start: var(--mx); }
body.ta-center .plate > .mark-badge { margin-inline: auto; }
[data-fit="1"] .mark-badge:has(img[src]:not([src=""])) { block-size: 92px; }
[data-fit="2"] .mark-badge:has(img[src]:not([src=""])) { block-size: 80px; padding: 14px 20px; }

/* @ds:end-of-source */
/* @ds:end */

/* ---- headline-focus ----------------------------------------------------- */
/* The figure sits ABOVE the statement here, which is the opposite of `slide`
   and deliberate: on this plate the number is the setup and the sentence is the
   payoff, so the eye should land on the figure and finish on the statement. */
.hf-device { margin-block-end: var(--sp-2); }
.hf-lockup {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--sp);
}
.hf-headline { max-inline-size: min(16ch, 100%); }
.hf-lockup .body-text { max-inline-size: min(26em, 100%); }
/* A LIST ITEM'S NUMBER (2026-09-23, the_list series). The item is the slide,
   and its number is how a reader keeps their place in a countable promise, so
   it is set big, in the display face and the ink, never the accent (the
   accent is the run's one mark). Empty on every other series, and gone. */
.hf-ordinal {
  font-family: var(--f-display, var(--f-body, system-ui, sans-serif));
  font-weight: 700;
  /* The scale's top step, which is also a stat's figure: a list number is
     that kind of object, and an off-scale literal is what the set forbids. */
  font-size: var(--t-figure);
  line-height: 1.06;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, var(--fg) 88%, transparent);
}
.hf-ordinal:empty { display: none; }

/* ── A LIST ITEM CAN CARRY A PICTURE (2026-09-24). ──
   `the_list` sets its items on this plate, and it had no picture slot, so a
   photo-led client's list post shipped one picture in eight (thepitchbydeel,
   pubsub-21255292697877233). With a picture the plate drops its device: one
   object per item, the picture or the figure, never both crowding the copy. */
.plate.focus:has(.sc-figure-band img[src]:not([src=""])) .hf-device { display: none; }

/* ── A LIST ITEM THAT CARRIES A FIGURE (owner, 2026-09-25). ──
   The item number above sat at the top step and never stepped with the fit
   ladder, so on a plate that also carried a figure the ladder shrank the
   FIGURE instead: The Pitch by Deel and KAROS shipped a 200px "03" over a
   66px figure and a 22px caption, six sizes on one plate, and the owner saw
   the small text on top fighting what was written below it. The figure is
   the display object; the item number becomes a place marker at the label
   step, and the caption never drops below that step. */
.plate.focus:has(.hf-device:not(:empty)):not(:has(.sc-figure-band img[src]:not([src=""]))) .hf-ordinal {
  font-family: var(--f-mono, var(--f-body, system-ui, sans-serif));
  font-size: var(--t-label);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.04em;
  color: color-mix(in srgb, var(--fg) 72%, transparent);
}
.plate.focus .hf-device .dv-label,
.plate.focus .hf-device[data-fit] .dv-label { font-size: var(--t-label); }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}" data-n="{{slideIndex}}" data-ground="{{groundStyle}}" data-tone="{{groundTone}}" data-cover="{{coverForm}}" data-accent="{{accentForm}}" data-anchor="{{compositionAnchor}}" data-figure="{{figurePlacement}}">
  <div class="ground" aria-hidden="true"></div>

  <div class="zone-mark">
    <div class="kicker">{{kicker}}</div>
  </div>

  <div class="plate focus">
    <div class="sc-figure-band" data-kind="{{heroKind}}" style="--hero-src: url('{{image:hero}}')"><img src="{{image:hero}}" onerror="this.remove()" alt="" /></div>
    <div class="device hf-device" data-fitted="secondary">{{html:device}}</div>
    <div class="hf-lockup">
      <div class="hf-ordinal" aria-hidden="true">{{itemOrdinal}}</div>
      <div class="acc" aria-hidden="true"></div>
      <div class="hf-headline headline r-display" id="headline" data-fitted="primary"><span class="mk-runs">{{html:headlineRuns}}</span><span class="mk-plain">{{headline}}</span></div>
      <div class="body-text r-lead" data-fitted="secondary"><span class="mk-runs">{{html:bodyRuns}}</span><span class="mk-plain">{{body}}</span></div>
    </div>
  </div>

  <div class="zone-foot">
    <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
    <span class="pg-index" aria-hidden="true">{{slideIndex}}</span>
  </div>

  <script>
/* @ds:fit-start */
/* ============================================================================
   THE FIT LADDER — one for the whole set.
   ----------------------------------------------------------------------------
   Generated into every template between the `@ds:fit-start` / `@ds:fit-end`
   markers by `scripts/sync-design-system.ts`. Edit HERE, never in a plate.

   WHAT IT REPLACES. Every template used to carry its own ladder that picked a
   size from `textContent.length` against bespoke thresholds. Three problems,
   all of them things the owner saw:

   1. IT GUESSED. A character count does not know the face, the script, the
      reviewer's `--ts`, or how wide the words are, so each ladder needed its
      own thresholds AND a second set shifted ~15% for `ts-l`. Eight ladders,
      sixteen threshold sets, and a long statement still printed over its own
      kicker. This one MEASURES the laid-out box and steps until it fits, so
      there is nothing to tune and nothing to keep in sync.

   2. IT READ THE HIDDEN TWIN. `textContent` reads a `display: none` subtree, so
      on a marked render the host counted its copy twice and a 30-character
      headline scored 60 and took a step it did not need. Geometry only sees
      the visible twin, so a marked and an unmarked render of the same copy now
      set the same size.

   3. IT ONLY EVER SHRANK. Short copy stayed at the role's own step and left the
      plate mostly empty — the owner's "the first slide is relatively empty and
      boring", and the near-blank interior plate. This ladder tries ONE STEP UP
      first and keeps it when it fits.

   Every value it sets resolves to a step of the six-step scale. It cannot
   produce a size that is not on the scale, which is the property that took a
   carousel from 25 distinct sizes to the set the scale declares.
   ========================================================================== */
(function () {
  var plate = document.querySelector('.plate');
  if (!plate) { window.__CAROUSEL_READY__ = true; return; }

  var hosts = Array.prototype.slice.call(document.querySelectorAll('[data-fitted]'));
  if (!hosts.length) { window.__CAROUSEL_READY__ = true; return; }
  var primary = hosts.filter(function (h) { return h.getAttribute('data-fitted') === 'primary'; });

  /* EVERY ELEMENT ON THE PLATE, DEEPEST FIRST — not just the fitted hosts.
     A host is where a STEP is applied; overflow happens wherever there is text.
     Measured: `.me-title` in a list row and `.quote-attr` under a quotation are
     neither of them fit hosts, and both reported — the attribution printed 15px
     into the reserved foot band, on top of the @handle, which is the same class
     of defect as the closer's CTA and was invisible for the same reason.
     Deepest first so a child's ink is closed before its parent is measured,
     otherwise a container inherits its children's overflow and pays twice. */
  var content = Array.prototype.slice.call(plate.querySelectorAll('*'))
    .filter(function (el) { return el.tagName !== 'IMG' && el.tagName !== 'BR'; })
    .map(function (el) { var d = 0, n = el; while (n && n !== plate) { d++; n = n.parentElement; } return { el: el, depth: d }; })
    .sort(function (a, b) { return b.depth - a.depth; })
    .map(function (x) { return x.el; });

  /* Overflow means either of the two things a reader sees: the stack is taller
     than the field between the brand band and the foot band, or a single
     unbreakable line is wider than the measure. */
  /* The field the copy is allowed to occupy: the plate's content box, which is
     everything between the reserved brand band and the reserved foot band. */
  function field() {
    var r = plate.getBoundingClientRect();
    var cs = getComputedStyle(plate);
    return { top: r.top + parseFloat(cs.paddingTop), bottom: r.bottom - parseFloat(cs.paddingBottom) };
  }

  function overflows() {
