<!doctype html>
<html lang="en" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent headline_focus slide template</title>
<!--
  `headline_focus` — one high-impact editorial statement. The hook cover, or a
  turn in the middle of a carousel that wants to land hard with no picture.

  Ported from karos-agents' legacy `news-pulse.html` `.slide.pulse` (its
  kicker/headline lockup and the character-count size ladder) and
  `story-carousel.html`'s `.copy` block, retyped into the Gen-2 token system
  the rest of this directory uses.

  ONE deliberate departure from legacy, worth flagging: legacy set these
  headlines in `Albert Sans` at weight 900, UPPERCASE, at `line-height: 0.92`.
  That is a genuinely louder poster voice than this template's sentence-case
  Fraunces. The Gen-2 system that `slide.html` and the other archetypes here
  are built on made a considered move to sentence case ("uppercase reserved for
  hooks and the mono face"), and mixing an uppercase-900 slide into a carousel
  whose other slides are sentence-case serif reads as two different designs
  rather than one with range. Impact is bought back with size (118px) and the
  accent band instead.

  `line-height: 1.02` rather than Gen-2's usual 1.3: that 1.3 exists to leave
  vertical room for the `.hl` highlighter-band device, which this template does
  not use. Without a band to clear, 1.3 on a 118px display face just reads as a
  gap.

  ── 2026-09-10, item M.3: THE GROUND ──

  Everything above `.copy` used to be bare `var(--bg)`: with a two-line
  headline this template measured `flatBackgroundShare` ~0.91, `occupiedShare`
  ~0.13 and a single contiguous empty rectangle covering ~0.69 of the plate,
  which is precisely the slide the owner pointed at ("מסך אפור ברובו") and
  precisely what item L's `LARGEST_EMPTY_RECT_CEILING` refuses. It now paints
  a token-driven ground, CSS only, no new content slot:

    * `gr-grid` (the default): a 45-degree hairline field at 14% of the
      foreground token, 1.5px rules every 18px, plus one thin accent rule.
    * `gr-glyph`: the same field mirrored to 135 degrees, plus a display-face
      numeral bleeding off the top — filled at 8% (texture) and stroked at
      26% (content).

  The field's parameters are design decisions, and the measurements below are
  their CONSEQUENCE rather than their cause. That ordering is worth stating
  plainly, because an earlier revision of this comment had it the other way
  round — it explained the 14% mix as "8% measures 17.2, just under the ink
  threshold; 14% is above the line", which is a template designed to a
  counter. A design tuned to cross a measurement threshold is not a design,
  and the review that caught it was right: at that point the metric was
  measuring the ground rather than the slide.

  So, the design first. 1.5px rules every 18px at 14% of the foreground is
  the contrast at which a pinstripe READS as a pinstripe on a phone at feed
  size: at 8% it is a smudge that reproduces as nothing on a dim screen, and
  above ~20% it competes with the body text for the reader's eye. A single
  45-degree direction rather than a grid because a grid's crossings make a
  visible dot at every intersection, which fights the diagonal accent rule.
  Inset 16px rather than full-bleed because a hairline field crossing the
  frame edge reads as a printing error, not as a ground.

  What that then measures, through the real `measureSlidePng` over
  synthesised plates of this template:

    bare plate         flat 90.9%  occupied 13.5%  emptyRect 69.4%  content 13.5%
    orthogonal grid    flat 77.1%  occupied 38.6%  emptyRect  1.5%  content 13.6%
    45-degree field    flat 83.8%  occupied 40.7%  emptyRect  1.5%  content 13.5%

  Read that last column. The field moves `occupiedShare` and the empty
  rectangle and leaves `contentOccupiedShare` — the mask that only counts
  cells whose MEAN colour has left the ground — exactly where it was, because
  an 8.3% duty cycle at 24 units of contrast shifts a cell's mean by about 2.
  That is the honest description of what a ground treatment is, and it is why
  `interest-floor.ts` gained clause G: the field legitimately fills the dead
  space clause C measures (a slide with a ground is not a slide with a bare
  ground, which is the rule clause C inherited), and it cannot stand in for
  content, because clause G reads the content mask and a texture cannot
  satisfy it at any opacity that keeps it a texture. An empty-slot render of
  this template fails clause G, and
  `__tests__/interest-floor-calibration.test.ts` asserts exactly that.

  One further constraint the numbers do decide, and it is a real one: the
  field must NOT read as a device. A filled low-colour measurement cell
  counts as `graphicShare`, so an orthogonal grid's crossings — which fill
  whole cells — would have let a statement slide clear the cover role's
  imagery-or-device floor and quietly undone `default:cover-carries-device`.
  A single-direction field has no crossings and adds ~0.1pp of graphic share.

  Which variant a slide paints comes from `slides-data.ts`'s existing seeded
  low-discrepancy walk (`isVariationSlot`) under its own `:ground` namespace
  — deterministic within a run, phase-shifted across runs, no new randomness
  mechanism. The field is the CSS default so that a checkpoint written before
  `{{groundStyle}}` existed (where the class token strips to a bare "gr-")
  still paints a ground rather than reverting to the bare plate.

  See `stat-callout.html`'s header for why the token block is duplicated.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --mx: 64px;
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2): a discrete type-scale multiplier
     and logical text alignment, applied per slide via body classes. Classes,
     never a {{fontScale}} CSS var: a stripped placeholder degrades to a
     harmless "ts-" class token, whereas an EMPTY-but-defined custom property
     substitutes as empty (not the var() fallback) and would invalidate every
     font-size on an older checkpointed slides-data re-rendered post-deploy. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--f-body); }

  /* ── The ground (item M.3) — see the header for the measured numbers. ── */
  .ground {
    /* INSET, not full-bleed: a hairline field crossing the frame edge reads
       as a printing error rather than as a ground. The 16px is also
       load-bearing for the measurement — `clippedEdgeShare` counts ink inside
       an 8px bleed band and fails a slide over 0.4%, and a full-bleed version
       of this field measured 0.5% — so the design choice and the metric agree
       here, which is the only reason a number appears in this comment. */
    position: absolute; inset: 16px; z-index: 0; overflow: hidden;
    background-image: repeating-linear-gradient(45deg,
      color-mix(in srgb, var(--fg) 14%, transparent) 0 1.5px,
      transparent 1.5px 18px);
  }
  /* The accent moment stays a RULE, never a solid block. A solid block over
     ~3% of the frame measures as `graphicShare`, which would let a statement
     slide clear the cover role's imagery-or-device floor and quietly undo
     `default:cover-carries-device`. A hairline is too thin to be read as a
     device by the pixels, which is the correct answer for an interior slide. */
  .ground-rule {
    position: absolute; inset-block-start: 90px; inset-inline-end: -80px;
    inline-size: 520px; block-size: 4px; background: var(--accent);
    transform: rotate(45deg); transform-origin: center;
  }
  .ground-glyph { display: none; }
  /* The alternative ground: the same field mirrored, plus a display-face
     numeral bleeding off the top. The numeral is OUTLINED — the fill sits
     below the ink threshold (texture) while the stroke is above it (content),
     and both stay too thin to register as a device. */
  body.gr-glyph .ground { background-image: repeating-linear-gradient(135deg,
      color-mix(in srgb, var(--fg) 14%, transparent) 0 1.5px,
      transparent 1.5px 18px); }
  body.gr-glyph .ground-rule { display: none; }
  body.gr-glyph .ground-glyph {
    display: block; position: absolute;
    inset-block-start: calc(-190px * var(--ts, 1)); inset-inline-start: calc(-24px * var(--ts, 1));
    font-family: var(--f-display); font-weight: 600; font-size: calc(760px * var(--ts, 1));
    line-height: 0.8; letter-spacing: -0.04em;
    color: color-mix(in srgb, var(--fg) 8%, transparent);
    -webkit-text-stroke: 3px color-mix(in srgb, var(--fg) 26%, transparent);
  }

  .copy { position: absolute; inset-inline: var(--mx); bottom: 130px; z-index: 4; }
  /* An optional number device sits inside the bottom-anchored lockup, above
     the kicker, so it grows upward into the ground rather than pushing the
     headline off the plate. Any archetype may carry a `device` (item M.4);
     this is the one bundled typographic archetype that renders it. */
  .hf-device { margin-block-end: calc(40px * var(--ts, 1)); }
  .hf-device:empty { display: none; }

  .kicker {
    font-family: var(--f-mono); font-weight: 500; font-size: calc(22px * var(--ts, 1));
    letter-spacing: 0.22em; text-transform: uppercase;
    color: color-mix(in srgb, var(--fg) 78%, transparent); margin-bottom: 28px;
  }
  .kicker:empty { display: none; }

  .hf-headline {
    font-family: var(--f-display); font-weight: 600; font-size: calc(118px * var(--ts, 1));
    line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance;
  }
  .hf-headline.small { font-size: calc(92px * var(--ts, 1)); line-height: 1.05; }
  .hf-headline.tiny { font-size: calc(74px * var(--ts, 1)); line-height: 1.1; }

  .stat-band { width: 132px; height: 12px; background: var(--accent); margin-top: 34px; }

  .body-text {
    font-family: var(--f-body); font-weight: 400; font-size: calc(31px * var(--ts, 1)); line-height: 1.55;
    color: color-mix(in srgb, var(--fg) 92%, transparent); margin-top: 30px; max-width: 900px; text-wrap: pretty;
  }
  .body-text:empty { display: none; }
  .brand-badge:empty, .brand-handle:empty { display: none; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}} gr-{{groundStyle}}">
  <div class="brand-badge">{{seriesBadge}}</div>
  <div class="brand-handle">{{brandHandle}}</div>
  <div class="ground" aria-hidden="true">
    <div class="ground-rule"></div>
    <span class="ground-glyph">{{slideIndex}}</span>
  </div>
  <div class="copy">
    <div class="hf-device">{{html:device}}</div>
    <div class="kicker">{{kicker}}</div>
    <div class="hf-headline" id="headline">{{headline}}</div>
    <div class="stat-band"></div>
    <div class="body-text">{{body}}</div>
  </div>
  <script>
    // Legacy `news-pulse` breakpoints verbatim: >32 characters to `small`,
    // >60 to `tiny`.
    (function () {
      var h = document.getElementById("headline");
      var len = (h.textContent || "").trim().length;
      if (len > 60) h.className = "hf-headline tiny";
      else if (len > 32) h.className = "hf-headline small";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
