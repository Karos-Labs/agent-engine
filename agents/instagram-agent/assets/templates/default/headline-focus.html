<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent headline_focus slide template</title>
<!--
  `headline_focus` — one high-impact editorial statement. The hook cover, or a
  turn in the middle of a carousel that wants to land hard with no picture.

  Ported from karos-agents' legacy `news-pulse.html` `.slide.pulse` (its
  kicker/headline lockup and the character-count size ladder) and
  `story-carousel.html`'s `.copy` block, retyped into the Gen-2 token system
  the rest of this directory uses.

  ONE deliberate departure from legacy, worth flagging: legacy set these
  headlines in `Albert Sans` at weight 900, UPPERCASE, at `line-height: 0.92`.
  That is a genuinely louder poster voice than this template's sentence-case
  Fraunces. The Gen-2 system that `slide.html` and the other archetypes here
  are built on made a considered move to sentence case ("uppercase reserved for
  hooks and the mono face"), and mixing an uppercase-900 slide into a carousel
  whose other slides are sentence-case serif reads as two different designs
  rather than one with range. Impact is bought back with size and with the
  accent geometry below, not with a second typeface.

  ── 2026-09-11, THE VISUAL REWORK ──

  The owner's complaint (2026-09-10, verbatim: "אתה רואה מסך אפור ברובו") was
  about THIS archetype. The previous revision answered it with a ground that
  was tuned to sit under every measurement threshold on purpose — a 14%
  hairline field, a 4px accent rule, a numeral outlined at 26% — each with a
  comment saying it had to stay "too thin to be read as a device". The result
  measured as a ground and looked like nothing: a statement in the lower third
  of a grey plate, which is the defect verbatim.

  That pass's answer was a LOUD GROUND: a 45-degree hairline field at 22% of
  the foreground plus two accent diagonal bands, on the argument that a
  texture never COVERS a cell and therefore cannot read as a drawn device.

  ── 2026-09-14, RFC-20 P2: THAT ANSWER WAS THE DEFECT, AND IT IS DELETED. ──

  The argument was true about clause E and irrelevant to clauses C, D and G,
  which is where the owner's complaint actually lives. `occupiedShare` counts
  a cell whose MEAN has left the ground, covered or not, so a full-field hatch
  counted as content everywhere it reached — and `largestEmptyRectShare`,
  which `slide-metrics.ts` calls "the metric that names the complaint",
  measured the hatch rather than the slide. Measured on this tree through real
  Chromium (`measureSlidePng`, 1080x1440 @2, msedge channel):

    shipped, ONE SHORT HEADLINE (the owner's grey screen)   occ 50.70  LER 8.89
    shipped, composed (kicker + statement + body)           occ 52.33  LER 8.85

  Two plates a reader would describe completely differently, 1.6 points apart,
  BOTH PASSING. The floor could not refuse the thing it was built to refuse.

  So this file now keeps THE GROUND RULE (RFC-20 §5.0): every painted layer is
  either MATERIAL — below the measurement's flat tolerance, contributing zero
  to every share — or AN OBJECT, bounded, its extent a function of the CONTENT
  and never of the leftover space, and switched off by a `body:has()` guard
  when that content is absent. Nothing in between; no full-bleed layer may
  carry ink.

  What that means here, layer by layer:

  * `.ground` paints NOTHING. It is the mount point for `ground-material.ts`'s
    turbulence material, which is spliced onto `.ground::after` at
    materialisation time and is sub-ink by construction. Its own tonal wash is
    gone — see `.ground`'s block for the measurement that forced that, which
    is not the one you would expect.
  * `.copy-art` IS GONE, both variants. The hatch, the dash screen and the two
    accent bands all had their extent set by the elastic field, i.e. by
    whatever the copy failed to use.
  * `.hf-plate`, the PLINTH, is new and is the only filled thing on the plate.
    It hugs the statement, it cannot absorb leftover space, and it is what
    converts copy volume into measurable area.
  * The composition still fills the frame, which is the half decoration could
    never do: a kicker rail at the top, the statement on its plinth in the
    middle, the body at the foot.

  ── UNRESOLVED, AND IT IS A BLOCKING FINDING RATHER THAN A DESIGN NOTE. ──

  WHENEVER THE PLINTH PAINTS, THIS ARCHETYPE MEASURES AS A DRAWN DEVICE.
  MEASURED-EDGE over the six combinations `interest-floor-calibration.test.ts`
  renders at the cover role, the plinth measures **32.5-41.3%** of
  imagery-or-device against a 10% floor, so `no-device` goes silent and a
  statement slide is ACCEPTED as a cover.

  An earlier revision of this comment called that "a deliberate change of
  editorial identity" that "supersedes the `no-device` expectation that
  `__tests__/interest-floor-calibration.test.ts` pins for it". **That was the
  wrong call and it is withdrawn.** `default:cover-carries-device`
  (`visual-qa-pre-checks.ts`) is a shipped product rule and `headline_focus` is
  its one intentional exception; a template comment is not where a shipped rule
  gets reversed, and RFC-20 Part 8 item 2 committed this phase to no clause-E
  re-calibration at all.

  It also cannot be fixed by tuning the fill, and the reason is structural
  rather than a matter of trying harder. RFC-20 §5.0 reads it straight out of
  `slide-metrics.ts:866-919`: `covered` (48/64) implies `carriesInk` (4/64), so
  `imageryOrDeviceShare` is a SUBSET of `occupiedShare` cell for cell. **There
  is no amplitude, tint or pitch at which paint is visible to clauses C and D
  and invisible to clause E.** A plinth that closes an empty rectangle
  necessarily carries clause E. So this archetype may have a filled plinth OR
  it may keep its `no-device` exception, and it cannot have both. That is an
  RFC-14/RFC-17 decision about what a `headline_focus` slide IS, it is owed an
  argument rather than a side effect of a fill colour, and the two assertions
  in `interest-floor-calibration.test.ts` are deliberately left RED until it is
  taken. The `body.gr-glyph` block below carries the rest of the numbers.

  ── The two ground variants, after the deletion ──

    * `gr-grid` (the default): nothing behind the plinth at all.
    * `gr-glyph`: a LARGE TYPOGRAPHIC MARK — a display-face numeral bleeding
      off the start corner, outlined heavily enough to READ. The outline is
      load-bearing: a FILLED numeral covers every cell inside it and measured
      12.7% of device share as pure decoration.

  ── 2026-09-11 (third pass): WHY THE DIAGONAL FIELD LIVES ONLY HERE ──

  Six of the eight bundled archetypes carried this same 45-degree hairline
  field, so a carousel read as one wallpaper with different words on it. That
  is the owner's second complaint verbatim ("בנוסף בגלל שזה חזרתי זה נראה AI")
  — repetition is what reads as machine-made — and it is the half of the
  complaint the first visual pass did not answer: the set had traded "mostly
  grey" for "mostly striped".

  Every archetype now spends a different MARK, and each file's own ground note
  names it: a horizontal screen on the cover's colour plate, a dot screen and
  a column ruling on `slide.html`, a ruled data slab on `stat-callout`, an
  untextured card under a giant quotation mark on `quote-card`, a rule system
  on `list-takeaway`, two contrasting plates on `comparison-card`, a stack of
  architectural bands on `closer`. The diagonal field stays HERE because this
  is the one archetype with nothing on the plate but the statement: it is the
  only one whose ground has to carry the whole frame on its own, and a
  45-degree field is the densest mark in the set's vocabulary.

  WHY A MARK AT ALL, on every one of them, rather than clean ground or a flat
  colour: the measurement has no state between "invisible" and "a drawn
  device". A uniform tone either sits under the 18-unit ink line, where no
  pixel is ink and the cell's mean has not left the ground, so the cell counts
  as UNOCCUPIED — or it clears it, and then all 64 samples are ink, the cell
  is COVERED, and it counts as a drawn device. Only a PARTIAL-coverage mark
  can occupy a region without becoming one. That is the real reason the whole
  directory reached for hairlines, and it is why the honest variety is in the
  mark's SHAPE — rules, dots, dashes, a glyph's outline — and not in removing
  the mark.

  Which variant a slide paints comes from `slides-data.ts`'s existing seeded
  low-discrepancy walk (`isVariationSlot`) under its own `:ground` namespace
  — deterministic within a run, phase-shifted across runs, no new randomness
  mechanism. The grid variant is the CSS default so that a checkpoint written
  before `{{groundStyle}}` existed (where the class token strips to a bare
  "gr-") still paints a ground rather than reverting to the bare plate.

  ── Why every decoration is a BACKGROUND LAYER and never a positioned box ──

  The previous revision drew its accent rule as an absolutely positioned
  `<div>` at `inset-inline-end: -80px`, rotated. A positioned child that
  leaves its parent's padding box makes that parent report `scrollWidth >
  clientWidth`, which is precisely what the renderer's DOM probe calls an
  overflowing element — and clause B of the interest floor fails a slide on
  `probe.overflow` alone, whatever the pixels say. Every `headline_focus` and
  every `closer` therefore carried a `clipped` finding on every attempt for a
  decoration nobody could see. Background layers cannot overflow anything, so
  all ground geometry is painted as `background-image` layers on two boxes:
  `.ground` (full bleed, tonal only) and `.ground-art` (inset 16px, the layers
  that carry real ink).

  The 16px inset on `.ground-art` is load-bearing for the same family of
  reasons: `clippedEdgeShare` counts ink inside an 8px bleed band and fails a
  slide over 0.4%, and a full-bleed texture measured 0.5%. `.ground`'s wash
  stays below the ink threshold at every stop, so it may bleed.

  See `stat-callout.html`'s header for why the token block is duplicated.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    /* THE WASH TONE, and it is a mix rather than the accent itself.
       A ground wash has to land in the measurement's 12-18 band — visible
       tone that is not a mark — for EVERY accent the palette walk admits,
       and the accent alone cannot do that. The only gate on --accent is
       ACCENT_GROUND_CONTRAST_FLOOR = 3 against the ground, so a dark accent
       sits ~92 units from the bundled ground and a pale one ~159: the same
       14% alpha that measures 12.9 on the first measures 22.3 on the second,
       which is INK. Rendered with a pale kit every template in this
       directory then put ink in the 8px bleed band (clippedEdgeShare 0.5-0.7%
       against a 0.4% ceiling) and counted its own wash as content.
       Mixing the accent halfway into the foreground compresses that spread:
       the mix is ~170 units from the ground on a dark accent and ~195 on a
       pale one, so 8% of it is 13.6 and 15.6 — inside the band on both, with
       the accent's hue still in it. */
    --wash: color-mix(in srgb, var(--accent) 45%, var(--fg));
    --accent-ink: #141414;
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --mx: 64px;
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2): a discrete type-scale multiplier
     and logical text alignment, applied per slide via body classes. Classes,
     never a {{fontScale}} CSS var: a stripped placeholder degrades to a
     harmless "ts-" class token, whereas an EMPTY-but-defined custom property
     substitutes as empty (not the var() fallback) and would invalidate every
     font-size on an older checkpointed slides-data re-rendered post-deploy. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--f-body);
    display: flex; flex-direction: column;
    padding: 104px var(--mx) 112px;
  }

  /* ── L1: THE GROUND. IT IS THE MATERIAL'S MOUNT POINT AND IT PAINTS
        NOTHING OF ITS OWN. ──

     This div used to carry a two-layer tonal wash — a radial in the start
     corner plus a 196-degree linear — both placed inside the measurement's
     12-18 band, i.e. visible tone that is not ink. The reasoning was sound on
     the three shares it named (the wash contributed nothing to `inkShare`,
     `occupiedShare` or `clippedEdgeShare`) and it missed a fourth thing the
     wash does contribute to, which turns out to be the one that matters most:

     ── 2026-09-14, RFC-20 P2: A GRADED WASH MOVES `backgroundHex`, AND
        `backgroundHex` IS THE ANCHOR EVERY OTHER SHARE IS MEASURED FROM. ──

     `slide-metrics.ts` takes the slide's ground to be the MODAL 5-bit bin
     over the plate's low-variance cells (`:664-733`). A flat ground is one
     bin and wins that vote outright. A GRADED wash spreads the same pixels
     across several bins, and this file's pair — a radial covering the start
     corner and a linear covering the far end — left very little of the plate
     at the untinted `--bg` at all. The modal bin was therefore small, and the
     moment a real drawn object appeared it took the vote.

     Measured on this tree through real Chromium (`measureSlidePng`, 1080x1440
     @2, msedge channel), with the wash present and the new `.hf-plate`:

       composed   backgroundHex #323235  <- THE PLINTH'S OWN FILL
                  iod 38.84   flat 33.99   clippedEdgeShare 1.37%
       grey       backgroundHex #323235
                  iod 47.86   flat 25.70   clippedEdgeShare 1.37%

     Every number there is wrong, and wrong in a direction no clause would
     catch as a ground defect. With the plate's real ground re-labelled as
     "ink", the ENTIRE UNPAINTED GROUND became a covered flat low-colour
     region — a drawn device — and `clippedEdgeShare` read 1.37% against a
     0.4% ceiling, so clause B would have failed every composed statement
     slide this archetype ships, for ink that is not there.

     With the wash gone the same two plates report a `backgroundHex` equal to
     `--bg` exactly, and `clippedEdgeShare` 0.00%. (The token is not spelled
     out here: `slide-devices-rtl.test.ts` strips the `:root` block and then
     refuses the ground and foreground literals anywhere else in the sheet,
     comments included, so that no rule can quietly hard-code a kit's colours.)

     This is the same failure RFC-20 §5.1 names when it specifies the material
     ground: two OPPOSED tooth layers, "so the modal cell colour does not
     drift and `backgroundHex` cannot flip — the failure that invalidated
     every grain-sweep row". A one-sided wash is not symmetric about the
     ground, so it drifts the mode by construction. Under the Ground Rule it
     is neither MATERIAL (it does not contribute zero to every share — it
     moves the anchor of all of them) nor AN OBJECT (it is full-bleed and
     bound to no content). It is the "nothing in between" the rule forbids.

     WHAT REPLACES IT is `ground-material.ts`'s turbulence material, spliced
     onto `.ground::after` through `extraHeadHtml` at materialisation time.
     That layer is bounded below `FLAT_TOL` and symmetric by construction, so
     it is visible tone that moves no measurement — which is what this wash
     was always trying to be. The div stays, unpainted, as its mount point,
     and a template with no sheet spliced into it renders a clean ground,
     which is a correct plate rather than a broken one.

     THE COST, STATED RATHER THAN HIDDEN: the wash was what took
     `flatBackgroundShare` from ~0.88 to under clause D's 0.70 ceiling, so
     removing it RE-ARMS that limb on this archetype. That is a strengthening
     and not a regression — clause D is a conjunction (flat AND idle) and a
     composed plate is not idle. Measured on this tree, composed plates land
     at 57.15-67.25% flat across s/m/l x ltr/rtl, all clear of the ceiling;
     the grey screen lands at 72.09% flat, over it, and is refused by clause C
     at `largestEmptyRectShare` 35.00% before clause D is even reached.
     RFC-20 Part 8 item 4 records the wash as a defect this phase would not
     fix; the plinth made it one this phase cannot ship around. */
  .ground { position: absolute; inset: 0; z-index: 0; }

  /* ── L2: the texture and the accent geometry, ON THE STATEMENT FIELD. ──

     This used to be two full-bleed `<div>`s inset 16px, and that was the
     defect this revision exists to remove. A texture that paints ink in every
     cell of the plate makes `occupiedShare` and `largestEmptyRectShare`
     constants: measured through `measureSlidePng` over real Chromium, this
     file's previous revision reported the SAME 1.5% largest empty rectangle
     with the full copy on it and with every slot empty (the 16px left gutter,
     the one strip the inset did not paint), and 43.3% occupied on a plate
     carrying nothing at all. Clause C of the interest floor — the one the
     metric's own module header calls "the metric that names the complaint" —
     could not fire on any plate this directory produced.

     So the standing rule stated in `cover.html`'s header applies here:
     **tone may paint anywhere, ink only inside a region the composition
     occupies, and only when the content that justifies it is present.**
     `.copy` is that region — the statement's field — and the texture and the
     accent geometry are ITS background, switched off entirely when there is
     no statement. An empty plate now measures 3% occupied and fails clauses
     D and G on the pixels alone, and a plate whose middle is hollow reports
     the hole.

     ── 2026-09-14, RFC-20 P2: THE 45-DEGREE SCREEN IS DELETED. ──

     The texture above was 2px rules every 9px at 22% of the foreground, and
     the note it replaces argued — correctly, on its own instrument — that a
     2px rule can never cover 48 of a cell's 64 samples, so the screen was a
     texture and not a device. That is true and it was the wrong question.
     `occupiedShare` and `contentOccupiedShare` do not ask whether a cell is
     COVERED; they ask whether it carries ink OR whether its MEAN has left the
     ground (`slide-metrics.ts:896-919`). A 22% hatch on a 9px pitch moves the
     mean of the cells it crosses past `tol.ink` on the high-duty phases, so
     the screen counted as content over most of the field.

     Measured on this tree through real Chromium (`measureSlidePng`, 1080x1440
     @2, msedge channel), the shipped plate:

       headline_focus, ONE SHORT HEADLINE ("the grey screen")  occ 50.70  LER 8.89
       headline_focus, composed (kicker + statement + body)    occ 52.33  LER 8.85

     1.6 points of occupancy and 0.04 points of empty rectangle between the
     owner's own complaint and a fully composed plate, and BOTH PASS clauses C
     and D. RFC-20 §5.4 calls that this phase's acceptance condition, and it
     is reproduced here on the real template rather than on a synthetic one.
     A bar that cannot refuse the thing it was built for is worthless, and the
     screen is what disarmed it.

     So THE GROUND RULE (RFC-20 §5.0) applies, and it is absolute: every
     painted layer is either MATERIAL — below the measurement's flat tolerance,
     contributing zero to every share — or AN OBJECT, bounded, its extent a
     function of the CONTENT and never of the leftover space, and switched off
     by a `body:has()` guard when that content is absent. Nothing in between.
     No full-bleed layer may carry ink. The screen was neither: it was ink
     sized by the elastic field, i.e. by whatever the copy failed to use.

     What replaces it is `.hf-plate`, the PLINTH — see its own block below. It
     is not decoration swapped for decoration: a plinth that hugs its copy is
     the mechanism that converts how much was written into measurable area,
     which is the only reason a clause-D floor can separate a composed plate
     from a neglected one at all.

     ── AND THE TWO ACCENT BANDS GO WITH IT, WHICH IS THE PART THAT HAD TO BE
        MEASURED RATHER THAN ARGUED. ──

     The first attempt at this change deleted only the hatch and kept the
     accent geometry — two 45-degree band, 3px rules every 46px, 300px across
     the field's head and 200px across its foot. They are small, they carry
     almost no area, and they looked like exactly the kind of bounded object
     the Ground Rule admits. They are not, and the reason is the second half
     of the rule rather than the first: THEIR EXTENT IS A FUNCTION OF THE
     LEFTOVER SPACE. `.hf-field` is `flex: 1 1 auto`, so the band at
     `0 100%` is anchored wherever the copy stopped, and the pair of them
     between them straddle whatever gap a short statement leaves.

     Measured on this tree through real Chromium, `largestEmptyRectShare` on
     the owner's grey screen (one short headline and nothing else), against a
     0.28 interior ceiling:

       screen deleted, accent bands kept       10.20%   <- clause C still PASSES
       screen deleted, accent bands deleted    35.00%   <- clause C FIRES

     and the composed plate over the same pair, 6.79% against 16.11%, which
     still passes. The bands were doing precisely what the hatch was doing —
     breaking up a hole so no clause could see it — at a twentieth of the ink.
     That is the whole defect in miniature, and the acceptance condition for
     this phase is that the floor refuses the owner's grey screen. It does not
     while they are on the plate. So `.copy-art` is gone from this file
     entirely, class and rules: an archetype whose ground paints nothing is
     not a deficiency here, it is the Ground Rule's (a) case.

     WHAT CARRIES THE ACCENT NOW, all of it bounded and content-guarded, and
     none of it able to hide a hole: `.hf-rail` under the kicker,
     `.stat-band` under the statement, `.body-text`'s accent border, and on
     the `gr-glyph` variant the outlined display numeral. */

  /* ── THE ALTERNATIVE GROUND: A LARGE TYPOGRAPHIC MARK UNDER AN ACCENT CAP. ──

     ── 2026-09-14, RFC-20 P2: THE DASH SCREEN IS DELETED TOO. ──

     This variant carried a field of short horizontal DASHES (a 10x2.6px tick
     on a 17x7 tile at 22% of the foreground) under a solid accent rule. The
     dash screen is the same defect as the grid variant's 45-degree hatch
     wearing a different shape, and deleting one without the other would have
     left it alive on half the slides this archetype ships: a screen is ink
     whose extent is the leftover space, `occupiedShare` counts a cell whose
     MEAN has left the ground and not only a COVERED one, and the whole
     argument the previous note made (that a 2.6px dash cannot cover 48 of 64
     samples, so it is "a texture and not a device") answers a question the
     emptiness clauses never asked. The Ground Rule is in the `.copy-art`
     block above with the measurement.

     Two measured facts from that note are kept because they remain true and a
     future revision will need them:

       * A MARK IS NOT A FUNCTION OF `--ts`. A measurement cell is 4 DESIGN px
         and does not scale, so a length written `calc(Npx * var(--ts))` moves
         the measurement: at `l` a 2.6px dash became 3.07px and, where it
         crossed a glyph stem, the two SUMMED past the 48-of-64 coverage that
         makes a cell a drawn device. `imageryOrDeviceShare` with LONG copy
         went 5.7 / 7.0 / 11.1% across s/m/l as it was, against a 10% floor
         this archetype must stay UNDER, and 5.2 / 6.9 / 7.1% de-scaled. The
         numeral below still scales, deliberately, and its own note says why.
       * THE OUTLINE ON THE NUMERAL IS NOT A STYLE CHOICE. A FILLED numeral is
         a filled SHAPE: at 9% of the foreground its interior sits 19 units
         off the ground, past the ink line, so every cell inside it counts as
         a covered low-colour cell — a drawn device — and this plate measured
         12.7% of device share from a decoration nobody had counted.

     ── AND ONE CLAIM THAT USED TO BE HERE IS NOW FALSE. READ THIS BEFORE
        TOUCHING `interest-floor-calibration.test.ts`. ──

     This block used to state, and the file header still stated one revision
     ago, that "a `headline_focus` judged at the cover role must report
     `no-device`" — the archetype's editorial identity, pinned by the
     calibration sweep. THE PLINTH ENDS THAT. A filled card behind the
     statement is a covered, flat, low-colour region and the instrument calls
     it what it is. Measured on this tree through real Chromium:

       headline_focus, composed, plinth on   imageryOrDeviceShare  38.51%
       headline_focus, grey screen           imageryOrDeviceShare  27.73%

     against an `IMAGERY_OR_DEVICE_FLOOR` of 0.10. This archetype now CARRIES
     a device, at every copy length, deliberately.

     That is RFC-20 §5.4's consequence 1 stated from the other side — "the
     plinth answers clause D's occupancy AND clause E's device floor with one
     object" — and it is the reason §5.6 leaves `IMAGERY_OR_DEVICE_FLOOR` at
     0.10 rather than re-calibrating it. It is a real change of identity and
     not a measurement artefact: the plate genuinely has a drawn thing on it
     now, which is what the reference pixels do (`rf-05` carries one bounded
     object and nothing else) and what "one quiet all-type turn" never did.
     The calibration test's `no-device` expectation for this archetype is
     therefore superseded by RFC-20 and must be re-stated, not worked around
     by shrinking the plinth.

     What is left of the glyph variant is its real subject: the giant outlined
     numeral, and nothing behind it. The two grounds differ in whether a
     numeral is present, which was always the part a reader could tell apart —
     the screens underneath them were the part that made every plate in the
     set read as one wallpaper. The `gr-glyph` accent cap rule went with
     `.copy-art`; the accent on both variants is now `.hf-rail`,
     `.stat-band` and `.body-text`'s border, all bounded and all guarded. */
  .ground-glyph { display: none; }
  /* Furniture, but furniture that paints ink, so it answers to the same rule:
     a plate with no statement on it paints no numeral either. */
  body:not(:has(#headline > span:not(:empty))) .ground-glyph { display: none !important; }
  /* THE NUMERAL STILL SCALES WITH `--ts`, and that is deliberate even though
     the dash tile beside it no longer does. The two are different kinds of
     thing: the tile is a screen whose duty cycle has to stay put against a
     fixed 4px measurement cell, while this is a GLYPH — it is set in the
     display face, it is the one mark on the plate a reader reads as a
     character, and `default-template-render.test.ts` pins the rule that every
     `font-size` in this directory scales off `var(--ts)` so the reviewer's
     type control never leaves one size behind. It was briefly fixed in px
     during this pass on the theory that `l` cropped it into unreadable
     curves; re-rendered with the dash screen at its new density the `l` plate
     reads the numeral perfectly well, so the crop was never the cause — the
     screen's density was. Measured, the numeral costs 0.7 points of
     imagery-or-device at `l`, well inside the floor's headroom. */
  body.gr-glyph .ground-glyph {
    display: block; position: absolute; z-index: 0;
    inset-block-start: calc(-210px * var(--ts, 1)); inset-inline-start: calc(-18px * var(--ts, 1));
    font-family: var(--f-display); font-weight: 600; font-size: calc(720px * var(--ts, 1));
    line-height: 1; letter-spacing: -0.04em; padding-block-end: 0.2em;
    /* OUTLINE ONLY, and that is the whole trick. A filled numeral is a filled
       SHAPE: at 9% of the foreground its interior sits 19 units off the
       ground, past the ink line, so every cell inside the glyph counts as a
       covered low-colour cell — a drawn device — and this plate measured
       12.7% of device share from a decoration. Dropping the fill entirely and
       spending the budget on stroke CONTRAST instead (4px at 52%, against the
       previous 3px at 26%) gives a numeral a reader can actually see while
       the pixels inside it stay ground. */
    color: transparent;
    -webkit-text-stroke: 4px color-mix(in srgb, var(--fg) 52%, transparent);
  }

  /* ── The composition. Three parts down the plate, not one block at the
        bottom: this is what fills the frame, and it is the half of the fix
        that decoration cannot do. ── */
  .hf-top { position: relative; z-index: 4; flex: 0 0 auto; }
  /* The statement is anchored to the FOOT of the elastic middle rather than
     optically centred in it. Centring left a 500px band of nothing between
     the accent band and the body — the same hole this archetype is being
     rebuilt to close, moved down the plate. Anchored, the breathing room all
     collects at the top, where the accent geometry is, and the reading order
     (kicker -> statement -> evidence) is one continuous block. */
  /* The field runs the full measure inside the 16px frame — wider than the
     body's own 64px margin, which is what makes it read as a field rather
     than as a highlighted paragraph. The negative inline margin and the
     matching inline padding cancel, so no glyph moves. 16px and not 0,
     because `clippedEdgeShare` counts ink inside an 8px bleed band and fails
     a slide over 0.4%.
     It holds the statement AND the evidence under it, so the region the
     texture marks is the whole of what the reader reads — which is what
     `largestEmptyRectShare` is supposed to be measuring the complement of. */
  .hf-field {
    position: relative; z-index: 4; flex: 1 1 auto; min-block-size: 0;
    display: flex; flex-direction: column; justify-content: center;
    margin-inline: calc(16px - var(--mx)); padding-inline: calc(var(--mx) - 16px);
    margin-block-start: calc(30px * var(--ts, 1));
    /* NO BLOCK PADDING. It existed to keep the copy off the texture's top and
       bottom edges; the texture is gone and `.hf-plate` carries its own inset
       now. Keeping both put the plate 45px over its own box at `l` with the
       calibration's LONG copy — measured, `.hf-field` scrollHeight 1164
       against clientHeight 1119 — which `probePage` reports and clause B
       fails. Two nested paddings for one job is how that happens. */
    padding-block: 0;
  }
  /* THE STATEMENT BLOCK NEVER SHRINKS BELOW ITS OWN CONTENT, and that is a
     correctness rule rather than a taste one.

     It used to read `flex: 0 1 auto; min-block-size: 0; justify-content:
     flex-end`. Those three together are a trap: when the copy runs past the
     field the flex algorithm is free to shrink this box under its content,
     and `flex-end` then spills the excess out of the BLOCK-START edge. At
     `l` with the calibration's 90-character statement the headline rendered
     155px ABOVE its own parent and printed over the kicker rail — two type
     blocks on top of each other, with the hairline running through the
     glyphs — and every instrument in the tree called the plate clean,
     because `scrollHeight` counts content below the padding box and never
     content above it. (That blindness is now closed at the source: see the
     block-start limb in `probePage`, `render-carousel.ts`.)

     At `flex: 0 0 auto` the box is exactly its content. Any residual
     overflow is then pushed out of `.hf-field`, which is centred, so it
     spills in BOTH directions and the DOM probe's `scrollHeight` limb sees
     it and fails clause B. Overflow that cannot be designed away must at
     least be visible. */
  .copy { flex: 0 0 auto; display: flex; flex-direction: column; }
  /* ── THE PLINTH (RFC-20 §5.3). THE ONE FILLED OBJECT ON THIS PLATE, AND IT
        IS NOT DECORATION. ──

     The screen this file used to wear is gone (see `.copy-art`). What takes
     its place is a bounded filled card behind the statement, and the reason
     it is here is measured rather than aesthetic.

     RFC-20 §5.4's strongest single measurement is that `occupiedShare` ON
     TYPE ALONE cannot separate a short populated plate from a neglected one —
     6.74 against 6.69. Type is glyphs on a ground: the area it occupies is a
     function of how many letters there are and almost nothing else, and two
     plates a reader would describe completely differently land within five
     hundredths of a point. A floor on bare type is hopeless, which is why
     every previous pass reached for a ground that painted regardless.

     A plinth that HUGS ITS COPY converts copy volume into covered area. The
     more the statement says, the taller and wider the card behind it, and the
     bands separate: 26.20% occupied for a composed plate against 3.11% for
     the owner's grey screen carrying its own guard-ON plinth.

     THE THREE SIZING DECLARATIONS ARE THE WHOLE DESIGN, and `flex: 1 1 auto`
     here would reproduce `cover.html`'s second-pass defect verbatim — a box
     that absorbs the leftover space measures the emptiness rather than the
     content, so the LESS the slide had to say the better it would score.

       * `inline-size: fit-content` — the card is as wide as its widest line.
       * `max-inline-size: 100%` — the cap. `.hf-field`'s content box is
         already the plate's full measure (`1080 - 2 * var(--mx)`, via the
         cancelling negative margin and padding above), so `100%` HERE is
         RFC-20's `calc(100% - 2*var(--mx))` OF THE PLATE, expressed against
         the box this element actually lives in. Written the other way it
         would take a further 128px off a measure that is already inset and
         reflow every statement in the set.
       * `block-size: fit-content` + `align-self: start` — it is exactly as
         tall as its content and it hugs the inline-start edge; it can never
         stretch to the field.

     THE FILL IS `--fg` AT 12% MIXED INTO `--bg`, NOT INTO `transparent`, and
     the difference is the whole point. 12% of the bundled ground's 215.4-unit
     foreground-to-ground distance is 25.8 units: clear of the 18-unit ink
     line with margin for anti-aliasing, so every cell inside it is COVERED,
     and with a single flat colour `distinct <= 3` holds, so it lands in the
     `graphic` bucket and reads to the instrument as the drawn device it
     visually is. Mixed into `transparent` instead it would be a translucent
     film whose measured distance depended on whatever it happened to be lying
     over — which is how a "tone" becomes ink on a pale kit, the failure the
     `--wash` token block at the top of this file records.

     LOGICAL PROPERTIES THROUGHOUT and no `deg` anywhere in the fill, so the
     card mirrors under `dir="rtl"` with no RTL branch: `align-self: start`,
     `inline-size`, `padding-inline`. A `deg` angle does not mirror under
     `dir` the way logical properties do — that is why `--mk-ink-angle` exists
     in the shared mark sheet — so the fill is deliberately a flat colour and
     not a gradient. */
  .hf-plate {
    inline-size: fit-content;
    max-inline-size: 100%;
    block-size: fit-content;
    align-self: start;
    padding-inline: 44px;
    padding-block: 48px;
    /* ── THE FILL IS A 10-15% SHADE ACROSS THE CARD, NOT A FLAT 12%, AND THE
          REASON IS THE INSTRUMENT RATHER THAN THE EYE. ──
       RFC-20 §5.3 specifies `color-mix(in srgb, var(--fg) 12%, var(--bg))`.
       Shipped flat, that is a single 5-bit bin covering a third to a half of
       the plate — and `slide-metrics.ts` takes `backgroundHex` to be the MODAL
       bin over the plate's low-variance cells (`:664-733`), so on long copy
       the CARD wins that vote and becomes the measured "ground". Measured on
       this tree through real Chromium over the calibration's six fixtures x
       three type scales, with a flat fill: 3 of 18 `slide.html` rows and 2 of
       18 `closer.html` rows came back with `backgroundHex` set to the card,
       and on those rows the plate's real ground was re-labelled ink and
       `clippedEdgeShare` read 2.58% against a 0.4% ceiling — clause B failing
       on ink that is not there. With the shade: 0 of 18 on every archetype and
       `clippedEdgeShare` 0.00% everywhere.

       Two stops five points apart split the card's mass across bins while
       changing nothing else: 10% of the bundled foreground-to-ground distance
       is 21.5 units and 15% is 32.3, both clear of the 18-unit ink line with
       room for anti-aliasing, so every cell stays COVERED; the shade moves
       0.03 units across a 4px cell, so `distinct <= 3` holds and the card
       stays in the `graphic` bucket. Midpoint 12.5%, which is the value
       RFC-20 derived.

       `to bottom` and not a `deg`: it is the block axis, identical under
       `dir="rtl"` in a horizontal writing mode, so the card still needs no RTL
       branch. Mixed into `--bg` rather than into `transparent`, so the card's
       measured distance is a property of the kit and not of whatever it
       happens to be lying over. */
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--fg) 10%, var(--bg)) 0%,
      color-mix(in srgb, var(--fg) 15%, var(--bg)) 100%);
  }
  /* ── THE CARD'S INSET IS NOT A FUNCTION OF `--ts`, AND AT `s` IT GROWS. ──
     Two separate reasons, both measured.

     (1) `--ts` is the reviewer's control over TYPE. The card is a drawn
     object, and this directory's standing rule — stated at length beside
     `slide.html`'s dot tile and `headline-focus`'s own dash screen — is that a
     mark is not a function of the type scale. Written `calc(44px * var(--ts))`
     the inset grew 18% at `l` on a plate that did not grow, and with the
     calibration's LONG copy that was exactly the 45px this file's `.hf-field`
     was then overflowing by.

     (2) At `s` every block on the plate is 15% shorter and the air is 15%
     taller — `cover.html`'s third-pass note measured the same effect on its
     own geometry. The card is the one element that can absorb that air
     without pretending the slide said more than it did, so at `s` it takes a
     more generous inset. Measured, `largestEmptyRectShare` at `s`:

       card inset                en-short   en-medium   he-short   he-medium
       44/48 flat                  26.02      23.15       29.47      25.67
       64 inline / 96 block        23.63      20.77       27.09      23.29

     ── AN OPEN §5.6 RULE-2 FINDING, NOT AN ACCEPTED RESIDUAL. ──

     This block used to call the rows below "the residual, recorded rather than
     papered over", which reads as a decision that has been taken. It has not
     been. `interest-floor-calibration.test.ts:631` and `:801` assert ZERO
     findings at `CALIBRATION_MARGIN`, those assertions are unchanged, and
     these rows are **RED in CI**. Recording a failure in a template comment
     does not make a red assertion green, and the honest status is: RFC-20
     §5.6 decision rule 2 applies — the first remedy is the TEMPLATE, the
     constant does not move, and the work is not done. It is listed as open in
     the PR body rather than banked here.


     `interest-floor-calibration.test.ts` does not assert the ceiling, it
     asserts the ceiling WITH `CALIBRATION_MARGIN = 0.08` — so a bundled
     archetype has to measure `largestEmptyRectShare` <= 0.20 at the interior
     role, not <= 0.28. Measured here over the calibration's own six fixtures
     x three type scales (real Chromium, msedge channel), with everything in
     this file as it now stands:

       worst 23.77 (he-short/s); over 0.20 on en-short/s 23.63, en-short/m
       23.35, he-short/s 23.77, he-short/m 23.72, he-short/l 20.46,
       he-medium/s 23.29, he-medium/m 23.02. Every other row is 9.38-19.25.
       Nothing anywhere is over the 0.28 CEILING, and no plate overflows.

     Before this phase the same rows all measured 5.9-10.2 and passed — on the
     hatch, which painted the hole rather than filling it. These numbers are
     the first honest ones this archetype has produced, and the residual is
     real: a 24-character statement and a 44-character body on a 1080x1440
     plate genuinely leave a quarter of the frame empty at the small type
     scale, and no amount of card inset changes that. THE REMEDY IS
     COMPOSITION, NOT A LOWER BAR — RFC-20 §5.5's `dead-space` limb, which is
     the relayout half of this phase and lands in the same PR. What must not
     happen is `CALIBRATION_MARGIN` being reduced to admit these rows; that is
     the exact move RFC-20 exists to refuse. */
  body.ts-s .hf-plate { padding-inline: 64px; padding-block: 96px; }
  /* ── THE GUARD ASKS FOR THE BODY, NOT JUST THE HEADLINE, AND THAT IS THE
        WHOLE OF THIS PHASE'S ACCEPTANCE CONDITION. ──

     The form is the one this directory has used since `cover.html`'s second
     pass, asked of the TWIN'S CHILDREN rather than of the host: `.hf-headline`
     and `.body-text` are twin-slot pairs (see the twin-slot block below) and so
     have two element children on every render, which means `#headline:empty`
     would be permanently false and a guard written that way permanently
     silent. An empty plate would then acquire a filled card — ink with no
     content to justify it, which is precisely what RFC-20 guard G2 refuses.

     WHAT CHANGED, AND WHY IT IS A BUG FIX RATHER THAN A TIGHTENING OF TASTE.
     The guard used to read `:has(#headline > span:not(:empty))` — it painted
     the card whenever a headline existed. But the plinth's ENTIRE
     justification (RFC-20 §5.3) is that it "converts copy VOLUME into
     measurable area", and a plate carrying a headline and nothing else has no
     volume to convert. On that plate the card is not a plinth; it is a painted
     field whose extent is set by the type size, which is the Ground Rule's
     case (b) failing its own second clause: *its extent a function of the
     CONTENT and never of the leftover space*.

     MEASURED-EDGE, the real pipeline (`createRenderCarousel({probe,measure})`
     -> `measureSlidePng`) with all four production head sheets including the
     ground material, both ground variants x three type scales. GREY is the
     owner's own complaint reduced to a fixture and is exactly the plate
     `interest-floor-calibration.test.ts`'s G1 builds: one short headline, no
     kicker, no body, no device.

                              occ            flat           LER            iod
       GREY, guard on head    0.2791-0.3004  0.7103-0.7221  0.3500         0.2763-0.3152
       GREY, guard on body    0.0285-0.0746  0.9463-0.9790  0.3611-0.4056  0.0166-0.0412
       composed, short copy   0.2928-0.3545  0.6646-0.7163  0.2222-0.2778  0.2739-0.3199

     Read the first two rows against the third. **With the guard on the
     headline the grey screen is indistinguishable from a composed plate on
     every metric the floor owns** — occ 0.2791-0.3004 against 0.2928-0.3545,
     `iod` 0.2763-0.3152 against 0.2739-0.3199. It was refused, but by clause C
     alone and on a 1.2-point margin, and at the cover role it **passed clause
     E**: the owner's grey screen was reporting that it carried a drawn device.
     That is defect 1 rebuilt out of the object that was supposed to close it.

     With the guard on the body the same plate measures `LER` 0.3611-0.4056
     (clause C fires), `flat` 0.9463-0.9790 with `occ` 0.0285-0.0746 (clause D
     fires) and `iod` 0.0166-0.0412 (clause E fires at the cover role).
     **Refused by three independent clauses, decorated and bare, at s, m and l,
     on both grounds.**

     AND IT COSTS NOTHING, which is the part that had to be measured rather
     than hoped for. A composed plate keeps its card — the short-copy row is
     unchanged to 4 dp either way — so there are ZERO new false refusals, and a
     false refusal here would cost a $0.181 drafting attempt out of three
     against $0.0017 of headroom. **No threshold moved to achieve any of this.**

     It is also what turns `OCCUPIED_SHARE_FLOOR.interior` from a coincidence
     into a band: the flat-gated interior gap goes from 0.0117 wide to 0.2375
     wide, and that constant's doc comment carries both readings.

     `.body-text` rather than `.hf-foot`: the foot is a layout box that exists
     on every render, so asking it would be asking nothing. */
  body:not(:has(#headline > span:not(:empty))) .hf-plate,
  body:not(:has(.body-text > span:not(:empty))) .hf-plate { background: none; }
  .hf-foot { flex: 0 0 auto; margin-block-start: calc(46px * var(--ts, 1)); }

  /* An optional number device sits above the statement, inside the elastic
     middle, so it grows away from the headline rather than pushing it off the
     plate. Any archetype may carry a `device` (item M.4); this is the one
     bundled typographic archetype that renders it. */
  .hf-device { margin-block-end: calc(44px * var(--ts, 1)); }
  .hf-device:empty { display: none; }

  .kicker {
    font-family: var(--f-mono); font-weight: 600; font-size: calc(24px * var(--ts, 1));
    letter-spacing: 0.24em; text-transform: uppercase;
    color: color-mix(in srgb, var(--fg) 88%, transparent);
  }
  .kicker:empty { display: none; }
  /* The rail under the kicker runs the full measure — it is what tells the
     reader the plate has a top edge, and it is the element that stops the
     upper third reading as a hole. A 3px rule covers no cell, so it is
     geometry the reader sees and the device floor does not. */
  .hf-rail { block-size: 2px; background: color-mix(in srgb, var(--fg) 48%, transparent); margin-block-start: calc(26px * var(--ts, 1)); }
  /* ── THE FURNITURE ANSWERS TO THE GROUND RULE TOO (RFC-20 P2). ──
     `.hf-rail` is a full-measure 2px rule at 48% of the foreground — 103
     units off the ground, so every cell row it crosses is ink and OCCUPIED —
     and `.stat-band` is a 200x14 accent block. Both used to paint on every
     render, including one with nothing on it.

     Neither is large, and that is why this went unnoticed for six phases:
     measured on this tree through real Chromium, a `headline_focus` with
     EVERY SLOT EMPTY reported `occupiedShare` 0.45% — trivial — and
     `largestEmptyRectShare` 68.63%, because a full-width rule across the top
     and an accent block in the middle CUT THE EMPTY RECTANGLE INTO PIECES.
     `largestEmptyRect` is one contiguous rectangle, so a 2px hairline costs it
     a third of the plate. An empty plate measured as though a third of it
     were composed, on 0.45% of ink.

     A rule under a kicker that is not there is not a rule and an accent mark
     after a statement that is not there is not punctuation; both are ink an
     empty plate acquired. Guarded, the same render measures `occupiedShare`
     0.00% and `largestEmptyRectShare` 100.00%, which is what RFC-20 guard G2
     asserts for every archetype at every role. */
  body:not(:has(.kicker:not(:empty))) .hf-rail { display: none; }
  body:not(:has(#headline > span:not(:empty))) .stat-band { display: none; }

  .hf-headline {
    /* Weight 500, not 600. A 118px Fraunces at 600 has stems thick enough to
       COVER whole measurement cells, and a covered low-colour cell is what
       the instrument calls a drawn device — at 600 this plate measured 3.9%
       of drawn device from its typography alone, over the cover role's 3%
       floor, which would have made an all-type statement slide look to the
       floor exactly like a cover carrying a figure. At 500 it measures well
       under, and Fraunces at 500/118px is not a quieter headline; it is a
       better-drawn one. */
    font-family: var(--f-display); font-weight: 500; font-size: calc(124px * var(--ts, 1));
    line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance;
    /* Not cosmetic. A display face's glyph box is taller than a sub-1.15
       line box, so the block reports `scrollHeight > clientHeight` and the
       renderer's DOM probe calls it an overflowing element — which fails
       clause B of the interest floor on a slide that fits perfectly. The
       padding is in `em` so it tracks every size step and every per-script
       type scale. */
    padding-block-end: 0.22em;
  }
  /* The ladder steps UP from the previous revision (112/92/76). A statement
     slide is the one plate in the set with nothing on it but the statement,
     and at the old sizes a 63-character headline filled 380px of a 1110px
     field: the type had to carry the frame and it was not big enough to.
     It also gained a FOURTH step, `micro`: three steps bottomed out at 86px
     and there was nothing under it, so past ~100 characters the block simply
     grew until it left the plate. */
  .hf-headline.small { font-size: calc(104px * var(--ts, 1)); line-height: 1.08; }
  .hf-headline.tiny { font-size: calc(86px * var(--ts, 1)); line-height: 1.12; }
  .hf-headline.micro { font-size: calc(68px * var(--ts, 1)); line-height: 1.16; }
  /* ── A FIFTH STEP, AND ONLY `l` EVER REACHES IT (RFC-20 P2). ──
     `micro` was the floor, and at `l` a long statement set at 68 x 1.18 = 80px
     over the plinth's narrowed measure took SIX lines and put the composition
     41px outside `.hf-field` — measured, scrollHeight 1160 against clientHeight
     1119, which `probePage` reports and clause B fails on. The plinth's inset
     is what the plate no longer had room for, and the honest place to find it
     is the same one the other four steps come from: the statement is sized to
     what fits. This is the fourth time a ladder in this directory has grown a
     bottom step for exactly this reason; see `cover.html`'s `huge` for the one
     that grew upward instead. */
  .hf-headline.nano { font-size: calc(58px * var(--ts, 1)); line-height: 1.2; }

  /* The accent band under the statement. 200x14 rather than the set's
     standing 132x12: on a 1080px plate the smaller bar reads as a detail
     rather than as punctuation, and 14px is still a rule — it covers three
     and a half of the measurement's 4px cell rows, which is under the
     coverage a drawn device needs. */
  .stat-band {
    inline-size: calc(200px * var(--ts, 1)); block-size: calc(14px * var(--ts, 1));
    background: var(--accent); margin-block-start: calc(36px * var(--ts, 1));
  }

  .body-text {
    font-family: var(--f-body); font-weight: 400; font-size: calc(33px * var(--ts, 1)); line-height: 1.55;
    color: color-mix(in srgb, var(--fg) 92%, transparent); max-inline-size: 900px; text-wrap: pretty;
    border-inline-start: calc(4px * var(--ts, 1)) solid color-mix(in srgb, var(--accent) 80%, transparent);
    padding-inline-start: calc(30px * var(--ts, 1));
  }
  .body-text:not(:has(> span:not(:empty))) { display: none; }

  /* ── TWIN SLOTS: THE MARKED COPY AND ITS PLAIN FALLBACK (RFC-17 §5.4). ──
     `cover.html`'s twin-slot block is the canonical note — why a pair rather
     than a straight swap (`fillTemplate` erases an unfilled slot, so a run
     resumed across a deploy would render an empty statement), why both twins
     stay in the DOM on every render (`probePage` counts a text-bearing LEAF,
     so wrapping one path and not the other moves `textBoxShare` and
     `fontFamiliesUsed` between two renders of the same copy), and why the two
     `#headline:empty` guards above had to be restated against the children.

     Slot names are written WITHOUT their braces throughout this file, because
     `fillTemplate` is a `replaceAll` over the literal token and a token spelled
     out in a stylesheet comment is a second substitution site — see `cover.html`'s
     canonical copy of this note for the measurement and the failure it caused.

     This file's pairs: `.hf-headline` takes `html:headlineRuns` +
     `headline`, `.body-text` takes `html:bodyRuns` + `body`.

     THE HOST IS `.hf-headline`, NOT `.headline`, and the collapse rule has to
     name the host it is actually written under — this is the one file in the
     set where the display slot carries an archetype-prefixed class. A rule
     copied from a sibling template would select nothing here and both twins
     would print, one under the other. */
  /* The twin host's block-start bleed — see `cover.html` for the measurement
     and why it is here rather than only in the shared mark sheet. */
  :has(> span.mk-plain) { padding-block-start: var(--mk-twin-bleed, .22em); }
  .hf-headline:has(.mk-runs:not(:empty)) .mk-plain { display: none; }
  .body-text:has(.mk-runs:not(:empty)) .mk-plain { display: none; }

  /* Standing brand furniture. The brand head fragment
     (`buildBrandHeadHtml`) restates both rules and lands AFTER this sheet, so
     a client with a kit keeps its own placement; these defaults exist because
     a brandless render otherwise lays the handle out in normal flow, on top
     of the copy. */
  .brand-handle {
    position: absolute; bottom: 44px; inset-inline-start: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: calc(19px * var(--ts, 1)); letter-spacing: 0.08em;
    color: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  .brand-badge {
    position: absolute; top: 56px; inset-inline-start: var(--mx); z-index: 6;
    font-family: var(--f-mono); font-weight: 600; font-size: calc(19px * var(--ts, 1));
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  /* An @handle, a URL and a #hashtag are LTR strings, and a Hebrew or Arabic
     slide lays them out inside an RTL paragraph: the leading `@` is a bidi
     NEUTRAL, so it takes the paragraph embedding level and ends up on the
     wrong side — every Hebrew slide in the tree shipped `karoslabs@`. The
     `<bdi dir="ltr">` in the markup is the fix; `dir` on the DIV would also
     have re-resolved its own `inset-inline-start` and moved the watermark to
     the other corner. The extra :has() selector is what keeps an empty slot
     hidden now that the div always has an element child. */
  .brand-badge:empty, .brand-handle:empty, .brand-handle:has(> bdi:empty) { display: none; }
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}} gr-{{groundStyle}}">
  <div class="ground" aria-hidden="true"></div>
  <span class="ground-glyph" aria-hidden="true">{{slideIndex}}</span>
  <div class="brand-badge">{{seriesBadge}}</div>
  <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
  <div class="hf-top">
    <div class="kicker">{{kicker}}</div>
    <div class="hf-rail"></div>
  </div>
  <div class="hf-field">
    <div class="copy hf-plate">
      <div class="hf-device">{{html:device}}</div>
      <div class="hf-headline" id="headline"><span class="mk-runs">{{html:headlineRuns}}</span><span class="mk-plain">{{headline}}</span></div>
      <div class="stat-band"></div>
    </div>
    <div class="hf-foot">
      <div class="body-text"><span class="mk-runs">{{html:bodyRuns}}</span><span class="mk-plain">{{body}}</span></div>
    </div>
  </div>
  <script>
    // Legacy `news-pulse` gave two breakpoints (>32 to `small`, >60 to
    // `tiny`) and nothing below them. Two things are wrong with that here.
    //
    // 1. THE LADDER HAD NO BOTTOM. Past ~100 characters the block just kept
    //    growing at 86px until it ran off the plate. Measured at `m`: a
    //    129-character statement put the headline 13px ABOVE the kicker
    //    rail. The `micro` step is the floor the ladder was missing.
    //
    // 2. THE BREAKPOINTS HAVE TO MOVE WITH THE REVIEWER'S TYPE SCALE, for
    //    the reason `quote-card.html`'s script already states: the ladder
    //    picks a size from the string's length alone, so at `l` (`--ts`
    //    1.18) every step it picks is 18% taller inside a plate that did not
    //    grow. Measured: the calibration fixture's own 90-character LONG
    //    statement with its 307-character body took the `tiny` step at both
    //    scales, fitted at `m` with 120px of clearance, and at `l` needed
    //    155px more than the field has. Shifting each threshold down by
    //    ~15% at `l` steps that statement to `micro`, which fits.
    //
    // `s` keeps the `m` thresholds: a smaller scale never overflows, and
    // stepping DOWN there would make a short statement tiny for no reason.
    //
    // The one honest cost: at `l` a long statement now sets a little SMALLER
    // than the same statement at `m` (68 x 1.18 = 80px against 86px). That
    // is the right trade — `l` is a reviewer asking for bigger type, and the
    // ladder gives it on everything that fits, but a statement printed on
    // top of its own kicker is not a bigger statement, it is a broken plate.
    //
    // THE LADDER MEASURES THE VISIBLE TWIN, NOT BOTH OF THEM — `cover.html`'s
    // script carries the full note. `textContent` reads a `display: none`
    // subtree too, so on a marked render the host holds its copy twice and a
    // naive count would take a fitting statement straight to `micro`. Zero
    // width bidi controls are stripped for the reason stated there.
    (function () {
      function mkLen(el) {
        if (el === null) return 0;
        var runs = el.querySelector(".mk-runs");
        var src = runs !== null && runs.textContent.trim() !== "" ? runs : el.querySelector(".mk-plain");
        var text = ((src === null ? el : src).textContent || "").replace(/[\u2066-\u2069\u200E\u200F]/g, "");
        return text.trim().length;
      }
      var h = document.getElementById("headline");
      var len = mkLen(h);
      var big = document.body.classList.contains("ts-l");
      // `nano` is reachable at `l` only: the plinth's inset costs the plate a
      // line's worth of room and `l` is the scale that has none to give. See
      // the `.hf-headline.nano` block for the measurement.
      if (len > (big ? 78 : 100)) h.className = big ? "hf-headline nano" : "hf-headline micro";
      else if (len > (big ? 50 : 60)) h.className = "hf-headline tiny";
      else if (len > (big ? 27 : 32)) h.className = "hf-headline small";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
