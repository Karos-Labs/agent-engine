name: Quality checks

# Reusable workflow — the single source of truth for "does this commit pass
# type-check/tests" across every workspace package. Called by deploy-prep.yml,
# which gates the prep deploy on it (same pattern as karosCMO's own
# quality.yml / deploy-prep.yml split).
on:
  workflow_call:

jobs:
  quality:
    name: Type-check · Test (all workspaces)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every package's `types`/`main` points at its own dist/ (see each
      # package.json) — a file that imports another workspace package BY
      # NAME (scripts/*.ts, and anything depending on a package other than
      # the lowest-layer @agent-engine/core) resolves that import through
      # node_modules -> the target's package.json -> dist/*.d.ts. A truly
      # fresh checkout has no dist/ anywhere yet, so typecheck/test would
      # fail on "Cannot find module" before a single real bug is found —
      # this build step is what a local dev's own already-built dist/ was
      # silently standing in for.
      - name: Build all workspace packages
        run: npm run build

      - name: TypeScript type-check
        run: npm run typecheck

      # instagram-agent's default-template-render.test.ts launches a real,
      # un-mocked Chromium against the actual production slide template
      # (agent-engine#4) — every other render-carousel test deliberately
      # stays Chromium-free, so this is the one place that needs a real
      # browser. `--with-deps` also installs the OS-level libs (fonts,
      # libnss3, ...) ubuntu-latest doesn't ship, matching the Dockerfile's
      # own runtime-stage install.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test suite (all workspaces)
        run: npm test
