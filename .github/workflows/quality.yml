name: Quality checks

# Reusable workflow — the single source of truth for "does this commit pass
# type-check/tests" across every workspace package. Called by deploy-prep.yml,
# which gates the prep deploy on it (same pattern as karosCMO's own
# quality.yml / deploy-prep.yml split).
on:
  workflow_call:

jobs:
  quality:
    name: Type-check · Test (all workspaces)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every package's `types`/`main` points at its own dist/ (see each
      # package.json) — a file that imports another workspace package BY
      # NAME (scripts/*.ts, and anything depending on a package other than
      # the lowest-layer @agent-engine/core) resolves that import through
      # node_modules -> the target's package.json -> dist/*.d.ts. A truly
      # fresh checkout has no dist/ anywhere yet, so typecheck/test would
      # fail on "Cannot find module" before a single real bug is found —
      # this build step is what a local dev's own already-built dist/ was
      # silently standing in for.
      - name: Build all workspace packages
        run: npm run build

      - name: TypeScript type-check
        run: npm run typecheck

      # AU49: fails when a variable the code reads is missing from
      # .env.example, and when the AU55 capability catalogue names a variable
      # nothing reads. Wired-but-unread only WARNS — variables are read through
      # *FromEnv factories and string arguments, so absence of evidence is not
      # evidence of absence, and no variable is ever deleted on this script's
      # say-so.
      - name: Configuration inventory
        run: npm run check:config

      # SCRUM-361: every model id named in executable source must have a price
      # row. All 27 declarations are static string literals, so this is
      # answerable before a deploy rather than after a billed run — and it has
      # to be, because DEFAULT_MODEL_PRICING is Sonnet's own rate, so an
      # unpriced id produces a PLAUSIBLE wrong number in both directions (Opus
      # understates 5x; the gemini-1.5-flash failover target this check found
      # overstated ~40x). Ids arriving at run time via MODEL_STEP_<ID>_MODEL or
      # a per-run stageModels override are outside what any static check can
      # see; those are refused by assertModelPriced at model selection.
      - name: Model pricing coverage
        run: npm run check:pricing

      # SCRUM-361c / AU68: every field the telemetry insert writes must exist as
      # a column. `ignoreUnknownValues: true` drops a missing one SILENTLY while
      # the insert still reports success — that is how `operation`, `jobId`,
      # `stepId` and `source` were discarded on every insert for months after
      # being added deliberately. Both runtime options are silent (turning the
      # flag off trades column loss for ROW loss, since the insert's catch logs
      # and swallows), so the field list is checked statically instead, where it
      # is a static fact. Advisory without a GCP credential, and it says so
      # rather than passing quietly.
      - name: BigQuery insert/schema agreement
        run: npm run check:bq-schema

      # instagram-agent's default-template-render.test.ts launches a real,
      # un-mocked Chromium against the actual production slide template
      # (agent-engine#4) — every other render-carousel test deliberately
      # stays Chromium-free, so this is the one place that needs a real
      # browser. `--with-deps` also installs the OS-level libs (fonts,
      # libnss3, ...) ubuntu-latest doesn't ship, matching the Dockerfile's
      # own runtime-stage install.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test suite (all workspaces)
        run: npm test
