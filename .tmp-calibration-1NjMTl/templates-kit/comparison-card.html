<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<title>instagram-agent comparison_card slide template</title>
<!--
  `comparison_card` — two sides set against each other (before/after,
  option A vs option B).

  Unlike the other four archetypes this is a COMPOSITION of legacy devices
  rather than a port of one legacy file, and that is worth stating plainly:
  the legacy system had no label+body two-column card. What it had was
  `verdict-ranking.html`'s ranked single-item slide (one option per slide,
  the ranking carried by slide ORDER), `_cf-devices.css`'s `.fig-chip` /
  `.bar-row` for numeric comparison, and the tiny `.ab` / `.ab.win` glyph pair.
  A true side-by-side needed building.

  What is genuinely legacy here:
  - The card treatment is `.fig-chip`'s: 1px `--line` border, 6px radius,
    `rgba(242,241,236,0.03)` fill.
  - The right-hand emphasis marker is `.ab.win::after` verbatim — a 14px
    square rotated 45deg, pinned to the corner, in the accent.
  - The `.diamond` 7px rotated square, the set's bullet.
  - The head/rows offsets and type scale follow `by-the-numbers.html`'s
    `meaning` layout so this sits in the same vertical rhythm as
    `list-takeaway.html`.

  Only the RIGHT column carries the accent border and the corner marker. That
  asymmetry is deliberate and directional: the right column is the "after" /
  the recommended option, so the slide argues rather than merely tabulating.
  A symmetric treatment would need a different marker story and is not this
  template.

  See `stat-callout.html`'s header for why the token block is duplicated.
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181C;
    --fg: #F4F2EC;
    --accent: {{accentColor}};
    /* THE WASH TONE, and it is a mix rather than the accent itself.
       A ground wash has to land in the measurement's 12-18 band — visible
       tone that is not a mark — for EVERY accent the palette walk admits,
       and the accent alone cannot do that. The only gate on --accent is
       ACCENT_GROUND_CONTRAST_FLOOR = 3 against the ground, so a dark accent
       sits ~92 units from the bundled ground and a pale one ~159: the same
       14% alpha that measures 12.9 on the first measures 22.3 on the second,
       which is INK. Rendered with a pale kit every template in this
       directory then put ink in the 8px bleed band (clippedEdgeShare 0.5-0.7%
       against a 0.4% ceiling) and counted its own wash as content.
       Mixing the accent halfway into the foreground compresses that spread:
       the mix is ~170 units from the ground on a dark accent and ~195 on a
       pale one, so 8% of it is 13.6 and 15.6 — inside the band on both, with
       the accent's hue still in it. */
    --wash: color-mix(in srgb, var(--accent) 45%, var(--fg));
    --accent-ink: #141414;
    --line: color-mix(in srgb, var(--fg) 26%, transparent);
    /* 8%, not 3%. At 3% of the foreground a card sits 6 units off the ground
       — inside the measurement's own ground tolerance, and invisible to a
       reader on a phone. 8% is 17 units: a surface you can see, and still
       under the 18-unit ink line, so the quiet side of the comparison stays
       quiet while the accented side carries the argument. */
    --card: color-mix(in srgb, var(--fg) 8%, transparent);
    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --mx: 64px;
    --ts: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Reviewer typography controls (Phase 2): a discrete type-scale multiplier
     and logical text alignment, applied per slide via body classes. Classes,
     never a {{fontScale}} CSS var: a stripped placeholder degrades to a
     harmless "ts-" class token, whereas an EMPTY-but-defined custom property
     substitutes as empty (not the var() fallback) and would invalidate every
     font-size on an older checkpointed slides-data re-rendered post-deploy. */
  body.ts-s { --ts: 0.85; }
  body.ts-l { --ts: 1.18; }
  body.ta-center { text-align: center; }
  body.ta-end { text-align: end; }
  html, body { width: 1080px; height: 1440px; }
  body {
    position: relative; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: var(--f-body);
    /* Distributed, not pinned at legacy's fixed offsets — see
       `stat-callout.html`'s note. Here the variable is how long each side's
       body copy runs, which changes the cards' height. */
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 96px var(--mx) 96px;
  }

  /* ── L1: the tonal wash, full bleed, inside the 12-18 band. A pixel is
        GROUND within 12 of the ground colour and INK beyond 18, so a wash
        between the two is visible tone that is not a mark: it may reach the
        frame edge without putting ink in the band `clippedEdgeShare` reads,
        and it takes the plate off "flat". ── */
  .ground {
    position: absolute; inset: 0; z-index: 0;
    background-image: linear-gradient(188deg, transparent 54%, color-mix(in srgb, var(--wash) 8%, transparent) 100%);
  }
  /* ── THERE IS NO L2 ON THIS PLATE ANY MORE, and that is the point. ──
     A full-bleed texture inset 16px used to paint ink in every cell of the
     frame, which made `occupiedShare` and `largestEmptyRectShare` constants:
     every ground-bearing template in this directory reported the same 1.5%
     largest empty rectangle with the full copy on it and with every slot
     empty. The texture now lives only on the two cards, which are the region
     the composition actually occupies — see `cover.html`'s header for the
     rule and `headline-focus.html`'s for the pitch. ── */

  .cmp-top { position: relative; z-index: 3; flex: 0 0 auto; }
  /* `inline-block` so a client's `pill`/`brackets` badge variant wraps the
     words rather than painting a full-measure bar. */
  .eyebrow {
    display: inline-block;
    font-family: var(--f-mono); font-weight: 600; font-size: calc(22px * var(--ts, 1));
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow:empty { display: none; }
  .cmp-rail { block-size: 2px; background: color-mix(in srgb, var(--fg) 48%, transparent); margin-block-start: calc(24px * var(--ts, 1)); }
  /* ── The Ground Rule and §11.5 together — `stat-callout.html`'s `.sc-rail`
        carries the full argument and this file is the same shape one
        archetype over. ──
     MEASURED-EDGE: every copy slot empty gave `occupiedShare` 1.94% and
     `largestEmptyRectShare` 31.67% — the worst blank plate in the set. The
     panel FILLS were already content-guarded on `.cmp-label`; four things
     were not, and drew a whole comparison diagram on a plate with no
     comparison on it: this rail, the two `.cmp-col` borders, the two
     `.cmp-rule` bars and the winner's corner diamond.
     THE SUBJECT OF A COMPARISON CARD IS ITS LABELS, so all five read
     `.cmp-label` — including the rail, which used to read `.eyebrow` and
     therefore vanished from a populated card whose writer wrote no kicker.
     With the guards and with a card on the plate: occ 0.00 / LER 100.00
     blank, and no (0,0) band populated. */
  body:not(:has(.cmp-label:not(:empty))) .cmp-rail { display: none; }

  /* ── AN IMAGE ON A PANEL ARCHETYPE (RFC-21 Part 2). ──

     Until now only `cover.html` and `slide.html` declared an `{{image:hero}}`
     slot, so `HERO_IMAGE_LAYOUTS` was two archetypes wide and a carousel that
     reached for structured panels sourced **no pictures at all** — measured on
     `thepitchbydeel` pubsub-21559620763659451, 8 slides, 0 images. The imagery
     floor fixes the COUNT by promoting `text_only` slides; this fixes the
     RANGE, so a post does not have to choose between a designed panel and a
     photograph.

     THE OWNER'S BRIEF, 2026-09-15: *add image/illustration slots and sometimes
     use striking images in other layouts too (beside a stat or a card), so we
     are not limited to cover and slide.html.*

     IT IS A BAND, NOT A BACKGROUND, and that is the whole design of it. A
     full-bleed photograph behind a panel would put the panel's type on an
     uncontrolled ground — the contrast gate cannot promise anything over a
     picture — and it would re-introduce exactly the full-frame layer RFC-20
     §11.1 spent a phase removing. A bounded band sits BESIDE the content, has
     its own edges, and every share it moves is its own.

     `:empty` collapses it, so a slide with no picture is byte-identical to
     before. `object-fit: cover` on a fixed band means a portrait or a
     landscape both fill it without distortion, and `onerror` removes the node
     rather than hiding it — a removed node leaves no broken-image glyph, which
     is the same rule `cover.html` and `slide.html` already follow. */
  /* ── THE PICTURE IS THE ELEMENT THAT YIELDS. ──

     `flex: 0 1 auto` with a definite `block-size`, so in this column flex
     container the band is the ONLY item that can shrink (every sibling is
     `0 0 auto`). When a long body at `l` asks for more than the 1440px canvas
     has, the band gives the space back instead of the copy being clipped.

     WHY IT IS THE RIGHT ELEMENT TO GIVE, and this is the whole argument:
     **text cannot shrink without being clipped, and a cover-fitted photograph
     can shrink without losing anything.** `object-fit: cover` means a shorter
     band crops a little more of the same picture at the same scale - no
     distortion, no reflow, nothing hidden. Capping a text box instead is what
     CI 35001921837 caught: *"2 element(s) overflow their own box (div.num-zone,
     div#figure.num-figure), and 0% of the frame is ink inside the 8px bleed
     band"* - nothing falling off the canvas, a fixed-size numeral hidden by a
     box drawn smaller than it.

     200px rather than 300: measured down when the same overflow appeared on
     `stat-callout.html`, whose header carries the arithmetic. `min-block-size`
     floors the shrink so the band cannot be squeezed to a sliver - at that
     point it is neither a picture nor honest about being one, and clause E
     would score a 30px stripe as this plate's drawn device. */
  .sc-figure-band {
    position: relative; z-index: 3; flex: 0 1 auto;
    block-size: calc(200px * var(--ts, 1)); min-block-size: calc(110px * var(--ts, 1)); inline-size: 100%;
    overflow: hidden; border-radius: 2px;
    margin-block-end: calc(24px * var(--ts, 1));
  }
  /* ── THE COLLAPSE IS KEYED ON A NON-EMPTY `src`, NEVER ON `:has(img)`. ──

     `fillTemplate` ERASES a slot nobody filled, so a slide with no picture
     still renders `<img src="">` and the `<img>` element is still there.
     `:not(:has(img))` is therefore FALSE on exactly the plates it was written
     to collapse, and the band kept its 200px on every pictureless slide in the
     set. That is what CI 35011946920 measured as `clipped` on
     `en ltr long l -> stat-callout @ interior`, on a plate the sweep attaches
     no image to at all — the band was eating the height the long body needed
     and no amount of shrinking the figure was ever going to give it back.

     `onerror="this.remove()"` does not cover it either, and that is the part
     worth keeping. An empty `src` may or may not fire `error`, and if it does
     it fires ASYNCHRONOUSLY: the DOM probe can read the document before the
     handler runs, so the same template measures differently run to run. A
     collapse rule has to be true at parse time. `onerror` stays for the case it
     is actually for, a path that was filled and then failed to load.

     This is the same lesson `slide.html` already carries at its `.scrim` rule:
     *"`.bg:empty` rather than `:not(:has(.hero))` because this template's
     `onerror` empties a wrapper instead of removing a top-level node"*. Same
     defect, one archetype over, and the house pattern was already written down. */
  .sc-figure-band:not(:has(img[src]:not([src=""]))) { display: none; }
  /* NO SLAB CLAMP HERE. `.num-zone` is `stat-callout.html`'s figure slab and
     this template has no element of that class - the rule that used to sit
     here was copy-pasted with the band and matched nothing on either this
     archetype or `list-takeaway.html`. Deleted rather than corrected: the
     shrinking band above is what makes the composition fit, and it needs no
     per-archetype clamp to do it. */
  .sc-figure-band img { inline-size: 100%; block-size: 100%; object-fit: cover; display: block; }
  /* ── AND THE CARDS STOPS SHRINKING WHEN A PICTURE IS ON THE PLATE. ──

     `.cmp-row` is `flex: 1 1 auto` with `min-block-size: 0`. It GROWS to
     fill the gap, which is what its own comment above is about, and it also
     SHRINKS below its own content, which nothing above is about and which is
     how `stat-callout.html` came to report `clipped` twice.

     The band is `flex: 0 1 auto` so that IT is what gives a pixel back when a
     long body at `l` asks for more than the canvas has. With two shrinkable
     items a browser splits the overflow between them in proportion to their
     base sizes, so this one would take the larger share and clip its own text:
     the band would be the element that yields in the comment and not in the
     layout. `1 0 auto` keeps the grow and drops the shrink.

     Scoped to `:has(.sc-figure-band img)`, so a plate with no picture keeps the
     exact flex it had before the band existed and every share the calibration
     measured on it still holds. */
  body:has(.sc-figure-band img[src]:not([src=""])) .cmp-row { flex: 1 0 auto; }
  /* The one mark it carries: the brand rule that ties it to the plate. */
  .sc-figure-band::after {
    content: ""; position: absolute; inset-block-end: 0; inset-inline: 0;
    block-size: calc(8px * var(--ts, 1)); background: var(--accent);
  }
  .cmp-head {
    z-index: 3;
    font-family: var(--f-display); font-weight: 600; font-size: calc(66px * var(--ts, 1));
    line-height: 1.3; letter-spacing: -0.012em; text-wrap: balance;
    margin-block-start: calc(40px * var(--ts, 1)); padding-block-end: 0.12em;
  }
  .cmp-head.small { font-size: calc(52px * var(--ts, 1)); }

  .cmp-row {
    /* `1 1 auto`, so the cards STRETCH into whatever the head and the footnote
       leave them. Hugging their content left a short comparison sitting in the
       middle of a mostly empty plate — 42% occupied against a cover role's
       floor of 42%, which is not a margin. */
    position: relative; z-index: 3; flex: 1 1 auto; min-block-size: 0;
    /* CAPPED, for the reason `stat-callout.html`'s slab is. Uncapped, the
       cards took 878px for ~250px of content: a 28%-tall band of empty tint
       above each label and another under each body, inside the region that
       supplies this archetype's device score. Capped at 720px — with the
       label and the body set larger to meet it — the same plate carries about
       half that, and the space the cap gives back becomes two even gaps on
       the ground rather than one hole. */
    max-block-size: calc(720px * var(--ts, 1));
    display: flex; gap: 22px; align-items: stretch;
    margin-block: calc(44px * var(--ts, 1));
  }
  /* The two cards are the archetype's device, so they have to be visible
     surfaces rather than a 3% tint nobody can see. Both are GRADED and
     TEXTURED rather than flat-filled: `measureSlidePng` reads the slide's
     ground colour off the modal FLAT cell, so a pair of large flat panels can
     out-vote the real ground and be measured AS it, after which every dark
     pixel at the frame edge counts as clipped ink. */
  .cmp-col {
    /* The cards STRETCH to the row, and their content is optically centred
       inside them. Top-aligned content in a stretched card left a column of
       dead tint under every label — the hole this rework exists to close,
       painted brown — while letting the cards hug their content left the
       plate itself half empty. Centring is the composition that holds at
       both extremes of copy length. */
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    border: 2px solid var(--line); border-radius: 6px;
    padding: 52px 40px;
  }
  /* THE CARDS PAINT ONLY WHEN THEY HAVE LABELS. `imageryOrDeviceShare` counts
     a covered, low-colour-count cell as a drawn device, so unconditional
     tinted blocks score their whole area whether or not anything is standing
     on them — which is how a plate with every slot empty used to clear the
     role floors it exists to fail. */
  /* ── THE TWO CARDS ARE HATCHED IN OPPOSITE DIRECTIONS, AND THAT IS THIS
        ARCHETYPE'S MARK. ──
     The whole bundled set used to carry one 45-degree hairline field, so six
     of the eight plates read as the same wallpaper with different words on it
     — the owner's second complaint verbatim. Every archetype now spends a
     different MARK (`headline-focus.html`'s header lists the set and states
     why a mark is needed at all rather than a flat tint or clean ground).

     This is the one place in the directory where a DIAGONAL still earns its
     keep, because here the mirroring means something: the quiet side runs at
     45 degrees and the recommended side at 135, so the pair leans into each
     other and the slide's argument is legible before a word of it is read.
     Nothing else in the set is a mirrored pair, and `headline-focus.html` is
     the only other file that hatches at all — one field, never two.

     The pitch is the set's standing one and it answers to the same cell
     arithmetic: a 2px rule marks (2+4)/11 of the cells it crosses and can
     never fill three quarters of a 4px cell, so the hatch adds no drawn-device
     coverage and each card's device share stays its TINT's. A cell crossed by
     the hatch is also not FLAT, which is what stops two panels covering half
     the frame from out-voting the real ground for `backgroundHex`. */
  body:has(.cmp-label:not(:empty)) .cmp-col {
    background-image:
      linear-gradient(166deg, var(--card) 0%, color-mix(in srgb, var(--fg) 4%, transparent) 100%);
  }
  /* The "after" / recommended side. `.ab.win`'s treatment, scaled up to a card.
     It is always the SECOND `.cmp-row` child in markup order, never pinned to
     a physical side: `flex-direction: row` lays its children out along the
     inline-end direction, so `dir="{{dir}}"` alone moves it to the visually
     opposite corner for RTL without any flex/order override here. The
     marker's own corner uses `inset-inline-end` for the same reason — "the
     outward corner, away from the other card" is a directional description,
     not a physical `right`. */
  /* The winning side is the one accent-tinted panel on the plate — the
     archetype's whole argument in one surface, rather than a 1px border. */
  .cmp-col.win { border-color: var(--accent); position: relative; }
  body:has(.cmp-label:not(:empty)) .cmp-col.win {
    background-image:
      linear-gradient(166deg,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%,
        color-mix(in srgb, var(--accent) 8%, transparent) 100%);
  }
  /* INSIDE the card, not hanging off its corner. A decoration that leaves its
     parent's box makes that parent report `scrollWidth > clientWidth`, which
     the renderer's DOM probe reports as an overflowing element — and clause B
     of the interest floor fails a slide on `probe.overflow` alone. The old
     `-7px` offsets put both `.cmp-col.win` and `.cmp-row` on that list on
     every comparison slide ever rendered. */
  .cmp-col.win::after {
    content: ""; position: absolute; top: 16px; inset-inline-end: 16px;
    width: 20px; height: 20px; background: var(--accent); transform: rotate(45deg);
  }
  .cmp-label {
    font-family: var(--f-display); font-weight: 600; font-size: calc(54px * var(--ts, 1));
    line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance;
    /* A glyph box taller than its line box makes the block report
       `scrollHeight > clientHeight`, which the DOM probe reports as an
       overflowing element and clause B of the interest floor fails on. */
    padding-block-end: 0.14em;
  }
  .cmp-rule { width: 72px; height: 5px; background: var(--line); margin: 30px 0; }
  .cmp-col.win .cmp-rule { background: var(--accent); }
  /* The Ground Rule — see `.cmp-rail` above. The border and the diamond go to
     `transparent` rather than `display: none` so the empty cards keep their
     boxes and the row keeps its geometry: the guard must remove PAINT, not
     rearrange a layout that a populated plate depends on. */
  body:not(:has(.cmp-label:not(:empty))) .cmp-col,
  body:not(:has(.cmp-label:not(:empty))) .cmp-col.win { border-color: transparent; }
  body:not(:has(.cmp-label:not(:empty))) .cmp-rule { display: none; }
  body:not(:has(.cmp-label:not(:empty))) .cmp-col.win::after { display: none; }
  .cmp-body {
    font-family: var(--f-body); font-weight: 400; font-size: calc(32px * var(--ts, 1)); line-height: 1.5;
    color: color-mix(in srgb, var(--fg) 78%, transparent); text-wrap: pretty;
  }

  .cmp-foot {
    position: relative; z-index: 3; flex: 0 0 auto;
    display: flex; gap: 22px; align-items: flex-start;
  }
  .diamond {
    display: inline-block; width: 16px; height: 16px; background: var(--accent);
    transform: rotate(45deg); flex-shrink: 0; margin-top: 12px;
  }
  .cmp-foot-text {
    font-family: var(--f-body); font-weight: 400; font-size: calc(27px * var(--ts, 1)); line-height: 1.5;
    color: color-mix(in srgb, var(--fg) 78%, transparent); text-wrap: pretty;
  }
  .cmp-foot:has(.cmp-foot-text:empty) { display: none; }

  /* Standing brand furniture. The brand head fragment (`buildBrandHeadHtml`)
     restates both rules and lands AFTER this sheet, so a client with a kit
     keeps its own placement; these defaults exist because a brandless render
     otherwise lays the handle out in normal flow, between the cards. */
  .brand-handle {
    position: absolute; bottom: 34px; inset-inline-start: 44px; z-index: 6;
    font-family: var(--f-mono); font-size: calc(19px * var(--ts, 1)); letter-spacing: 0.08em;
    color: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  .brand-badge {
    position: absolute; top: 36px; inset-inline-end: var(--mx); z-index: 6;
    font-family: var(--f-mono); font-weight: 600; font-size: calc(19px * var(--ts, 1));
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  /* An @handle, a URL and a #hashtag are LTR strings, and a Hebrew or Arabic
     slide lays them out inside an RTL paragraph: the leading `@` is a bidi
     NEUTRAL, so it takes the paragraph embedding level and ends up on the
     wrong side — every Hebrew slide in the tree shipped `karoslabs@`. The
     `<bdi dir="ltr">` in the markup is the fix; `dir` on the DIV would also
     have re-resolved its own `inset-inline-start` and moved the watermark to
     the other corner. The extra :has() selector is what keeps an empty slot
     hidden now that the div always has an element child. */
  .brand-badge:empty, .brand-handle:empty, .brand-handle:has(> bdi:empty) { display: none; }
</style>
<style>
/* instagram-agent number devices (Phase 2, item M) — built by slide-devices.ts. */
.dv {
  --dv-quiet: color-mix(in srgb, var(--fg) 22%, transparent);
  margin-block-start: calc(30px * var(--ts, 1));
}
/* The ONE accent-bearing element in a fragment sets the ink every accented
   part reads, so "exactly one accent per device" is a single marker class
   rather than a rule spread across six builders. */
.dv-accent { --dv-ink: var(--accent); }

.dv-figure {
  font-family: var(--f-display); font-weight: 600;
  /* A figure never breaks mid-number. */
  white-space: nowrap;
  line-height: 0.95; letter-spacing: -0.02em;
  font-size: calc(200px * var(--ts, 1));
  /* Not cosmetic, and not slack. A display face's glyph box is TALLER than a
     line box under about 1.15, so a figure set at 0.95 reports
     `scrollHeight > clientHeight` — and the renderer's DOM probe reports any
     such element as overflowing, which fails clause B of the interest floor
     (`probe.overflow` is a limb no amount of imagery exempts). Measured: a
     150px figure's line box is 143px against 163px of content. A tight line
     height is the right typography for a standalone numeral, so the fix is to
     give the box the descender room rather than to loosen the leading. In
     `em`, so it tracks all three size steps and every per-script type scale. */
  padding-block-end: 0.16em;
}
.dv-figure--mid { font-size: calc(150px * var(--ts, 1)); }
.dv-figure--small { font-size: calc(108px * var(--ts, 1)); }
/* The accented figure — the "after" half of a before/after pair. */
.dv-figure.dv-accent { color: var(--dv-ink); }

.dv-rule {
  inline-size: calc(132px * var(--ts, 1)); block-size: calc(12px * var(--ts, 1));
  background: var(--dv-ink, var(--dv-quiet)); margin-block-start: calc(26px * var(--ts, 1));
}
/* Labels wrap BENEATH the figure, in the text face — never the display or mono face. */
.dv-label {
  font-family: var(--f-body); font-weight: 400; font-size: calc(30px * var(--ts, 1));
  line-height: 1.45; text-wrap: pretty; text-align: start;
  margin-block-start: calc(20px * var(--ts, 1)); max-inline-size: calc(760px * var(--ts, 1));

.brand-handle {
  position: absolute; bottom: 44px; inset-inline-start: 44px; z-index: 6;
  font-family: var(--f-mono); font-size: 19px; letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--fg) 55%, transparent);
}
.brand-badge {
  position: absolute; top: 56px; inset-inline-start: var(--mx, 64px); z-index: 6;
  font-family: var(--f-mono); font-weight: 600; font-size: 19px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--badge-ink, var(--accent));
}
</style>
</head>
<body class="ts-{{fontScale}} ta-{{textAlign}}">
  <div class="ground" aria-hidden="true"></div>
  <div class="brand-badge">{{seriesBadge}}</div>
  <div class="brand-handle"><bdi dir="ltr">{{brandHandle}}</bdi></div>
  <div class="cmp-top">
    <div class="eyebrow">{{kicker}}</div>
    <div class="cmp-rail"></div>
    <div class="cmp-head" id="head">{{headline}}</div>
  </div>
  <div class="sc-figure-band"><img src="{{image:hero}}" onerror="this.remove()" alt="" /></div>
  <div class="cmp-row">
    <div class="cmp-col">
      <div class="cmp-label">{{leftLabel}}</div>
      <div class="cmp-rule"></div>
      <div class="cmp-body">{{leftBody}}</div>
    </div>
    <div class="cmp-col win">
      <div class="cmp-label">{{rightLabel}}</div>
      <div class="cmp-rule"></div>
      <div class="cmp-body">{{rightBody}}</div>
    </div>
  </div>
  <div class="cmp-foot">
    <span class="diamond"></span>
    <div class="cmp-foot-text">{{body}}</div>
  </div>
  <script>
    (function () {
      var h = document.getElementById("head");
      if ((h.textContent || "").trim().length > 52) h.className = "cmp-head small";
      window.__CAROUSEL_READY__ = true;
    })();
  </script>
</body>
</html>
