# Cloud Build for agent-engine's apps/agent-server. Builds ONE image and
# deploys it to TWO Cloud Run services — agent-engine-<env> (HTTP, default
# CMD) and agent-engine-<env>-worker (the Pub/Sub pull consumer, via a
# --command/--args override) — same split as karosCMO/agent-service's own
# agent-service-api / agent-service-worker (see agent-service/cloudbuild.yaml).
# A subscribe() failure in the worker must never take the HTTP health check
# down with it, and vice versa — one process doing both would risk exactly
# that.
#
# Substitutions:
#   _REGION            e.g. us-central1
#   _REPO              Artifact Registry repo (the existing "karos" repo,
#                       already used by agent-service/karos-cmo — no new
#                       repo needed)
#   _SERVICE_PREFIX    "agent-engine-prep" or "agent-engine" (prod) — the two
#                       Cloud Run service names are this plus "" / "-worker"
#   _SERVICE_ACCOUNT   runtime SA email (agent-engine-sa@<project>.iam.gserviceaccount.com)
#   _GOOGLE_CLOUD_PROJECT   Firestore project (karoscmo — Firestore is NOT
#                       enabled in karoscmo-prep; see .env.example)
#   _FIRESTORE_DATABASE_ID  named Firestore database ("prep" or "(default)")
#   _ANTHROPIC_VERTEX_PROJECT_ID  GCP project whose Model Garden has Claude
#                       enabled (karoscmo-prep)
#   _PUBSUB_PROJECT_ID  GCP project holding the run-jobs topic/subscription
#   _QUEUE_SUBSCRIPTION_RUN_JOBS  the PULL subscription name the worker binds to
#   _GCS_MEDIA_BUCKET / _GCS_ARTIFACTS_BUCKET / _GCS_WORKSPACE_BUCKET  provisioned buckets
#   _ANTHROPIC_API_KEY_SECRET  Secret Manager secret name (not value) backing
#                       the dual-layer fallback router's direct-Anthropic hop
#                       (ResilientClaudeAdapter) — the runtime SA needs
#                       secretmanager.secretAccessor on this exact secret.
#                       Blank skips --set-secrets entirely (no fallback wired).
#
# One-time setup (run once per environment before the first build):
#   gcloud iam service-accounts create agent-engine-sa --project=<project> \
#     --display-name="Agent engine (api+worker)"
#   # then grant it aiplatform.user + pubsub.subscriber (this project),
#   # datastore.user (the Firestore project), storage.objectAdmin (both
#   # buckets), secretmanager.secretAccessor (on _ANTHROPIC_API_KEY_SECRET if
#   # used) — see DEPLOY_ENVIRONMENTS.md. Also grant the Cloud Build default
#   # compute service account roles/iam.serviceAccountUser ON agent-engine-sa
#   # itself, or the deploy steps below fail with a PERMISSION_DENIED actAs
#   # error.
substitutions:
  _REGION: us-central1
  _REPO: karos
  _SERVICE_PREFIX: agent-engine-prep
  _SERVICE_ACCOUNT: ""
  _GOOGLE_CLOUD_PROJECT: ""
  # Which project owns the BI dataset. Separate from _GOOGLE_CLOUD_PROJECT
  # on purpose: that one points at whichever project holds Firestore, and
  # for prep that is PRODUCTION (karoscmo, database "prep"). BigQuery used
  # to inherit it, so every prep run tried to write production's telemetry
  # table, was denied on bigquery.tables.updateData, and swallowed the
  # error as a WARNING line. Blank falls back to _GOOGLE_CLOUD_PROJECT,
  # which is correct for production and preserves prior behaviour.
  _BQ_PROJECT_ID: ""
  _FIRESTORE_DATABASE_ID: "(default)"
  _ANTHROPIC_VERTEX_PROJECT_ID: ""
  _ANTHROPIC_API_KEY_SECRET: ""
  # Optional image-search key for media.findImages. The keyless providers
  # (openverse, wikimedia, ddg_images) work without it, so this only ADDS a
  # source — but the secret must exist in the project, since a blank value
  # would render an invalid "UNSPLASH_ACCESS_KEY=:latest". This file deploys
  # prep only; prod goes through cloudbuild.promote.yaml, which deliberately
  # does not wire this (karoscmo has no such secret today).
  _UNSPLASH_ACCESS_KEY_SECRET: unsplash-access-key
  _PEXELS_API_KEY_SECRET: pexels-api-key
  _PIXABAY_API_KEY_SECRET: pixabay-api-key
  # Google Places: the ONLY place-verified source on the named_venue route
  # (AU56 / SCRUM-355). Absent, that route has no source that can confirm a
  # photo is of the right building and falls through to generic image
  # search — which it had been doing in every environment since it was
  # written, because this key was documented in .env.example and wired
  # nowhere. prod is deliberately NOT wired yet: its key does not exist.
  _GOOGLE_PLACES_KEY_SECRET: google-places-key
  # The scraper backend research.pull and the visual pipeline's scrape tier
  # actually run on (karos-scraper/src/index.ts's createScraperProvider) —
  # the one generic, swappable ScraperProvider implementation, chosen so the
  # scraping vendor can change without touching any tool's own code. Without
  # it research.pull reports not_available and every content agent holds
  # rather than drafting from a placeholder, so THIS is what's effectively
  # required for prep to produce content at all.
  _SCRAPPYCOCO_API_KEY_SECRET: scrappycoco-api-key
  # ChatGPT's AI-visibility capture column (research.captureVisibility ->
  # capture-adapters/openai-answer-engine.ts). Note what it measures: the
  # OpenAI API with the server-side web_search tool, NOT the ChatGPT product —
  # retrieval, ranking and citations differ from the UI, which is stated on the
  # adapter and in .env.example so nobody discovers it by comparison. It
  # replaced a ScrappyCoco route that never existed on that vendor, which is
  # why SCRAPPYCOCO_API_KEY above no longer backs any capture (it still backs
  # research.pull's scraper). Absent, ChatGPT's cells report
  # UNAVAILABLE/no_adapter_wired like any other unconfigured engine.
  #
  # prod is deliberately NOT wired: cloudbuild.promote.yaml is its own file and
  # karoscmo's secret/IAM state is not this one's to assume.
  _OPENAI_API_KEY_SECRET: OPENAI_API_KEY
  _PUBSUB_PROJECT_ID: ""
  _QUEUE_SUBSCRIPTION_RUN_JOBS: ""
  # The topic /runs/start PUBLISHES to (AU66 / SCRUM-364). Its absence was
  # invisible until AU66, because until then nothing in the server published
  # — only the worker consumed, and its subscription WAS wired. Left unset,
  # runJobsTopicName() falls back to "agent-engine-run-jobs", which exists in
  # neither project, and every enqueue would 500.
  _QUEUE_TOPIC_RUN_JOBS: "karos-agent-runs-prep"
  _GCS_MEDIA_BUCKET: ""
  _GCS_ARTIFACTS_BUCKET: ""
  _GCS_WORKSPACE_BUCKET: ""
  # Push-route authentication (AU2 / SCRUM-288). Verified: routes/queue.ts's
  # OIDC check only activates when PUBSUB_PUSH_AUDIENCE_URL is set — until
  # now, blank in every environment, so the push route accepted any
  # syntactically valid envelope with no auth at all. This turns it on using
  # this service's OWN, stable HTTP-service URL as the required `aud` claim
  # (Google's own recommended mechanism for a Pub/Sub push subscription:
  # https://cloud.google.com/pubsub/docs/authenticate-push-subscriptions).
  # Cloud Run service URLs are deterministic from service-name+region+project
  # and stable across deploys/revisions, so hardcoding is safe — not a value
  # that needs to survive a rebuild.
  #
  # CORRECTED (AU2 reopened): this was the BARE SERVICE URL, which made the
  # check structurally incapable of failing. Cloud Run only admits a token
  # whose `aud` is the service URL, so every request that reached the handler
  # already carried exactly the audience the handler was verifying — probed
  # against deployed prep, a plain invoker token sailed through to payload
  # validation. It must be the FULL ENDPOINT PATH, which is what Pub/Sub mints
  # push tokens for and what `--push-endpoint` is set to. NOTE: this is NOT
  # karosCMO's AGENT_ENGINE_AUDIENCE, which is correctly the bare service URL
  # for ordinary API calls; copying that value here is what caused the bug.
  # Only applies to deploy-http below —
  # deploy-worker (queue-consumer.js) never mounts this route at all; it
  # pull-subscribes directly and has no Express app.
  _PUBSUB_PUSH_AUDIENCE_URL: "https://agent-engine-prep-v6nerot2ba-uc.a.run.app/api/v1/queue/pubsub-push"
  # Service-identity authentication plumbing (AU1 / SCRUM-287, config folded
  # in here per AU2 / SCRUM-288). AUTH_AUDIENCE resolves to the exact same
  # URL as _PUBSUB_PUSH_AUDIENCE_URL above (this service's own address) —
  # kept as a separate substitution rather than reused because the two guard
  # different things in code (apps/agent-server/src/auth/service-identity.ts
  # vs the Pub/Sub-specific check in routes/queue.ts) and could legitimately
  # diverge later (e.g. a dedicated auth-only hostname).
  #
  # AUTH_ENABLED IS HARDCODED BELOW, IN THE --set-env-vars LIST, NOT HERE —
  # deliberately not a substitution at all, so its value can never arrive from
  # outside this file. That decision is kept: SCRUM-331 flipped the pinned
  # literal from `false` to `true` rather than making it injectable.
  #
  # SCRUM-331 (AU48), 2026-09-02: **prep now runs with enforcement ON.** The
  # blocker named here — the portal's fail-open metadata fetch, SCRUM-330 —
  # is merged and deployed to prep, so "enabling before that lands turns a
  # silent metadata blip into an intermittent portal 401" no longer applies
  # here. It still applies to PRODUCTION until the portal promotion lands
  # there; see cloudbuild.promote.yaml, which stays `false` until then.
  #
  # Why the literal and not a `gcloud run services update`: every push to
  # main redeploys prep through this file with `--set-env-vars`, which
  # REPLACES the environment. A flag flipped by hand survives until the next
  # merge and then silently reverts, which is worse than never flipping it —
  # enforcement that comes and goes with unrelated commits.
  _AUTH_AUDIENCE: "https://agent-engine-prep-v6nerot2ba-uc.a.run.app"
  # Who may call this service once AUTH_ENABLED is flipped. Established by
  # reading the LIVE runtime identity of every Cloud Run service in this
  # project, not inferred: `karos-cmo` (the portal) is the only caller, and
  # agent-middleware does not call agent-engine at all (the dependency runs
  # the other way -- agent-engine reads its prompt store).
  #
  # This is staged NOW, while the flag is off, because an EMPTY list means
  # "any identity Google vouches for for this audience"
  # (auth/service-identity.ts:77-82) -- and since AUTH_AUDIENCE is this
  # service's own URL, that is exactly the set Cloud Run IAM already
  # admitted. Flipping the flag without this would produce enforcement in
  # the logs and none in fact, which is worse than auth being off.
  #
  # SCRUM-331: this value used to be the default compute SA and contradicted
  # the comment above it. The compute SA holds `roles/run.invoker` on this
  # service, but it is not the identity the portal PRESENTS -- the token's
  # `email` claim is the CALLER'S RUNTIME service account, and prep's
  # `karos-cmo` runs as `karos-cmo-prep@karoscmo-prep` (verified live:
  # `gcloud run services describe karos-cmo --project=karoscmo-prep
  # --region=us-central1 --format='value(spec.template.spec.serviceAccountName)'`).
  # The invoker list and the runtime identity are different things; reading
  # the first for the second is what produced the wrong value here. With the
  # old value, flipping AUTH_ENABLED=true would have 401'd every dispatch at
  # auth/service-identity.ts:162 -- enforcement that rejects the one caller it
  # exists to admit.
  #
  # ONE ENTRY ONLY, structurally. `AUTH_ALLOWED_SERVICE_ACCOUNTS` is split on
  # "," (wiring/auth.ts:23), but it is passed through `--set-env-vars=` below,
  # which uses "," as ITS OWN delimiter between variables. A second entry does
  # not produce a two-element allowlist -- it produces a malformed env-var
  # list. Adding one requires switching that flag to gcloud's alternate-
  # delimiter form (`--set-env-vars=^@^K1=a,b@K2=c`) in the same change.
  #
  # AND ONE COUPLING TO KNOW ABOUT (SCRUM-331 audit, 2026-09-02). A dedicated
  # portal runtime identity exists in BOTH projects — prep's `karos-cmo-prep`
  # is already the portal's SA and is the value below, but production's
  # `karos-cmo-sa@karoscmo` is NOT: the prod portal still runs as
  # `firebase-adminsdk-fbsvc@karoscmo`, which is what the prod allowlist
  # names. `karos-cmo-sa` was created and granted `run.invoker` for AU58 /
  # SCRUM-357 and the switch was never made.
  #
  # So **AU58 must update this allowlist in the same change that switches the
  # prod portal's service account**, or every engine call 401s the moment it
  # lands. It was deliberately NOT pre-widened here: the value above is
  # "the live runtime identity", per this comment's own method, and naming an
  # identity nothing runs as would both break that method and — per the
  # paragraph above — require the alternate-delimiter rewrite to express at
  # all. Two entries is not a bigger string; it is a different flag syntax.
  _AUTH_ALLOWED_SERVICE_ACCOUNTS: "karos-cmo-prep@karoscmo-prep.iam.gserviceaccount.com"

steps:
  # Layer cache. Each build starts on a fresh worker with an empty local
  # daemon, so without this every layer is rebuilt from scratch every time —
  # measured at ~7 min for build+deploy. `|| exit 0` because the very first
  # build (and any build after the tag is deleted) has nothing to pull, and a
  # missing cache must not fail the build.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:cache || exit 0

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/agent-server/Dockerfile
      # `--cache-from` reuses layers from the pulled image. It pairs with the
      # Dockerfile's runtime-stage ordering, where the expensive
      # `playwright install` layer was moved ABOVE the source COPYs so it
      # depends only on node_modules — together they mean a source-only change
      # reuses the browser layer instead of re-downloading it.
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:cache
      # Records inline cache metadata in the pushed image so the NEXT build's
      # --cache-from can actually match layers. Without it the pull succeeds
      # and matches nothing.
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:$COMMIT_SHA
      # A moving tag, separate from the immutable SHA tag the deploy and the
      # promote both pin. Nothing is ever DEPLOYED from `:cache`.
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:cache
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:$COMMIT_SHA

  - id: push-cache
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:cache

  - id: deploy-http
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_PREFIX}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:$COMMIT_SHA
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=2Gi
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},BQ_PROJECT_ID=${_BQ_PROJECT_ID},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,VERTEX_AI_LOCATION=${_REGION},GEMINI_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},PROMPT_STORE_DRIVER=firestore,QUEUE_PROVIDER=pubsub,QUEUE_TOPIC_RUN_JOBS=${_QUEUE_TOPIC_RUN_JOBS},PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},GCS_ARTIFACTS_BUCKET=${_GCS_ARTIFACTS_BUCKET},GCS_WORKSPACE_BUCKET=${_GCS_WORKSPACE_BUCKET},LANDING_ENGINE_TEMPLATE_ROOT=/app/packages/tools/karos-landing/assets/template,LANDING_ENGINE_ROOT=/tmp/landing-engine,INSTAGRAM_AGENT_REPO_ROOT=/app,PUBSUB_PUSH_AUDIENCE_URL=${_PUBSUB_PUSH_AUDIENCE_URL},AUTH_ENABLED=true,AUTH_AUDIENCE=${_AUTH_AUDIENCE},AUTH_ALLOWED_SERVICE_ACCOUNTS=${_AUTH_ALLOWED_SERVICE_ACCOUNTS}
      - --set-secrets=ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY_SECRET}:latest,UNSPLASH_ACCESS_KEY=${_UNSPLASH_ACCESS_KEY_SECRET}:latest,PEXELS_API_KEY=${_PEXELS_API_KEY_SECRET}:latest,PIXABAY_API_KEY=${_PIXABAY_API_KEY_SECRET}:latest,GOOGLE_PLACES_KEY=${_GOOGLE_PLACES_KEY_SECRET}:latest,SCRAPPYCOCO_API_KEY=${_SCRAPPYCOCO_API_KEY_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_KEY_SECRET}:latest
      # instagram-agent writes under `repoRoot` (INSTAGRAM_AGENT_REPO_ROOT=/app):
      # `.media-cache/<runId>/` from media.findImages, and
      # `instagram-output/<client>/<postId>/` from publish.renderCarousel. The
      # container filesystem is read-only, so both used to fail with EACCES —
      # invisible until now only because the single-provider media tool returned
      # `not_available` on a missing key before it ever touched the filesystem
      # (prep run pubsub-21065943969253409 hit it the moment a key existed).
      # These must stay under repoRoot rather than move to /tmp: renderCarousel
      # enforces assertInside(repoRoot) on templateDir, outDir AND every image
      # path, and templateDir ships read-only inside the image.
      - --add-volume=name=mediacache,type=in-memory,size-limit=384Mi
      - --add-volume-mount=volume=mediacache,mount-path=/app/.media-cache
      - --add-volume=name=igoutput,type=in-memory,size-limit=256Mi
      - --add-volume-mount=volume=igoutput,mount-path=/app/instagram-output
      # `.template-cache/<runId>/` from karos-templates' materializeTemplates,
      # for the same reason and with the same constraint: the registry writes
      # each run's chosen archetype templates to disk so renderCarousel can
      # read them as repo-relative FILES (Approach (a)), which is what keeps
      # its assertInside guard as the single path-safety code path. Small
      # because a run writes at most a handful of few-KB HTML documents.
      - --add-volume=name=templatecache,type=in-memory,size-limit=64Mi
      - --add-volume-mount=volume=templatecache,mount-path=/app/.template-cache

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_PREFIX}-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:$COMMIT_SHA
      - --command=node
      - --args=apps/agent-server/dist/queue-consumer.js
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=2Gi
      # A pull subscriber has no inbound HTTP traffic to wake it — it must
      # never scale to zero or have its CPU throttled between messages, or
      # it simply stops pulling. Same reasoning as agent-service-worker's
      # own --min-instances=1 --no-cpu-throttling.
      - --min-instances=1
      - --no-cpu-throttling
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},BQ_PROJECT_ID=${_BQ_PROJECT_ID},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,VERTEX_AI_LOCATION=${_REGION},GEMINI_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},PROMPT_STORE_DRIVER=firestore,QUEUE_PROVIDER=pubsub,QUEUE_TOPIC_RUN_JOBS=${_QUEUE_TOPIC_RUN_JOBS},PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID},QUEUE_SUBSCRIPTION_RUN_JOBS=${_QUEUE_SUBSCRIPTION_RUN_JOBS},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},GCS_ARTIFACTS_BUCKET=${_GCS_ARTIFACTS_BUCKET},GCS_WORKSPACE_BUCKET=${_GCS_WORKSPACE_BUCKET},LANDING_ENGINE_TEMPLATE_ROOT=/app/packages/tools/karos-landing/assets/template,LANDING_ENGINE_ROOT=/tmp/landing-engine,INSTAGRAM_AGENT_REPO_ROOT=/app
      - --set-secrets=ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY_SECRET}:latest,UNSPLASH_ACCESS_KEY=${_UNSPLASH_ACCESS_KEY_SECRET}:latest,PEXELS_API_KEY=${_PEXELS_API_KEY_SECRET}:latest,PIXABAY_API_KEY=${_PIXABAY_API_KEY_SECRET}:latest,GOOGLE_PLACES_KEY=${_GOOGLE_PLACES_KEY_SECRET}:latest,SCRAPPYCOCO_API_KEY=${_SCRAPPYCOCO_API_KEY_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_KEY_SECRET}:latest
      # instagram-agent writes under `repoRoot` (INSTAGRAM_AGENT_REPO_ROOT=/app):
      # `.media-cache/<runId>/` from media.findImages, and
      # `instagram-output/<client>/<postId>/` from publish.renderCarousel. The
      # container filesystem is read-only, so both used to fail with EACCES —
      # invisible until now only because the single-provider media tool returned
      # `not_available` on a missing key before it ever touched the filesystem
      # (prep run pubsub-21065943969253409 hit it the moment a key existed).
      # These must stay under repoRoot rather than move to /tmp: renderCarousel
      # enforces assertInside(repoRoot) on templateDir, outDir AND every image
      # path, and templateDir ships read-only inside the image.
      - --add-volume=name=mediacache,type=in-memory,size-limit=384Mi
      - --add-volume-mount=volume=mediacache,mount-path=/app/.media-cache
      - --add-volume=name=igoutput,type=in-memory,size-limit=256Mi
      - --add-volume-mount=volume=igoutput,mount-path=/app/instagram-output
      # `.template-cache/<runId>/` from karos-templates' materializeTemplates,
      # for the same reason and with the same constraint: the registry writes
      # each run's chosen archetype templates to disk so renderCarousel can
      # read them as repo-relative FILES (Approach (a)), which is what keeps
      # its assertInside guard as the single path-safety code path. Small
      # because a run writes at most a handful of few-KB HTML documents.
      - --add-volume=name=templatecache,type=in-memory,size-limit=64Mi
      - --add-volume-mount=volume=templatecache,mount-path=/app/.template-cache

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:$COMMIT_SHA
