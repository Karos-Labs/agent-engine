# Promote a prep-built agent-engine image to production. No rebuild from
# source: copies the exact image already built + deployed to prep (tagged
# with the git commit SHA) into production's own Artifact Registry, then
# deploys that same image to both Cloud Run services (HTTP + worker).
# Production always runs the identical bits verified in prep.
#
# Invoked by .github/workflows/deploy-prod.yml:
#   gcloud builds submit --project=<PROD_PROJECT_ID> --config=cloudbuild.promote.yaml \
#     --no-source --substitutions=_PREP_PROJECT_ID=...,_SHA=<commit-sha>,...
#
# One-time setup — grant production's Cloud Build service account read
# access to prep's Artifact Registry repo, so the pull-from-prep step below
# can reach it. BOTH of these may be needed: `gcloud builds describe
# <buildId> --format='value(serviceAccount)'` on an actual run is what
# settled it here — this project's builds run as the Compute Engine default
# SA, not the legacy Cloud Build SA the first grant below assumes (a GCP
# default that varies by project/API-enablement history; don't assume either
# one without checking a real build's `serviceAccount` field first):
#
#   PROD_PROJECT_NUMBER=$(gcloud projects describe $PROD_PROJECT_ID --format='value(projectNumber)')
#   gcloud artifacts repositories add-iam-policy-binding karos \
#     --project=$PREP_PROJECT_ID --location=us-central1 \
#     --member="serviceAccount:${PROD_PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/artifactregistry.reader"
#   gcloud artifacts repositories add-iam-policy-binding karos \
#     --project=$PREP_PROJECT_ID --location=us-central1 \
#     --member="serviceAccount:${PROD_PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
#     --role="roles/artifactregistry.reader"
#
# The cloud-run-deploy steps' flags mirror cloudbuild.yaml's own deploy
# steps — keep the two in sync.
substitutions:
  _REGION: us-central1
  _REPO: karos
  _SERVICE_PREFIX: agent-engine-prod
  _SERVICE_ACCOUNT: ""
  _PREP_PROJECT_ID: ""
  _PREP_REGION: us-central1
  _SHA: ""
  _GOOGLE_CLOUD_PROJECT: ""
  _FIRESTORE_DATABASE_ID: "(default)"
  # The BI dataset per-step cost rows are written to. This file sets no
  # _BQ_PROJECT_ID, so the project keeps falling back to
  # _GOOGLE_CLOUD_PROJECT, which is correct here (karoscmo owns both Firestore
  # and the BI dataset in production); only the dataset name is pinned, so the
  # target is stated in the deploy config rather than only in
  # bigquery-client.ts's default.
  _BQ_DATASET_ID: "bi_telemetry"
  _ANTHROPIC_VERTEX_PROJECT_ID: ""
  _ANTHROPIC_API_KEY_SECRET: ""
  # The scraper key, created in karoscmo alongside prep's.
  _SCRAPPYCOCO_API_KEY_SECRET: scrappycoco-api-key
  _PERPLEXITY_API_KEY_SECRET: PERPLEXITY_API_KEY
  # Curated stock photography, venue photography and the ChatGPT visibility
  # column. These five were prep-only on the stated grounds that "the secrets
  # do not exist in karoscmo and --set-secrets naming a missing secret fails
  # the deploy outright" — the instruction attached to that was "create the
  # secrets in karoscmo and add them here to close it".
  #
  # They exist. Verified 2026-09-06 against the prod project: every one of
  # these secrets is present with an enabled version, and every one answers its
  # own API — Unsplash/Pexels/Pixabay/OpenAI 200, and google-places-key 200
  # from `maps/api/place/findplacefromtext` (the endpoint providers/google-places.ts
  # actually calls; the newer places.googleapis.com is not enabled in either
  # project and is not what this code uses). So the premise had expired and
  # only the comment was still enforcing it, which cost production three of
  # six image providers, the only place-verified photo source, and the ChatGPT
  # column — silently, because a stale comment reads exactly like a decision.
  #
  # Checked against a real credential rather than assumed: elevenlabs-api-key
  # was mounted in prep for weeks holding a key that 401'd, so "the secret
  # exists" is not the same claim as "the capability works".
  _UNSPLASH_ACCESS_KEY_SECRET: unsplash-access-key
  _PEXELS_API_KEY_SECRET: pexels-api-key
  _PIXABAY_API_KEY_SECRET: pixabay-api-key
  _GOOGLE_PLACES_KEY_SECRET: google-places-key
  _OPENAI_API_KEY_SECRET: OPENAI_API_KEY
  # Transcription (video.transcribe, ElevenLabs Scribe) — the one credential
  # both video products cannot run without. The secret exists in karoscmo
  # (created 2026-08-28 alongside prep's), so naming it here cannot fail the
  # deploy the way a missing secret would. prep has been wired since the tiktok
  # smart-pipeline change; prod was the half that stayed unwired, which is what
  # the video-transcription capability row said out loud until this line
  # existed.
  _ELEVENLABS_API_KEY_SECRET: elevenlabs-api-key
  # The OAuth app a Google grant was issued to. connectors.googleDataSync needs
  # it to mint a per-client access token (karos-connectors/src/access-token.ts,
  # and google-connectors-oauth lists both as REQUIRED), and since 2026-09-07
  # reputation's GBP leg needs it too whenever GOOGLE_BUSINESS_TOKEN holds a
  # refresh token rather than an access token — which is what was pasted.
  #
  # These arrived CROSSED between the projects: prep held karoscmo's app and
  # prod held karoscmo-prep's, so every exchange returned unauthorized_client
  # while both secrets looked present and correctly named. Corrected by testing
  # each refresh token against each client; each project now holds its own app.
  # Presence is not pairing.
  _GOOGLE_OAUTH_CLIENT_ID_SECRET: GOOGLE_OAUTH_CLIENT_ID
  _GOOGLE_OAUTH_CLIENT_SECRET_SECRET: GOOGLE_OAUTH_CLIENT_SECRET
  # The pasted user grant for Google Business Profile. An OVERRIDE, not the
  # credential: absent, the GBP legs mint a business.manage token from the
  # worker's own identity (gbp-credential.ts). Wired because it exists now, and
  # safe to wire because an unusable value falls through to that same ADC path.
  _GOOGLE_BUSINESS_TOKEN_SECRET: GOOGLE_BUSINESS_TOKEN
  # VIDEO_HARVEST_PROVIDER=yt-dlp is set inline on both services below, matching
  # prep. It needs no secret — yt-dlp is installed in the image — and without it
  # media.harvestVideo reports not_available, so a prod tiktok run skips from
  # the client's own footage straight to generated b-roll and a client whose
  # sourcePool is shows never gets a commentary clip. Whether a given show may
  # be clipped stays a per-client rights question the product answers, exactly
  # as it does in prep; this variable only decides whether the tool exists.
  _PUBSUB_PROJECT_ID: ""
  _QUEUE_SUBSCRIPTION_RUN_JOBS: ""
  # The topic /runs/start PUBLISHES to (AU66 / SCRUM-364). Its absence was
  # invisible until AU66, because until then nothing in the server published
  # — only the worker consumed, and its subscription WAS wired. Left unset,
  # runJobsTopicName() falls back to "agent-engine-run-jobs", which exists in
  # neither project, and every enqueue would 500.
  _QUEUE_TOPIC_RUN_JOBS: "karos-agent-runs-prod"
  _GCS_MEDIA_BUCKET: ""
  _GCS_ARTIFACTS_BUCKET: ""
  _GCS_WORKSPACE_BUCKET: ""
  # Landing Builder v2 (RFC-11): the Firebase project whose Hosting serves each
  # client's page (one site per client, `<prefix><clientSlug>.web.app`). The
  # worker's service account needs roles/firebasehosting.admin on it. Empty
  # disables publishing; the run still builds and archives to GCS.
  _LANDING_HOSTING_PROJECT: "karoscmo"
  _LANDING_HOSTING_SITE_PREFIX: "karos-"
  # Push-route authentication (AU2 / SCRUM-288) — see cloudbuild.yaml's own
  # comment on this same substitution for the full reasoning; identical here,
  # differing only in pointing at production's own URL. Only wired into
  # deploy-http below: deploy-worker (queue-consumer.js) never mounts the
  # push route at all.
  _PUBSUB_PUSH_AUDIENCE_URL: "https://agent-engine-prod-zc6vfwnzsq-ew.a.run.app/api/v1/queue/pubsub-push"
  # Service-identity authentication plumbing (AU1 / SCRUM-287, folded in per
  # AU2 / SCRUM-288) — see cloudbuild.yaml's own comment for the full
  # reasoning. AUTH_ENABLED is hardcoded in --set-env-vars below, never a
  # substitution, so its value cannot arrive from outside this file.
  #
  # SCRUM-331 (AU48), 2026-09-02: production now runs with enforcement ON. The
  # blocker named here — SCRUM-330, the portal's fail-open metadata fetch — was
  # promoted to production in the same pass: the prod portal moved from
  # `6a76387b` (2026-08-24, 118 commits behind, and verified NOT to contain the
  # fix) to `0fef40aa`, which does.
  #
  # Checked live before flipping, not assumed: AUTH_AUDIENCE byte-identical to
  # `status.url`; the allowlist below equal to the portal's live runtime
  # identity (`karos-cmo-sa@karoscmo`, which the PORTAL promotion itself
  # switched to — see that value's own note); that SA holding run.invoker on
  # this service; and both prod surfaces Ready on this image with zero errors.
  #
  # Blast radius, measured rather than guessed: dispatch reaches the engine over
  # Pub/Sub, not HTTP, so enforcement here covers only gate resolution and
  # unmaterialized-deliverable fetches. Two real reconcile calls (prep and prod)
  # produced no engine HTTP request at all. A misconfiguration therefore shows
  # up as a 401 on a gate approval — user-triggered and immediately visible —
  # not as a silent outage.
  _AUTH_AUDIENCE: "https://agent-engine-prod-zc6vfwnzsq-ew.a.run.app"
  # Who may call this service once AUTH_ENABLED is flipped. Established by
  # reading the LIVE runtime identity of every Cloud Run service in this
  # project, not inferred: `karos-cmo` (the portal) is the only caller, and
  # agent-middleware does not call agent-engine at all (the dependency runs
  # the other way -- agent-engine reads its prompt store).
  #
  # This is staged NOW, while the flag is off, because an EMPTY list means
  # "any identity Google vouches for for this audience"
  # (auth/service-identity.ts:77-82) -- and since AUTH_AUDIENCE is this
  # service's own URL, that is exactly the set Cloud Run IAM already
  # admitted. Flipping the flag without this would produce enforcement in
  # the logs and none in fact, which is worse than auth being off.
  #
  # RETARGETED 2026-09-02 (SCRUM-331 audit). This said
  # `firebase-adminsdk-fbsvc@karoscmo` — correct for the portal's runtime
  # identity when it was written, and wrong from the moment the portal is next
  # promoted. karos-portal's own `cloudbuild.promote.yaml` carries
  # `_RUNTIME_SERVICE_ACCOUNT: "karos-cmo-sa@karoscmo.iam.gserviceaccount.com"`
  # as its DEFAULT, so the portal promotion PERFORMS AU58 / SCRUM-357 and moves
  # the prod portal off `firebase-adminsdk-fbsvc`.
  #
  # Verified live before changing this: all 30 secrets the portal mounts
  # already grant `karos-cmo-sa` (checked per secret — the project-level role
  # list shows only aiplatform.user + logging.logWriter and is misleading), and
  # it already holds run.invoker on this service. So that switch succeeds.
  #
  # Enforcement plus the old value would have 401'd every portal call the first
  # time both promotions had run. This keeps this comment's own method — ONE
  # entry, the LIVE runtime identity — by naming the identity the portal will
  # actually have, rather than adding a second entry, which `--set-env-vars`
  # cannot express without switching to the `^@^` delimiter form.
  #
  # What made the transition safe: both promotions ran with AUTH_ENABLED=false,
  # so the window between the portal switching identity and this value being
  # retargeted enforced nothing. Enforcement was turned on only afterwards, as
  # its own change — see AUTH_ENABLED's note above.
  _AUTH_ALLOWED_SERVICE_ACCOUNTS: "karos-cmo-sa@karoscmo.iam.gserviceaccount.com"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: pull-from-prep
    name: gcr.io/cloud-builders/docker
    args:
      - pull
      - ${_PREP_REGION}-docker.pkg.dev/${_PREP_PROJECT_ID}/${_REPO}/agent-engine:${_SHA}

  - id: tag-for-production
    name: gcr.io/cloud-builders/docker
    args:
      - tag
      - ${_PREP_REGION}-docker.pkg.dev/${_PREP_PROJECT_ID}/${_REPO}/agent-engine:${_SHA}
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:${_SHA}
    waitFor: [pull-from-prep]

  - id: push-to-production
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:${_SHA}
    waitFor: [tag-for-production]

  - id: deploy-http
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_PREFIX}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:${_SHA}
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=2Gi
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},BQ_DATASET_ID=${_BQ_DATASET_ID},ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,VERTEX_AI_LOCATION=${_REGION},GEMINI_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},PROMPT_STORE_DRIVER=firestore,QUEUE_PROVIDER=pubsub,QUEUE_TOPIC_RUN_JOBS=${_QUEUE_TOPIC_RUN_JOBS},PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},GCS_ARTIFACTS_BUCKET=${_GCS_ARTIFACTS_BUCKET},GCS_WORKSPACE_BUCKET=${_GCS_WORKSPACE_BUCKET},LANDING_HOSTING_PROJECT=${_LANDING_HOSTING_PROJECT},LANDING_HOSTING_SITE_PREFIX=${_LANDING_HOSTING_SITE_PREFIX},INSTAGRAM_AGENT_REPO_ROOT=/app,VIDEO_HARVEST_PROVIDER=yt-dlp,PUBSUB_PUSH_AUDIENCE_URL=${_PUBSUB_PUSH_AUDIENCE_URL},AUTH_ENABLED=true,AUTH_AUDIENCE=${_AUTH_AUDIENCE},AUTH_ALLOWED_SERVICE_ACCOUNTS=${_AUTH_ALLOWED_SERVICE_ACCOUNTS}
      - --set-secrets=ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY_SECRET}:latest,SCRAPPYCOCO_API_KEY=${_SCRAPPYCOCO_API_KEY_SECRET}:latest,PERPLEXITY_API_KEY=${_PERPLEXITY_API_KEY_SECRET}:latest,ELEVENLABS_API_KEY=${_ELEVENLABS_API_KEY_SECRET}:latest,UNSPLASH_ACCESS_KEY=${_UNSPLASH_ACCESS_KEY_SECRET}:latest,PEXELS_API_KEY=${_PEXELS_API_KEY_SECRET}:latest,PIXABAY_API_KEY=${_PIXABAY_API_KEY_SECRET}:latest,GOOGLE_PLACES_KEY=${_GOOGLE_PLACES_KEY_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_KEY_SECRET}:latest,GOOGLE_BUSINESS_TOKEN=${_GOOGLE_BUSINESS_TOKEN_SECRET}:latest,GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID_SECRET}:latest,GOOGLE_OAUTH_CLIENT_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET_SECRET}:latest
      # instagram-agent writes under `repoRoot` (INSTAGRAM_AGENT_REPO_ROOT=/app):
      # `.media-cache/<runId>/` from media.findImages, and
      # `instagram-output/<client>/<postId>/` from publish.renderCarousel. The
      # container filesystem is read-only, so both used to fail with EACCES —
      # invisible until now only because the single-provider media tool returned
      # `not_available` on a missing key before it ever touched the filesystem
      # (prep run pubsub-21065943969253409 hit it the moment a key existed).
      # These must stay under repoRoot rather than move to /tmp: renderCarousel
      # enforces assertInside(repoRoot) on templateDir, outDir AND every image
      # path, and templateDir ships read-only inside the image.
      - --add-volume=name=mediacache,type=in-memory,size-limit=384Mi
      - --add-volume-mount=volume=mediacache,mount-path=/app/.media-cache
      - --add-volume=name=igoutput,type=in-memory,size-limit=256Mi
      - --add-volume-mount=volume=igoutput,mount-path=/app/instagram-output
      # `.template-cache/<runId>/` from karos-templates' materializeTemplates,
      # same reasoning as the two above: the registry writes each run's chosen
      # archetype templates to disk so renderCarousel reads them as
      # repo-relative FILES (Approach (a)).
      - --add-volume=name=templatecache,type=in-memory,size-limit=64Mi
      - --add-volume-mount=volume=templatecache,mount-path=/app/.template-cache
    waitFor: [push-to-production]

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_PREFIX}-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:${_SHA}
      - --command=node
      - --args=apps/agent-server/dist/queue-consumer.js
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=2Gi
      - --min-instances=1
      - --no-cpu-throttling
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},BQ_DATASET_ID=${_BQ_DATASET_ID},ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,VERTEX_AI_LOCATION=${_REGION},GEMINI_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},PROMPT_STORE_DRIVER=firestore,QUEUE_PROVIDER=pubsub,QUEUE_TOPIC_RUN_JOBS=${_QUEUE_TOPIC_RUN_JOBS},PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID},QUEUE_SUBSCRIPTION_RUN_JOBS=${_QUEUE_SUBSCRIPTION_RUN_JOBS},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},GCS_ARTIFACTS_BUCKET=${_GCS_ARTIFACTS_BUCKET},GCS_WORKSPACE_BUCKET=${_GCS_WORKSPACE_BUCKET},LANDING_HOSTING_PROJECT=${_LANDING_HOSTING_PROJECT},LANDING_HOSTING_SITE_PREFIX=${_LANDING_HOSTING_SITE_PREFIX},INSTAGRAM_AGENT_REPO_ROOT=/app,VIDEO_HARVEST_PROVIDER=yt-dlp
      - --set-secrets=ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY_SECRET}:latest,SCRAPPYCOCO_API_KEY=${_SCRAPPYCOCO_API_KEY_SECRET}:latest,PERPLEXITY_API_KEY=${_PERPLEXITY_API_KEY_SECRET}:latest,ELEVENLABS_API_KEY=${_ELEVENLABS_API_KEY_SECRET}:latest,UNSPLASH_ACCESS_KEY=${_UNSPLASH_ACCESS_KEY_SECRET}:latest,PEXELS_API_KEY=${_PEXELS_API_KEY_SECRET}:latest,PIXABAY_API_KEY=${_PIXABAY_API_KEY_SECRET}:latest,GOOGLE_PLACES_KEY=${_GOOGLE_PLACES_KEY_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_KEY_SECRET}:latest,GOOGLE_BUSINESS_TOKEN=${_GOOGLE_BUSINESS_TOKEN_SECRET}:latest,GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID_SECRET}:latest,GOOGLE_OAUTH_CLIENT_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET_SECRET}:latest
      # instagram-agent writes under `repoRoot` (INSTAGRAM_AGENT_REPO_ROOT=/app):
      # `.media-cache/<runId>/` from media.findImages, and
      # `instagram-output/<client>/<postId>/` from publish.renderCarousel. The
      # container filesystem is read-only, so both used to fail with EACCES —
      # invisible until now only because the single-provider media tool returned
      # `not_available` on a missing key before it ever touched the filesystem
      # (prep run pubsub-21065943969253409 hit it the moment a key existed).
      # These must stay under repoRoot rather than move to /tmp: renderCarousel
      # enforces assertInside(repoRoot) on templateDir, outDir AND every image
      # path, and templateDir ships read-only inside the image.
      - --add-volume=name=mediacache,type=in-memory,size-limit=384Mi
      - --add-volume-mount=volume=mediacache,mount-path=/app/.media-cache
      - --add-volume=name=igoutput,type=in-memory,size-limit=256Mi
      - --add-volume-mount=volume=igoutput,mount-path=/app/instagram-output
      # `.template-cache/<runId>/` from karos-templates' materializeTemplates,
      # same reasoning as the two above: the registry writes each run's chosen
      # archetype templates to disk so renderCarousel reads them as
      # repo-relative FILES (Approach (a)).
      - --add-volume=name=templatecache,type=in-memory,size-limit=64Mi
      - --add-volume-mount=volume=templatecache,mount-path=/app/.template-cache
    waitFor: [push-to-production]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-engine:${_SHA}
